# GATE 1 — NÃO CONGELADO. Este arquivo registra o hash corrente de
# ruleset.yaml para que ninguém trabalhe sobre uma cópia divergente; ele NÃO
# atesta que o portão foi vencido. O congelamento do GATE 1 exige 100 % dos
# registros em APROVADA ou com PENDENTE_HUMANO resolvido por decisão humana
# registrada.
#
# Situação na versão 6:
#   regras (normativas) ............ 14 APROVADA, 7 PENDENTE_HUMANO
#   praticas_consagradas (nova) .... 1 APROVADA, 1 APROVADA_COM_USO_RESTRITO
#   escopo_amplo_em_conferencia .... 8 PENDENTE_HUMANO
#
# Alteração do ruleset invalida as aprovações de A6 e A7 (CLAUDE.md regra 5).
# Na versão 6 nenhum registro APROVADA de `regras` mudou de status, valor ou
# citação. As alterações são: (a) seção NOVA `praticas_consagradas` com dois
# registros, mais `requisitos_para_a4` e `requisitos_para_a3`; (b) fechamento
# parcial da linha `escopo_amplo_em_conferencia > sapata_isolada.geotecnia`,
# que já era PENDENTE_HUMANO. A nova rodada de A6/A7 pode restringir-se aos
# dois registros novos e ao código que vier a depender deles.
#
# APROVADA_COM_USO_RESTRITO é status novo desta versão: aprovado DENTRO do
# campo `uso_autorizado` e proibido fora dele (`nao_autorizado`). Para o GATE 1
# conta como resolvido; para o A6 é veto se o uso em código exceder o campo.
