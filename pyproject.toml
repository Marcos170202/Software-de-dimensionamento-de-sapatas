[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "estrutura-metalica"
version = "0.1.0"
description = "Motor de cálculo para modelagem e dimensionamento de estruturas metálicas (NBR 8800), com saída de reações de apoio para o módulo de sapatas/fundações."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Álgebra linear (montagem/solução do sistema de rigidez global em
    # analysis/). Não é uma dependência de interface — mantém o motor
    # de cálculo livre de GUI/framework, só usa a ferramenta numérica
    # padrão do ecossistema Python em vez de reimplementar eliminação
    # gaussiana à mão.
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
