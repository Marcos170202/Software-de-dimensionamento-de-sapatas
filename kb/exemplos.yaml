    seguintes condições de solo e valores médios no bulbo de tensões: a) argila rija com Nspt = 15 b) areia compacta com Nspt
    = 30 c) areia argilosa com φ = 25° e c = 50 kPa (valores não drenados). [figura: cota 0 no terreno; base da sapata e NA
    na cota -1; B = 2 m L = 3 m]'
