  extracao: PDF digitalizado (~100 dpi, sombra de encadernacao na margem esquerda da p.49/51); leitura so por visao, duas
    passadas (folha de contato 45 dpi para localizar + recorte 220 dpi para ler); aritmetica do autor reproduzida pelo A1
    -- confere nos tres casos
  status: EXTRAIDO
  escopo:
    geotecnico_A4: capacidade de carga (tensao de ruptura) por metodo teorico -- NBR 6122:2022 7.3.2
  normas_citadas_pelo_autor:
  - NBR 6122:2010 (o livro e anterior a NBR 6122:2022)
  hipoteses_do_autor:
  - Equacao de Terzaghi com a proposicao de Vesic; fatores de capacidade de carga da Tab. 2.2 e fatores de forma da Tab. 2.3
    DO LIVRO (nao normativos; a NBR 6122:2022 nao fornece estas tabelas).
  - Solo representado por "valores médios no bulbo de tensões" -> tratado como homogeneo.
  - 'Correlacoes do autor: argila c = 10·NSPT (kPa); areia phi = 28 graus + 0,4·NSPT.'
  - 'Pesos especificos por tabelas do livro: Tab. 2.4 (argila rija gamma = 19 kN/m3); Tab. 2.5 (areia compacta gamma = 18,
    gamma_sat = 21 kN/m3); areia argilosa: gamma = 18 e gamma_sat = 21 "atribuímos".'
  - 'Modo de ruptura escolhido pelo autor: ruptura geral nos tres casos (caso c pela Fig. 2.21, regiao III).'
  - 'NA na cota de apoio (-1 m): sobrecarga q = gamma·h com gamma natural; termo de peso com gamma'' = gamma_sat - 10 (gamma_w
    = 10 kN/m3).'
  - 'Caso a: phi = 0 (argila, analise nao drenada); a equacao usada omite o termo de peso (1/2 gamma B N_gamma S_gamma).'
  - 'Fatores de forma na substituicao literal: Sc = 1 + (2/3)·(Nq/Nc); Sq = 1 + (2/3)·tg phi; S_gamma = 1 - 0,4·(2/3), com
    2/3 = B/L.'
  - q = gamma·h com h = 1 m, sem sobrecarga adicional.
  - Resultado e a tensao de ruptura sigma_r; o exercicio NAO aplica fator de seguranca nem calcula tensao admissivel.
  - 'Arredondamentos: fatores com 2 casas; resultados com "≅".'
