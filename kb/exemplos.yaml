  enunciado_literal: 'Dimensionar uma sapata de fundação rasa para um pilar com seção transversal 20 x 80 cm, que transfere
    à sapata uma carga vertical centrada total de 1.250 kN (Nk = valor característico), com armadura vertical no pilar composta
    por barras de 16 mm (φℓ,pil), tensão admissível do solo (Padm) de 0,26 MPa (2,6 kgf/cm2) e: - momentos fletores solicitantes
    externos inexistentes (Mx = My = 0); - coeficientes de ponderação: γc = γf = 1,4 ; γs = 1,15; - materiais: concreto C25,
    aço CA-50 (fyd = 43,48 kN/cm2); - cobrimento de concreto: c = 4,0 cm.'
  hash_trecho: sha256:50a077532f710b130c5b2059564e3701c63637da65489e2ccfe985d98e9ad747
  hash_metodo: sha256 do enunciado_literal apos NFC + colapso de espacos
  extracao: texto do enunciado pela camada de texto (Word) conferido visualmente; equacoes e valores numericos SO por leitura
    visual (camada de texto das equacoes e fragmentada), pagina a 200 dpi; aritmetica do autor reproduzida pelo A1 com os
    valores transcritos -- confere
  status: EXTRAIDO
  escopo:
    geotecnico_A4: parte a) Dimensoes da sapata (area, B, A)
    estrutural_A5: partes a) altura/rigidez, b) momentos e armaduras, c) diagonal comprimida, d) detalhamento -- NBR 6118,
      fora do escopo do A4
  normas_citadas_pelo_autor:
  - NBR 6118/2023
  - NBR 6122/2021 (assim citada na Apresentacao do texto; a versao no acervo e NBR 6122:2022)
  - CEB-70
  - ACI 318
  hipoteses_do_autor:
  - 'Kmaj = 1,1 aplicado a Nk "a fim de levar em conta o peso próprio da sapata e do solo sobre a sapata" (Eq. 1.6: Ssap =
    Kmaj·Nk/Padm). DIVERGE da forma da NBR 6122:2022 5.6 ("peso próprio de blocos de coroamento ou sapatas, ou no mínimo 5
    % da carga vertical permanente"): o autor usa 10 % da carga TOTAL e inclui o solo.'
  - Padm = 0,26 MPa e dado de entrada (nao derivado de ensaio); verificacao em valores admissiveis com Nk caracteristico.
  - 'Balanços iguais cA = cB (Eq. 1.5: A - B = ap - bp) e menor lado pela Eq. 1.9: B = 1/2 (bp - ap) + sqrt(1/4 (bp - ap)^2
    + Ssap) [transcrito da substituicao na p.32].'
  - Dimensões arredondadas para múltiplos de 5 cm (B = 201,9 -> 205 cm).
  - A area adotada (54.325 cm2) e comparada com a area estimada (52.885 cm2); a tensao no solo com o peso proprio real NAO
    e recalculada.
  - Sapata rigida pelo criterio h >= (A - ap)/3 (Eq. 1.1, atribuido pelo autor a NBR 6118); verificado so na direcao A porque
    cA = cB.
  - h = 70 cm adotado (decisao do autor, acima do minimo 61,7 cm).
  - d = h - (c + 1,0 cm) = h - 5 cm.
  - Comprimento de ancoragem da armadura do pilar lb = 42 cm pela Tabela A-7 do autor (boa aderencia, C25, phi 16 mm, com
    gancho); exige d > lb.
  - ho >= max(h/3; 15 cm) (Eq. 1.3) e angulo da face inclinada alpha <= 30 graus (tg alpha = (h - ho)/cA).
  - Pressao de calculo pd = Nd/(A·B) com Nd = 1,4·Nk, SEM peso proprio da sapata e do solo ("não necessitam ser consideradas
    no cálculo do momento fletor"); pressao "fictícia", nao comparavel a Padm.
  - 'Metodo CEB-70: secao de referencia S1 a 0,15·ap (ou 0,15·bp) para dentro da face do pilar; limite de aplicacao h/2 <=
    cA <= 2h (Eq. 1.25); M1 = pd·x^2/2·(largura) (Eq. 1.27).'
  - 'As = M1d/(0,85·d·fyd) (Eq. 1.28): braco de alavanca 0,85·d; fyd = 50/1,15 = 43,48 kN/cm2.'
  - Sem armadura minima de flexao (autor argumenta que a NBR 6118 nao a define para sapatas).
  - Armadura distribuida uniformemente apesar de ap + 2h = 220 cm > B = 205 cm (autor dispensa a concentracao do CEB-70 porque
    A/B = 1,29).
  - Sapata rigida -> sem verificacao de puncao; so diagonal comprimida no contorno C (u0 = perimetro do pilar); FSd = gamma_f·N
    sem reducao pela reacao do solo.
  - tau_Rd2 = 0,27·alpha_v·fcd com alpha_v = (1 - fck/250), fck em MPa (Eq. 1.17 do autor, transcrita da substituicao) --
    NAO conferido contra a NBR 6118 pelo A1.
  - 'Gancho das barras de flexao: vertical ho - 10 = 15 cm + inclinado lb - 15 = 23 -> 25 cm (lb = 38 cm, phi 10, sem gancho,
    Tabela A-7).'
