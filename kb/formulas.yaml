    - Quando se tratar de solicitações obtidas de combinações de ações nas quais o vento não é a ação variável principal,
      não é permitida a majoração dos valores de tensão admissível de sapatas e tubulões, nem de cargas admissíveis em estacas.
    - Em qualquer caso, deve ser feita a verificação estrutural do elemento de fundação.
    nota_A1: trecho_literal/hash cobre apenas a regra de 15 %; a regra de 30 % e a lista de obras estao no enunciado integral
      da clausula NBR6122-2022-6.3.2.
