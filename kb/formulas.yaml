  - id: CINTRA-4.1.2a-sigma-adm-SPT-Nspt-50
    norma: "CINTRA, J.C.A.; AOKI, N.; ALBIERO, J.H. - Fundações Diretas, 2011"
    fonte_tipo: SECUNDARIA_NAO_NORMATIVA
    item: "4.1.2 Métodos semiempíricos, alínea a) SPT"
    pagina: "impressa 112 (PDF 113)"
    clausula_ref: CINTRA-4.1.2a-sigma-adm-SPT-regra-Nspt-50
    titulo: "Regra brasileira sigma_a = N_spt/50 + q (MPa), e a dedução de Teixeira (1996) que a sustenta"
    latex: '\sigma_a = \dfrac{N_{spt}}{50} + q \quad (\mathrm{MPa}) \qquad \text{com } 5 \le N_{spt} \le 20'
    sympy: "Eq(sigma_a, N_spt/50 + q)"
    deducao_de_teixeira_1996:
      latex: '\sigma_r = c\,N_c \;,\; N_c = 6 \;,\; c = 0{,}01N_{spt}\,(\mathrm{MPa}) \;,\; FS = 3 \;\Rightarrow\; \sigma_a = \frac{0{,}01\,N_{spt}\cdot 6}{3} = 0{,}02\,N_{spt} = \frac{N_{spt}}{50}'
      sympy: "Eq(sigma_a, (Rational(1,100)*N_spt*6)/3)"
      condicoes_da_deducao: >-
        Sapatas RETANGULARES apoiadas na SUPERFÍCIE de terrenos PURAMENTE
        ARGILOSOS, capacidade de carga pelo método de Skempton (1951) com
        N_c = 6, c = 0,01*N_spt (MPa) e fator de segurança 3.
    variaveis:
      sigma_a: {descricao: "tensão admissível", unidade: "MPa", valor: null}
      N_spt: {descricao: "VALOR MÉDIO no bulbo de tensões (não o valor na cota de apoio)", unidade: "adimensional (golpes)", valor: null}
      q: {descricao: "sobrecarga na cota de apoio. PARCELA FACULTATIVA — a fonte diz que 'pode ou não ser considerada'", unidade: "MPa", valor: null}
      N_spt_min: {descricao: "limite inferior explícito da faixa de validade", unidade: "adimensional", valor: 5}
      N_spt_max: {descricao: "limite superior explícito da faixa de validade", unidade: "adimensional", valor: 20}
      FS_embutido: {descricao: "fator de segurança já embutido no divisor 50", unidade: "adimensional", valor: 3}
    dominio_validade: >-
      FAIXA EXPLÍCITA E ESTREITA, DECLARADA NA FONTE: 5 <= N_spt <= 20. Fora
      dela a fonte NÃO autoriza a fórmula.
      DOMÍNIO DA DEDUÇÃO, também declarado: sapatas RETANGULARES, apoiadas na
      SUPERFÍCIE (h = 0), em terreno PURAMENTE ARGILOSO, via Skempton (1951)
      com N_c = 6, c = 0,01*N_spt (MPa) e FS = 3.
      N_spt é o VALOR MÉDIO NO BULBO DE TENSÕES.
      Unidade de saída MPa; q tem de entrar em MPa.
      O FS = 3 JÁ ESTÁ EMBUTIDO no divisor 50. Aplicar de novo o FSg = 3,00 da
      Tabela 1 da NBR 6122 sobre este resultado seria DUPLA CONTAGEM — ver o
      conflito registrado em
      CINTRA-4.1.2-conflito-FS-embutido-vs-NBR6122-Tabela1.
    incoerencia_interna_da_fonte: >-
      A dedução vale para sapata na SUPERFÍCIE (h = 0), mas a fórmula carrega um
      termo "+ q" de sobrecarga, que só existe se h > 0 — e a fonte ainda torna
      q facultativo. A fonte NÃO concilia as duas coisas. Registrado sem
      resolução.
    alerta_de_atribuicao: >-
      A fonte apresenta sigma_a = N_spt/50 como "regra CONHECIDA NO MEIO TÉCNICO
      BRASILEIRO", e NÃO como "o método de Teixeira". O papel de Teixeira (1996)
      aqui é o de ter DEMONSTRADO a regra para um caso particular. Rotular esta
      fórmula no memorial como "método de Teixeira (1996)" seria impreciso em
      relação a esta fonte. O método de Teixeira propriamente dito é o de areia
      (CINTRA-4.1.2a-teixeira-1996-areia).
    leitura_visual:
      passada_1: "página PDF 113 (impressa 112) inteira a 160 dpi"
      passada_2: "recorte a 500 dpi (x 120-480, y 250-310 em pontos) — divisor 50, termo +q e faixa 5..20 conferidos"
      divergencia: false
    status: NAO_NORMATIVO_AGUARDA_A2

  - id: CINTRA-4.1.2a-mello-1975
    norma: "CINTRA, J.C.A.; AOKI, N.; ALBIERO, J.H. - Fundações Diretas, 2011"
    fonte_tipo: SECUNDARIA_NAO_NORMATIVA
    item: "4.1.2 alínea a) SPT — correlação de Mello (1975)"
    pagina: "impressa 112 (PDF 113)"
    clausula_ref: CINTRA-4.1.2a-mello-1975-sigma-adm-SPT
    titulo: "Mello (1975): tensão admissível a partir do N_SPT, sem distinção de tipo de solo"
    latex: '\sigma_a = 0{,}1\left(\sqrt{N_{spt}} - 1\right) \quad (\mathrm{MPa}) \qquad \text{com } 4 \le N_{spt} \le 16'
    sympy: "Eq(sigma_a, Rational(1,10)*(sqrt(N_spt) - 1))"
    variaveis:
      sigma_a: {descricao: "tensão admissível", unidade: "MPa", valor: null}
      N_spt: {descricao: "índice de resistência à penetração do SPT", unidade: "adimensional (golpes)", valor: null}
      N_spt_min: {descricao: "limite inferior explícito", unidade: "adimensional", valor: 4}
      N_spt_max: {descricao: "limite superior explícito", unidade: "adimensional", valor: 16}
    dominio_validade: >-
      Faixa explícita: 4 <= N_spt <= 16 — DIFERENTE da faixa 5..20 da regra
      N_spt/50. Não confundir as duas faixas.
      "SEM DISTINÇÃO DE SOLO" — a fonte declara explicitamente que esta
      correlação não separa argila de areia. Saída em MPa.
      NAO_DECLARADO_NA_FONTE: profundidade, dimensão da sapata, se N_spt é média
      no bulbo ou valor na cota, e se há fator de segurança embutido (por estar
      sob o título "métodos semiempíricos" presume-se que sim, mas a fonte NÃO
      afirma isso para esta fórmula em particular).
      Nota: o radical cobre apenas N_spt; o "-1" está fora dele, e o fator 0,1
      multiplica o parêntese inteiro. Conferido a 500 dpi.
    advertencia_da_propria_fonte: >-
      A mesma página traz a advertência de Mello (1975, p. 61), citada pelos
      autores, que se aplica a TODAS as correlações desta seção e deveria
      acompanhar qualquer uso delas no memorial: "é preciso analisar a origem e
      validade de tais FORMULÁRIOS DE BOLSO antes de passar a aplicá-los
      inconscientemente e mesmo prejudicialmente em condições que extravasam do
      campo experimental do qual decorreram". Os autores acrescentam que "é
      sempre questionável a aplicabilidade de correlações empíricas desse tipo"
      e remetem a Hachich e Nader (1992).
    leitura_visual:
