  - id: CINTRA-Tab2.3-de-beer-fatores-de-forma
    norma: "CINTRA, J.C.A.; AOKI, N.; ALBIERO, J.H. - Fundações Diretas, 2011"
    fonte_tipo: SECUNDARIA_NAO_NORMATIVA
    item: "Tab. 2.3 - Fatores de forma (De Beer, 1967, apud Vesic, 1975)"
    pagina: "impressa 33 (PDF 32 e 33)"
    clausula_ref: CINTRA-Tab2.3-fatores-forma-de-beer
    titulo: "Fatores de forma de De Beer — dependem de phi e de B/L, e COBREM sapata retangular"
    tabela:
      - sapata: "Corrida"
        S_c: {latex: '1{,}00', sympy: "1"}
        S_q: {latex: '1{,}00', sympy: "1"}
        S_gamma: {latex: '1{,}00', sympy: "1"}
      - sapata: "Retangular"
        S_c: {latex: '1 + \frac{B}{L}\cdot\frac{N_q}{N_c}', sympy: "1 + (B/L)*(N_q/N_c)"}
        S_q: {latex: '1 + \frac{B}{L}\,\mathrm{tg}\,\phi', sympy: "1 + (B/L)*tan(phi)"}
        S_gamma: {latex: '1 - 0{,}4\,\frac{B}{L}', sympy: "1 - Rational(2,5)*(B/L)"}
      - sapata: "Circular ou Quadrada"
        S_c: {latex: '1 + \frac{N_q}{N_c}', sympy: "1 + (N_q/N_c)"}
        S_q: {latex: '1 + \mathrm{tg}\,\phi', sympy: "1 + tan(phi)"}
        S_gamma: {latex: '0{,}60', sympy: "Rational(3,5)"}
    variaveis:
      B: {descricao: "menor dimensão da base (a fonte NÃO declara explicitamente a orientação nesta tabela)", unidade: "m", valor: null}
      L: {descricao: "maior dimensão da base", unidade: "m", valor: null}
      N_q: {descricao: "da Tab. 2.2, para o phi do solo", unidade: "adimensional", valor: null}
      N_c: {descricao: "da Tab. 2.2, para o phi do solo", unidade: "adimensional", valor: null}
      phi: {descricao: "ângulo de atrito interno", unidade: "grau", valor: null}
    dominio_validade: >-
      Este é o único conjunto de fatores de forma desta fonte que COBRE SAPATA
      RETANGULAR. Deve ser usado com os fatores N de Vesic (Tab. 2.2), não com
      os de Terzaghi-Peck.
      NAO_DECLARADO_NA_FONTE: a orientação de B e L (qual é o menor lado) não é
      declarada nesta tabela; e não há restrição declarada de faixa de B/L.
      Coerência interna verificada: a linha "Circular ou Quadrada" é o limite
      B/L = 1 das expressões da linha "Retangular" nas três colunas — inclusive
      S_gamma, pois 1 - 0,4(1) = 0,60.
    leitura_visual:
      passada_1: "página PDF 32 (impressa 33) a 160 dpi"
      passada_2: "recorte dedicado da Tab. 2.3 a 400 dpi (y 560-700 em pontos)"
      divergencia: false
    status: NAO_NORMATIVO_AGUARDA_A2

  - id: CINTRA-2.4.1-skempton-argila-nao-drenada
    norma: "CINTRA, J.C.A.; AOKI, N.; ALBIERO, J.H. - Fundações Diretas, 2011"
    fonte_tipo: SECUNDARIA_NAO_NORMATIVA
    item: "2.4.1 Método de Skempton"
    pagina: "impressas 34 e 35 (PDF 34 e 35)"
    clausula_ref: CINTRA-2.4.1-metodo-de-skempton
    titulo: "Skempton (1951) para argila saturada não drenada (phi = 0)"
    latex: '\sigma_r = c\,N_c\,S_c + q \;;\quad S_c = 1 + 0{,}2\,\frac{B}{L}'
    sympy: "[Eq(sigma_r, c*N_c*S_c + q), Eq(S_c, 1 + Rational(1,5)*(B/L))]"
    variaveis:
      c: {descricao: "coesão não drenada", unidade: "kPa", valor: null}
      N_c: {descricao: "fator de capacidade de carga, FUNÇÃO DE h/B — dado apenas pelo GRÁFICO da Fig. 2.10, não digitalizado", unidade: "adimensional", valor: null}
      S_c: {descricao: "fator de forma de Skempton", unidade: "adimensional", valor: null}
      q: {descricao: "sobrecarga na cota de apoio", unidade: "kPa", valor: null}
      B: {descricao: "menor dimensão da base", unidade: "m", valor: null}
      L: {descricao: "maior dimensão da base", unidade: "m", valor: null}
    dominio_validade: >-
      ARGILA SATURADA em condição NÃO DRENADA, phi = 0. É essa condição que
      permite Nq = 1 e N_gamma = 0 e reduz a equação de Terzaghi a c*Nc*Sc + q.
      Fora dela a simplificação NÃO vale.
      N_c NÃO ESTÁ DISPONÍVEL COMO NÚMERO NESTA FONTE: depende de h/B e só
      aparece na Fig. 2.10, que é gráfico (curva cheia para sapata corrida,
      curva tracejada para quadrada/circular já com o fator de forma embutido),
      com h/B de 0 a 6. NÃO foi digitalizado — ver
      CINTRA-2.4.1-metodo-de-skempton, campo consequencia.
      Único valor numérico de N_c impresso em texto na fonte: N_c = 6, usado na
      dedução de Teixeira (1996) para sapata na SUPERFÍCIE (item 4.1.2 a),
      impressa 112).
      A fonte oferece DOIS caminhos alternativos e mutuamente exclusivos para
      sapata quadrada/circular: (a) usar a curva cheia e multiplicar por
      S_c = 1,2; ou (b) ler a curva tracejada, que JÁ inclui o fator de forma.
      Aplicar os dois seria contar S_c duas vezes.
    leitura_visual:
      passada_1: "página PDF 34 (impressa 34) a 160 dpi"
      passada_2: "página PDF 35 (impressa 35) a 160 dpi — continuação e Fig. 2.10"
      divergencia: false
    status: NAO_NORMATIVO_AGUARDA_A2

  - id: CINTRA-2.4.2-meyerhof-dimensoes-efetivas
    norma: "CINTRA, J.C.A.; AOKI, N.; ALBIERO, J.H. - Fundações Diretas, 2011"
    fonte_tipo: SECUNDARIA_NAO_NORMATIVA
    item: "2.4.2 Método de Meyerhof"
    pagina: "impressa 35 (PDF 35)"
    clausula_ref: CINTRA-2.4.2-meyerhof-area-efetiva
    titulo: "Meyerhof (1953): dimensões fictícias (área efetiva) para carga vertical excêntrica"
    latex: "B' = B - 2\\,e_B \\;;\\quad L' = L - 2\\,e_L"
    sympy: "[Eq(B_linha, B - 2*e_B), Eq(L_linha, L - 2*e_L)]"
    variaveis:
      B_linha: {descricao: "largura fictícia (efetiva) a usar NO CÁLCULO DE CAPACIDADE DE CARGA", unidade: "m", valor: null}
      L_linha: {descricao: "comprimento fictício (efetivo)", unidade: "m", valor: null}
      B: {descricao: "largura real da base", unidade: "m", valor: null}
      L: {descricao: "comprimento real da base", unidade: "m", valor: null}
      e_B: {descricao: "excentricidade da carga na direção do lado B", unidade: "m", valor: null}
      e_L: {descricao: "excentricidade da carga na direção do lado L", unidade: "m", valor: null}
    dominio_validade: >-
      CARGA VERTICAL EXCÊNTRICA. A substituição é autorizada pela fonte APENAS
      "nos cálculos de capacidade de carga" — NÃO para dimensionamento
      estrutural nem para cálculo de recalque.
      NAO_DECLARADO_NA_FONTE, e cada um destes é um buraco real:
      (a) nenhum limite de excentricidade (não há menção a e <= B/6 nem a núcleo
      central); (b) o que fazer quando 2e_B >= B, isto é B' <= 0; (c) se e_B e
      e_L são de valores característicos ou de cálculo; (d) se o método de
      Meyerhof propriamente dito está sendo adotado — a fonte apenas o REMETE a
      Vargas (1978) e Velloso e Lopes (1996) e NÃO reproduz suas equações.
      FORA DO ESCOPO MÍNIMO do CLAUDE.md (carga centrada). Registrado porque
      calc_core/sapata_isolada/ já trata excentricidade sem auditoria
      geotécnica.
    leitura_visual:
      passada_1: "página PDF 35 (impressa 35) inteira a 160 dpi"
      passada_2: "mesma página, conferência dirigida do fator 2 e dos subscritos B e L"
      divergencia: false
    status: NAO_NORMATIVO_AGUARDA_A2

