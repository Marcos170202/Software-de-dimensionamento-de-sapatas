    simbolica sujeita a A2)
  status: EXTRAIDA
  escopo_minimo: false
  latex: \sigma_{\mathrm{adm,vento}} \leq 1{,}15\,\sigma_{\mathrm{adm}}\ (\text{geral});\ \leq 1{,}30\,\sigma_{\mathrm{adm}}\
    (\text{obras listadas});\ FS_g \geq 1{,}6 \text{ se majorado}
  sympy:
  - sigma_adm_vento <= 1.15*sigma_adm
  - sigma_adm_vento <= 1.30*sigma_adm
  - FS_g >= 1.6
  sympy_condicao:
  - vento e a acao variavel principal
  - vento e a acao variavel principal E obra em {galpões industriais, torres de linhas de transmissão, reservatórios elevados,
    silos graneleiros, torres eólicas, torres de telecomunicações, tanques de produtos químicos}
