  - id: CINTRA-4.1.2a-teixeira-1996-areia
    norma: "CINTRA, J.C.A.; AOKI, N.; ALBIERO, J.H. - Fundações Diretas, 2011"
    fonte_tipo: SECUNDARIA_NAO_NORMATIVA
    item: "4.1.2 alínea a) SPT — correlação de Teixeira (1996) para areia, com Fig. 4.1"
    pagina: "impressa 113 (PDF 114)"
    clausula_ref: CINTRA-4.1.2a-teixeira-1996-sigma-adm-areia
    titulo: "MÉTODO DE TEIXEIRA (1996) para sapata em AREIA — o achado que fecha ACERVO-BUSCA-NEG-teixeira-1996"
    latex: '\sigma_a = 0{,}05 + \left(1 + 0{,}4\,B\right)\dfrac{N_{spt}}{100} \quad (\mathrm{MPa})'
    sympy: "Eq(sigma_a, Rational(1,20) + (1 + Rational(2,5)*B)*N_spt/100)"
    variaveis:
      sigma_a: {descricao: "tensão admissível", unidade: "MPa", valor: null}
      B: {descricao: "LADO da sapata QUADRADA, EM METROS. A fórmula NÃO é adimensional: o coeficiente 0,4 carrega unidade 1/m", unidade: "m", valor: null}
      N_spt: {descricao: "índice de resistência à penetração do SPT", unidade: "adimensional (golpes)", valor: null}
    constantes_do_metodo:
      termo_constante_MPa: 0.05
      coeficiente_de_B_por_metro: 0.4
      divisor: 100
    parametros_FIXOS_embutidos_na_deducao:
      profundidade_de_apoio_m: 1.5
      peso_especifico_da_areia_kN_m3: 18
      correlacao_de_phi_usada: "phi = sqrt(20*N_spt) + 15 graus (a de TEIXEIRA, não a de Godoy)"
      capacidade_de_carga_base: "equação de TERZAGHI"
      fator_de_seguranca_embutido: 3
    dominio_validade: >-
      DOMÍNIO MUITO ESTREITO E INTEIRAMENTE DECLARADO NA FONTE — este é o campo
      que impede o software de aplicar a fórmula fora do lugar:
      (1) solo AREIA;
      (2) sapata QUADRADA de lado B, com B EM METROS;
      (3) profundidade de apoio FIXA em 1,5 m — NÃO é variável da fórmula, é
      hipótese congelada na dedução;
      (4) peso específico da areia FIXO em 18 kN/m3 — idem;
      (5) phi obtido pela correlação de Teixeira, phi = sqrt(20*N_spt) + 15
      graus;
      (6) fator de segurança 3 JÁ EMBUTIDO;
      (7) capacidade de carga calculada por TERZAGHI.
      A fonte NÃO declara faixa de validade de N_spt para esta fórmula; a Fig.
      4.1 é desenhada de N_spt = 0 a 25, o que é INDÍCIO e não declaração.
      A fonte também NÃO declara faixa de B; a Fig. 4.1 mostra apenas B = 1, 2
      e 3 m.
      Extrapolar profundidade, peso específico, forma retangular, ou B fora de
      1 a 3 m, é sair do domínio declarado.
    figura_associada: >-
      Fig. 4.1 "Tensão admissível em função de B e de N_spt - sapatas em areia
      (Teixeira, 1996)" é um GRÁFICO: eixo vertical sigma_a (MPa) de 0 a 0,6;
      eixo horizontal N_spt de 0 a 25; três retas cheias rotuladas B = 1 m,
      B = 2 m e B = 3 m; e uma linha TRACEJADA que a fonte identifica como
      "valores de experiência prática em São Paulo, relatados por Vargas
      (1951)", correndo entre as retas de B = 1 m e B = 2 m. A curva de Vargas
      NÃO foi digitalizada.
    conferencia_de_leitura: >-
      INTERPRETAÇÃO minha, registrada como conferência de leitura da fórmula e
      NÃO como caso de teste homologado: para B = 2 m e N_spt = 10,
      sigma_a = 0,05 + (1 + 0,8)*10/100 = 0,23 MPa, compatível com a Fig. 4.1.
    leitura_visual:
      passada_1: "página PDF 114 (impressa 113) inteira a 160 dpi"
      passada_2: "recorte a 550 dpi (x 100-480, y 150-260 em pontos) — termo 0,05, coeficiente 0,4B e divisor 100 conferidos"
      divergencia: false
    status: NAO_NORMATIVO_AGUARDA_A2

