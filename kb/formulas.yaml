  - id: NBR6118-15.8.2-lambda1-limite-pilar-curto
    norma: "NBR 6118:2023"
    item: "15.8.2"
    pagina: 107
    clausula_ref: NBR6118-15.8.2-dispensa-2a-ordem-local
    titulo: "Valor-limite λ1 — FRONTEIRA PILAR CURTO x ESBELTO (dispensa dos efeitos locais de 2ª ordem)"
    latex: "\\lambda_1 = \\dfrac{25 + 12{,}5\\,e_1/h}{\\alpha_b}\\,,\\qquad 35 \\le \\lambda_1 \\le 90"
    sympy: "Eq(lamb_1, Min(90, Max(35, (25 + 12.5*e_1/h)/alpha_b)))"
    criterio_de_dispensa:
      latex: "\\lambda < \\lambda_1 \\Rightarrow \\text{efeitos locais de 2\\textsuperscript{a} ordem podem ser desprezados}"
      sympy: "Lt(lamb, lamb_1)"
      literal_da_fonte: >-
        "Os esforços locais de 2ª ordem em elementos isolados podem ser
        desprezados quando o índice de esbeltez for menor que o valor-limite λ1
        estabelecido nesta subseção." — desigualdade ESTRITA (menor que), não <=.
    variaveis:
      lamb_1:  {descricao: "valor-limite do índice de esbeltez", unidade: "adimensional", valor: null}
      e_1:     {descricao: "excentricidade de 1ª ordem na extremidade do pilar onde ocorre o momento de 1ª ordem de maior valor absoluto; NÃO inclui a excentricidade acidental (simbologia 15.1)", unidade: "m", valor: null}
      h:       {descricao: "altura da seção transversal na direção considerada", unidade: "m", valor: null}
      alpha_b: {descricao: "coeficiente que depende da vinculação e do diagrama de momentos de 1ª ordem", unidade: "adimensional", valor: null}
    alpha_b:
      a_biapoiado_sem_cargas_transversais:
        latex: "\\alpha_b = 0{,}60 + 0{,}40\\,\\dfrac{M_B}{M_A} \\ge 0{,}40"
        sympy: "Eq(alpha_b, Max(0.40, 0.60 + 0.40*M_B/M_A))"
        limites: "1,0 >= alpha_b >= 0,4"
        M_A: "maior valor absoluto do momento de 1ª ordem ao longo do pilar biapoiado"
        M_B: "momento de 1ª ordem no outro extremo; sinal POSITIVO se traciona a mesma face que M_A, NEGATIVO em caso contrário"
        nos_moveis: "em estruturas de nós móveis, M_A e M_B são os momentos TOTAIS (1ª ordem + 2ª ordem global)"
      b_biapoiado_com_cargas_transversais_significativas: 1.0
      c_em_balanco: 1.0
      d_momentos_menores_que_M1d_min_de_11_3_3_4_3: 1.0
    dominio_validade: >-
      Elementos isolados (15.4.4) de seção e armadura constantes ao longo do
      eixo, submetidos à flexo-compressão (15.8.1). ESTE É O CRITÉRIO PEDIDO
      PELO BACKLOG #13 para separar pilar curto de esbelto.
      Os limites 35 <= λ1 <= 90 são de TRUNCAMENTO, não de validade: λ1
      calculado abaixo de 35 vira 35 e acima de 90 vira 90.
      PARA O PILARETE SOB CARGA CENTRADA DESTA RODADA cai-se na alínea d):
      como os momentos são menores que M_1d,mín (11.3.3.4.3), α_b = 1,0, e
      λ1 = max(35, 25 + 12,5·e_1/h) limitado a 90. Com e_1 = 0, λ1 = 35 —
      este é o número que o a4 deve usar como fronteira de RECUSA.
      NÃO DECLARADO NA FONTE: como calcular e_1 quando o momento de 1ª ordem é
      nulo e só existe M_1d,mín (usar e_1 = M_1d,mín/N_d é interpretação, não
      texto da Norma — o item 15.8.2 diz que e_1 "não inclui a excentricidade
      acidental", e M_1d,mín É a substituição das imperfeições locais).
      A avaliação é POR DIREÇÃO (h muda com a direção).
    fronteiras_adicionais_de_esbeltez:
      - "λ > λ1: efeitos locais de 2ª ordem OBRIGATÓRIOS (15.8.2) — FORA do escopo desta rodada"
      - "λ > 90: consideração da FLUÊNCIA obrigatória (15.8.3.1 → 15.8.4)"
      - "λ > 140: MÉTODO GERAL (análise não linear) obrigatório (15.8.3.2); e γ_n1 majora os efeitos locais (15.8.1)"
      - "λ > 200: PROIBIDO, exceto elementos pouco comprimidos com N_d < 0,10 f_cd A_c (15.8.1, alterado pela Emenda 1)"
    leitura_visual:
      passada_1: "páginas PDF 125 e 126 (impressas 107 e 108) inteiras a 300 dpi"
      passada_2: "recortes das regiões de λ1, de 35<=λ1<=90 e de α_b a 450-500 dpi"
      divergencia: false
    status: OK
    alterada_por_emenda1: false
