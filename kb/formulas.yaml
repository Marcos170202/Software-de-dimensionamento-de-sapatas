  - id: CINTRA-2.2.4-terzaghi-capacidade-de-carga
    norma: "CINTRA, J.C.A.; AOKI, N.; ALBIERO, J.H. - Fundações Diretas: Projeto Geotécnico. Oficina de Textos, 2011"
    fonte_tipo: SECUNDARIA_NAO_NORMATIVA
    item: "2.2.4 Superposição de efeitos (com 2.2.1, 2.2.2 e 2.2.3)"
    pagina: "impressas 28 e 29 (PDF 27 e 28)"
    clausula_ref: CINTRA-2.2.1-2.2.4-terzaghi-equacao-geral
    titulo: "Equação de capacidade de carga de Terzaghi (1943) por superposição de efeitos, e os fatores Nc e Nq em forma fechada"
    latex: '\sigma_r = c\,N_c + q\,N_q + \tfrac{1}{2}\,\gamma\,B\,N_\gamma'
    sympy: "Eq(sigma_r, c*N_c + q*N_q + gamma*B*N_gamma/2)"
    formulas_auxiliares:
      N_c_forma_fechada:
        latex: 'N_c = \cot\phi\left[e^{\pi\,\mathrm{tg}\,\phi}\,\mathrm{tg}^2\!\left(45^\circ + \phi/2\right) - 1\right]'
        sympy: "Eq(N_c, cot(phi)*(exp(pi*tan(phi))*tan(rad(45) + phi/2)**2 - 1))"
        origem: "Prandtl (1921, apud Terzaghi e Peck, 1967), item 2.2.1"
      N_q_forma_fechada:
        latex: 'N_q = e^{\pi\,\mathrm{tg}\,\phi}\,\mathrm{tg}^2\!\left(45^\circ + \phi/2\right)'
        sympy: "Eq(N_q, exp(pi*tan(phi))*tan(rad(45) + phi/2)**2)"
        origem: "Reisnner (1924, apud Terzaghi e Peck, 1967), item 2.2.2"
      relacao_entre_Nc_e_Nq:
        latex: 'N_c = (N_q - 1)\cot\phi'
        sympy: "Eq(N_c, (N_q - 1)*cot(phi))"
      N_gamma_SEM_SOLUCAO_ANALITICA:
        latex: 'N_\gamma = \frac{4E_p}{\gamma B^2}\cos(\alpha - \phi)'
        sympy: null
        status: NAO_IMPLEMENTAVEL
        motivo: >-
          A fonte afirma textualmente que "não há solução analítica para
          N_gamma". Esta expressão depende do empuxo passivo E_p, que a fonte
          NÃO fornece, e de um ângulo alpha desconhecido que só se obtém
          repetindo o cálculo até minimizar N_gamma. NÃO transformar em código.
          Para obter N_gamma como número use a Tab. 2.2 de Vesic
          (CINTRA-VESIC-tabela-2.2-fatores-capacidade-carga) ou a aproximação
          de Caquot-Kérisel (CINTRA-2.3.1-vesic-N-gamma).
    variaveis:
      sigma_r: {descricao: "capacidade de carga do SISTEMA sapata-solo (tensão de ruptura)", unidade: "kPa", valor: null}
      c: {descricao: "coesão do solo; na notação da fonte, geralmente o valor NÃO DRENADO", unidade: "kPa", valor: null}
      q: {descricao: "sobrecarga na cota de apoio, q = gamma*h", unidade: "kPa", valor: null}
      gamma: {descricao: "peso específico; na notação da fonte é SEMPRE o peso específico EFETIVO. A fonte alerta que gamma acima e abaixo da cota da base podem ser diferentes apesar do mesmo símbolo", unidade: "kN/m3", valor: null}
      B: {descricao: "largura da sapata (menor dimensão da base)", unidade: "m", valor: null}
      h: {descricao: "profundidade de embutimento da sapata", unidade: "m", valor: null}
      phi: {descricao: "ângulo de atrito interno; na notação da fonte, geralmente o valor NÃO DRENADO", unidade: "grau", valor: null}
      N_c: {descricao: "fator de capacidade de carga da parcela de coesão; função apenas de phi", unidade: "adimensional", valor: null}
      N_q: {descricao: "fator de capacidade de carga da parcela de sobrecarga; função apenas de phi", unidade: "adimensional", valor: null}
      N_gamma: {descricao: "fator de capacidade de carga da parcela de peso específico; função apenas de phi; SEM solução analítica nesta fonte", unidade: "adimensional", valor: null}
    dominio_validade: >-
      DECLARADO EXPLICITAMENTE NA FONTE (item 2.2, impressa 26), e é o campo que
      impede o uso indevido desta equação:
      (1) SAPATA CORRIDA, com L >= 5B — o problema é tratado como bidimensional.
      Sapata quadrada, retangular ou circular só entra pelos fatores de forma
      SEMIEMPÍRICOS de 2.2.5 / Tab. 2.1 (ou Tab. 2.3 de De Beer).
      (2) EMBUTIMENTO h <= B — é isso que autoriza desprezar a resistência ao
      cisalhamento da camada acima da cota de apoio e trocá-la pela sobrecarga
      q = gamma*h. Para h > B a substituição não está justificada pela fonte.
      (3) MACIÇO RÍGIDO, RUPTURA GERAL. Solo fofo ou mole exige a redução de
      2.2.6 (c* = 2c/3, tg phi* = 2 tg phi /3).
      (4) SOLO HOMOGÊNEO. O caso estratificado é tratado em item separado (2.5,
      impressas 36-40), NÃO extraído nesta rodada — não aplicar esta equação a
      perfil estratificado.
      (5) A própria fonte qualifica a equação de APROXIMADA, por ser
      superposição de três casos particulares.
    leitura_visual:
      passada_1: "página PDF 28 (impressa 29) inteira a 160 dpi"
      passada_2: "página PDF 27 (impressa 28) inteira a 160 dpi — Nc e Nq conferidos termo a termo"
      divergencia: false
    status: NAO_NORMATIVO_AGUARDA_A2

  - id: CINTRA-2.2.5-terzaghi-peck-fatores-de-forma
    norma: "CINTRA, J.C.A.; AOKI, N.; ALBIERO, J.H. - Fundações Diretas, 2011"
    fonte_tipo: SECUNDARIA_NAO_NORMATIVA
    item: "2.2.5 Efeito da forma da sapata, com Tab. 2.1"
    pagina: "impressas 30 e 31 (PDF 29 e 30)"
    clausula_ref: CINTRA-2.2.5-fatores-forma-tab2.1
    titulo: "Equação geral com fatores de forma, e Tab. 2.1 (fatores de forma de Terzaghi-Peck)"
    latex: '\sigma_r = c\,N_c\,S_c + q\,N_q\,S_q + \tfrac{1}{2}\,\gamma\,B\,N_\gamma\,S_\gamma'
    sympy: "Eq(sigma_r, c*N_c*S_c + q*N_q*S_q + gamma*B*N_gamma*S_gamma/2)"
    tabela_2_1_fatores_de_forma_terzaghi_peck:
      - {sapata: "Corrida (lado B)",       S_c: 1.0, S_q: 1, S_gamma: 1.0}
      - {sapata: "Quadrada (B = L)",       S_c: 1.2, S_q: 1, S_gamma: 0.8}
      - {sapata: "Circular (B = diâmetro)", S_c: 1.2, S_q: 1, S_gamma: 0.6}
    variaveis:
      S_c: {descricao: "fator de forma da parcela de coesão", unidade: "adimensional", valor: null}
      S_q: {descricao: "fator de forma da parcela de sobrecarga", unidade: "adimensional", valor: null}
      S_gamma: {descricao: "fator de forma da parcela de peso específico", unidade: "adimensional", valor: null}
      B: {descricao: "lado da sapata corrida ou quadrada; DIÂMETRO no caso da sapata circular (declarado na própria Tab. 2.1)", unidade: "m", valor: null}
    dominio_validade: >-
      A Tab. 2.1 cobre APENAS TRÊS formas: corrida, quadrada e circular. NÃO HÁ
      LINHA PARA SAPATA RETANGULAR (B != L). Não interpolar entre quadrada e
      corrida — para retangular a fonte só oferece a Tab. 2.3 (De Beer/Vesic).
      As duas equações semiempíricas originais de Terzaghi e Peck (1967) das
      quais a Tab. 2.1 foi extraída têm domínio declarado ESTREITO: sapata
      circular/quadrada "embutida em um SOLO COMPACTO OU RIJO". A fonte NÃO
      declara se esse qualificador continua valendo na forma generalizada com
      Sc/Sq/S_gamma — NAO_DECLARADO_NA_FONTE.
      Usar a Tab. 2.1 com os fatores N de Terzaghi-Peck, e a Tab. 2.3 com os de
      Vesic. A fonte não autoriza misturar os dois conjuntos.
      Herda todas as restrições de CINTRA-2.2.4-terzaghi-capacidade-de-carga,
      exceto a de sapata corrida — que é justamente o que os fatores de forma
      relaxam.
    leitura_visual:
      passada_1: "página PDF 29 (impressa 30) a 160 dpi — equação geral"
      passada_2: "página PDF 30 (impressa 31) a 160 dpi — Tab. 2.1 célula a célula"
      divergencia: false
    status: NAO_NORMATIVO_AGUARDA_A2

  - id: CINTRA-2.2.6-terzaghi-puncionamento
    norma: "CINTRA, J.C.A.; AOKI, N.; ALBIERO, J.H. - Fundações Diretas, 2011"
    fonte_tipo: SECUNDARIA_NAO_NORMATIVA
    item: "2.2.6 Ruptura por puncionamento"
    pagina: "impressa 31 (PDF 30)"
    clausula_ref: CINTRA-2.2.6-puncionamento-reducao-2-3
    titulo: "Redução empírica de Terzaghi (1943) nos parâmetros de resistência, para ruptura por puncionamento"
    latex: 'c^{*} = \tfrac{2}{3}c \;;\quad \mathrm{tg}\,\phi^{*} = \tfrac{2}{3}\,\mathrm{tg}\,\phi \;;\quad \sigma^{\prime}_r = c^{*}N^{\prime}_c S_c + q\,N^{\prime}_q S_q + \tfrac{1}{2}\gamma B N^{\prime}_\gamma S_\gamma'
    sympy: "[Eq(c_est, Rational(2,3)*c), Eq(tan(phi_est), Rational(2,3)*tan(phi)), Eq(sigma_r_linha, c_est*Nc_linha*S_c + q*Nq_linha*S_q + gamma*B*Ngamma_linha*S_gamma/2)]"
    variaveis:
      c_est: {descricao: "coesão reduzida c* = 2c/3", unidade: "kPa", valor: null}
      phi_est: {descricao: "ângulo de atrito reduzido phi*, definido por tg phi* = (2/3) tg phi — NÃO por phi* = 2phi/3", unidade: "grau", valor: null}
      Nc_linha: {descricao: "N'c, fator de capacidade de carga calculado com phi* (não com phi)", unidade: "adimensional", valor: null}
      Nq_linha: {descricao: "N'q, calculado com phi*", unidade: "adimensional", valor: null}
      Ngamma_linha: {descricao: "N'_gamma, calculado com phi*", unidade: "adimensional", valor: null}
      sigma_r_linha: {descricao: "capacidade de carga aproximada na ruptura por puncionamento", unidade: "kPa", valor: null}
    dominio_validade: >-
      SOLOS FOFOS OU MOLES, não passíveis de ruptura geral. A própria fonte
      declara a redução como EMPÍRICA, adotada "na impossibilidade de realizar
      um desenvolvimento teórico".
      ARMADILHA DE NOMENCLATURA, explicitada pela fonte: o que Terzaghi chamou
      de "ruptura local" é o que este livro chama de PUNCIONAMENTO. Neste livro
      "ruptura local" é um terceiro modo, intermediário, que NÃO tem equação
      própria — ver CINTRA-2.4-procedimento-adotado-pelos-autores.
      ATENÇÃO À FORMA DA REDUÇÃO DE phi: a fonte reduz a TANGENTE, não o ângulo.
      phi* = arctg( (2/3) tg phi ). Reduzir o ângulo diretamente daria valor
      diferente e do lado INSEGURO para phi alto.
      Os fatores de FORMA (Sc, Sq, S_gamma) NÃO são reduzidos — aparecem sem
      linha na fonte. Só os fatores de capacidade de carga levam linha.
    leitura_visual:
      passada_1: "página PDF 30 (impressa 31) inteira a 160 dpi"
      passada_2: "mesma página, conferência dirigida da posição das linhas (') em N'c, N'q, N'gamma contra Sc, Sq, Sgamma sem linha"
      divergencia: false
    status: NAO_NORMATIVO_AGUARDA_A2

