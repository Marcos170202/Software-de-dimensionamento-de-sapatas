      NAO_DECLARADO_NA_FONTE: qual parcela de K_maj corresponde ao concreto e
      qual ao solo; altura de solo; peso especifico do solo; geometria do
      volume de solo. K_maj e ADIMENSIONAL e GLOBAL.
