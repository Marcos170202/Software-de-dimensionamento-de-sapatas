        caso_lista_fechada: 0.30
      FSg: {descricao: "fator de segurança global; piso de 1,6 imposto QUANDO a majoração é utilizada", unidade: "adimensional", valor: 1.6}
    dominio_validade: >-
      MÉTODO DE VALORES ADMISSÍVEIS (valores característicos + FS global), e só
      ele — 6.3.3 é o equivalente para valores de cálculo e tem outro número.
      CONDIÇÃO NECESSÁRIA: o vento tem de ser a AÇÃO VARIÁVEL PRINCIPAL da
      combinação, conforme ABNT NBR 8681 (remissão de 6.3.1). Se o vento NÃO é
      a ação variável principal, k_v = 0 obrigatoriamente: a Norma escreve "não
      é permitida a majoração".
      k_v_max = 0,30 vale SOMENTE para a lista FECHADA e taxativa de sete tipos
      de obra: galpões industriais, torres de linhas de transmissão,
      reservatórios elevados, silos graneleiros, torres eólicas, torres de
      telecomunicações e tanques de produtos químicos. Edifício residencial ou
      comercial comum fica em k_v_max = 0,15.
