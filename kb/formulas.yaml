  hash_trecho: sha256:dc696e2a407957859163a8679f4edc3af22e127bc6df7e75e449bd81ecb8030b
  titulo: método de valores admissíveis
  leituras:
    camada_texto_pdf: Padm = Rk/FSg e Padm ≥ Sk
    visao_passada_1: P_adm = R_k/FS_g e P_adm ≥ S_k  (pagina inteira, 300 dpi)
    visao_passada_2: P_adm = R_k/FS_g e P_adm ≥ S_k  (recorte da linha, 500 dpi)
  status: EXTRAIDA
  divergencia: null
  latex: P_{\mathrm{adm}} = R_{\mathrm{k}} / FS_{\mathrm{g}} \quad \text{e} \quad P_{\mathrm{adm}} \geq S_{\mathrm{k}}
  sympy:
  - Eq(P_adm, R_k/FS_g)
  - P_adm >= S_k
  variaveis:
    P_adm:
      definicao_literal: é a tensão admissível de sapatas e tubulões e carga admissível de estacas
      unidade: NAO_DECLARADO_NA_FONTE
    R_k:
      definicao_literal: representa as forças ou tensões características de ruptura (últimas)
      unidade: NAO_DECLARADO_NA_FONTE
    S_k:
      definicao_literal: representa as solicitações características
      unidade: NAO_DECLARADO_NA_FONTE
    FS_g:
      definicao_literal: é o fator de segurança global
      unidade: 'adimensional (inferido: divisor de grandezas de mesma natureza; nao declarado)'
  unidades_nota: A fonte nao declara unidades. P_adm, R_k e S_k tem a mesma dimensao entre si (tensao para sapatas/tubuloes,
    forca para estacas) -- isso decorre das definicoes literais, nao de declaracao de unidade.
  dominio_validade:
    declarado_na_fonte: true
    literal:
    - método em que as forças ou tensões de ruptura são divididas por um fator de segurança global (3.30)
    - Esta grandeza é utilizada no projeto quando se trabalha com valores característicos das ações. (3.45, NOTA)
    metodo_de_seguranca_declarado: valores admissíveis (valores característicos + fator de segurança global)
    valores_de_FSg: ver C-NBR6122-T1 (Tabela 1, fundações rasas, compressão)
- id: F-NBR6122-3.31
  tipo: formula_explicita
  norma: ABNT NBR 6122:2022
  item: '3.31'
  clausula_id: NBR6122-2022-3.31
  pagina:
  - 6
  pagina_pdf:
  - 18
  arquivo: refs/NBR 06122 - 2022 - Projeto e execução de fundações.pdf
  trecho_literal: Rd = Rk/γm e Sd = Sk ∙ γf e Rd ≥ Sd
  hash_trecho: sha256:6158acd0b25a53383accbb24065e5eff71e60a1cd79bb36cf20fe534c5145d34
  titulo: método de valores de cálculo
  leituras:
    camada_texto_pdf: Rd = Rk/γm e Sd = Sk ∙ γf e Rd ≥ Sd
    visao_passada_1: R_d = R_k/γ_m e S_d = S_k · γ_f e R_d ≥ S_d  (pagina inteira, 300 dpi)
    visao_passada_2: R_d = R_k/γ_m e S_d = S_k · γ_f e R_d ≥ S_d  (recorte da linha, 500 dpi)
  status: EXTRAIDA
  divergencia: null
  latex: R_{\mathrm{d}} = R_{\mathrm{k}}/\gamma_{\mathrm{m}} \quad \text{e} \quad S_{\mathrm{d}} = S_{\mathrm{k}} \cdot \gamma_{\mathrm{f}}
    \quad \text{e} \quad R_{\mathrm{d}} \geq S_{\mathrm{d}}
  sympy:
  - Eq(R_d, R_k/gamma_m)
  - Eq(S_d, S_k*gamma_f)
  - R_d >= S_d
  variaveis:
    R_d:
      definicao_literal: representa a tensão resistente de cálculo para sapatas ou tubulões ou a força resistente de cálculo
        para estacas
      unidade: NAO_DECLARADO_NA_FONTE
    S_d:
      definicao_literal: representa as solicitações de cálculo
      unidade: NAO_DECLARADO_NA_FONTE
    R_k:
      definicao_literal: (3.31, texto corrido) forças ou tensões características de ruptura
      unidade: NAO_DECLARADO_NA_FONTE
    S_k:
      definicao_literal: (3.31, texto corrido) solicitações características
      unidade: NAO_DECLARADO_NA_FONTE
    gamma_f:
      definicao_literal: coeficiente de ponderação dos valores característicos das solicitações
      unidade: adimensional (inferido; nao declarado)
    gamma_m:
      definicao_literal: 'coeficiente de ponderação dos valores característicos das resistências: tensão de ruptura sob sapatas
        ou bases de tubulões, ou carga de ruptura de estacas'
      unidade: adimensional (inferido; nao declarado)
  unidades_nota: A fonte nao declara unidades.
  dominio_validade:
    declarado_na_fonte: true
    literal:
    - método em que as forças ou tensões características de ruptura são divididas pelo coeficiente de ponderação das resistências,
      as solicitações características são multiplicadas pelos coeficientes de ponderação (3.31)
    - Esta grandeza é utilizada no projeto quando se trabalha com valores de cálculo das ações. (3.48, NOTA)
    metodo_de_seguranca_declarado: valores de cálculo (coeficientes de ponderação)
    valores_de_gamma: 'ver C-NBR6122-T1 (γm por método; nota c: γf = 1,4 se só houver valor característico)'
