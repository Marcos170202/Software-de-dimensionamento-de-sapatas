  - id: CINTRA-2.9.2-angulo-de-atrito-por-Nspt
    norma: "CINTRA, J.C.A.; AOKI, N.; ALBIERO, J.H. - Fundações Diretas, 2011"
    fonte_tipo: SECUNDARIA_NAO_NORMATIVA
    item: "2.9.2 Ângulo de atrito"
    pagina: "impressa 45 (PDF 45)"
    clausula_ref: CINTRA-2.9.2-angulo-de-atrito-godoy-e-teixeira
    titulo: "Duas correlações N_SPT -> ângulo de atrito: Godoy (1983) e Teixeira (1996)"
    correlacoes:
      godoy_1983:
        latex: '\phi = 28^\circ + 0{,}4\,N_{spt}'
        sympy: "Eq(phi, 28 + Rational(2,5)*N_spt)"
      teixeira_1996:
        latex: '\phi = \sqrt{20\,N_{spt}} + 15^\circ'
        sympy: "Eq(phi, sqrt(20*N_spt) + 15)"
    variaveis:
      phi: {descricao: "ângulo de atrito interno", unidade: "grau", valor: null}
      N_spt: {descricao: "índice de resistência à penetração do SPT", unidade: "adimensional (golpes)", valor: null}
    dominio_validade: >-
      A FONTE DECLARA DOIS DOMÍNIOS QUE NÃO COINCIDEM, NO MESMO ITEM:
      (1) o parágrafo de abertura de 2.9.2 trata do ângulo de atrito interno da
      AREIA e remete ao ábaco da Fig. 2.20 (Mello, 1971), que exige a tensão
      vertical EFETIVA na cota do ensaio e distingue areia fina, areia grossa e
      conjunto — é GRÁFICO, não digitalizado;
      (2) as DUAS FÓRMULAS acima são introduzidas como "ainda para a estimativa
      de phi, NA CONDIÇÃO NÃO DRENADA". A fonte NÃO repete a palavra "areia"
      para elas e NÃO declara faixa de N_spt, tipo de solo nem limite superior
      de phi. NAO_DECLARADO_NA_FONTE.
      As duas fórmulas NÃO são equivalentes e divergem bastante: para
      N_spt = 8, Godoy dá 31,2 graus e Teixeira 27,6 graus; para N_spt = 30,
      Godoy dá 40,0 e Teixeira 39,5. A fonte NÃO diz qual preferir nem em que
      caso — decisão do a2.
    alerta_de_implementacao: >-
      GEOMETRIA DO RADICAL CONFERIDA A 500 dpi EM DUAS PASSADAS: na fórmula de
      Teixeira o radical cobre APENAS "20 N_spt"; o "+ 15 graus" está FORA do
      radical. Ou seja phi = sqrt(20*N_spt) + 15, e NÃO sqrt(20*N_spt + 15).
      Este é o erro de transcrição mais provável nesta fórmula, e por isso fica
      registrado explicitamente.
      Ambas as fórmulas retornam GRAUS e são dimensionalmente heterogêneas
      (somam um número puro a um ângulo) — são empíricas, não homogêneas.
    observacao: >-
      A correlação de Teixeira é a MESMA que reaparece na impressa 113 como
      insumo do método de Teixeira (1996) para sigma_adm em areia
      (CINTRA-4.1.2a-teixeira-1996-areia). Transcrição idêntica nas duas
      páginas, conferida.
    leitura_visual:
      passada_1: "página PDF 45 (impressa 45) inteira a 160 dpi"
      passada_2: "recorte a 500 dpi (x 60-470, y 380-470 em pontos) — extensão do radical conferida"
      divergencia: false
    status: NAO_NORMATIVO_AGUARDA_A2

  - id: CINTRA-2.9.3-tabelas-peso-especifico-e-classificacao
    norma: "CINTRA, J.C.A.; AOKI, N.; ALBIERO, J.H. - Fundações Diretas, 2011"
    fonte_tipo: SECUNDARIA_NAO_NORMATIVA
    item: "2.9.3 Peso específico — Tab. 2.4 e Tab. 2.5 (Godoy, 1972)"
    pagina: "impressas 45 e 46 (PDF 45 e 46)"
    clausula_ref: CINTRA-2.9.3-peso-especifico-e-classificacao-por-Nspt
    titulo: "Consistência (argila) e compacidade (areia) por faixa de N_SPT, com peso específico — TABELAS, extraíveis"
    tipo: TABELA_NUMERICA
    tabela_2_4_solos_argilosos:
      unidade_peso_especifico: "kN/m3"
      linhas:
        - {N_spt: "<= 2",  consistencia: "Muito Mole", gamma: 13}
        - {N_spt: "3 - 5",  consistencia: "Mole",       gamma: 15}
        - {N_spt: "6 - 10", consistencia: "Média",      gamma: 17}
        - {N_spt: "11 - 19", consistencia: "Rija",      gamma: 19}
        - {N_spt: ">= 20",  consistencia: "Dura",       gamma: 21}
    tabela_2_5_solos_arenosos:
      unidade_peso_especifico: "kN/m3"
      estrutura_da_fonte: >-
        A coluna Compacidade tem CINCO classes, mas a de peso específico tem
        apenas TRÊS linhas de valores: "Fofa" e "Pouca Compacta" COMPARTILHAM
        16/18/19, e "Compacta" e "Muito Compacta" COMPARTILHAM 18/20/21. Isso
        está assim impresso (conferido a 450 dpi) e NÃO é erro de transcrição.
        As linhas abaixo desdobram os pares para facilitar consulta; nenhum
        valor foi interpolado ou inventado.
      linhas:
        - {N_spt: "< 5",    compacidade: "Fofa",                  seca: 16, umida: 18, saturada: 19}
        - {N_spt: "5 - 8",   compacidade: "Pouca Compacta",        seca: 16, umida: 18, saturada: 19}
        - {N_spt: "9 - 18",  compacidade: "Medianamente Compacta", seca: 17, umida: 19, saturada: 20}
        - {N_spt: "19 - 40", compacidade: "Compacta",              seca: 18, umida: 20, saturada: 21}
        - {N_spt: "> 40",   compacidade: "Muito Compacta",        seca: 18, umida: 20, saturada: 21}
    dominio_validade: >-
      Condição de uso declarada: "se não houver ensaios de laboratório" —
      valores APROXIMADOS de recurso.
      Tab. 2.4 SOMENTE para solos ARGILOSOS (consistência); Tab. 2.5 SOMENTE
      para solos ARENOSOS (compacidade). A fonte NÃO cobre solos intermediários
      (silte, areia argilosa, argila arenosa etc.).
      As faixas de N_spt cobrem todos os inteiros, sem lacuna, nas duas tabelas.
      A classificação por N_spt é atribuída pela fonte à ABNT NBR 6484/2001 —
      norma AUSENTE do acervo deste repositório, e em edição de 2001,
      possivelmente superada.
    CONTRADICAO_DA_FONTE_NAO_RESOLVIDA: >-
      O parágrafo sob a Tab. 2.5 afirma, literalmente: "No caso de areia
      saturada, o valor apresentado na Tab. 2.5 refere-se ao peso específico
      submerso. Como para o cálculo de capacidade de carga precisamos sempre do
      peso específico efetivo, é necessário descontar o peso específico da
      água."
      As duas frases não podem valer ao mesmo tempo: se o valor JÁ fosse
      submerso, não haveria o que descontar. Além disso 19/20/21 kN/m3 são
      ordens de grandeza de peso específico SATURADO (total); submerso ficaria
      em torno de 9 a 11 kN/m3.
      Conferido a 500 dpi com a margem esquerda inteira: NÃO há um "não" na
      frase — o texto é esse mesmo.
      NENHUMA fórmula de peso específico submerso foi escrita a partir deste
      trecho, e eu NÃO escolhi entre as duas leituras. DECISÃO DO a2.
      IMPACTO: aplicar a leitura errada muda gamma por um fator de ~2 nas
      parcelas de sobrecarga e de peso próprio da equação de capacidade de
      carga — e é do lado INSEGURO usar 19-21 kN/m3 como se fosse efetivo
      abaixo do nível d'água.
    leitura_visual:
      passada_1: "páginas PDF 45 e 46 inteiras a 160 dpi"
      passada_2: "recorte da Tab. 2.5 e do parágrafo seguinte a 450 dpi (x 150-470, y 470-700); recorte do parágrafo com margem esquerda a 500 dpi (x 95-480, y 610-690)"
      divergencia: false
    status: NAO_NORMATIVO_AGUARDA_A2

