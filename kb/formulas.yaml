      lamb:     {descricao: "índice de esbeltez", unidade: "adimensional", valor: null}
    dominio_validade: >-
      SOMENTE para pilares com λ > 140, e SOMENTE sobre os efeitos LOCAIS de 2ª
      ordem (não sobre os esforços de 1ª ordem). Registrado aqui apenas para
      FECHAR A FRONTEIRA DE DOMÍNIO: esta rodada NÃO implementa 2ª ordem, logo
      o a4 deve RECUSAR λ >= λ1 antes de chegar perto de λ = 140. A fórmula não
      deve ser implementada nesta rodada.
