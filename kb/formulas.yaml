  - id: NBR6118-17.3.5.3-armadura-longitudinal-pilar
    norma: "NBR 6118:2023"
    item: "17.3.5.3.1 e 17.3.5.3.2"
    pagina: 133
    clausula_ref: NBR6118-17.3.5.3.1-armadura-minima-pilar
    titulo: "Armaduras longitudinais mínima e máxima de pilares"
    latex: "A_{s,\\min} = \\max\\left(0{,}15\\,\\dfrac{N_d}{f_{yd}},\\; 0{,}004\\,A_c\\right) \\qquad A_{s,\\max} = 0{,}08\\,A_c"
    sympy: "[Eq(A_s_min, Max(0.15*N_d/f_yd, 0.004*A_c)), Eq(A_s_max, 0.08*A_c)]"
    variaveis:
      A_s_min: {descricao: "área mínima de armadura longitudinal do pilar", unidade: "cm2", valor: null}
      A_s_max: {descricao: "área máxima de armadura longitudinal do pilar", unidade: "cm2", valor: null}
      N_d:     {descricao: "força normal de cálculo", unidade: "kN", valor: null}
      f_yd:    {descricao: "resistência de cálculo ao escoamento do aço", unidade: "kPa (ou MPa, consistente com N_d e A_c)", valor: null}
      A_c:     {descricao: "área da seção transversal bruta de concreto do pilar", unidade: "cm2", valor: null}
    dominio_validade: >-
      Armadura longitudinal de PILARES de concreto armado (o item se chama
      literalmente "Valores-limites para armaduras longitudinais de pilares").
      A_s,mín é um MÁXIMO entre duas parcelas — a Norma escreve
      "A_s,mín = (0,15 N_d/f_yd) >= 0,004 A_c", ou seja, a primeira parcela
      calculada, com piso na segunda.
      A_s,máx = 8 % de A_c deve considerar INCLUSIVE a sobreposição de armadura
      na região de emenda: se a emenda de traspasse com a armadura de espera da
      sapata for total na mesma seção (o que 9.5.2.1 AUTORIZA para armadura
      permanentemente comprimida), a taxa fora da emenda fica na prática
      limitada a 4 % de A_c. Essa é a restrição que costuma governar o pilarete.
      NÃO DECLARADO NA FONTE: qual combinação de ações fornece o N_d de A_s,mín
      (adotar a mais desfavorável é interpretação, não texto).
      Remissão obrigatória a 18.4.2.2 (distribuição transversal).
    leitura_visual:
      passada_1: "página PDF 151 (impressa 133) inteira a 300 dpi"
      passada_2: "recorte das duas expressões a 450 dpi"
      divergencia: false
    status: OK
    alterada_por_emenda1: false

  - id: NBR6118-18.4.3-espacamento-estribos-pilar
    norma: "NBR 6118:2023"
    item: "18.4.3"
    pagina: 153
    clausula_ref: NBR6118-18.4.3-armaduras-transversais-pilar
    titulo: "Armadura transversal de pilares — diâmetro mínimo do estribo e espaçamento longitudinal máximo"
    latex: "\\phi_t \\ge \\max(5\\ \\mathrm{mm},\\ \\phi/4) \\qquad s \\le \\min\\left(200\\ \\mathrm{mm},\\ b_{\\min},\\ k_\\phi\\,\\phi\\right)"
    sympy: "[Ge(phi_t, Max(5, phi/4)), Le(s, Min(200, b_min, k_phi*phi))]"
    k_phi_por_categoria_de_aco:
      CA-25: 24
      CA-50: 12
      CA-60: "NAO_DECLARADO_NA_FONTE — o item lista apenas CA-25 e CA-50"
    alternativa_estribo_fino:
      condicao: "phi_t < phi/4, desde que as armaduras sejam constituídas do MESMO TIPO DE AÇO"
      latex: "s_{\\max} = 90000\\left(\\dfrac{\\phi_t^2}{\\phi}\\right)\\dfrac{1}{f_{yk}}"
      sympy: "Eq(s_max, 90000*(phi_t**2/phi)/f_yk)"
      unidades: "f_yk em MPa; phi e phi_t na mesma unidade; s_max resultando em mm"
      observacao: >-
        Esta limitação é ADICIONAL ("respeite TAMBÉM"), não substitutiva: o
        espaçamento continua sujeito ao mínimo entre 200 mm, b_mín e k_φ·φ.
    variaveis:
      phi_t: {descricao: "diâmetro do estribo", unidade: "mm", valor: null}
      phi:   {descricao: "diâmetro da barra longitudinal isolada, ou diâmetro equivalente do feixe", unidade: "mm", valor: null}
      s:     {descricao: "espaçamento longitudinal entre estribos, medido na direção do eixo do pilar", unidade: "mm", valor: null}
      s_max: {descricao: "espaçamento máximo adicional quando se adota phi_t < phi/4", unidade: "mm", valor: null}
      b_min: {descricao: "menor dimensão da seção transversal do pilar", unidade: "mm", valor: null}
      f_yk:  {descricao: "resistência característica ao escoamento do aço", unidade: "MPa", valor: null}
    dominio_validade: >-
      Pilares de concreto armado dentro do campo de 18.4.1 (maior dimensão da
      seção <= 5 × menor dimensão; fora disso é pilar-parede, 18.5).
      LACUNA DO PRÓPRIO TEXTO NORMATIVO: o item dá k_φ para CA-25 e CA-50 e
      NÃO dá para CA-60. Se o software aceitar CA-60 na armadura longitudinal
      do pilarete, o espaçamento máximo fica NAO_DECLARADO_NA_FONTE e o a4 deve
      recusar ou exigir entrada do engenheiro — não extrapolar.
      A NOTA sobre redução de 50 % nos espaçamentos para concretos C55 a C90
      (com ganchos de pelo menos 135°) é RECOMENDAÇÃO ("recomenda-se"), não
      requisito: não pode virar verificação obrigatória no software.
      Quando houver necessidade de armadura transversal para força cortante e
      torção, comparar com os mínimos de 18.3 (vigas) e adotar o MENOR limite —
      caso fora do escopo desta rodada (carga centrada, sem cortante no pilarete).
    leitura_visual:
      passada_1: "páginas PDF 171 e 172 (impressas 153 e 154) a 300 dpi"
      passada_2: "recortes da região da expressão de s_max a 350 e 420 dpi"
      divergencia: false
    status: OK
    alterada_por_emenda1: false
    observacao: >-
      A camada de texto do PDF sugere um expoente 1/2 inexistente
      ("90000 1 2 phi phi / f yk"). A leitura visual mostra a fração 1/f_yk
      MULTIPLICANDO o parêntese (φ_t²/φ), sem raiz nenhuma. Registrado porque é
      exatamente o tipo de erro que um parser silencioso introduziria.

  - id: NBR6118-9.5.2.3-traspasse-comprimidas
    norma: "NBR 6118:2023"
    item: "9.5.2.3"
    pagina: 44
    clausula_ref: NBR6118-9.5.2.3-traspasse-comprimidas
    titulo: "Comprimento de traspasse de barras COMPRIMIDAS, isoladas — dimensiona a armadura de espera do pilarete"
    latex: "\\ell_{0c} = \\ell_{b,nec} \\ge \\ell_{0c,\\min} = \\max\\left(0{,}6\\,\\ell_b,\\; 15\\phi,\\; 200\\ \\mathrm{mm}\\right)"
    sympy: "Eq(l_0c, Max(l_b_nec, 0.6*l_b, 15*phi, 200))"
    variaveis:
      l_0c:     {descricao: "comprimento de traspasse de barras comprimidas", unidade: "mm", valor: null}
      l_b_nec:  {descricao: "comprimento de ancoragem necessário (9.4.2.5 — já extraído no acervo)", unidade: "mm", valor: null}
      l_b:      {descricao: "comprimento de ancoragem básico (9.4.2.4 — já extraído no acervo)", unidade: "mm", valor: null}
      phi:      {descricao: "diâmetro da barra emendada (a de MENOR diâmetro, por 9.5.2.1)", unidade: "mm", valor: null}
    dominio_validade: >-
      Barras COMPRIMIDAS isoladas, emendadas por traspasse, com bitola
      phi <= 32 mm (9.5.2). É O ITEM QUE DIMENSIONA A EMENDA ENTRE A ARMADURA DE
      ESPERA (ARRANQUE) QUE SAI DA SAPATA E A ARMADURA LONGITUDINAL DO PILARETE
      no regime de compressão centrada desta rodada.
      NÃO há coeficiente α_0t (a Tabela 9.4 só vale para barras TRACIONADAS,
      por 9.5.2.2.1) — e por 9.5.2.1, tratando-se de armadura permanentemente
      comprimida, TODAS as barras podem ser emendadas na mesma seção.
      Depende de l_b (9.4.2.4) e l_b,nec (9.4.2.5), ambos JÁ no acervo, e por
      cadeia de f_bd (9.3.2.1), η_1 (Tabela 8.2) e f_ctd (8.2.5) — também já no
      acervo. Nenhuma reextração foi necessária.
      Ver ainda 9.5.2.4.2: pelo menos uma barra de armadura transversal 4φ além
      de cada extremidade da emenda, além dos critérios de 9.5.2.4.1.
    leitura_visual:
      passada_1: "página PDF 62 (impressa 44) a 300 dpi"
      passada_2: "recorte da região da equação a 400 dpi"
      divergencia: false
    status: OK
    alterada_por_emenda1: false

  - id: NBR6118-9.5.2.2.1-traspasse-tracionadas
    norma: "NBR 6118:2023"
    item: "9.5.2.2.1 e Tabela 9.4"
    pagina: 43
    clausula_ref: NBR6118-9.5.2.2.1-traspasse-tracionadas
    titulo: "Comprimento de traspasse de barras TRACIONADAS, isoladas"
    latex: "\\ell_{0t} = \\alpha_{0t}\\,\\ell_{b,nec} \\ge \\ell_{0t,\\min} = \\max\\left(0{,}3\\,\\alpha_{0t}\\,\\ell_b,\\; 15\\phi,\\; 200\\ \\mathrm{mm}\\right)"
    sympy: "Eq(l_0t, Max(alpha_0t*l_b_nec, 0.3*alpha_0t*l_b, 15*phi, 200))"
    tabela_9_4_alpha_0t:
      barras_emendadas_na_mesma_secao_pct: ["<=20", 25, 33, 50, ">50"]
      alpha_0t:                            [1.2, 1.4, 1.6, 1.8, 2.0]
    variaveis:
      l_0t:     {descricao: "comprimento de traspasse de barras tracionadas", unidade: "mm", valor: null}
      alpha_0t: {descricao: "coeficiente função da porcentagem de barras emendadas na mesma seção (Tabela 9.4)", unidade: "adimensional", valor: null}
      l_b_nec:  {descricao: "comprimento de ancoragem necessário (9.4.2.5)", unidade: "mm", valor: null}
      l_b:      {descricao: "comprimento de ancoragem básico (9.4.2.4)", unidade: "mm", valor: null}
      phi:      {descricao: "diâmetro da barra emendada", unidade: "mm", valor: null}
    dominio_validade: >-
      Barras TRACIONADAS isoladas, com distância livre entre barras emendadas
      ENTRE 0 E 4φ. Se a distância livre for MAIOR que 4φ, 9.5.2.2.2 manda
      ACRESCER essa distância ao comprimento calculado — condição geométrica que
      o software precisa verificar, não pressupor.
      FORA DO ESCOPO DESTA RODADA (carga centrada ⇒ armadura do pilarete
      permanentemente comprimida ⇒ usar 9.5.2.3). Registrado porque é o item que
