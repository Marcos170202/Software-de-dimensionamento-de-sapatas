  trecho_literal: os valores de tensão admissível de sapatas e tubulões e as cargas admissíveis em estacas podem ser majorados
    em até 15 %. Quando esta majoração for utilizada, o fator de segurança global não pode ser inferior a 1,6.
  hash_trecho: sha256:ac36ccfc0ef59aaa63f0f7b8c6980b6bc6edebe2f838239779257ea1f75ecd34
