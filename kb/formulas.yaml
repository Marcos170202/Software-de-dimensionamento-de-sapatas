      sigma_25: {descricao: "tensão na curva tensão x recalque da PLACA correspondente a 25 mm de recalque; é a tensão de ruptura convencional", unidade: "kPa", valor: null}
    dominio_validade: >-
      Prova de carga em placa. Os recalques de 10 mm e 25 mm são DA PLACA, não
      da sapata; a extrapolação placa -> sapata é tratada em capítulo separado
      (Cap. 3), NÃO extraído nesta rodada.
      DEFEITO DE APLICAÇÃO REGISTRADO PELA PRÓPRIA FONTE, e que é advertência e
      não condição de validade: o critério foi desenvolvido para PLACA QUADRADA
      DE 0,30 m DE LADO e é usado no Brasil desde 1955 "SEM NENHUMA ADAPTAÇÃO"
      para a placa circular de 0,80 m de diâmetro usual aqui.
      O denominador 2 corresponde ao fator de segurança sobre a ruptura
      convencional; o critério de sigma_10 corresponde a fixar recalque
      admissível de 10 mm para a placa.
      Segundo Teixeira e Godoy (1996), sigma_25/2 é SEMPRE mais rigoroso do que
      sigma_10 — ou seja, o mínimo tende a ser sempre o segundo termo.
    nao_confundir: >-
      O "FS = 2" deste critério NÃO é o FSg = 2,00 da Tabela 1 da NBR 6122:2022.
      O da norma vale para "semiempíricos ou analíticos ACRESCIDOS DE DUAS OU
      MAIS PROVAS DE CARGA executadas na fase de projeto"; este é o denominador
      do critério de Boston sobre a curva da placa. Ver
      CINTRA-4.1.2-conflito-FS-embutido-vs-NBR6122-Tabela1.
      FORA DO CAMINHO CRÍTICO ATUAL: o repositório não tem entrada de curva de
      prova de carga.
