  - id: NBR6118-7.4.7-cobrimento-nominal
    norma: "NBR 6118:2023"
    item: "7.4.7.1, 7.4.7.2, 7.4.7.5 e Tabela 7.2"
    pagina: 19
    clausula_ref: NBR6118-Tabela7.2-cobrimento-nominal
    titulo: "Cobrimento nominal — critério de aceitação e valores da Tabela 7.2"
    latex: "c_{nom} \\ge c_{min} + \\Delta c \\,,\\quad \\Delta c \\ge 10\\ \\mathrm{mm}\\,;\\qquad c_{nom} \\ge \\phi_{barra}"
    sympy: "[Ge(c_nom, c_min + Delta_c), Ge(Delta_c, 10), Ge(c_nom, phi)]"
    variaveis:
      c_nom:   {descricao: "cobrimento nominal (o que vai no projeto e nos espaçadores)", unidade: "mm", valor: null}
      c_min:   {descricao: "cobrimento mínimo — menor valor a respeitar ao longo de todo o elemento", unidade: "mm", valor: null}
      Delta_c: {descricao: "tolerância de execução", unidade: "mm", valor: null}
      phi:     {descricao: "diâmetro da barra (ou φ_n = φ√n para feixe; 0,5 φ_bainha para bainha)", unidade: "mm", valor: null}
    tabela_7_2_cobrimento_nominal_mm:
      nota: "para Δc = 10 mm; colunas = classes de agressividade ambiental I, II, III, IV (Tabela 6.1)"
      concreto_armado:
        laje:                                  {I: 20, II: 25, III: 35, IV: 45}
        viga_pilar:                            {I: 25, II: 30, III: 40, IV: 50}
        elementos_em_contato_com_o_solo:       {I: 30, II: 30, III: 40, IV: 50}
      concreto_protendido:
        laje:                                  {I: 25, II: 30, III: 40, IV: 50}
        viga_pilar:                            {I: 30, II: 35, III: 45, IV: 55}
      nota_de_rodape_d_GOVERNA_O_PILARETE: >-
        "No trecho dos pilares em contato com o solo junto aos elementos de
        fundação, a armadura deve ter cobrimento nominal >= 45 mm."
        Piso ABSOLUTO de 45 mm, independente da classe de agressividade — mais
        restritivo que a linha "Viga/pilar" nas classes I, II e III.
    dominio_validade: >-
      Concreto armado e protendido, classes de agressividade I a IV.
      PARA O PILARETE DE FUNDAÇÃO o valor que governa é a NOTA DE RODAPÉ (d) da
      Tabela 7.2: c_nom >= 45 mm no trecho em contato com o solo junto aos
      elementos de fundação. O a2 precisa decidir explicitamente onde termina
      "o trecho em contato com o solo" num pilarete parcialmente enterrado — a
      Norma NÃO define essa fronteira (NAO_DECLARADO_NA_FONTE).
      Na linha "Elementos estruturais em contato com o solo" as classes I e II
      compartilham UMA ÚNICA CÉLULA de 30 mm — a extração de texto crua entrega
      3 valores para 4 colunas e leva a pareamento errado.
      A redução de 5 mm para concretos de classe superior à mínima exigida é
      permitida ("podem ser reduzidos em até 5 mm"), não automática.
      A redução para Δc = 5 mm (7.4.7.4) exige projeto conforme ABNT NBR 9062,
      norma AUSENTE do acervo — fora do domínio implementável.
      Os cobrimentos são referidos à ARMADURA EXTERNA, em geral a face externa
      do ESTRIBO (7.4.7.5), não à barra longitudinal.
