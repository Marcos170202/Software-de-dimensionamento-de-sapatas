      O TEXTO dos dois itens: como a armadura do pilarete é comprimida e a
      proporção emendada na mesma seção é tipicamente 100 % (>= 25 %), valem os
      requisitos reforçados de 9.5.2.4.1 — estribos capazes de resistir à força
      de UMA barra emendada, fechados quando a distância entre as duas barras
      mais próximas de duas emendas for < 10·phi, concentrados nos terços
      extremos — MAIS a exigência própria de 9.5.2.4.2: pelo menos uma barra de
