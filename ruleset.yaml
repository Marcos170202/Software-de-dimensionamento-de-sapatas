# --- Versão 3: rodada NBR 6118 §22.6 (rigidez e direcionalidade) ------------
#
# ATENÇÃO: esta versão ALTERA o ruleset. Conforme CLAUDE.md regra 5, as
# aprovações de A6 (relatorios/revisao_codigo.md) e A7 (relatorios/validacao*)
# ficam INVALIDADAS para tudo que dependa das regras NBR6118-22.6.*: é
# obrigatória nova rodada de A6 e A7 antes de qualquer release. As regras
# NBR6122-* e NBR6118-8/9/19.4/19.5 não foram tocadas.
#
# Disparada por consulta do usuário: "o modelo classifica sapata isolada como
# unidirecional/bidirecional e aplica redutor de armadura secundária?"
#
# RESPOSTA NORMATIVA, conferida por leitura VISUAL das páginas 191/192/193 da
# NBR 6118:2023 pelo a2-verificador (não pelo resumo do a1): NÃO EXISTE, na
# NBR 6118:2023, classificação de sapata em unidirecional/bidirecional, nem
# critério geométrico que a produza, nem redutor de armadura em direção
# secundária. Os itens 22.6.2.2-a) (rígida) e 22.6.2.3-a) (flexível) exigem
# trabalho à flexão NAS DUAS DIREÇÕES, incondicionalmente. A única dicotomia
# de comportamento estrutural oferecida pela Norma é rígida x flexível
# (declarado textualmente em 22.6.2.1). Portanto o comportamento atual do
# software — sempre dimensionar as duas direções, sem redutor — está CORRETO
# e não é lacuna; passa a ser regra APROVADA e explicitamente protegida
# contra "otimização" futura (ver NBR6118-22.6.2.2a-flexao-duas-direcoes).
#
# A NBR 6122:2022 corrobora pelo lado terminológico: "sapata corrida" (3.40) é
# definida por CARREGAMENTO (carga distribuída linearmente ou 3+ pilares num
# mesmo alinhamento), não por forma alongada. Uma sapata retangular alongada
# sob UM pilar permanece no campo de 3.38 (sapata) — não migra para 3.40 e
# não herda nenhum tratamento de viga/faixa por analogia terminológica.
#
# Auditoria da extração do a1 nesta rodada: 15 transcrições + 4 buscas
# negativas. Rastreabilidade (norma+item+página+hash) presente em 15/15, e
# todos os 15 hashes foram reconferidos como sha256 reproduzível do próprio
# enunciado. Três imprecisões do a1 corrigidas aqui, nenhuma bloqueante:
#   (a) o a1 afirma que 22.6.4.1.3 é "a ÚNICA referência cruzada da Seção 22
#       para as Seções 19 e 20". FALSO como escrito: 22.6.2.2-b) remete a
#       19.5.3.1 e 22.6.2.3-b) remete a 19.5. O correto e mais estreito:
#       22.6.4.1.3 é a única remissão que importa requisitos de DETALHAMENTO
#       DE LAJE (Seção 20) para sapata — e só para sapata FLEXÍVEL. Sapata
#       rígida TEM, sim, obrigação vinda da Seção 19 (compressão diagonal por
#       19.5.3.1, via 22.6.2.2-b).
#   (b) a busca negativa NBR6122-sapata-isolada-nada registra 'bidirecional'
#       como NADA_ENCONTRADO na NBR 6122:2022; o termo OCORRE duas vezes
#       (PDF p. 50 e 53), como "teste bidirecional" (ensaio tipo Osterberg).
#       A conclusão do a1 não muda, mas o falso positivo não foi documentado.
#   (c) "sapata isolada" tem 0 ocorrência no singular na NBR 6122; a única
#       ocorrência é no plural, "sapatas isoladas", em 7.7.1.

# --- Versão 2: adição do escopo AMPLO ---------------------------------------
#
# calc_core/sapata_isolada/ é um pacote maior, fornecido pelo usuário (não
# gerado pelo pipeline A1->A2 deste projeto), cobrindo carga excêntrica,
# recalques, punção, bielas e tirantes, rigidez/grelha sobre base elástica e
# MEF do solo. Ele foi tratado como fonte a AUDITAR, não como verdade aceita:
# cada fórmula abaixo com status APROVADA foi conferida por leitura VISUAL
# (imagem da página em 300dpi, não do texto extraído) contra a NBR 6118:2023,
# porque as equações da 6118 não têm camada de texto (ver CLAUDE.md).
#
# Da auditoria da Seção 8 (materiais), 9 (ancoragem) e 19.4/19.5 (cisalhamento
# e punção) — a única parte coberta até agora — saíram 6 defeitos confirmados,
# todos corrigidos em calc_core/sapata_isolada/materiais.py e sapata.py:
#   1. fct,m (fck>50MPa): constante errada na fórmula.
#   2. Eci: faltava o parâmetro alpha_E do agregado (assumia granito=1,0 sempre).
#   3. l_b básico: faltava o piso >=25*phi exigido pela norma.
#   4. eta_1: CA-60 herdava o valor de CA-50 (2,25 em vez de 1,00) — ERRO DO
#      LADO INSEGURO (subestima comprimento de ancoragem para CA-60).
#   5. tau_Rd1 (punção, contorno C'): "d" usado em milímetros em vez de
#      centímetros no fator ke — subestimava a resistência (conservador).
#   6. tau_Rd1: faltava o teto rho<=0,02 — ERRO DO LADO INSEGURO em sapata
#      muito armada (superestima a resistência à punção).
#
# As demais partes do pacote (geotecnia com Boussinesq/Newmark, recalques —
# Schmertmann/Perloff/Terzaghi, bielas e tirantes de Blévot além dos limites
# de nó já conferidos, rigidez/grelha sobre base elástica de Winkler, MEF do
# solo axissimétrico, e a geometria/estabilidade sob carga excêntrica em
# sapata.py) foram PORTADAS mas AINDA NÃO auditadas item a item contra a
# fonte — ver a seção "escopo_amplo_em_conferencia" abaixo. A interface e o
# memorial devem deixar isso visível: "em conferência" não é "aprovado".

regras:

  - id: NBR6122-7.6.1-area-carga-centrada
    norma: "NBR 6122:2022"
    item: "7.6.1"
    pagina: 23
    metodo: ambos  # a fórmula (sigma = N/A <= sigma_adm) vale tanto para
                    # valores admissíveis (característico + FSg) quanto para
                    # valores de cálculo (tensão resistente de cálculo) —
                    # a norma usa a mesma estrutura para os dois métodos em
                    # 7.1; o chamador decide qual tensão-limite está passando.
    status: APROVADA
    implementacao: "geotecnico.dimensionar_sapata_carga_centrada"
    checagem_dimensional: "N [kN] / A [m²] = sigma [kPa]; sigma <= sigma_adm [kPa]. Homogêneo."
    checagem_numerica: "N_k=1200 kN, sigma_adm=250 kPa, pilar 0,30x0,50 m -> A_nec=4,8 m², B~2,10 L~2,30 m (ver relatorios/conformidade.md). Dentro da faixa plausível declarada em a2-verificador.md (50-600 kPa)."
    observacao: "Cláusula não define COMO obter B e L a partir da área — apenas exige tensão uniforme <= limite. O método de manter a mesma folga 'c' nas quatro bordas do pilar (B=b_pilar+2c, L=l_pilar+2c) é prática consagrada de escritório (Alonso, Bowles), NÃO é texto da norma. Registrado como decisão de implementação, não como regra normativa — rotulado em código como tal."

