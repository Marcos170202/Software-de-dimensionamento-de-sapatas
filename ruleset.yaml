  - id: NBR6122-7.7.2-profundidade-divisa
    status: APROVADA
    tipo: verificacao
    metodo: ambos
    titulo: Profundidade minima de apoio nas divisas
    norma: ABNT NBR 6122:2022
    item: 7.7.2
    pagina: [24]
    pagina_pdf: [36]
    clausula_kb: NBR6122-2022-7.7.2
    hash_trecho: sha256:e3a8828e0aa22221fdd39c54d891308684dd3124449b1e09d367f8bf8441655d
    trecho_literal:
      - Nas divisas com terrenos vizinhos, salvo quando a fundação for assente sobre rocha, a profundidade de apoio não pode ser inferior a 1,5 m.
      - Em casos de obras cujas sapatas ou blocos tenham, em sua maioria, dimensões inferiores a 1,0 m, essa profundidade mínima pode ser reduzida.
      - A cota de apoio de uma fundação deve ser tal que assegure que a capacidade de suporte do solo de apoio não seja influenciada pelas variações sazonais de clima ou por alterações de umidade.
    origem: LITERAL
    sympy: ["D_assentamento >= D_min_divisa"]
    variaveis:
      D_assentamento: {unidade_pint: m, implementacao: geotecnico.D_assentamento}
    constantes:
      D_min_divisa: {valor: 1.5, unidade_pint: m, literal: "1,5 m"}
    entradas:
      em_divisa: {tipo: bool, entrada_obrigatoria: true}
      obra_maioria_sapatas_menores_1m: {tipo: bool, entrada_obrigatoria: true}
      declaracao_cota_sem_influencia_sazonal: {tipo: bool, entrada_obrigatoria: true, nota: "requisito qualitativo do 2o paragrafo; declarado pelo engenheiro, registrado no memorial"}
    logica:
      - "em_divisa == False -> verificacao de 1,5 m nao se aplica (registrar)"
      - "em_divisa == True e D_assentamento >= 1,5 m -> ATENDE"
      - "em_divisa == True e D_assentamento < 1,5 m e obra_maioria_sapatas_menores_1m == False -> NAO_ATENDE"
      - "em_divisa == True e D_assentamento < 1,5 m e obra_maioria_sapatas_menores_1m == True -> INCONCLUSIVO: a norma permite reduzir mas nao fixa valor; exige justificativa escrita do engenheiro no memorial. O software nao aprova nem inventa piso."
      - "excecao 'assente sobre rocha' inalcancavel no v0 (rocha recusada pela guarda 7.5)"
    nota_A2: forma simbolica do A1 ("D_apoio >= 1.5") REJEITADA na checagem dimensional; substituida por constante com unidade.

  - id: NBR6122-7.7.3-lastro
