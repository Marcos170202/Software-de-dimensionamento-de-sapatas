  - id: NBR6122-6.2.1.1.2-tracao-deslizamento-tombamento
    norma: "NBR 6122:2022"
    item: "6.2.1.1.2"
    pagina: 17          # página impressa 17 = PDF p. 29 (offset 12)
    hash: "sha256:816ce04330cbfffee574b14aaa2b18591d3f4d83fee5c9a7cb4ce8e761813e93"
    hash_pdf_fonte: "sha256:65fb1d5c60b81066010c08a2e86fdedb3491d0603a7c98a46917d52f29571f53"
    metodo: calculo     # <<< SÓ valores de cálculo. A norma NÃO oferece rota
                        # de valores admissíveis (FS global) para tração,
                        # deslizamento e tombamento de fundação rasa.
    status: PENDENTE_HUMANO
    implementacao: "geotecnico.<a definir> — HOJE existe apenas
      sapata_isolada.sapata::_verificar_estabilidade, que NÃO implementa esta
      regra (usa FS global sobre combinações ELS). Não é [rule:] desta regra."
    texto_literal: >-
      "6.2.1.1.2 Coeficientes de ponderação para verificação de tração,
      deslizamento e tombamento — Devem ser adotados os seguintes coeficientes
      de ponderação: γm = 1,2 (minoração) para a parcela favorável do peso;
      γm = 1,4 (minoração) para a resistência do solo; γf = 1,4 (majoração)
      para o esforço atuante, se disponível apenas o seu valor característico;
      se já fornecido o valor de cálculo, nenhum coeficiente de ponderação
      deve ser aplicado a ele."
    checagem_dimensional: >-
      Coeficientes adimensionais aplicados a grandezas homogêneas
      (peso [kN], resistência [kN], esforço atuante [kN]). As razões FS do
      código também fecham adimensionais (verificado com pint: N·tanδ + c'·A
      [kN] / H [kN] e N·a/2 [kN·m] / M [kN·m]). A dimensão NÃO acusa o defeito
      aqui — o defeito é de MÉTODO e de VALOR, não de transcrição dimensional.
    checagem_numerica: >-
      Convertendo 6.2.1.1.2 para FS global equivalente: deslizamento exige
      R_k/S_k >= 1,2·1,4·1,4 = 2,35 (leitura estrita, peso favorável minorado
      E resistência do solo minorada) ou >= 1,4·1,4 = 1,96 (leitura branda, um
      único γm sobre a resistência de atrito). Tombamento: >= 1,2·1,4 = 1,68.
      O código adota 1,5 e 1,5 (geotecnia.py:215-216). Em TODAS as leituras
      possíveis o código é MENOS conservador que a norma: -36% a -57% em
      deslizamento, -11% em tombamento. LADO INSEGURO.
    motivo_pendencia: >-
      REFORMULADO na versão 5 — de DUAS perguntas bloqueantes para UMA.
      PERGUNTA BLOQUEANTE ÚNICA (era a nº 2): o software mantém a rota de
      valores admissíveis (FS global sobre combinações características) para
      deslizamento e tombamento, com FS = 1,5 rotulado como PRÁTICA CONSAGRADA
      NÃO NORMATIVA, ou migra para o método de valores de cálculo de
      §6.2.1.1.2 (combinações ELU + coeficientes parciais)? O engenheiro que
      responder precisa estar ciente de três fatos, todos verificados:
      (i) §6.2.1.1.2 é o ÚNICO item da NBR 6122:2022 que cobre deslizamento e
      tombamento de fundação rasa, e ele só oferece coeficientes parciais;
      (ii) a licença de escolha de rota de §7.1 e §6.2.1.1.1 é sobre a TENSÃO
      (compressão), não sobre esta verificação — ver cabeçalho da versão 5;
      (iii) o FS equivalente da norma é 1,68 (tombamento) a 2,35 (deslizamento)
      contra os 1,5 do código, ou seja, manter 1,5 é decidir operar de 11 % a
      36 % do lado inseguro em relação ao único item aplicável, em troca de
      alinhamento com a prática de mercado.
      PERGUNTA ANTES BLOQUEANTE, AGORA CONDICIONAL E DORMENTE (era a nº 1):
      se "γm = 1,4 para a resistência do solo" incide sobre tanδ/c' além da
      minoração de 1,2 já aplicada ao peso favorável (FS equivalente 2,35) ou
      se as duas são alternativas (1,96). Só volta a ser bloqueante SE a
      resposta à pergunta única for "migrar para valores de cálculo". Se a
      resposta for "manter admissíveis", esta pergunta deixa de ter efeito
      sobre o código e permanece registrada apenas como referência do cálculo
      de equivalência.
      NÃO IMPLEMENTAR em calc_core até virar APROVADA. A4/A5 continuam
      PROIBIDOS de alterar os valores 1,5/1,5 — a correção de citação e a
      correção de critério são coisas diferentes e a segunda não está decidida.
      A correção de CITAÇÃO, essa sim, está liberada: ver campo
      `acao_liberada_para_a4` abaixo.
    evidencia_secundaria_v5: >-
      FONTE SECUNDÁRIA NÃO NORMATIVA, admitida como evidência de PRÁTICA e
      NUNCA como fonte de obrigatoriedade: BASTOS, P.S., "Sapatas de
      Fundação", UNESP Bauru/SP, Estruturas de Concreto III, Out/2023, 119 p.
      (Sapatas.pdf na raiz). Item 1.8, p. impressas 74-75 / PDF 78-79.
      Cláusulas BASTOS-1.8a-tombamento-eq170-172 e
      BASTOS-1.8b-escorregamento-eq173-175 em kb/clausulas.jsonl; fórmulas
      BASTOS-1.72-tombamento e BASTOS-1.75-escorregamento em kb/formulas.yaml.
      A fonte prescreve γ_tomb = M_estab/M_tomb >= 1,5 e
      γ_esc = F_estab/F_H >= 1,5 — os MESMOS dois valores do código, na MESMA
      forma de fator de segurança global sobre razão resistente/solicitante.
      Conferido pelo a2 por leitura visual própria a 500 dpi das duas equações.
      O QUE ISSO ESTABELECE: FS = 1,5 para tombamento e escorregamento de
      sapata é prática de ensino e de mercado no Brasil, não invenção deste
      software. É base suficiente para o RÓTULO "prática consagrada".
      O QUE ISSO NÃO ESTABELECE: conformidade com a NBR 6122:2022. A busca
      negativa (registro BASTOS-6.2.1-coef-parciais-nada, refeita pelo a2 nas
      119 páginas) mostra que a string "6.2.1" não ocorre uma única vez na
      apostila e que a expressão "coeficiente de segurança" ocorre uma única
      vez em todo o documento — justamente no parágrafo do 1,5, e sem remissão
      normativa. A fonte apresenta 1,5 como valor de projeto direto.
      LEITURA DO A2: uma segunda fonte independente que dá 1,5 SEM citar norma
      é, ao mesmo tempo, evidência a favor do rótulo "prática consagrada" e
      evidência adicional de que não existe âncora normativa para o valor.
      Ela FORTALECE a rotulagem e NÃO substitui a decisão humana sobre manter
      ou não a constante em produção.
    correspondencia_codigo_x_fonte_secundaria: >-
      Verificado pelo a2 com pint e com valores típicos (N=800 kN, P=60 kN,
      F_H=60 kN, M=50 kN·m, h=0,8 m, base 2,0 x 2,0 m, φ=30°, c=10 kPa):
      `sapata.py::_verificar_estabilidade` implementa, na prática, o modelo da
      apostila e NÃO o da norma — M_tomb = M + F_H·h (eq. 1.70),
      M_estab = (N+P)·A/2 (eq. 1.71), razão >= 1,5 (eq. 1.72), e para o
      deslizamento a razão F_estab/F_H >= 1,5 (eq. 1.75) com F_estab de atrito
      mais coesão (eq. 1.74). Todas as razões fecham adimensionais.
      DUAS DIVERGÊNCIAS ENTRE O CÓDIGO E A FONTE, ambas apuradas nesta rodada:
      (a) A FAVOR DO CÓDIGO — a eq. 1.74 escreve a parcela de coesão como A·c
      com A definido pela fonte como comprimento, o que é dimensionalmente
      inconsistente; o código escreve `self.solo.coesao * self.a * self.b`,
      isto é, coesão vezes ÁREA, que é a leitura dimensionalmente correta.
      O defeito da fonte NÃO se propagou para o código.
      (b) CONTRA O CÓDIGO — a eq. 1.74 reduz a coesão a 2/3 (parcela
      "A(2/3 c)"); o código aplica o fator 2/3 apenas ao ângulo de atrito
      (`fator_atrito_base`) e usa a coesão CHEIA. No caso típico acima isso
      torna o código 3,9 % menos conservador que a própria apostila na força
      resistente ao deslizamento. É pequeno e não é bloqueante, mas significa
      que o código não pode ser descrito como "implementa Bastos 1.74": ele
      implementa uma variante mais permissiva. Se a resposta humana for
      "manter a rota admissível", este item entra junto na mesma decisão.
    alertas_da_fonte_avaliados_pelo_a2: >-
      Os dois alertas de qualidade levantados pelo a1 foram avaliados e têm
      PESOS MUITO DIFERENTES na decisão:
      (1) COLISÃO DE SÍMBOLO γ — RELEVANTE, e diretamente relevante a esta
      discussão. A apostila grafa o fator de segurança GLOBAL como γ_tomb e
      γ_esc; a NBR 6122 usa γm/γf para COEFICIENTES PARCIAIS. É a colisão de
      método de segurança do §3 do a2-verificador aparecendo já na notação.
      Um leitor de memorial que veja "γ_tomb = 1,5" pode entender que se trata
      de coeficiente de ponderação normativo — que é precisamente o erro que
      esta pendência existe para impedir. REQUISITO REGISTRADO: o software
      NÃO pode grafar esta constante como γ, em código, em tela ou em
      memorial. Grafar `FSg_tombamento` / `FSg_deslizamento` (fator de
      segurança global), com o rótulo de prática não normativa colado ao
      número. Vale mesmo que a decisão humana seja migrar de método.
      (2) INCONSISTÊNCIA DIMENSIONAL DA EQ. 1.74 — REAL (confirmada por pint,
      ver cabeçalho da versão 5) mas IRRELEVANTE para a decisão sobre o valor
      1,5. São coisas separadas: 1,5 vem da eq. 1.72 e da eq. 1.75, ambas
      dimensionalmente sadias; o defeito está só na eq. 1.74, que é uma das
      duas alternativas de F_estab. E o código já usa a forma dimensionalmente
      correta (coesão x área), como registrado acima. Portanto este alerta NÃO
      enfraquece a apostila como evidência de prática quanto ao 1,5. Ele
      apenas proíbe que a eq. 1.74 seja citada como fórmula auditada.
    discrepancia_de_edicao: >-
      REGISTRO, NÃO TAREFA. Três edições diferentes da NBR 6122 circulam neste
      dossiê: a apostila cita 2021 (três vezes, e "2022" não aparece nenhuma
      vez em suas 119 páginas); o código cita 2019 em vários pontos; o acervo
      deste repositório tem a de 2022. O a1 conferiu três trechos citados
      literalmente pela apostila contra a edição 2022 e bateram palavra por
      palavra, e a numeração dos dezesseis itens que ela cita coincide — o que
      é COMPATÍVEL com a hipótese de erro de grafia do ano, mas NÃO a prova, e
      em particular nada disso prova que o item de deslizamento/tombamento
      tenha a mesma redação em 2021. Não há exemplar de 2021 nem de 2019 no
      acervo, logo não há como investigar. Fica assim. Consequência operacional
      única e suficiente: a fonte normativa deste projeto é a NBR 6122:2022 do
      acervo, e toda citação no código deve dizer 2022 — as citações "2019"
      espalhadas pelo código são incorretas por edição, independentemente de
      estarem ou não corretas por item.
    acao_liberada_para_a4: >-
      LIBERADO, e SOMENTE isto: `geotecnia.py:215` traz o comentário
      "# NBR 6122, 6.2.1.2" ao lado de `fs_deslizamento: float = 1.5`, e
      `ui/completo/resultado.py:22` traz
      ITEM_ESTABILIDADE = "NBR 6122:2019 §6.2.1.2 — deslizamento e tombamento".
      As duas citações são falsas em dois níveis: §6.2.1.2 é "Segurança de
      fundações PROFUNDAS", e a edição do acervo é 2022, não 2019. Devem ser
      REMOVIDAS. Substituir NÃO por outro número de item, mas pela verdade
      apurada: o valor 1,5 não tem item normativo; é prática consagrada de
      mercado, documentada em fonte secundária, sob decisão pendente de
      engenheiro. Redação sugerida para o comentário e para o rótulo de tela:
      "FS global = 1,5 — PRÁTICA CONSAGRADA, SEM RESPALDO NORMATIVO. A NBR
      6122:2022 §6.2.1.1.2 trata deslizamento/tombamento SÓ por coeficientes
      parciais (equivalente 1,68 a 2,35). Valor sob decisão de engenharia
      pendente. [rule: NBR6122-6.2.1.1.2-tracao-deslizamento-tombamento —
      PENDENTE_HUMANO]". Isto NÃO é a troca cega "6.2.1.2 -> 6.2.1.1.2" que a
      versão 4 proibiu, e continua proibida: não se troca um item por outro,
      RETIRA-SE a alegação normativa. Nenhum número muda. Nenhum resultado de
      cálculo muda. Executor: a4-geotecnico (estabilidade geotécnica).
    observacao: >-
      COLISÃO DE MÉTODO DE SEGURANÇA (o erro clássico do setor, ver
      a2-verificador.md §3). _verificar_estabilidade itera sobre
      `self.combs_els` (valores característicos) e compara contra um FS
      global — rota de "valores admissíveis". Mas a NBR 6122:2022 só define
      tração/deslizamento/tombamento de fundação rasa pela rota de "valores
      de cálculo". Não há, em toda a NBR 6122:2022, FS global para
      deslizamento ou tombamento: varredura das 120 páginas por
      "deslizamento|tombamento" retorna 4 ocorrências — 6.2.1.1 c) (lista de
      mecanismos de ELU), o título e o corpo de 6.2.1.1.2, e 7.5.1 (fundação
      sobre rocha inclinada). O único FS global de fundação rasa fora da
      compressão é 1,1, e é para FLUTUAÇÃO (6.2.1.1.3) — não confundir.
      Requisito para o software: proibir em tempo de execução a mistura de
      valores característicos com FS global nesta verificação.

