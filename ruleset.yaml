    clausula_ref: "NBR6122-7.3.2-metodos-teoricos-dominio"
    implementacao: "geotecnico.sigma_adm.teorico_terzaghi_vesic (a criar)"
    texto_literal: >-
      "7.3.2 Métodos teóricos — Podem ser empregados métodos analíticos
      (teorias de capacidade de carga) nos domínios de validade de sua
      aplicação, desde que contemplem todas as particularidades do projeto,
      inclusive a natureza do carregamento (drenado ou não drenado)."
    achado_de_edicao_do_a2: >-
      DIFERENÇA DE EDIÇÃO ENCONTRADA PELO a2 NESTA RODADA, que nenhuma das duas
      extrações do a1 detectou, e que o próprio a1 pediu que fosse reconferida
      ("toda remissão a item de norma feita pelo livro precisa ser reconferida
      pelo a2 contra a edição 2022"). O livro Cintra/Aoki/Albiero (2011) cita a
      NBR 6122:2010 assim: "podem ser empregados métodos analíticos (teorias de
      capacidade de carga) nos domínios de validade de sua aplicação, QUE
      CONTEMPLAM todas as particularidades do projeto, inclusive a natureza do
      carregamento (drenado ou não drenado)". A edição 2022 do acervo, lida
      pelo a2 na camada de texto do PDF, diz "... DESDE QUE CONTEMPLEM ...".
      NÃO É DETALHE DE REDAÇÃO: "que contemplam" é oração relativa DESCRITIVA
      (afirma que os métodos contemplam); "desde que contemplem" é CONDIÇÃO
      SUSPENSIVA (só podem ser empregados SE contemplarem). A edição 2022
      converteu em requisito o que em 2010 era descrição. Consequência direta
      para esta rodada: a citação normativa que o livro faz em 4.1.1, e que o
      registro CINTRA-4.1.1-metodos-teoricos-FS-3 reproduz, está correta para
      2010 e DESATUALIZADA para 2022. O memorial deve citar a redação de 2022.
    condicao_suspensiva_vira_guarda: >-
      A condição tem duas pernas e as duas viram guarda executável, porque uma
      condição suspensiva que o software não verifica é uma condição que o
      software viola em silêncio:
      (i) "nos domínios de validade de sua aplicação" — as três hipóteses de
          Terzaghi declaradas na fonte (sapata corrida L >= 5B relaxada pelos
          fatores de forma; embutimento h <= B; maciço rígido / ruptura geral)
          mais solo HOMOGÊNEO. Guarda em REQ-SIGMA-07.
      (ii) "inclusive a natureza do carregamento (drenado ou não drenado)" —
          o software tem de saber, e registrar, se os parâmetros c e phi que
          recebeu são drenados ou não drenados, e o resultado tem de dizê-lo.
          Isto é EXIGÊNCIA NORMATIVA EXPRESSA, não boa prática. E é
          especialmente crítico nesta fonte, que avisa (impressa 26) que na sua
          notação "c e phi geralmente representam os valores NÃO DRENADOS" —
          convenção diferente da usual em Mecânica dos Solos. Guarda em
          REQ-SIGMA-08.
    o_que_esta_regra_nao_aprova: >-
      A EQUAÇÃO. Busca negativa do a1 reconferida pelo a2 na camada de texto do
      PDF: a NBR 6122:2022 não traz Terzaghi, Vesic, Meyerhof, Hansen,
      Skempton, nem fator Nc/Nq/N_gamma, nem fator de forma, nem equação alguma
      de capacidade de carga de fundação rasa. "Capacidade de carga" aparece em
      dois contextos e nenhum desenvolve fórmula. A equação vem de
      `praticas_consagradas` (FB-CINTRA-TERZAGHI-VESIC-capacidade-de-carga) e é
      NÃO NORMATIVA.
    pacote_normativo_do_caminho_teorico: >-
      O que a Norma efetivamente exige deste caminho, e que só faz sentido
      junto: 7.3.2 (esta regra) + Tabela 1 linha "Analíticos" com FSg = 3,00
      FIXO (sem "no mínimo") + nota (b) da Tabela 1, "sem aplicação de
      coeficientes de ponderação aos parâmetros de resistência do terreno" —
      isto é, c e phi entram CARACTERÍSTICOS, não minorados, e toda a segurança
      fica no FSg + 7.4 (ELS). Implementar a equação sem os quatro é
      implementar outra coisa.
    checagem_dimensional: "Item em prosa. A da equação está em FB-CINTRA-TERZAGHI-VESIC-capacidade-de-carga."

  - id: NBR6122-7.3-7.4-conjuncao-ELU-ELS
    norma: "NBR 6122:2022"
    item: "7.3 (chapéu) e 7.4, com remissão a 6.2.2.1"
    pagina: 22          # 7.3 na impressa 22; 7.4 na 23; 6.2.2.1 na 20
    pagina_pdf: 34
    metodo: ambos
    status: APROVADA
    clausula_ref: "NBR6122-7.3-chapeau-elu"
    implementacao: "geotecnico.sigma_adm.* — TODAS as funções (rótulo de saída)"
    texto_literal: >-
      "7.3 [...] A tensão admissível ou a tensão resistente de cálculo deve ser
      fixada a partir da utilização e interpretação de um ou mais dos
      procedimentos descritos em 7.3.1 a 7.3.3, além de atender ao disposto em
      7.4." | "7.4 [...] As tensões determinadas em 7.3 devem também atender ao
      estado limite de serviço. A tensão admissível ou tensão resistente de
      cálculo é, neste caso, o valor máximo da tensão aplicada ao terreno que
      atenda aos requisitos em 6.2.2."
    por_que_esta_regra_existe: >-
      É A REGRA MAIS IMPORTANTE DESTA VERSÃO, e é a única que restringe em vez
      de habilitar. A definição 3.45 de "tensão admissível" é CONJUNTIVA:
      "atende, com fatores de segurança predeterminados, aos estados limites
      últimos (ruptura) E de serviço (recalques, vibrações etc.)". Tudo que a
      v9 aprova — Terzaghi/Vesic, Teixeira, regra N/50 — entrega APENAS a
      parcela de ELU. Nenhum desses caminhos verifica recalque. Logo NENHUM
      deles produz, sozinho, a "tensão admissível" da NBR 6122.
    consequencia_executavel: >-
      PROIBIDO rotular a saída de qualquer função desta versão como "tensão
      admissível conforme a NBR 6122", em tela, em memorial ou em nome de
      variável. O rótulo obrigatório é "parcela de ELU da tensão admissível
      (NBR 6122 §7.3) — §7.4 (ELS/recalque) NÃO verificado". Ver REQ-SIGMA-09,
      e REQ-UI-SIGMA-01 do lado da interface. Esta é a diferença entre um
      software honesto e um que anuncia conformidade que não tem.
    interpretacao_do_a1_avaliada: >-
      O a1 registrou como INTERPRETAÇÃO PRÓPRIA a leitura "sigma_adm final é o
      MENOR entre o valor de 7.3 (ELU) e o valor que satisfaz 6.2.2 (ELS)",
      observando que a Norma não escreve "min(...)". O a2 CONCORDA com a
      leitura e a adota: 7.3 exige "além de atender ao disposto em 7.4" e 7.4
      exige "devem TAMBÉM atender", o que é conjunção de duas condições
      cumulativas sobre a mesma grandeza; o valor que satisfaz ambas é
      necessariamente o menor dos dois tetos. A adoção é INÓCUA nesta versão,
      porque o segundo termo do mínimo não é calculável aqui — e é justamente
      por isso que a regra vira rótulo, e não aritmética.
    por_que_o_ELS_nao_e_calculavel_nesta_versao: >-
      6.2.2.1 exige Ek <= C. O recalque estimado (Ek) o motor amplo até tem
      (calc_core/sapata_isolada/recalques.py), mas ele está em
      `escopo_amplo_em_conferencia` e NÃO foi auditado. E o C — o recalque
      aceitável — a Norma expressamente NÃO fixa: 6.2.2.2.2 lista sete fatores
      para defini-lo (confiabilidade, velocidade dos recalques, tipo de
      estrutura e material, tipo de fundação, natureza do solo, finalidade da
      obra, influência em vizinhos) e NENHUM é calculável a partir de um perfil
      SPT. C é decisão do engenheiro. Software nenhum deduz C.
    nota_sobre_o_semiempirico: >-
      Ressalva do a1 que o a2 confirma e agrava: as correlações semiempíricas
      são calibradas contra desempenho observado, e por isso costuma-se dizer
      que "já embutem" o recalque. Isso é PLAUSÍVEL e NÃO É VERIFICÁVEL a
      partir do valor entregue — a calibração do autor não é auditável e não
      vem com o recalque aceitável C do projeto em questão. Não serve como
      dispensa de 7.4. O rótulo obrigatório vale igualmente para o caminho
      semiempírico.
    checagem_dimensional: "Regra de rotulagem e conjunção, sem aritmética própria."

  - id: NBR6122-6.3.2-majoracao-vento-valores-admissiveis
    norma: "NBR 6122:2022"
    item: "6.3.2 (com 6.3.1)"
    pagina: 21
    pagina_pdf: 33
    metodo: admissivel   # e SÓ admissivel. 6.3.3 é o gêmeo do outro método.
    status: APROVADA
    clausula_ref: "NBR6122-6.3.2-majoracao-vento-valores-admissiveis"
    formula_ref: "NBR6122-6.3.2-majoracao-vento-admissivel"
    implementacao: "geotecnico.vento.majoracao_admissivel (a criar)"
    texto_literal: >-
      "Quando se tratar de solicitações obtidas de combinações de ações nas
      quais o vento é a ação variável principal, os valores de tensão admissível
      de sapatas e tubulões e as cargas admissíveis em estacas podem ser
      majorados em até 15 %. Quando esta majoração for utilizada, o fator de
      segurança global não pode ser inferior a 1,6. Caso a majoração não seja
      utilizada, podem ser aplicados todos os requisitos desta Norma relativos
      ao valor do fator de segurança global. | Quando se tratar de solicitações
      obtidas de combinações de ações nas quais o vento não é a ação variável
      principal, não é permitida a majoração dos valores de tensão admissível de
      sapatas e tubulões, nem de cargas admissíveis em estacas. [...] | Em
      qualquer caso, deve ser feita a verificação estrutural do elemento de
      fundação. | No caso de galpões industriais, torres de linhas de
      transmissão, reservatórios elevados, silos graneleiros, torres eólicas,
      torres de telecomunicações e tanques de produtos químicos, nos quais o
      vento é a ação variável principal, [...] podem ser majorados em até 30 %.
      Quando esta majoração for utilizada, o fator de segurança global não pode
      ser inferior a 1,6. [...]"
    formalizacao: >-
      DESIGUALDADE, jamais igualdade — "em ATÉ 15 %" é TETO de uma FACULDADE
      ("podem ser"). Escrever sigma_adm_vento = 1,15 * sigma_adm seria trair a
      fonte e majorar por conta própria.
        sigma_adm_vento <= (1 + k_v) * sigma_adm
      sujeito, SIMULTANEAMENTE, a:
        (C1) k_v = 0                       se o vento NÃO é ação variável principal
        (C2) k_v <= 0,15                   caso geral
        (C3) k_v <= 0,30                   somente na lista fechada de sete obras
        (C4) FSg / (1 + k_v) >= 1,6        piso do fator de segurança global
      k_v é ESCOLHA DO PROJETISTA dentro do teto, default 0 (não majorar).
    valores:
      k_v_max_caso_geral: 0.15
      k_v_max_lista_fechada: 0.30
      FSg_efetivo_minimo: 1.6
      k_v_default: 0.0
      lista_fechada_dos_30_por_cento:
        - "galpões industriais"
        - "torres de linhas de transmissão"
        - "reservatórios elevados"
        - "silos graneleiros"
        - "torres eólicas"
        - "torres de telecomunicações"
        - "tanques de produtos químicos"
    decisao_do_a2_sobre_o_piso_FSg_1_6: >-
      QUESTÃO DESPACHADA AO a2, QUE REGISTROU DUAS LEITURAS INCOMPATÍVEIS E NÃO
      ESCOLHEU. A Norma não diz COMO se afere "o fator de segurança global não
      pode ser inferior a 1,6" quando se majora.
      LEITURA ADOTADA (L1) — o 1,6 incide sobre o FSg EFETIVO, isto é, o que
      resta depois da majoração: FSg_efetivo = FSg_base / (1 + k_v) >= 1,6.
      FUNDAMENTO 1, aritmético: majorar sigma_adm em 15 % é, por identidade,
      dividir sigma_rup por FSg/1,15. O "fator de segurança global" que existe
      depois da majoração É FSg/1,15. Não há terceira grandeza a que o 1,6
      possa se referir.
      FUNDAMENTO 2, textual: a terceira frase do item — "Caso a majoração não
      seja utilizada, podem ser aplicados TODOS os requisitos desta Norma
      relativos ao valor do fator de segurança global" — só tem sentido por
      contraste. Ela diz que, majorando, nem todos os requisitos de FSg da
      Norma (Tabela 1) seguem valendo tal e qual; no lugar deles entra o piso
      de 1,6 sobre o resultado. Isso é exatamente L1.
      CORREÇÃO DE UM ERRO DO a1, e é o que fecha a decisão: o a1 escreveu que
      sob L1 "com FSg_original = 3,00 e 15 %, dá 2,61 >= 1,6, e a condição
      NUNCA ativa" — e concluiu daí que L1 tornaria a frase inútil. A conclusão
      é falsa porque o a1 testou apenas FSg = 3,00. A Tabela 1 tem TRÊS linhas,
      e a terceira dá FSg = 2,00 (semiempíricos ou analíticos acrescidos de duas
      ou mais provas de carga na fase de projeto). Verificado pelo a2:
          FSg = 3,00, k_v = 0,15 -> 2,61  >= 1,6   não ativa
          FSg = 3,00, k_v = 0,30 -> 2,31  >= 1,6   não ativa
          FSg = 2,00, k_v = 0,15 -> 1,74  >= 1,6   não ativa
          FSg = 2,00, k_v = 0,30 -> 1,538 <  1,6   ATIVA
      Sob L1 a condição BINDA, e binda num caso concreto e nada exótico: obra da
      lista dos 30 % (torre de transmissão, silo, torre eólica — justamente as
      obras em que o vento governa) com FSg reduzido por provas de carga. Nesse
      caso a majoração máxima admissível não é 30 %, e sim 2,00/1,6 - 1 = 25 %.
      A frase da Norma não é surplusage: ela é o que impede a acumulação de dois
      benefícios (prova de carga + vento).
      LEITURA DESCARTADA (L2) — "1,6 é piso independente, que autorizaria
      reduzir o FSg de origem até 1,6". DESCARTADA por três motivos: (i)
      anularia o teto explícito "em até 15 %" / "em até 30 %" escrito na MESMA
      frase, e uma leitura que revoga o texto vizinho não pode prevalecer; (ii)
      sob L2 a majoração admissível chegaria a 3,00/1,6 - 1 = 87,5 %, absurdo
      contra um texto que diz "até 15 %"; (iii) L2 exigiria ler "fator de
      segurança global" como o FSg de ENTRADA no exato ponto em que a Norma
      acaba de dizer que os requisitos de FSg de entrada deixam de ser aplicados
      integralmente.
      GRAU DE CONFIANÇA, dito sem inflar: L1 é uma leitura defensável e L2 é
      refutável, mas NENHUMA DAS DUAS ESTÁ ESCRITA na Norma. Por isso a
      aritmética é aprovada e o EFEITO é contido: (C4) só pode RECUSAR ou
      REDUZIR uma majoração, nunca criar uma. Se a leitura estiver errada, o
      software terá sido conservador — nunca inseguro. Este é o motivo pelo qual
      a regra sai APROVADA e não PENDENTE_HUMANO. A pendência residual, de
      natureza puramente interpretativa e sem efeito inseguro, está registrada
      em kb/pendencias.md > V1.
    armadilhas_literais_da_fonte: >-
      Quatro, todas verificadas pelo a2 na camada de texto e no render a
      300 dpi. (1) "em ATÉ 15 %" / "em ATÉ 30 %" é TETO e FACULDADE, não fator
      automático: o software NÃO pode majorar por conta própria; k_v é entrada,
      default 0. (2) A majoração é condicional a FSg efetivo >= 1,6 — quem
      majora aceita esse piso. (3) Quando o vento NÃO é a ação variável
      principal a majoração é EXPRESSAMENTE PROIBIDA ("não é permitida"), com
      zero de tolerância. (4) A lista dos 30 % é FECHADA e TAXATIVA. Edifício
      residencial ou comercial comum NÃO está nela e fica em 15 %. Nada de
      "obra semelhante a galpão".
    o_que_o_software_nao_pode_decidir: >-
      "O vento é a ação variável principal" é definido pela ABNT NBR 8681
      (remissão de 6.3.1), vem da análise estrutural a montante e NÃO é
      dedutível dentro do módulo de fundação. A NBR 8681:2025 está no acervo mas
      NÃO foi varrida em nenhuma rodada. Portanto: entrada declarada
      explicitamente pelo usuário, default FALSE, sem inferência. Idem para a
      classificação do tipo de obra na lista dos sete. REQ-SIGMA-10.
    nao_alivia_a_verificacao_estrutural: >-
      "Em qualquer caso, deve ser feita a verificação estrutural do elemento de
      fundação" — literal. A majoração é GEOTÉCNICA. Não toca em flexão,
      cisalhamento, punção nem ancoragem da sapata, que continuam com os
      coeficientes da NBR 6118. Um k_v > 0 NÃO pode se propagar para nenhuma
      função de calc_core/sapata_isolada/ do lado estrutural.
    checagem_dimensional: >-
      pint: (1 + k_v) adimensional; (1 + k_v) * sigma_adm [kPa] -> kPa.
      Homogêneo. FSg/(1 + k_v) adimensional. A checagem tem pouco poder aqui —
      k_v é adimensional e quase nada há a desbalancear; quem carrega a regra
      são as condições (C1)-(C4).
    checagem_numerica: >-
      sigma_adm = 300 kPa: k_v = 0,15 -> 345 kPa; k_v = 0,30 -> 390 kPa. Ambos
      dentro da faixa plausível de 50-600 kPa. k_v = 0 -> 300 kPa (identidade,
      caso default). Casos de contorno do piso (C4) tabulados em
      `decisao_do_a2_sobre_o_piso_FSg_1_6`.
    interacao_com_o_FS_embutido_dos_semiempiricos: >-
      Ponto de junção entre as duas features desta versão, e ele fecha bem. Se
      sigma_adm veio de correlação semiempírica, o FSg da condição (C4) é o
      FS_embutido medido pelo a2 (3,0000 exato na regra N/50; 3,05 a 4,55 na de
      Teixeira para areia — ver FB-TEIXEIRA-1996-areia). Com FSg >= 3,00 e
      k_v <= 0,30, o efetivo é >= 2,31 e (C4) nunca binda por este caminho. Mas
      a verificação tem de ser EXECUTADA e não presumida, e é o mesmo campo
      `FS_embutido` que REQ-SIGMA-02 já obriga a carregar. Uma metadado, dois
      usos.

  - id: NBR6122-6.3.3-majoracao-vento-valores-calculo
    norma: "NBR 6122:2022"
    item: "6.3.3"
    pagina: 21
    pagina_pdf: 33
    metodo: calculo
    status: PENDENTE_HUMANO
    clausula_ref: "NBR6122-6.3.3-majoracao-vento-valores-calculo"
    implementacao: null
    texto_literal: >-
      "6.3.3 Método de valores de cálculo — Quando a verificação das
      solicitações for feita considerando-se as combinações nas quais o vento é
      a ação variável principal, os valores de tensão resistente de cálculo de
      sapatas e tubulões e de forças resistentes de cálculo de estacas podem ser
      majorados em até 10 %. | Deve ser feita a verificação estrutural do
      elemento de fundação."
    motivo_pendencia: >-
      NÃO é pendência de leitura — o item foi extraído, conferido pelo a2 na
      camada de texto do PDF e não tem ambiguidade. É pendência de ESCOPO, e a
      decisão é deliberada: implementar 6.3.3 exigiria implementar antes o
      MÉTODO DE VALORES DE CÁLCULO inteiro (tensão resistente de cálculo,
      gamma_m da Tabela 1, gamma_f = 1,4 da nota c), que NÃO existe em nenhum
      lugar deste repositório. Ver `precedente_verificado`. Criar essa rota
      agora, só para a majoração de vento, seria instituir um SEGUNDO PADRÃO DE
      SEGURANÇA convivendo com o primeiro — exatamente a "colisão de método de
      segurança" que o a2 existe para impedir. Fica registrada, não
      implementada.
    precedente_verificado: >-
      Levantado pelo a2 nesta rodada, a pedido, para não criar um segundo
      padrão sem necessidade. O repositório usa HOJE, sem exceção, a rota de
      VALORES ADMISSÍVEIS: (i)
      `calc_core/geotecnico/geometria.py:90,114` calcula
      `area_necessaria = N_total / entrada.sigma_adm` e verifica
      `tensao_atuante <= entrada.sigma_adm` — característico contra admissível;
      (ii) `calc_core/sapata_isolada/sapata.py::_verificar_estabilidade` itera
      sobre `self.combs_els` (valores característicos) contra FS global — e a
      regra NBR6122-6.2.1.1.2-tracao-deslizamento-tombamento já registra que
      esse é o ponto de colisão pendente; (iii) nenhuma ocorrência de gamma_m
      em calc_core/geotecnico/. As regras aprovadas usam `metodo: ambos` porque
      as fórmulas em si (sigma = N/A) são NEUTRAS ao método de segurança — a
      diferença vive no valor de sigma_adm que o chamador fornece. As regras da
      v9 que produzem sigma_adm NÃO são neutras, e por isso são as primeiras a
      levar `metodo: admissivel` explícito.
    assimetrias_em_relacao_a_6_3_2: >-
      TRÊS, todas verificadas pelo a2 na camada de texto, e nenhuma pode ser
      preenchida por analogia quando esta regra for retomada:
      (1) o teto é 10 %, NÃO 15 %;
      (2) NÃO existe em 6.3.3 a lista de sete tipos de obra — o benefício de
          30 % é EXCLUSIVO do método de valores admissíveis;
      (3) NÃO há em 6.3.3 piso algum de fator de segurança nem de gamma_m — o
          "não pode ser inferior a 1,6" é exclusivo de 6.3.2.
      Também NÃO há em 6.3.3 o parágrafo que PROÍBE a majoração quando o vento
      é ação secundária: a autorização é redigida só pela positiva. O a1 leu
      que a condicional inicial ("Quando ... o vento é a ação variável
      principal") já delimita a hipótese e que a ausência do parágrafo
      proibitivo não é permissão. O a2 CONCORDA, e registra que é leitura, não
      texto. Valores ausentes ficam null por AUSÊNCIA NA FONTE, nunca inferidos
      de 6.3.2.
    pergunta_para_o_humano: >-
      O software deve passar a oferecer a rota de VALORES DE CÁLCULO (tensão
      resistente de cálculo, gamma_m = 2,15 semiempírico / 2,15 analítico /
      1,40 com provas de carga, gamma_f = 1,4) como alternativa à rota de
      valores admissíveis que ele usa hoje? Se SIM, esta regra e a de
      6.2.1.1.2 (deslizamento/tombamento) devem ser decididas JUNTAS, porque
      são o mesmo problema. Se NÃO, esta regra permanece registrada e inerte, e
      o software deve dizer ao usuário que não oferece a rota — em vez de
      silenciar. Registrada em kb/pendencias.md > V2.

  # ===========================================================================
  # VERSÃO 11 — PILARETE DE CONCRETO (pilar curto) E TRANSFERÊNCIA
  # PILARETE -> SAPATA. Backlog do usuário, item #13.
  #
  # TODAS as regras deste bloco são NBR 6118:2023 e TODAS têm
  # `metodo: calculo`. Nenhuma delas aceita valor característico com FS global:
  # o pilarete é verificado por valores de cálculo (gamma_f nas ações,
  # gamma_c/gamma_s nas resistências, Tabela 12.1). É a primeira vez que este
  # ruleset tem um bloco inteiro em `calculo` — a proibição de mistura com o
  # bloco geotécnico (`admissivel`) é REQ-PILARETE-14.
  # ===========================================================================

  - id: NBR6118-13.2.3-dimensoes-limites-pilarete
    norma: "NBR 6118:2023"
    item: "13.2.3 e Tabela 13.1"
    pagina: 73
    hash: "sha256:894fb843a37f9f2a0142b5275d69190123b05e53cea5cecde40bcc40d4d630ed"   # kb/clausulas.jsonl > NBR6118-13.2.3-dimensoes-limites-pilar
    metodo: calculo
    status: APROVADA
    implementacao: "estrutural.pilarete.verificar_dimensoes_limites"
    checagem_dimensional: >-
      gamma_n = 1,95 - 0,05·b é NÃO HOMOGÊNEA: o 1,95 é puro e o 0,05 carrega
      1/cm. Rodado em tools/checar_dimensoes.py como EMPIRICA
      (NBR6118-13.2.3-gamma-n) com o motivo registrado. Armadilha real: passar b
      em METROS devolve 1,94 — número plausível, sem erro dimensional
      detectável. Exige guarda de unidade explícita.
    checagem_numerica: >-
      b = 19 cm -> gamma_n = 1,00 (bate com a Tabela 13.1); b = 14 cm ->
      gamma_n = 1,25 (bate); b = 16 cm -> 1,15 (bate). Os seis pares da
      Tabela 13.1 foram reproduzidos pela fórmula sem exceção — conferidos
      contra a leitura visual da p. 73 feita pelo a2 nesta rodada.
    observacao: >-
      Conferido por LEITURA VISUAL DO a2 nesta rodada (PDF p. 91 = impressa 73):
      texto e Tabela 13.1 batem com a extração do a1, valor por valor.
      TRÊS FRONTEIRAS DURAS, e a terceira é a que costuma passar batido:
      (1) b < 14 cm é PROIBIDO — não existe gamma_n que autorize;
      (2) A_c < 360 cm² é PROIBIDO "em qualquer caso", INDEPENDENTE de b: um
          pilarete 19x18 cm tem b >= 14 mas A_c = 342 cm² < 360 e é proibido;
      (3) 14 <= b < 19 cm só é admissível MAJORANDO os esforços por gamma_n.
      NÃO DECLARADO NA FONTE: a ordem de aplicação de gamma_n em relação aos
      efeitos de 2ª ordem. A NOTA da Tabela 13.1 diz "esforços solicitantes
      FINAIS de cálculo". DECISÃO DO a2 PARA ESTA VERSÃO: como esta rodada só
      admite pilar curto (lambda < lambda_1, efeitos locais de 2ª ordem
      dispensados por 15.8.2), NÃO EXISTE "depois da 2ª ordem" — os esforços
      finais SÃO os de 1ª ordem majorados, e a ambiguidade não se materializa.
      A ambiguidade volta assim que a 2ª ordem entrar no escopo; registrada em
      kb/pendencias.md > V9 para não ser redescoberta.

  - id: NBR6118-11.3.3.4.3-momento-minimo-pilarete
    norma: "NBR 6118:2023"
    item: "11.3.3.4.3"
    pagina: 60
    hash: "sha256:88f331d6717afa147a3f3c26ed0d3b5915ff7caee4f16fdb03880bbb8f2db336"
    metodo: calculo
    status: APROVADA
    implementacao: "estrutural.pilarete.momento_minimo_1a_ordem"
    checagem_dimensional: >-
      M_1d,min = N_d·(0,015 + 0,03·h) NÃO é homogênea como escrita: o 0,015
      carrega METROS e o 0,03 é puro. Rodado em tools/checar_dimensoes.py com a
      atribuição declarada (NBR6118-11.3.3.4.3-M1d-min -> kN·m, OK) e com o
      mutante MUTANTE-M1d-min-h-em-cm, que o pint REJEITA quando h chega como
      número puro em centímetros. Se h chegar como grandeza em cm, o pint
      converte em silêncio e ACERTA — o erro só existe para float cru, e é por
      isso que REQ-PILARETE-02 exige unidade declarada na fronteira do módulo.
    checagem_numerica: >-
      N_d = 1000 kN, h = 0,30 m -> M_1d,min = 24,0 kN·m e e_1,min = 24 mm.
      Ordem de grandeza compatível com a excentricidade acidental de um pilar
      curto (2 a 3 cm). Verificado ainda que e_1,min = M_1d,min/N_d =
      0,015 + 0,03h NÃO DEPENDE DE N_d (N_d cancela) — ver DER-15.8.2-e1.
    observacao: >-
      Conferido por LEITURA VISUAL DO a2 (PDF p. 78 = impressa 60). A extração
      do a1 está correta, e o a2 acrescenta uma PRECISÃO DE REDAÇÃO que muda o
      estatuto da regra: a Norma diz que o efeito das imperfeições locais "PODE
      ser substituído ... pela consideração do momento mínimo". O que é
      OBRIGATÓRIO é considerar as imperfeições locais (11.3.3.4.2); M_1d,min é
      a rota de substituição AUTORIZADA em estruturas reticuladas. Portanto a
      afirmação "carga centrada não é estado admissível de projeto para pilar"
      está CORRETA em substância — as duas rotas produzem momento não nulo — mas
      a justificativa correta é essa, não "a Norma obriga M_1d,min".
      DOMÍNIO: o item diz "em estruturas reticuladas". Um pilarete isolado sob
      base metálica pode não ser parte de estrutura reticulada. O a2 APROVA a
      aplicação assim mesmo, e a razão é quantitativa, não retórica: pela rota
      alternativa (11.3.3.4.2, falta de retilineidade, theta_1 <= 1/200 e
      e_a = theta_1·H/2), um pilarete de H = 1,0 m daria e_a = 2,5 mm contra os
      24 mm de M_1d,min — a substituição adotada é ~10x MAIS CONSERVADORA. É
      hipótese declarada, não silêncio, e vai no memorial (REQ-PILARETE-12).
      CONSEQUÊNCIA DE ESCOPO, e é a mais importante desta versão: se há momento
      mínimo nas DUAS direções, a verificação de seção do pilarete é
      FLEXO-COMPRESSÃO (oblíqua), não compressão centrada. Ver
      DER-NBR6118-NRd0-compressao-centrada e REQ-PILARETE-06: esta versão NÃO
      emite veredito de ELU de seção.

  - id: NBR6118-15.4.4-elementos-isolados
    norma: "NBR 6118:2023"
    item: "15.4.4"
    pagina: 103
    hash: "sha256:a4a07f15b85f52905d64df73afdcf97640aa1de63e7f142208f1991209895328"
    metodo: calculo
    status: APROVADA_COM_USO_RESTRITO
    implementacao: "estrutural.pilarete.classificar_elemento_isolado"
    uso_autorizado: >-
      Classificação PRÉVIA e OBRIGATÓRIA para poder aplicar 15.8. Autorizada
      apenas a alínea a) — "elementos estruturais isostáticos" — que é onde cai
      o pilarete engastado na base e livre no topo, sem vinculação horizontal:
      ele é isostático por construção. O software marca esse caso sozinho e
      registra a justificativa no memorial.
    nao_autorizado: >-
      As alíneas b), c) e d) dependem de informação sobre a ESTRUTURA ACIMA
      (contraventado, estrutura de contraventamento, nós móveis) que este
      software não possui e não pode inferir de N/M/H na base do pilar
      metálico. Se o usuário declarar que o topo do pilarete é vinculado, a
      classificação passa a ser DECLARADO_PELO_USUARIO e ell_e vira entrada
      explícita (REQ-PILARETE-05). Nunca inferir.
    checagem_dimensional: "Item de classificação, sem grandeza física."
    checagem_numerica: "Não se aplica."
    observacao: >-
      A alínea d) foi marcada PARCIAL pelo a1 (cai na página seguinte, lida na
      camada de texto, não por visão). Como ela está em `nao_autorizado`, a
      lacuna de conferência NÃO bloqueia esta versão — nenhum caminho de código
      depende dela. Se algum dia depender, reextrair antes.

  - id: NBR6118-15.6-comprimento-equivalente
    norma: "NBR 6118:2023"
    item: "15.6"
    pagina: 105
    hash: "sha256:1d448b7296482d0e1a399ab1041af6d134ed1338ea0b0bb6ad4a1047685eb17a"
    metodo: calculo
    status: APROVADA_COM_USO_RESTRITO
    implementacao: "estrutural.pilarete.comprimento_equivalente (só o ramo declarado)"
    uso_autorizado: >-
      ell_e = min(ell_0 + h, ell) SOMENTE quando o usuário declarar que o
      pilarete é vinculado em AMBAS as extremidades a elementos horizontais e
      fornecer ell_0 e ell. Nesse caso os dois números são ENTRADA, nunca
      inferidos de geometria da sapata.
    nao_autorizado: >-
      Aplicar 15.6 ao pilarete em balanço. Para engastado na base e livre no
      topo a Norma manda explicitamente ell_e = 2·ell (15.8.2), e é esse o
      caminho aprovado. Também não autorizado adivinhar ell_0 (distância entre
      faces internas de elementos horizontais que o software não conhece).
    checagem_dimensional: "ell_e = min(ell_0 + h, ell): soma e mínimo entre comprimentos, [m]. Homogêneo por inspeção."
    checagem_numerica: "Não instanciado — ramo sem caminho de código nesta versão salvo declaração explícita do usuário."
    observacao: >-
      Conferido pelo a1 por visão; o a2 conferiu a existência e o domínio na
      camada de texto decodificada (PDF p. 123-124). O ponto que importa é o
      DOMÍNIO, não a fórmula: 15.6 pressupõe "elementos estruturais, supostos
      horizontais, que vinculam o pilar". Num pilarete de fundação isolado eles
      podem simplesmente não existir, e aí a expressão não tem sentido físico —
      é exatamente o caso em que um software desatento produziria um ell_e
      plausível e falso.

  - id: NBR6118-15.8.1-campo-de-aplicacao-esbeltez
    norma: "NBR 6118:2023"
    item: "15.8.1 (2º parágrafo conforme NBR 6118:2023/Em1:2026)"
    pagina: 107
    hash: "sha256:743c302ba0e05ff84d3593ce723491c93e40bbf5464fb3cd2da40c8800fbd4b0"
    hash_emenda: "sha256:ce85206327e92f6ce96eab9312ba40043bd63e848bc83c890db91548d7c6d9a6"
    metodo: calculo
    status: APROVADA
    implementacao: "estrutural.pilarete.verificar_campo_de_aplicacao_15_8"
    checagem_dimensional: "lambda adimensional; N_d [kN] < 0,10·f_cd [kPa]·A_c [m²] = [kN]. Homogêneo."
    checagem_numerica: >-
      Pilarete 30x30 cm, C25: 0,10·f_cd·A_c = 0,10·17857 kPa·0,09 m² = 160,7 kN.
      Com N_d = 1000 kN o pilarete NÃO é "pouco comprimido" — logo lambda <= 200
      é limite duro. Coerente: a exceção de lambda > 200 é para elemento quase
      descarregado, que não é o caso de um pilarete de fundação.
    observacao: >-
      Conferido por LEITURA VISUAL DO a2 (PDF p. 125 = impressa 107) TANTO na
      norma-mãe QUANTO na Emenda 1:2026 (PDF p. 13 = impressa 9). A Emenda
      substitui o 2º parágrafo e a mudança é de PRECISÃO, não de valor: "força
      normal DE CÁLCULO menor que 0,10 f_cd A_c". O software usa N_d, e é o
      texto emendado que ele cita.
      DUAS CONDIÇÕES DE CAMPO que valem antes de qualquer conta e que o
      software precisa impor: seção CONSTANTE e armadura CONSTANTE ao longo do
      eixo. Pilarete com seção variável (tronco de pirâmide, transição para a
      sapata) sai do campo de 15.8.2/15.8.3.2/15.8.4 — RECUSA, não
      aproximação (REQ-PILARETE-05).

  - id: NBR6118-15.8.2-dispensa-2a-ordem-local
    norma: "NBR 6118:2023"
    item: "15.8.2"
    pagina: 107
    hash: "sha256:c7e926e3cc7de93fe58378f1e86bb3e5c6199e5c6109e027f4ddb056c1e07faa"
    metodo: calculo
    status: APROVADA
    implementacao: "estrutural.pilarete.indice_de_esbeltez / limite_lambda1 / verificar_pilar_curto"
    checagem_dimensional: >-
      Rodado em tools/checar_dimensoes.py: NBR6118-15.8.2-lambda (ell_e/i ->
      dimensionless, OK), NBR6118-15.8.2-lambda1 (dimensionless, OK),
      DER-GEOM-raio-de-giracao (sqrt(I/A) -> m, OK) e o mutante
      MUTANTE-lambda-com-i-ao-quadrado, REJEITADO pelo pint como esperado.
      LIMITE CONHECIDO DA CHECAGEM, registrado para não gerar falsa confiança:
      e_1/h é adimensional com e_1 e h em qualquer unidade — se um deles vier em
      cm e o outro em m, o pint converte e o erro passa. Só guarda de unidade
      explícita pega isso (REQ-PILARETE-02).
    checagem_numerica: >-
      Pilarete 30x30 cm, ell = 1,00 m, engastado-livre: ell_e = 2,00 m,
      i = 0,30/sqrt(12) = 0,0866 m, lambda = 23,09. Com e_1 = e_1,min = 0,024 m
      -> e_1/h = 0,080 -> lambda_1 bruto = 26,0, truncado para 35.
      lambda = 23,1 < 35 -> PILAR CURTO, 2ª ordem local dispensada. Faixa
      plausível: um pilarete de fundação típico (ell <= 1,5 m, b >= 20 cm) fica
      entre lambda 15 e 35 — o resultado está dentro.
    observacao: >-
      Conferido por LEITURA VISUAL DO a2 em DUAS páginas (PDF p. 125 e 126 =
      impressas 107 e 108): lambda = ell_e/i; ell_e = 2·ell para engastado na
      base e livre no topo; lambda_1 = (25 + 12,5·e_1/h)/alpha_b; 35 <=
      lambda_1 <= 90; alpha_b pelas alíneas a) a d), com alpha_b = 1,0 nas
      alíneas c) (balanço) e d) (momentos menores que M_1d,min). Tudo bate com
      a extração do a1, incluindo os limites de truncamento.
      DESIGUALDADE ESTRITA: a dispensa vale "quando o índice de esbeltez for
      MENOR QUE o valor-limite". lambda == lambda_1 NÃO dispensa. O código usa
      `<`, e o teste de fronteira é obrigatório (REQ-PILARETE-13).
      "i" é o raio de giração MÍNIMO: avaliar as DUAS direções e tomar o MAIOR
      lambda. A Norma não dá i = h/sqrt(12) — ver DER-GEOM-raio-de-giracao.

  - id: NBR6118-15.8.3-metodos-de-2a-ordem
    norma: "NBR 6118:2023"
    item: "15.8.3.1 e 15.8.3.2"
    pagina: 108
    hash: "sha256:ceb604fdfe6346c1c4644681780246b2bbca4e00ef727b74861af52afa7b2dbe"
    metodo: calculo
    status: REJEITADA
    implementacao: "NENHUMA — e é veto do a6 encontrar código que implemente 2ª ordem local nesta versão."
    checagem_dimensional: "Não instanciada: regra não implementada."
    checagem_numerica: "Não instanciada."
    observacao: >-
      REJEITADA no sentido criado na v9: extraída, auditada e DECIDIDO NÃO
      IMPLEMENTAR nesta versão — não é pendência à espera de humano. Conferido
      visualmente pelo a2 (PDF p. 126): fluência obrigatória para lambda > 90;
      método geral (análise não linear) obrigatório para lambda > 140. Nada
      disso é fórmula fechada, e o software não tem análise não linear.
      A CONSEQUÊNCIA DIRETA é o critério de recusa de REQ-PILARETE-05: para
      lambda >= lambda_1 o software RECUSA, exibindo o item (15.8.2/15.8.3) e o
      valor de lambda obtido. Recusar é o comportamento correto; calcular
      "aproximadamente" seria produzir número sem regra aprovada.
      Também REJEITADA por arrasto nesta versão: NBR 6118 15.8.1 gamma_n1
      (majoração de 2ª ordem para lambda > 140), registrada em kb/formulas.yaml
      com status FORA_DO_ESCOPO_DESTA_RODADA.

  - id: NBR6118-17.3.5.3-armaduras-limite-pilarete
    norma: "NBR 6118:2023"
    item: "17.3.5.3.1 e 17.3.5.3.2"
    pagina: 133
    hash: "sha256:c64e2c1c2a444318f4d18c3a4ac0395c1dbb969f5753730ebe4696ab6fc8e318"
    metodo: calculo
    status: APROVADA
    implementacao: "estrutural.pilarete.armadura_longitudinal_minima / _maxima"
    checagem_dimensional: >-
      Rodado em tools/checar_dimensoes.py: 0,15·N_d/f_yd -> cm² (OK);
      0,004·A_c -> cm² (OK); 0,08·A_c -> cm² (OK); mutante
      MUTANTE-As-min-com-fyk-no-lugar-de-N (razão invertida) REJEITADO.
    checagem_numerica: >-
      Pilarete 30x30 cm (A_c = 900 cm²), CA-50 (f_yd = 434,8 MPa),
      N_d = 1000 kN: 0,15·N_d/f_yd = 3,45 cm² e 0,004·A_c = 3,60 cm² ->
      A_s,min = 3,60 cm² (governa a parcela geométrica). A_s,max = 72,0 cm².
      Faixa plausível: 4 phi 12,5 = 4,91 cm² atende; a taxa mínima de 0,4 % é o
      valor clássico para pilar pouco solicitado. Ordem de grandeza correta.
    observacao: >-
      Conferido por LEITURA VISUAL DO a2 (PDF p. 151 = impressa 133), e
      conferido também na Emenda 1:2026 (PDF p. 14 = impressa 10): a Emenda
      altera 17.3.5.2.4 — item VIZINHO, sobre 4 % de A_c em VIGAS — e NÃO toca
      17.3.5.3. A lista de alterações da Emenda salta de 133 para 135. O a1
      afirmara isso; o a2 confirmou lendo a lista.
      RESTRIÇÃO QUE COSTUMA GOVERNAR O PILARETE: A_s,max = 8 % de A_c vale
      "inclusive a sobreposição de armadura existente em regiões de emenda".
      Como 9.5.2.1 autoriza emendar 100 % das barras na mesma seção quando a
      armadura é permanentemente comprimida — e é isso que o pilarete faz na
      espera da sapata — a taxa FORA da emenda fica limitada a 4 % de A_c. O
      software precisa verificar os DOIS pontos: seção corrente (<= 8 %) e
      seção de emenda com armadura duplicada (<= 8 %, isto é, <= 4 % fora).
      NÃO DECLARADO NA FONTE: qual combinação fornece o N_d de A_s,min. Adotar
      a mais desfavorável é INTERPRETAÇÃO conservadora, declarada no memorial.

  - id: NBR6118-18.4.1-campo-de-aplicacao-detalhamento
    norma: "NBR 6118:2023"
    item: "18.4.1"
    pagina: 152
    hash: "sha256:09023175fc2a38ea2e74bb8c18f97cccb23061384d623882d3c75a9209788752"
    metodo: calculo
    status: APROVADA
    implementacao: "estrutural.pilarete.verificar_campo_18_4"
    checagem_dimensional: "h_max <= 5·b_min: razão entre comprimentos, adimensional. Homogêneo."
    checagem_numerica: "30x30 cm -> razão 1,0 <= 5: dentro. 100x19 cm -> razão 5,26 > 5: FORA, é pilar-parede (18.5), RECUSA."
    observacao: >-
      Conferido por LEITURA VISUAL DO a2 (PDF p. 171 = impressa 153, item na
      p. 152). Duas fronteiras, e a segunda foi decidida pelo a2 nesta rodada:
      (1) razão de lados > 5 -> pilar-parede (18.5 + efeitos localizados de 2ª
          ordem): FORA do escopo, RECUSA explícita;
      (2) "não são válidas para as REGIÕES ESPECIAIS (ver Seção 21)". A
          interface pilarete/sapata é região de descontinuidade. DECISÃO DO a2:
          18.4 governa o FUSTE do pilarete; a região da junta é governada por
          9.5.2.x (emenda por traspasse, Seção 9 — não excluída por 18.4.1) e
          por 21.6 (junta de concretagem). O software não estende 18.4 à região
          da junta e não usa a Seção 22 (bielas e tirantes) nesta versão.
      Conferido na Emenda 1:2026 (PDF p. 17 = impressa 13): as alterações na
      página 152 do texto-base são todas de 18.3.6 (vigas); 18.4.1 não é
      tocada, e não há entrada alguma para a página 153.

  - id: NBR6118-18.4.2-armaduras-longitudinais-pilarete
    norma: "NBR 6118:2023"
    item: "18.4.2.1 e 18.4.2.2"
    pagina: 153
    hash: "sha256:e8d23c4f4f84b1c038389212111db84199527b2efee94e8174b5f5ea92ae2c32"
    metodo: calculo
    status: APROVADA
    implementacao: "estrutural.pilarete.detalhar_armadura_longitudinal"
    checagem_dimensional: "phi >= 10 mm; phi <= b_min/8; espaçamentos em mm comparados com mm. Homogêneo."
    checagem_numerica: >-
      Pilarete 30x30 cm: phi_max = 300/8 = 37,5 mm (não governa, pois 9.5.2
      proíbe traspasse acima de 32 mm); phi_min = 10 mm; mínimo 4 barras (uma
      por vértice); espaçamento máximo entre eixos = min(2·300, 400) = 400 mm —
      com 4 barras a 30 cm de seção, folgado. Espaçamento livre mínimo =
      max(20 mm, phi, 1,2·d_agregado): com phi 16 e brita 1 (19 mm) -> 22,8 mm.
    observacao: >-
      Conferido por LEITURA VISUAL DO a2 (PDF p. 171 = impressa 153). O ponto
      que costuma governar o pilarete NÃO é o espaçamento na seção corrente e
      sim a frase "esses valores se aplicam TAMBÉM às regiões de emendas por
      traspasse": na emenda com a espera da sapata as barras estão duplicadas e
      o espaçamento livre mínimo continua valendo. Com 100 % das barras
      emendadas na mesma seção (autorizado por 9.5.2.1), é essa restrição
      geométrica que limita a bitola — e é uma verificação que o software DEVE
      fazer, não um aviso (REQ-PILARETE-07).

  - id: NBR6118-18.4.3-armaduras-transversais-pilarete
    norma: "NBR 6118:2023"
    item: "18.4.3"
    pagina: 153
    hash: "sha256:a80a4c30ce2953eadf45e4edd2cbcf9e10da83c30afe5d059c5d88e68b6b49aa"
    metodo: calculo
    status: APROVADA_COM_USO_RESTRITO
    implementacao: "estrutural.pilarete.detalhar_estribos"
    uso_autorizado: >-
      Armadura longitudinal em CA-25 (k_phi = 24) ou CA-50 (k_phi = 12).
      phi_t >= max(5 mm, phi/4). s <= min(200 mm, b_min, k_phi·phi).
      Alternativa phi_t < phi/4 autorizada SOMENTE com o mesmo tipo de aço nas
      duas armaduras e com a limitação ADICIONAL s_max = 90000·(phi_t²/phi)/f_yk
      — adicional, não substitutiva.
    nao_autorizado: >-
      CA-60 na armadura longitudinal do pilarete. O item dá k_phi apenas para
      CA-25 e CA-50; para CA-60 o espaçamento máximo é NAO_DECLARADO_NA_FONTE.
      RECUSA explícita, jamais extrapolação por interpolação de f_yk ou por
      analogia com CA-50 (REQ-PILARETE-08). Também não autorizado transformar a
      NOTA sobre C55-C90 (redução de 50 % nos espaçamentos, ganchos a 135°) em
      verificação: a Norma escreve "recomenda-se", e recomendação não vira
      requisito de software.
    checagem_dimensional: >-
      Rodado em tools/checar_dimensoes.py. NBR6118-18.4.3-s-max-estribo-fino ->
      mm (OK) com a atribuição declarada de MPa ao coeficiente 90000. E o achado
      que justifica sozinho a etapa 2 da cascata: o mutante
      MUTANTE-18.4.3-s-max-com-raiz — a leitura que a CAMADA DE TEXTO do PDF
      sugere ("90000 1 2 phi phi / f yk", com um expoente 1/2 inexistente) —
      é REJEITADO pelo pint por dar mm^0,5. Transcrição errada, dimensão quebra,
      aparece sem intervenção humana.
    checagem_numerica: >-
      phi 16 mm, phi_t 5 mm, CA-50: phi/4 = 4 mm, logo phi_t = 5 mm satisfaz
      phi_t >= max(5; 4). s <= min(200 mm; 300 mm; 12·16 = 192 mm) = 192 mm.
      A limitação adicional dá s_max = 90000·(25/16)/500 = 281 mm, que NÃO
      governa — coerente, já que ela só entra quando se adota estribo mais fino
      que phi/4, e aqui não se adotou.
    observacao: >-
      Conferido por LEITURA VISUAL DO a2 em DUAS páginas (PDF p. 171 e 172 =
      impressas 153 e 154), a segunda com recorte a 300 dpi só para a expressão
      de s_max: a fração 1/f_yk multiplica o parêntese (phi_t²/phi), SEM raiz
      nenhuma. Confirmado o achado do a1 e confirmado que "24 phi para CA-25,
      12 phi para CA-50" é a lista COMPLETA — CA-60 não aparece.
      Conferido na Emenda 1:2026: nenhuma alteração na página 153.

  - id: NBR6118-Tab7.2-nota-d-cobrimento-pilarete
    norma: "NBR 6118:2023"
    item: "7.4.7.1 a 7.4.7.6 e Tabela 7.2, nota de rodapé (d)"
    pagina: 20
    hash: "sha256:ab356f17e0ff0f877b5f771c70095b99431f5cb17afd11f9497ef484f20b6fb4"
    metodo: calculo
    status: APROVADA
    implementacao: "estrutural.pilarete.cobrimento_nominal_minimo"
    checagem_dimensional: "c_nom >= c_min + Delta_c e c_nom >= phi: comprimentos [mm] comparados com comprimentos. Homogêneo."
    checagem_numerica: >-
      Pilarete em CAA II com phi 16 mm e brita 19 mm: a linha "Viga/pilar" daria
      30 mm, mas a nota (d) impõe 45 mm no trecho em contato com o solo junto à
      fundação — governa. Verificações auxiliares: c_nom >= phi (45 >= 16, OK) e
      d_max <= 1,2·c_nom (19 <= 54, OK). Em CAA IV a linha "Viga/pilar" dá 50 mm
      e passa a governar sobre os 45 mm — o software toma o MAIOR dos dois, não
      a nota isoladamente.
    observacao: >-
      Conferido por LEITURA VISUAL DO a2 (PDF p. 38 = impressa 20), incluindo a
      CÉLULA MESCLADA da linha "Elementos estruturais em contato com o solo",
      onde um único 30 mm cobre as classes I e II (a extração de texto crua
      entrega 3 valores para 4 colunas e pareia errado). Nota (d) transcrita
      literalmente: "No trecho dos pilares em contato com o solo junto aos
      elementos de fundação, a armadura deve ter cobrimento nominal >= 45 mm".
      TRÊS DECISÕES DO a2 QUE O TEXTO NÃO TOMA POR SI:
      (1) A nota (d) é PISO ABSOLUTO, independente da classe de agressividade,
          mas NÃO é teto: em CAA IV vale o maior entre 45 mm e o valor da linha
          aplicável. O software calcula o máximo.
      (2) "Onde termina o trecho em contato com o solo" é NAO_DECLARADO_NA_FONTE.
          DECISÃO: aplicar os 45 mm ao PILARETE INTEIRO, do topo da sapata ao
          topo do pilarete. É o lado conservador e evita ter de inventar uma
          cota de transição que a Norma não define. Registrado no memorial como
          hipótese; kb/pendencias.md > V10.
      (3) A redução de até 5 mm por classe de resistência superior à mínima e a
          redução para Delta_c = 5 mm (7.4.7.4, que exige projeto conforme
          ABNT NBR 9062, AUSENTE do acervo) NÃO são automáticas e NÃO são
          implementadas nesta versão.
      Cobrimento é referido à ARMADURA EXTERNA — face externa do ESTRIBO
      (7.4.7.5), não à barra longitudinal. Conferido na Emenda 1:2026: a lista
      de alterações salta da página 15 para a 22 do texto-base; 19 e 20 não são
      tocadas.

  - id: NBR6118-9.5.2.1-emenda-100-por-cento-comprimida
    norma: "NBR 6118:2023"
    item: "9.5.2.1"
    pagina: 42
    hash: "sha256:ea22460bee66b4819bdcd320fe421aa9675e3ae4c416b027859fc9d3dfbaa692"
    metodo: calculo
    status: APROVADA
    implementacao: "estrutural.pilarete.emenda_espera (guarda de proporção)"
    checagem_dimensional: "Regra de proporção (%), adimensional."
    checagem_numerica: >-
      Armadura permanentemente comprimida -> 100 % das barras podem ser
      emendadas na mesma seção, sem a Tabela 9.3 e sem alpha_0t. Consequência
      numérica verificada: com 4 phi 16 (8,04 cm²) duplicados na emenda,
      16,08 cm² = 1,79 % de A_c (900 cm²) — folgado contra os 8 % de
      17.3.5.3.2. O limite só apertaria acima de 4 % fora da emenda.
    observacao: >-
      Conferido pelo a2 na camada de texto decodificada (PDF p. 61 = impressa
      43), frase literal: "Quando se tratar de armadura permanentemente
      comprimida ou de distribuição, todas as barras podem ser emendadas na
      mesma seção". A Tabela 9.3 e o coeficiente alpha_0t da Tabela 9.4 valem
      só para barras TRACIONADAS — não se aplicam aqui.
      GUARDA OBRIGATÓRIA: "permanentemente comprimida" é uma HIPÓTESE sobre o
      esforço, não sobre o elemento. Se alguma combinação puser a barra em
      TRAÇÃO (vento, momento grande, tração na base metálica), a autorização
      cai e voltam a valer 9.5.2.2 e a Tabela 9.4 — que esta versão não
      implementa. O software deve VERIFICAR a hipótese em todas as combinações
      e RECUSAR se alguma tracionar a armadura (REQ-PILARETE-10).

  - id: NBR6118-9.5.2.3-traspasse-comprimidas
    norma: "NBR 6118:2023"
    item: "9.5.2 (1º parágrafo conforme Em1:2026) e 9.5.2.3"
    pagina: 44
    hash: "sha256:d41e90c7adff9c0277acc0fe77e444f7dd615a43730a6ee8022a407d9256a82c"
    hash_emenda: "sha256:aa879652a6185ff0c0dcf3b63405612bbfb0068a9eb6616a53e84690d4b21e80"
    metodo: calculo
