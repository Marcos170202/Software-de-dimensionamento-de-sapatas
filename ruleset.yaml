  - id: NBR6118-11.3.3.4.3-fig11.3-envoltoria-minima-1a-ordem
    norma: "NBR 6118:2023"
    item: "11.3.3.4.3, Figura 11.3 e os dois parágrafos que a seguem"
    pagina: 61
    hash: "sha256:598a6b6738232470d7de10228e025128a1114c723c47e06bca8bca68d57f99a2"
    metodo: calculo
    status: APROVADA
    implementacao: "estrutural.pilarete.envoltoria_minima_1a_ordem"
    checagem_dimensional: >-
      (M_1d,min,x/M_1d,min,xx)² + (M_1d,min,y/M_1d,min,yy)² é adimensional.
      Rodado em tools/checar_dimensoes.py (NBR6118-Fig11.3-elipse-minima, OK).
      LIMITE DECLARADO DA CHECAGEM: o pint NÃO pega a troca do expoente 2 pelo
      alpha de 17.2.5, nem a troca de h por b nos semieixos — as duas passam
      adimensionais e em kN·m. Registrado como caso EMPIRICA
      (NBR6118-Fig11.3-cruzamento-eixo-dimensao) e só o teste numérico pega.
    checagem_numerica: >-
      N_d = 1000 kN, seção 30×30 cm: semieixos M_1d,min,xx = M_1d,min,yy =
      24,00 kN·m. Seção 20×40 cm com N_d = 800 kN: M_1d,min,xx = 21,60 kN·m
      (usa h = 0,40 m) e M_1d,min,yy = 16,80 kN·m (usa b = 0,20 m) — a troca
      dos dois altera o índice de inclusão de 0,5114 para 0,6113 no sanity
      check do a2, isto é, 20 %.
    observacao: >-
      Conferido por LEITURA VISUAL DO a2 (PDF p. 79 = impressa 61), com atenção
      deliberada aos dois pontos de maior risco. CONFIRMADOS OS DOIS:
      (1) O EXPOENTE É 2 (elipse), e NÃO o alpha de 17.2.5. São duas expressões
          de interação diferentes, com expoentes diferentes e em LADOS OPOSTOS
          da verificação: a da Figura 11.3 é a envoltória SOLICITANTE mínima; a
          de 17.2.5 é a envoltória RESISTENTE. Trocá-las é o erro provável desta
          feature.
      (2) A CORRESPONDÊNCIA DIMENSÃO↔EIXO É CRUZADA e está escrita na figura:
          o croqui traz h na vertical e b na horizontal; a seta HORIZONTAL é
          rotulada M_1d,mín,xx = N_d(0,015 + 0,03 h) e a seta VERTICAL é
          rotulada M_1d,mín,yy = N_d(0,015 + 0,03 b). Cada momento mínimo usa a dimensão
          da seção medida NO PLANO EM QUE ELE FLEXIONA. O registro genérico de
          11.3.3.4.3 ("h é a altura total da seção na direção considerada") não
          desambigua; a figura, sim. h e b em METROS.
      CRITÉRIO DE APROVAÇÃO — é o achado que destrava esta versão. O parágrafo
      logo abaixo da figura: "a verificação do momento mínimo pode ser
      considerada atendida quando, no dimensionamento adotado, obtém-se uma
      envoltória resistente que englobe a envoltória mínima de 1ª ordem".
      A Norma manda ENGLOBAR e NÃO escreve o teste de inclusão de uma curva na
      outra — o teste é derivação, ver DER-NBR6118-11.3.3.4.3-inclusao-de-envoltorias.
      DOMÍNIO: uso declarado FACULTATIVO e "a favor da segurança", e SÓ para
      seção retangular. Só basta enquanto os efeitos locais de 2ª ordem forem
      dispensados; havendo 2ª ordem em qualquer direção vale ainda a envoltória
      mínima com 2ª ordem de 15.3.2 (regra REJEITADA por escopo, abaixo) — a
      remissão é obrigatória e o pilarete só escapa dela porque REQ-PILARETE-05
      RECUSA tudo que não seja pilar curto.

  - id: NBR6118-17.2.5-flexao-composta-obliqua
    norma: "NBR 6118:2023"
    item: "17.2.5 (Processo aproximado para o dimensionamento à flexão composta oblíqua)"
    pagina: 125
    hash: "sha256:35a01133677f5494da75cdca096ece1dbcb8ea682153bf8fc28f164b8466bd58"
    metodo: calculo
    status: APROVADA_COM_USO_RESTRITO
    implementacao: "estrutural.pilarete.interacao_flexao_obliqua"
    uso_autorizado: >-
      A expressão [M_Rd,x/M_Rd,xx]^alpha + [M_Rd,y/M_Rd,yy]^alpha = 1 como
      DESCRIÇÃO DA SUPERFÍCIE da envoltória resistente, para um N_Rd = N_Sd
      fixado, com M_Rd,xx e M_Rd,yy obtidos por varredura de equilíbrio de
      seção (DER-NBR6118-17.2.2-MRd-varredura).
      alpha = 1,0 para o VEREDITO. É o valor que a própria Norma declara "a
      favor da segurança", é o autorizado "em geral" (sem condição de forma de
      seção), e é o único para o qual o teste de inclusão tem forma fechada
      exata (D3 do cabeçalho da v12) — o que elimina erro de discretização numa
      verificação que NÃO tem nenhum caso de conferência de terceiros no acervo.
      alpha = 1,2 pode ser CALCULADO E EXIBIDO como valor informativo, rotulado
      "margem adicional autorizada por 17.2.5 para seção retangular", e NUNCA
      pode ser o que decide o veredito nesta versão.
    nao_autorizado: >-
      (1) Usar alpha = 1,2 (ou qualquer alpha > 1) como critério de APROVAÇÃO
          sem decisão humana registrada — kb/pendencias.md > V18. Não é que a
          Norma proíba: ela autoriza expressamente para seção retangular. É que
          alpha maior = envoltória mais cheia = critério MENOS conservador
          (verificado pelo a2 em 20.000 pares aleatórios: nenhuma exceção), e
          quem decide gastar essa margem num modelo sem validação externa é o
          engenheiro, não o agente.
      (2) Qualquer outro valor de alpha. A Norma declara que alpha depende da
          força normal, da forma da seção, do arranjo e da taxa de armadura mas
          NÃO fornece tabela nem expressão — lacuna da própria fonte. É PROIBIDO
          interpolar, extrapolar, ou importar expoente de Bresler, do
          Eurocódigo, do ACI ou de bibliografia. A expressão TEM a forma de uma
          interação tipo Bresler, mas é a expressão da própria NBR 6118:2023,
          com os expoentes que ela mesma declara.
      (3) Aplicá-la a seção NÃO retangular (o alpha = 1,2 é condicionado; e o
          software só aceita seção retangular, por REQ-PILARETE-03).
      (4) Usá-la sem que M_Rd,xx e M_Rd,yy tenham sido calculados PARA O MESMO
          N_Rd = N_Sd. A condição está escrita no item e é o erro silencioso
          mais provável de quem reaproveita um M_Rd calculado para outra normal.
    checagem_dimensional: >-
      Razões de momento, adimensionais; soma adimensional. Rodado em
      tools/checar_dimensoes.py (NBR6118-17.2.5-interacao, OK) com dois
      mutantes REJEITADOS pelo pint: MUTANTE-17.2.5-normal-no-lugar-do-momento
      (N_Sd no numerador) e MUTANTE-17.2.5-expoente-no-momento (expoente
      aplicado ao momento e não à razão).
      LIMITE DECLARADO: o expoente é adimensional e a troca de alpha NÃO é
      detectável por análise dimensional. Caso EMPIRICA registrado.
    checagem_numerica: >-
      Pilarete 30×30 cm, C25, CA-50, 4 phi 16 (8,04 cm²), d' = 5,8 cm,
      N_Sd = 1000 kN: M_Rd,xx = M_Rd,yy = 63,95 kN·m por varredura. Com
      M_Sd,x = M_Sd,y = 24,00 kN·m (= M_1d,min): interação = 0,617 com
      alpha = 1,2 e 0,750 com alpha = 1,0. Ordem correta (alpha = 1 mais
      severo). Sobre a elipse mínima inteira, o máximo cai para 0,531
      (alpha = 1) e 0,407 (alpha = 1,2) — ver a derivação de inclusão.
    observacao: >-
      Conferido por LEITURA VISUAL DO a2 (PDF p. 143 = impressa 125). Confirmado
      deliberadamente o SINAL DE IGUALDADE ("= 1", não "<= 1") e os dois
      expoentes alpha sobre os colchetes.
      TRÊS ARMADILHAS REGISTRADAS:
      (a) A Norma escreve "= 1". A expressão descreve a SUPERFÍCIE da envoltória
          resistente, não um teste de utilização. Converter em "<= 1" é
          INTERPRETAÇÃO do agente — aprovada separadamente, e como derivação,
          em DER-NBR6118-17.2.5-criterio-menor-ou-igual-a-1. Nunca registrar
          "<= 1" como transcrição.
      (b) O item NÃO FECHA o problema. M_Rd,xx e M_Rd,yy são flexões compostas
          NORMAIS que a Norma não ensina a calcular por fórmula em lugar
          nenhum (busca negativa do a1, aceita pelo a2:
          NBR6118-BUSCA-NEG-sem-formula-fechada-MRd-NRd-secao-retangular).
          17.2.5 REDUZ o problema oblíquo de duas variáveis a dois problemas
          normais de uma variável — evita varrer linha neutra INCLINADA — mas
          não dispensa a varredura numérica da seção.
      (c) COLISÃO DE SÍMBOLO NA MESMA PÁGINA, achado do a2 e não do a1: quinze
          linhas abaixo, 17.3.1 usa alpha para o FATOR DE FORMA do momento de
          fissuração, e declara "alpha = 1,5 para seções retangulares". Os dois
          alpha estão na página 125, os dois têm valor "para seção retangular",
          e são grandezas sem nenhuma relação. Namespace obrigatório em
          REQ-PILARETE-01.
      EMENDA 1:2026 — CONFERIDO PELO a2, e a conferência é mais fina do que a
      busca negativa do a1 sugeria: existe SIM uma entrada da Emenda para a
      página 125, e ela é de 17.3.1 ("2ª designação da equação": "centro de
      gravidade" -> "centroide"). 17.2.5 NÃO é alterado pela Emenda.

  - id: NBR6118-17.2.2-fig17.1-limites-dos-dominios
    norma: "NBR 6118:2023"
    item: "17.2.2, alínea g) — Figura 17.1 (Domínios de estado-limite último de uma seção transversal)"
    pagina: 122
    hash: "sha256:253f6c1e630fd88147187d24ea3e68f9a1c4ae39f9d72055adc85b242cef394a"
    metodo: calculo
    status: APROVADA
    implementacao: "estrutural.pilarete.perfil_de_deformacao (polos A, B, C e reta b)"
    checagem_dimensional: >-
      y_C = (eps_cu - eps_c2)·h/eps_cu: deformações adimensionais, resultado em
      metros. Rodado em tools/checar_dimensoes.py (NBR6118-Fig17.1-polo-C, OK)
      com o mutante MUTANTE-Fig17.1-polo-C-com-h-ao-quadrado REJEITADO.
      LIMITE DECLARADO: como eps_cu e eps_c2 são adimensionais, trocar um pelo
      outro, trocar o sinal da diferença ou medir y_C da borda TRACIONADA em
      vez da COMPRIMIDA passa incólume pelo pint.
    checagem_numerica: >-
      Até C50 (eps_c2 = 2,0 ‰, eps_cu = 3,5 ‰): y_C = (3,5-2,0)/3,5 · h =
      3h/7 = 0,1286 m para h = 0,30 m. Verificado pelo a2, na varredura
      própria, que com x -> infinito o perfil que pivota em C tende à
      deformação uniforme eps_c2 e a varredura reproduz N_Rd0 = 1703,8 kN
      com diferença de 0,000 % contra a forma fechada já aprovada em
      DER-NBR6118-NRd0-compressao-centrada. É a melhor contra-prova interna
      disponível para esta figura.
    observacao: >-
      Conferido por LEITURA VISUAL DO a2 (PDF p. 140 = impressa 122). A figura
      traz os valores que faltavam ao ruleset:
      (1) POLO A: "10 ‰" escrito ao lado do ponto A, sobre a borda tracionada.
          É o limite convencional de alongamento do ELU.
      (2) POLO B: eps_cu na borda comprimida.
      (3) POLO C: sobre a vertical de eps_c2, à distância (eps_cu - eps_c2)·h/
          eps_cu MEDIDA DO NÍVEL DA BORDA COMPRIMIDA.
      (4) RETA b (compressão uniforme) = a linha VERTICAL de abscissa eps_c2.
          É a figura, e não o texto, que estabelece isso — e era exatamente o
          PASSO 1 (o "mais forte") da derivação de N_Rd0 aprovada na v11. Esta
          regra dá a esse passo o respaldo de item que ele não tinha.
      CORREÇÃO DE ROTA REGISTRADA, e ela vira regra de processo do repositório:
      a rodada 2112b3d declarou o valor 10 ‰ AUSENTE da Norma. Estava errado —
      o valor está na Figura 17.1, não no texto corrido, e rótulos de figura da
      NBR 6118 são vetorizados, fora do alcance de qualquer busca textual,
      inclusive depois de tools/decodificar_nbr.py. O registro errado NÃO foi
      apagado do kb/; coexiste, com o campo `corrige` apontando para ele.
      NENHUMA BUSCA NEGATIVA POR VALOR NUMÉRICO PODE SER DECLARADA COM BASE
      APENAS NO TEXTO DECODIFICADO. Ver kb/pendencias.md > V16.
      LACUNA QUE PERMANECE: eps_yd aparece na figura APENAS como rótulo de
      abscissa (fronteira dos domínios 3 e 4), SEM valor e SEM expressão —
      reconfirmado agora também na figura. eps_su continua sem valor em toda a
      Norma. Consequência para o código em
      DER-NBR6118-8.3.6-sigma-s-ate-10-por-mil.
      eps_c2 e eps_cu NÃO são constantes: dependem da classe por 8.2.10.1. A
      figura não os quantifica, só os nomeia — escrever y_C = 3h/7 no código é
      conta do agente válida SÓ até C50, e por isso o código deve calcular a
      expressão, não o número.

  - id: NBR6118-17.2.4.1-concentracao-de-armaduras
    norma: "NBR 6118:2023, com Em1:2026"
    item: "17.2.4.1 (Armaduras ativas e passivas — Generalidades), 1º parágrafo"
    pagina: 123
    hash: "sha256:e49f83b56fa220a3351ed05653ce89caa6f987eb55e12f4259854b761c046a7c"
    hash_emenda: "sha256:06156ce3402cbccc3fc046b162b22fcda291fd043f28d8b2a9428153c4b03181"
    metodo: calculo
    status: APROVADA_COM_USO_RESTRITO
    implementacao: "NENHUMA — ver uso_autorizado. É permissão que o software escolhe não usar."
    uso_autorizado: >-
      Registrada para DELIMITAR: o item é uma PERMISSÃO ("as forças nas
      armaduras PODEM ser consideradas concentradas no centroide
      correspondente, SE a distância deste centroide ao centro da armadura mais
      afastada, medida normalmente à linha neutra, for menor que 10 % de h"),
      e é CONDICIONADA. O software NÃO a usa: a varredura de seção soma barra a
      barra (camada a camada), o que é exato e nunca precisa da condição dos
      10 %. Uso autorizado: citar o item no memorial para justificar que a
      simplificação NÃO foi empregada.
    nao_autorizado: >-
      Agrupar armaduras no centroide sem verificar a condição dos 10 % de h.
      Num pilarete de seção pequena com barras nos quatro vértices a condição
      tipicamente NÃO é atendida (para 30×30 cm com d' = 5,8 cm, a distância do
      centroide da armadura à barra mais afastada é ~9,2 cm contra o limite de
      3,0 cm), e o agrupamento seria do lado INSEGURO por superestimar o braço
      de alavanca da armadura comprimida e subestimar a deformação da tracionada.
    checagem_dimensional: "Comparação de comprimento com 10 % de h: m contra m. Homogêneo."
    checagem_numerica: >-
      Seção 30×30 cm, 4 phi 16, d' = 5,8 cm: limite = 0,10·0,30 = 3,0 cm;
      distância real do centroide da armadura à camada mais afastada =
      (0,30 - 2·0,058)/2 = 9,2 cm > 3,0 cm. Condição NÃO atendida — a
      simplificação seria ILEGÍTIMA neste caso, o que confirma a decisão de
      não implementá-la.
    observacao: >-
      Conferido por LEITURA VISUAL DO a2 nas DUAS redações (PDF p. 141 =
      impressa 123 do texto-base; p. 13 do PDF da Emenda = impressa 9).
      É o ÚNICO item deste universo tocado pela Emenda 1:2026, e a alteração é
      TERMINOLÓGICA e SEM EFEITO NUMÉRICO: "centro de gravidade" passa a
      "centroide" nas duas ocorrências do parágrafo. Registradas as duas
      redações com hashes separados, como já se fez em
      NBR6118-12.3.3-12.4.1-valores-de-calculo.
      A troca "centro de gravidade" -> "centroide" aparece ainda em 17.1
      (p. 119), 17.3.1 (p. 125) e 17.4.2.2 (p. 137) — é uma padronização de
      vocabulário da Emenda em toda a Seção 17, não uma mudança de critério.

  - id: NBR6118-15.3.2-fig15.2-envoltoria-minima-2a-ordem
