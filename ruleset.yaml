# retrabalho maior que o necessário: NENHUM registro que estava APROVADA mudou
# de status, de valor ou de citação nesta versão. As alterações incidem sobre
# dois registros que já eram PENDENTE_HUMANO (6.2.1.1.2 e 7.6.2) e são de
# natureza documental. A nova rodada de A6/A7 exigida por esta versão pode,
# portanto, restringir-se a esses dois registros e ao que deles depende.
#
# DECISÃO DESTA RODADA, EM UMA LINHA: a apostila NÃO resolve a pendência.
# Ela a documenta melhor e permite ESTREITAR a pergunta ao humano de duas
# perguntas bloqueantes para uma. O registro CONTINUA PENDENTE_HUMANO.
#
# Auditoria da extração do a1 (8 cláusulas BASTOS-* + 3 fórmulas), refeita
# pelo a2 e não aceita de segunda mão:
#   - Rastreabilidade: fonte + item + página + hash presentes em 8/8. OK.
#   - Releitura VISUAL independente do a2, recorte a 500 dpi da eq. 1.72
#     (PDF p. 78): confirma "γ_tomb = M_estab / M_tomb ≥ 1,5", símbolo gama,
#     não ni. A camada de texto de fato perde a letra grega (sai "5,1 M M
#     tomb estab tomb"), como o a1 relatou. Confirmado.
#   - Releitura VISUAL da eq. 1.74 (recorte 500 dpi): confirma
#     "F_estab = (N+P)·tg(2/3 φ) + A·(2/3 c)", e confirma que a fonte define
#     "A = dimensão da base em contato com o solo".
#   - Busca negativa refeita pelo a2 nas 119 páginas: "6.2.1" NÃO ocorre;
#     "2022" NÃO ocorre; "coeficiente de segurança" ocorre UMA vez, na p. 78
#     (PDF), justamente no parágrafo da eq. 1.72, sem remissão normativa.
#     Confirmado integralmente.
#   Conclusão da auditoria: extração do a1 ACEITA sem correção de conteúdo.
#   O que segue são conclusões do a2, não do a1.
#
# ACHADO NORMATIVO NOVO DESTA RODADA — e é ele, não a apostila, que decide.
# A leitura da v4 (registrada como "a NBR 6122 §7.1 permite as duas rotas,
# logo a rota de valores admissíveis estaria disponível para deslizamento e
# tombamento") está LARGA DEMAIS e fica CORRIGIDA aqui. Texto literal de §7.1
# (PDF p. 33), relido nesta rodada:
#   "A grandeza fundamental para o projeto de fundações rasas é a TENSÃO
#    admissível, se o projeto for feito considerando fator de segurança global
#    e valores característicos, ou a TENSÃO resistente de cálculo, quando for
#    feito considerando coeficientes de ponderação e valores de cálculo."
# A escolha de rota que §7.1 oferece é sobre a TENSÃO — a grandeza da
# verificação de compressão. Não é uma licença geral de método para toda e
# qualquer verificação de fundação rasa. O mesmo se lê em §6.2.1.1.1, cujo
# título é "Segurança na COMPRESSÃO" e que abre com "A verificação da
# segurança pode ser feita com valores característicos e fator de segurança
# global ou com valores de cálculo (...) devendo ser obedecidos os valores da
# Tabela 1".
# A NBR 6122:2022 distribui a rota ITEM A ITEM, e não deixa o projetista
# escolher em cada verificação:
#   §6.2.1.1.1  compressão ............ AS DUAS rotas, explicitamente (Tabela 1)
#   §6.2.1.1.2  tração/deslizamento/
#               tombamento ............ SÓ coeficientes parciais. "Devem ser
#                                       adotados os seguintes coeficientes de
#                                       ponderação". Nenhum FS global.
#   §6.2.1.1.3  flutuação ............. SÓ fator de segurança global (1,1)
# Que §6.2.1.1.3 ofereça exclusivamente FS global, e §6.2.1.1.1 ofereça as
# duas com tabela, mostra que a omissão de FS global em §6.2.1.1.2 é
# deliberada e não lacuna de redação. Portanto: "escolher a rota de valores
# admissíveis" NÃO é uma opção livre para deslizamento e tombamento, e não
# pode ser usada como fundamento normativo para o par FS = 1,5/1,5.
#
# O QUE A APOSTILA MUDA (positivo, mas menor do que parece):
#   1. Confirma, por fonte independente, que 1,5 é valor de ENSINO E PRÁTICA
#      CORRENTE no Brasil para tombamento e escorregamento de sapata.
#   2. Confirma, por busca negativa, que esse 1,5 NÃO TEM ÂNCORA NORMATIVA.
#      A própria fonte, que cita a NBR 6122 dezesseis itens diferentes e o faz
#      com precisão (três trechos conferidos palavra por palavra contra a
#      edição 2022 do acervo), NÃO cita norma nenhuma ao dar o 1,5. A única
#      citação de toda a seção 1.8 é a nota 41, sobre empuxo passivo (§7.6.3),
#      e é para DESCARTAR o empuxo passivo — mais conservador que a norma.
#   Isto é: a apostila é evidência de PRÁTICA, e evidência (negativa) reforçada
#   de AUSÊNCIA DE RESPALDO NORMATIVO. Ela empurra o registro na direção de
#   "rotular como prática consagrada", não na direção de "aprovar como norma".
#
# POR QUE, MESMO ASSIM, O REGISTRO NÃO VIRA APROVADA NESTA RODADA:
#   Rotular 1,5 como prática consagrada é decisão documental, e essa o a2 toma
#   — está tomada abaixo. Manter 1,5 como constante de segurança em produção,
#   sabendo que o único item normativo aplicável implica equivalente de 1,68 a
#   2,35, é decisão de engenharia com consequência dimensional direta e do lado
#   inseguro. Não é do a2, não é de agente nenhum. Continua PENDENTE_HUMANO.
#   O ganho desta rodada é que a pergunta ao humano cai de duas para uma.
#
# CHECAGEM DIMENSIONAL (pint) DAS TRÊS FÓRMULAS DA FONTE — resultado:
#   eq. 1.72 (γ_tomb = M_estab/M_tomb) ............ HOMOGÊNEA, adimensional. OK
#   eq. 1.73 (modelo 1, atrito puro) .............. HOMOGÊNEA, adimensional. OK
#   eq. 1.74 (modelo 2, atrito + coesão) .......... REJEITADA. Ver abaixo.
#   eq. 1.48/1.49 (área comprimida) ............... HOMOGÊNEAS, adimensionais. OK
# A eq. 1.74, COM O SIGNIFICADO QUE A PRÓPRIA FONTE DÁ A "A" ("dimensão da
# base em contato com o solo", isto é, um comprimento), não fecha: pint acusa
# DimensionalityError ao somar (N+P)·tg(2/3φ) [kN] com A·(2/3 c) [m·kPa = kN/m].
# Falta um comprimento. O a1 sinalizou e não corrigiu — correto, não é função
# dele. A decisão do a2: a eq. 1.74, COMO ESCRITA NA FONTE, é REJEITADA por
# inconsistência dimensional e NÃO pode ser citada como respaldo de nada.
# Consequência prática: NENHUMA, porque o código não a implementa como escrita
# (ver a regra abaixo) — mas a fórmula fica marcada para que ninguém a use
# depois achando que passou por auditoria.
#
# NOTA DE MÉTODO: `tools/checar_dimensoes.py`, citado em a2-verificador.md,
# NÃO EXISTE neste repositório (tools/ contém apenas decodificar_nbr.py). A
# checagem acima foi feita com pint em script ad hoc. Criar essa ferramenta é
# dívida técnica aberta — enquanto ela não existir, a checagem dimensional
# depende de o a2 lembrar de fazê-la à mão, que é exatamente o que a cascata
# determinística deveria evitar.

# --- Versão 4: rodada NBR 6122 §6.2.1 (estabilidade de fundação rasa) -------
#
# ATENÇÃO: esta versão ALTERA o ruleset. Conforme CLAUDE.md regra 5, as
# aprovações de A6 e A7 ficam INVALIDADAS para tudo que dependa das regras
# NBR6122-6.2.1.* e do módulo sapata_isolada.sapata (estabilidade): nova
# rodada de A6 e A7 é obrigatória antes de qualquer release. As regras
# NBR6118-* e as demais NBR6122-* não foram tocadas nesta versão.
#
# Disparada por achado do a6 (citação "§6.2.1.2" para deslizamento/tombamento).
# Releitura da fonte pelo a2 (texto pymupdf + render 140 dpi das p. 17-18
# impressas = PDF p. 29-30) CONFIRMA o a6 na estrutura e vai ALÉM dele no
# conteúdo:
#   - 6.2.1.2 é "Segurança de fundações PROFUNDAS" — citação errada, confirmado.
#   - 6.2.1.1.2 existe, é "Coeficientes de ponderação para verificação de
#     tração, deslizamento e tombamento" e é o item aplicável a fundação rasa.
#   - MAS 6.2.1.1.2 NÃO prescreve fator de segurança global algum. Prescreve
#     APENAS coeficientes parciais (γm=1,2 / γm=1,4 / γf=1,4). Portanto a
#     troca "6.2.1.2 -> 6.2.1.1.2" NÃO pode ser feita sozinha: daria respaldo
#     normativo aparente a um FS=1,5 que a norma não contém. Ver regra
