#
#   V1. TABELA 2.2 DE VESIC, 255 CÉLULAS, CONFERIDA CONTRA AS PRÓPRIAS
#       EQUAÇÕES FECHADAS DA FONTE (não contra memória, não contra a web).
#       Recalculadas as 51 linhas x 5 colunas a partir de
#       Nq = e^(pi tg phi) tg²(45+phi/2), Nc = (Nq-1) cotg phi e
#       N_gamma = 2 (Nq+1) tg phi. Resultado: as 255 células batem com
#       erro relativo < 0,1 %. 230 batem por arredondamento exato a duas
#       casas; 24 diferem no último dígito por +0,005 a +0,03 (a fonte
#       arredonda para cima no dígito final, padrão consistente com a tabela
#       original de Vesic 1975 ter sido calculada com mais precisão
#       intermediária). NENHUMA dessas 24 é erro de transcrição do a1.
#       A 255ª é a única anomalia real e está tratada em V2.
#       CONSEQUÊNCIA: a Tab. 2.2 é confiável, e o a1 a transcreveu certo.
#
#   V2. A ANOMALIA phi = 0, COLUNA Nq/Nc (questão 3 despachada ao a2).
#       A fonte imprime 0,20; 1,00/5,14 = 0,1945, que arredondaria para 0,19.
#       Confirmado por leitura visual própria do a2 a 200 dpi da impressa 33:
