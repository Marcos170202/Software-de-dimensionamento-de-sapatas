      lajes e punção (ver Seções 19 e 20)." O item está sob 22.6.4.1
      (Detalhamento — Sapatas rígidas) mas seu título é "Sapatas flexíveis",
      e é a única remissão que traz requisitos de DETALHAMENTO DE LAJE
      (Seção 20) para dentro do projeto de sapata. Sapata RÍGIDA não recebe
      essa remissão (embora receba 19.5.3.1 via 22.6.2.2-b — não confundir).
      Decidir se o software passa a aplicar os mínimos de laje (20.1 e
      Tabela 19.1) às sapatas FLEXÍVEIS é decisão de engenharia com efeito
      direto em consumo de aço; não é dedutível do texto sozinha.
    pergunta_objetiva: >-
      O software deve aplicar a sapatas FLEXÍVEIS os mínimos de armadura de
      laje (Tabela 19.1: As/s >= 0,9 cm²/m e rho_s >= 0,5 rho_min para a
      secundária; 20.1: secundária >= 20 % da principal, espaçamento <= 33 cm,
      phi <= h/8, prolongamento de 4 cm além do eixo do apoio)?
    obstaculo_conhecido: >-
      Mesmo decidindo SIM, a Tabela 19.1 e 20.1 são escritas para lajes já
      classificadas como "armadas em uma direção" ou "nas duas direções", e a
      NBR 6118:2023 NÃO define em lugar nenhum o critério dessa classificação
      (busca negativa NBR6118-criterio-vaos-nada, reconferida: a razão
      ly/lx <= 2 é convenção de bibliografia, não texto da Norma). Como
      22.6.2.2-a/22.6.2.3-a já obrigam as DUAS direções na sapata, a leitura
      coerente é que uma sapata nunca cai na linha "armadas em uma direção"
      da Tabela 19.1 — mas isso precisa de confirmação humana.
    impacto_se_a_leitura_estiver_errada: >-
      Se os mínimos de laje forem devidos e não aplicados, sapata flexível
      pouco solicitada pode sair com armadura abaixo do mínimo normativo
      (lado inseguro em fissuração/ductilidade). Se forem aplicados
      indevidamente a sapata RÍGIDA, o consumo de aço sobe sem amparo — e
      pior, o memorial citaria um item que não alcança sapata rígida.

