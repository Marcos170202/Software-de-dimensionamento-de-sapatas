# -----------------------------------------------------------------------------
# Passo 4 -- sanity check numerico (tools/checar_dimensoes.py --sanity)
# -----------------------------------------------------------------------------
sanity_check:
  nota: >-
    N_SPT = 15 nao pode ser convertido em tensao por nenhuma regra aprovada (LAC-01/02). Usa-se o
    sigma_r do exemplo Cintra 2011 Cap.2 Ex.1a (argila rija, N_SPT = 15, metodo analitico, hipoteses
    do autor) como entrada sigma_r_k. Faixa tau_Rd (0,3-1,5 MPa) nao aplicavel: nenhuma regra
    estrutural no v0.
  casos:
    - id: SC-01
      descricao: instancia tipica (B = 2,0 m, L = 3,0 m, D = 1,5 m, N_SPT = 15 via sigma_r de Cintra)
      valores:
        sigma_r_k: {valor: 890, unidade_pint: kPa}
        FS_g: {valor: 3.0, unidade_pint: dimensionless}
        gamma_m: {valor: 2.15, unidade_pint: dimensionless}
        gamma_f: {valor: 1.4, unidade_pint: dimensionless}
        sigma_ELS: {valor: 300, unidade_pint: kPa}
        B: {valor: 2.0, unidade_pint: m}
        L: {valor: 3.0, unidade_pint: m}
        D_assentamento: {valor: 1.5, unidade_pint: m}
        N_k: {valor: 1400, unidade_pint: kN}
        G_k: {valor: 1000, unidade_pint: kN}
        P_pp_real_k: {valor: 90, unidade_pint: kN}
        P_solo_k: {valor: 97.2, unidade_pint: kN}
        frac_min_pp: {valor: 0.05, unidade_pint: dimensionless}
        B_min: {valor: 0.60, unidade_pint: m}
        dois: {valor: 2, unidade_pint: dimensionless}
      passos:
        - {alvo: sigma_adm_ELU, expr: "sigma_r_k/FS_g", unidade_pint: kPa, regra: NBR6122-T1-resistencia-ELU}
        - {alvo: sigma_Rd_ELU, expr: "sigma_r_k/gamma_m", unidade_pint: kPa, regra: NBR6122-T1-resistencia-ELU}
        - {alvo: sigma_adm, expr: "Min(sigma_adm_ELU, sigma_ELS)", unidade_pint: kPa, regra: NBR6122-7.1-7.4-ELU-e-ELS}
        - {alvo: P_pp_k, expr: "Max(P_pp_real_k, frac_min_pp*G_k)", unidade_pint: kN, regra: NBR6122-5.6-peso-proprio}
        - {alvo: area_base, expr: "B*L", unidade_pint: m**2, regra: NBR6122-7.6.1-tensao-uniforme}
        - {alvo: sigma_solo_k, expr: "(N_k + P_pp_k + P_solo_k)/area_base", unidade_pint: kPa, regra: NBR6122-7.6.1-tensao-uniforme}
        - {alvo: N_d, expr: "gamma_f*N_k", unidade_pint: kN, regra: NBR6122-T1c-gamma-f}
        - {alvo: sigma_solo_d, expr: "(N_d + gamma_f*(P_pp_k + P_solo_k))/area_base", unidade_pint: kPa, regra: NBR6122-7.6.1-tensao-uniforme}
        - {alvo: consist_T1, expr: "gamma_m*gamma_f", unidade_pint: dimensionless, regra: NBR6122-T1-resistencia-ELU}
      faixas:
        sigma_adm_ELU: {min: 50, max: 600, unidade_pint: kPa}
        sigma_adm: {min: 50, max: 600, unidade_pint: kPa}
        sigma_solo_k: {min: 50, max: 600, unidade_pint: kPa}
        consist_T1: {min: 2.98, max: 3.02, unidade_pint: dimensionless}
      condicoes:
        - {expr: "D_assentamento < dois*Min(B, L)", esperado: true}
        - {expr: "B >= B_min", esperado: true}
        - {expr: "sigma_solo_k <= sigma_adm", esperado: true}
        - {expr: "sigma_solo_d <= sigma_Rd_ELU", esperado: true}
        - {expr: "sigma_solo_k <= sigma_ELS", esperado: true}
    - id: SC-02
      descricao: Bastos 2023 Ex.1 parte a) com a hipotese do autor como entrada (Kmaj = 1,1 -> P_pp_real_k = 125 kN incluindo solo)
      valores:
        N_k: {valor: 1250, unidade_pint: kN}
        G_k: {valor: 1250, unidade_pint: kN}
        P_pp_real_k: {valor: 125, unidade_pint: kN}
        P_solo_k: {valor: 0, unidade_pint: kN}
        frac_min_pp: {valor: 0.05, unidade_pint: dimensionless}
        sigma_adm: {valor: 0.26, unidade_pint: MPa}
        B: {valor: 2.05, unidade_pint: m}
        L: {valor: 2.65, unidade_pint: m}
      passos:
        - {alvo: P_pp_k, expr: "Max(P_pp_real_k, frac_min_pp*G_k)", unidade_pint: kN, regra: NBR6122-5.6-peso-proprio}
        - {alvo: area_min_adm, expr: "(N_k + P_pp_k + P_solo_k)/sigma_adm", unidade_pint: m**2, regra: NBR6122-7.6.1-tensao-uniforme}
        - {alvo: area_base, expr: "B*L", unidade_pint: m**2, regra: NBR6122-7.6.1-tensao-uniforme}
        - {alvo: sigma_solo_k, expr: "(N_k + P_pp_k + P_solo_k)/area_base", unidade_pint: kPa, regra: NBR6122-7.6.1-tensao-uniforme}
      esperado:
        area_min_adm: {valor: 5.2885, tol_abs: 0.0005, unidade_pint: m**2}
        area_base: {valor: 5.4325, tol_abs: 0.0005, unidade_pint: m**2}
      condicoes:
        - {expr: "sigma_solo_k <= sigma_adm", esperado: true}
    - id: SC-03
      descricao: interacao 7.7.2 x 3.28 -- sapata minima 0,60 x 0,60 m em divisa com D = 1,5 m deve ser RECUSADA como nao-rasa
      valores:
        B: {valor: 0.60, unidade_pint: m}
        L: {valor: 0.60, unidade_pint: m}
        D_assentamento: {valor: 1.5, unidade_pint: m}
        dois: {valor: 2, unidade_pint: dimensionless}
      passos: []
      condicoes:
        - {expr: "D_assentamento < dois*Min(B, L)", esperado: false}
