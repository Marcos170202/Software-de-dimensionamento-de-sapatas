# Colisão de símbolo (a2-verificador.md, item 3): COLISÃO REAL DETECTADA nesta
# rodada, entre os dois motores que coexistem no repositório.
#   - calc_core/geotecnico/  chama as dimensões em planta de B e L
#     (restricoes.verificar_dimensao_minima(B, L), geometria.*).
#   - calc_core/sapata_isolada/  chama as MESMAS grandezas físicas de a e b
#     (rigidez.classificar(a, b, h, h0, ap, bp), sapata.Sapata).
#   - a NBR 6118:2023, 22.6.1, usa 'a' para a dimensão da sapata e 'a_p' para a
#     do pilar; a NBR 6122:2022, 7.7.1, não usa símbolo.
#   - 'h' é altura da SAPATA no domínio estrutural (22.6.1) e é usado para
#     espessura de camada/profundidade no domínio geotécnico.
# Exigência para A4/A5: usar namespace por domínio no campo `implementacao` e
# nas docstrings — `estrutural.<...>` e `geotecnico.<...>`, como já feito nas
# regras acima. NÃO renomear as APIs existentes nesta rodada (quebraria a UI e
# os testes); o namespace é de DOCUMENTAÇÃO e rastreabilidade. Uma unificação
# de nomenclatura entre os dois motores é candidata a tarefa própria, com nova
# rodada de A6/A7.
# 'd' (altura útil, estrutural) x 'd' (profundidade de assentamento,
# geotécnico): ainda sem colisão efetiva — o motor geotécnico chama a
# profundidade de assentamento de outra coisa. Revisitar se §7.3.3 entrar.
#
# 'L' NO CROQUI DE ESPRAIAMENTO — COLISÃO CONSUMADA, resolvida na versão 7.
# Este não é risco potencial: o símbolo já significava três coisas ao mesmo
# tempo no repositório (ruleset v6 REQ-PROP-03 = espessura de camada; docstring
# de `CamadaPropagacao` = espessura de camada; `visual2d.py:721` = largura
# equivalente do tronco), e ainda concorria com 'L' = dimensão em planta do
# retângulo carregado na docstring de `influencia_canto_retangulo` ("m = B/z,
# n = L/z") e com 'L' = comprimento da sapata em `calc_core/geotecnico/`
# (restricoes.verificar_dimensao_minima(B, L)).
# RESOLUÇÃO, obrigatória para A3 e A4 (o mesmo nome do topo ao fim da cadeia —
# núcleo, tela e memorial — é o que impede a colisão de voltar):
#   - 'L' e 'L_i' ficam PROIBIDOS neste croqui, em qualquer acepção.
#   - LARGURA equivalente do tronco, por INTERFACE: `a_eq,i` e `b_eq,i`
#     (`geotecnico.propagacao.a_eq/b_eq`), espelhando os campos que o núcleo já
#     expõe, `PontoPropagacao.largura_equivalente_a/_b`. Em corte, exibe-se a
#     do eixo do corte: `a_eq` no corte X, `b_eq` no corte Y.
#     NÃO usar 'B_eq': 'B' já é a menor dimensão em planta nos tetos "z <= 2·B"
#     e na razão de sanidade a_eq/B, e um 'B_eq' ao lado de um 'B' com outro
#     significado reintroduz exatamente o defeito que se está corrigindo.
#   - ESPESSURA do trecho de camada, por CAMADA: `h_i`
#     (`CamadaPropagacao.espessura`). Grandeza de TRECHO, índice de camada.
#     Exibi-la no croqui é OPCIONAL — a coluna estratigráfica ao lado já rotula
#     cada camada com suas cotas ("aterro · 0,00–1,50 m") e repetir a espessura
#     dentro do tronco é redundância que rouba espaço do que só o croqui pode
#     comunicar, que é a largura alcançada em cada cota.
#   - Grandeza de PONTO (interface, i = 0..n, i = 0 é a base da sapata) x
#     grandeza de TRECHO (camada, i = 1..n): índices de universos diferentes,
#     nunca sob o mesmo símbolo indexado. A análise dimensional NÃO separa esses
#     dois mundos — ambos são [length] — então a separação é de nomenclatura, e
#     é por isso que ela é normativa aqui e não questão de gosto.
#
# Colisão de método de segurança: até a v8, nenhuma regra aprovada misturava
# 'admissivel' e 'calculo' — todas usavam metodo: ambos porque a fórmula em si
# (sigma=N/A) é neutra ao método; a diferença ficava no valor de sigma_adm que
# o chamador fornecia (característico+FSg OU já ponderado). calc_core não
# ponderava nada sozinho — quem chamava decidia e passava o valor já pronto.
#
# ATUALIZAÇÃO DA v9, e é o principal risco novo desta versão: a partir da v9 o
# calc_core PRODUZ sigma_adm, e produzir sigma_adm é escolher um método de
# segurança. As regras novas que produzem sigma_adm levam `metodo: admissivel`
# EXPLÍCITO — são as primeiras do ruleset a não serem neutras. A rota de
# valores de cálculo (gamma_m) fica deliberadamente NÃO implementada
# (NBR6122-6.3.3-..., PENDENTE_HUMANO), para não instituir um segundo padrão
# de segurança convivendo com o primeiro. A proibição de mistura deixa de ser
# observação e vira guarda executável: REQ-SIGMA-01.
#
# Majoração por vento (§6.3.2): APROVADA na v9 como GUARDA, nunca como
# constante, e só no método de valores admissíveis — ver
# NBR6122-6.3.2-majoracao-vento-valores-admissiveis, campo
# `decisao_do_a2_sobre_o_piso_FSg_1_6`. §6.3.3 (valores de cálculo) segue NÃO
# implementada, por escopo e não por dificuldade de leitura.

