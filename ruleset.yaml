  - id: DER-NBR6118-14.4.1-faixa-B-recusa-do-cortante
    natureza: INTERPRETACAO_DE_ITEM_NORMATIVO
    metodo: calculo
    status: APROVADA_COM_USO_RESTRITO
    decidida_por: "a2-verificador (V21), doutrina (a) do despacho — recusar > extrapolar. NÃO é decisão humana."
    formula: >-
      razao_14_4_1 = ell / max(b, h);
      razao >= 3,0 -> FAIXA A: veredito de ELU COMPLETO (17.2.1 + 17.4.2.1);
      razao <  3,0 -> FAIXA B: §17.4 RECUSADO; veredito volta a ser o ESCOPADO
                      de solicitações NORMAIS, com dois avisos obrigatórios.
    itens_de_origem:
      - "NBR 6118:2023, 14.4.1 (p. 83): elemento linear é aquele cujo comprimento longitudinal supera em pelo menos três vezes a maior dimensão da seção transversal — regra NBR6118-14.4.1-elemento-linear-classificacao"
      - "NBR 6118:2023, 17.4.1 (p. 133): as prescrições aplicam-se a elementos lineares e NÃO se aplicam a elementos de volume, lajes, vigas-parede e consolos curtos — regra NBR6118-17.4.1-campo-de-aplicacao-do-cortante"
      - "NBR 6118:2023, 17.4.1.1.2-c) (p. 134): remissão NOMINAL a 'os pilares e elementos lineares de fundação' — regra NBR6118-17.4.1.1.2-c-excecao-dos-pilares-e-o-f-ctk-sem-sufixo"
      - "NBR 6118:2023, 17.2.1 (p. 120): critérios para os esforços resistentes das SEÇÕES de vigas, PILARES e tirantes — regra NBR6118-17.2.1-envoltoria-criterio-de-seguranca"
      - "NBR 6118:2023, 21.1 e Seção 22: elementos especiais; busca negativa própria do a2 (v11) confirma que 'pilarete' tem ZERO ocorrências na 6118 e na 6122, e 'pedestal' tem UMA, em 24.6.2 (concreto simples) — kb/clausulas.jsonl, NBR6118-LACUNA-17.4-pilarete-curto-nao-e-elemento-linear, sha256:710c1fc858c7a1f21ac30d777896c81707db377f943297d955b49ac39861c529"
    passos_de_interpretacao: >-
      (1) §17.4 alcança PILAR por duas vias independentes e nenhuma delas é
          interpretação: taxonômica (17.4.1 -> elementos lineares; 14.4.1.2 ->
          pilar é elemento linear) e nominal (17.4.1.1.2-c) escreve "os pilares
          e elementos lineares DE FUNDAÇÃO"). Isso está resolvido e é mais do
          que se esperava.
      (2) A ressalva não está em §17.4, está três Seções antes: 14.4.1
          condiciona a classe a ell >= 3·máx(b,h). Um pilarete de fundação é,
          por uso, curto — 30×30 exige 90 cm, 40×40 exige 120 cm.
      (3) Abaixo disso não há rota alternativa na Norma. 21.1 manda os elementos
          "que por sua forma ou proporções caracterizam uma descontinuidade
          generalizada" para a Seção 22, e a Seção 22 trata vigas-parede,
          consolos, dentes Gerber, sapatas, blocos e pilares-parede — NÃO trata
          pilarete, pedestal nem pilar curto de fundação. É VAZIO NORMATIVO no
          cortante, não lacuna de escopo deste pipeline. Doutrina (a): RECUSA.
      (4) §17.2 NÃO recebe o mesmo tratamento, e a assimetria está na FONTE, não
          na conveniência do agente. §17.4 traz uma LISTA EXPRESSA DE EXCLUSÕES
          — toda ela de elementos atarracados e de regiões de descontinuidade —
          e assenta declaradamente num modelo de TRELIÇA de banzos paralelos ao
          longo do elemento, que pressupõe região B. §17.2 não traz lista de
          exclusão alguma e 17.2.1 declara estabelecer critérios "para a
          determinação dos esforços resistentes das SEÇÕES de vigas, PILARES e
          tirantes": é resistência de SEÇÃO, com hipóteses de seção (17.2.2).
      (5) Manter §17.2 na FAIXA B É, AINDA ASSIM, UMA INTERPRETAÇÃO, e está
          declarada: a Seção 17 inteira se intitula para elementos lineares. O
          a2 escolheu não recusar §17.2 porque isso removeria, sem base
          normativa PARA A REMOÇÃO, uma capacidade já certificada na v12, e
          porque a alternativa adotada — rótulo alto, explícito e impresso — não
          produz nenhum número novo. Quem discordar tem o caminho aberto: é uma
          linha de configuração em REQ-PILARETE-17, não uma reescrita.
    uso_autorizado: >-
      FAIXA A (razao >= 3,0): §17.4 aplicável. Satisfeitas também
      REQ-PILARETE-03, -05, -11, -17 e -18, o software emite o veredito
      COMPLETO: "ELU de solicitações NORMAIS (17.2.1) e ELU de FORÇA CORTANTE
      (17.4.2.1): ATENDIDO / NÃO ATENDIDO".
      FAIXA B (razao < 3,0):
        (i)  §17.4 RECUSADO. Sem cálculo, sem número, sem V_Rd de espécie
             alguma. A mensagem traz, nesta ordem: a razão OBTIDA; o limite
             3,0; o valor 3·máx(b,h) que faltou atingir, em metros; a citação
             de 14.4.1 com a página; a lista de exclusões de 17.4.1; e a
             constatação de que a Seção 22 não cobre o pilarete.
        (ii) §17.2 continua verificado e o veredito volta a ser o ESCOPADO da
             v12 — "ELU de solicitações NORMAIS (17.2.1)" e nada mais —
             acrescido de DUAS frases obrigatórias: que o elemento não satisfaz
             14.4.1 (com a razão) e que, por isso, o ELU de força cortante NÃO
             FOI VERIFICADO POR NORMA NENHUMA, cabendo ao engenheiro tratá-lo
             por modelo de bielas e tirantes ou outro caminho fora deste
             software.
      A razão obtida vai ao memorial NAS DUAS FAIXAS, e a faixa é campo próprio
      do valor de retorno da API — não só texto.
    nao_autorizado: >-
      (1) Usar ell_e (comprimento equivalente) no lugar de ell na razão. No caso
          engastado-livre isso DOBRA o valor e classifica como elemento linear
          um pilarete de 45 cm.
      (2) Emitir veredito completo (N+M+V) na FAIXA B, por qualquer caminho.
      (3) Oferecer "prosseguir mesmo assim", caixa de confirmação, ou aplicação
          de §17.4 por analogia na FAIXA B.
      (4) Tratar a FAIXA B como caso raro na documentação ou na interface. NÃO
          É: no caso ENGASTADO_BASE_LIVRE_TOPO sob M_1d,mín as duas fronteiras
          (lambda < lambda_1 e razão >= 3) só coexistem se h_máx/b_mín < 1,684,
          e a seção 20×40 dos testes da v12 tem janela VAZIA.
      (5) Silenciar a lacuna em qualquer superfície.
    citacao_em_codigo: "[deriv: DER-NBR6118-14.4.1-faixa-B-recusa-do-cortante]"
    checagem_dimensional: >-
      Razão adimensional. Rodado em tools/checar_dimensoes.py
      (NBR6118-14.4.1-razao-elemento-linear-geomA/-geomB-RECUSA/-geomC e
      DER-FRONTEIRA-14.4.1-com-15.8.2-engastado-livre). LIMITE DECLARADO: a
      troca ell -> ell_e é invisível ao pint (caso EMPIRICA registrado).
    checagem_numerica: >-
      Geometria B (30×30, ell = 0,80 m): razão 2,667 -> FAIXA B; lambda = 18,48
      < 35 -> passa em 15.8.2. Demonstra que as duas verificações são
      INDEPENDENTES e que a FAIXA B é alcançável por geometria corriqueira.
      Fronteira quantificada pelo a2 (ell_e = 2·ell, lambda_1 = 35): lambda < 35
      exige ell/b_mín < 35/(2·raiz(12)) = 5,052; com 14.4.1 exigindo
      ell >= 3·h_máx, as duas só coexistem se h_máx/b_mín < 1,684. Janelas:
      30×30 -> ell em [0,90; 1,515) m; 25×40 -> [1,20; 1,263) m; 20×40 -> VAZIA.
    observacao: >-
      Esta derivação FECHA V21 e é o motivo pelo qual REQ-PILARETE-16 foi
      reescrito como REQ-PILARETE-16 (v13).
      DÉBITO DA v12 QUE ELA TORNA VISÍVEL, e que ninguém tinha visto: a v12
      aprovou §17.2 para o pilarete SEM NUNCA verificar 14.4.1 — nenhuma regra
      da v11 nem da v12 verificava a proporção geométrica. A v13 passa a
      verificar, e por isso ALTERA o comportamento da v12 até na parte de
      solicitações normais (o memorial ganha duas frases na FAIXA B).

  - id: DER-NBR6118-17.4.2.2-M0-nivel-de-carregamento
    natureza: INTERPRETACAO_DE_ITEM_NORMATIVO
    metodo: calculo
    status: APROVADA_COM_USO_RESTRITO
    decidida_por: "a2-verificador (V20, item 2), doutrina (b) — lado conservador. NÃO é decisão humana."
    formula: >-
      M_0 = N_(gamma_f=1,0) · W_1/A_c   (P_d = 0 em concreto armado);
      N_(gamma_f=1,0) é ENTRADA DECLARADA. Sem ela, V_c = V_c0 (não majora).
    itens_de_origem:
      - "NBR 6118:2023, 17.4.2.2-b), designação de M_0 (p. 137): '... sendo essa tensão calculada com valores de gamma_f e gamma_p iguais a 1,0 e 0,9, respectivamente' — regra NBR6118-17.4.2.2-modelo-I-VRd2-Vsw-Vc"
      - "NBR 6118:2023, 17.4.2.2-b), mesma designação (p. 137-138): 'os momentos correspondentes a essas forças normais não podem ser considerados no cálculo dessa tensão pois são considerados em M_Sd,máx'"
      - "NBR 6118:2023, 17.4.2.2-b), designação de M_Sd,máx (p. 138): 'é o momento fletor de CÁLCULO máximo na seção em análise'"
    passos_de_interpretacao: >-
      (1) A Norma manda calcular a tensão que M_0 anula com gamma_f = 1,0 — a
          frase está no texto e foi lida visualmente pelo a2 na p. impressa 137.
          Logo o N do numerador NÃO é o N_d majorado da combinação.
      (2) O denominador M_Sd,máx é de CÁLCULO — a designação está na p. 138 e diz
          "de cálculo" com todas as letras. A fração mistura, portanto, dois
          níveis de ponderação.
      (3) A mistura NÃO é descuido de redação: a mesma alínea explica por que os
          momentos das forças normais ficam fora do numerador ("pois são
          considerados em M_Sd,máx"). É a repartição que o item declara, e não
          cabe ao software "corrigi-la" majorando o numerador.
      (4) Usar N_d infla M_0, infla V_c e é do lado INSEGURO. A leitura LITERAL
          coincide aqui com a CONSERVADORA — não há conflito entre transcrição e
          doutrina (b).
    uso_autorizado: >-
      M_0 = N_(gamma_f=1,0)·W_1/A_c, com o valor N_(gamma_f=1,0) fornecido pelo
      engenheiro em CAMPO PRÓPRIO, sem default silencioso.
      SEM ESSE VALOR O SOFTWARE NÃO MAJORA: V_c = V_c0 (Modelo I) ou V_c1
      (Modelo II). É o lado conservador e evita o pior caminho, que seria
      inferir o número.
      O memorial imprime os DOIS valores lado a lado — N_d e N_(gamma_f=1,0) —
      com a frase literal de que a NBR 6118:2023, 17.4.2.2, manda calcular a
      tensão que M_0 anula com gamma_f = 1,0 enquanto M_Sd,máx é de cálculo, e
      de que a majoração de V_c foi (ou não foi) aplicada.
    nao_autorizado: >-
      (1) Usar N_d no numerador de M_0.
      (2) OBTER N_(gamma_f=1,0) dividindo N_d por um gamma_f suposto. O software
          não conhece a composição da combinação (repartição
          permanente/variável, coeficientes psi) e 1,4 não é necessariamente a
          razão efetiva entre os dois níveis. Uma "conversão automática" seria
          um número inventado com aparência de cálculo. Encontrar em
          `estrutural/` uma divisão de N_d por gamma_f para este fim é VETO
          do a6.
      (3) Majorar V_c quando a força normal não for de compressão, ou quando o
          estado não for flexo-compressão.
      (4) Remover o teto 2·V_c0 / 2·V_c1.
      (5) Validar esta decisão APENAS com o caso A1 do sanity check — ele a
          mascara. Ver a checagem numérica.
    citacao_em_codigo: "[deriv: DER-NBR6118-17.4.2.2-M0-nivel-de-carregamento]"
    checagem_dimensional: >-
      kN·cm nas duas leituras — o pint NÃO distingue. Caso EMPIRICA
      NBR6118-17.4.2.2-M0-nivel-de-carregamento registrado em
      tools/checar_dimensoes.py. O que o pint pega é a ausência de A_c
      (MUTANTE-M0-sem-dividir-por-Ac, REJEITADO).
    checagem_numerica: >-
      Geometria A, N_d = 1000 kN, N_(gamma_f=1,0) declarado = 714 kN,
      W_1/A_c = h/6 = 5,0 cm:
        M_0 correto = 35,70 kN·m ; M_0 com N_d = 50,00 kN·m.
        Caso A1 (M_Sd,máx = 24 kN·m): AS DUAS LEITURAS estouram o teto de
        2·V_c0 e dão 118,7 kN — o erro fica INVISÍVEL exatamente no caso
        típico, em que M_Sd,máx = M_1d,mín.
        Caso A2 (M_Sd,máx = 60 kN·m): o teto não governa; 94,63 kN contra
        108,77 kN, diferença de 14,14 kN (+14,9 %, lado INSEGURO).
      O caso A2 é OBRIGATÓRIO no GATE 3.
    observacao: >-
      Nenhum caso de terceiros valida esta majoração: o exemplo do Bastos é de
      flexão simples, onde V_c = V_c0 e M_0 nem entra. Ver
      NBR6118-BUSCA-NEG-cortante-em-pilar-no-acervo e kb/pendencias.md > V22.

  - id: DER-NBR6118-17.4.2.2-W1-fibra-mais-tracionada
    natureza: INTERPRETACAO_DE_ITEM_NORMATIVO
    metodo: calculo
    status: APROVADA_COM_USO_RESTRITO
    decidida_por: "a2-verificador (V20, item 3), doutrina (b) — lado conservador. NÃO é decisão humana."
    formula: >-
      r_x = (N_(gf=1)·W_1x/A_c)/M_Sd,máx,x  com W_1x = b·h²/6;
      r_y = (N_(gf=1)·W_1y/A_c)/M_Sd,máx,y  com W_1y = h·b²/6;
      V_c = V_c0·(1 + min(r_x, r_y)) <= 2·V_c0.
    itens_de_origem:
      - "NBR 6118:2023, 17.4.2.2-b), designação de M_0 (p. 138): 'sendo W_1 o módulo de resistência na fibra mais tracionada' — designação UNIAXIAL"
      - "NBR 6118:2023, 17.4.2.2-b), designação de M_Sd,máx (p. 138): 'momento fletor de cálculo máximo na seção em análise' — designação UNIAXIAL"
      - "NBR 6118:2023, 11.3.3.4.3 e Figura 11.3 (p. 60-61): M_1d,mín obrigatório nas DUAS direções — regra NBR6118-11.3.3.4.3-fig11.3-envoltoria-minima-1a-ordem"
      - "NBR 6118:2023, 16.3 (p. 116): não se aceita dimensionar pilar para carga centrada — regra NBR6118-16.3-proibicao-de-carga-centrada"
    passos_de_interpretacao: >-
      (1) As duas designações do item são UNIAXIAIS: pressupõem uma direção de
          flexão e uma fibra mais tracionada.
      (2) O pilarete está SEMPRE sob flexão oblíqua, mesmo sem momento aplicado,
          porque M_1d,mín é obrigatório nas duas direções (REQ-PILARETE-04) e
          16.3 proíbe a compressão centrada. Logo há duas fibras candidatas e
          dois M_Sd,máx, um por plano principal, e a Norma não diz qual usar.
      (3) V_c cresce com M_0/M_Sd,máx. O lado conservador é o MENOR V_c, isto é,
          a MENOR razão entre os dois pares legítimos.
      (4) O EMPARELHAMENTO POR PLANO é parte da decisão: cruzar o W_1 de um
          plano com o M_Sd,máx do outro produziria uma razão que não corresponde
          a estado nenhum. São dois pares legítimos, e adota-se o menor deles —
          não o menor W_1 com o maior M_Sd, que seria mais conservador ainda
          mas fisicamente arbitrário.
    uso_autorizado: >-
      Calcular r_x e r_y como na fórmula, emparelhados por plano, e adotar o
      MENOR. M_Sd,máx,x e M_Sd,máx,y são os momentos de CÁLCULO efetivamente
      usados no veredito de REQ-PILARETE-15 — isto é, já incluem M_1d,mín quando
      ele governa — e por isso são sempre estritamente positivos.
      O memorial imprime r_x, r_y, qual governou, os dois W_1 e a frase de que a
      Norma não declara qual fibra usar sob flexão oblíqua.
    nao_autorizado: >-
      (1) Adotar o W_1 que der o MAIOR M_0 (lado inseguro).
      (2) Cruzar W_1 de um plano com M_Sd,máx do outro.
      (3) Deixar a divisão explodir se algum M_Sd,máx vier nulo ou negativo. Se
          isso ocorrer por qualquer caminho, o software RECUSA em vez de
          encostar no teto de 2·V_c0.
      (4) Validar esta decisão em seção QUADRADA. Ali W_1x = W_1y e a escolha é
          invisível — mesma armadilha do cruzamento h↔b de REQ-PILARETE-13(11).
    citacao_em_codigo: "[deriv: DER-NBR6118-17.4.2.2-W1-fibra-mais-tracionada]"
    checagem_dimensional: >-
      W_1x e W_1y têm a MESMA dimensão (cm³) e as razões são adimensionais — o
      pint NÃO distingue. Caso EMPIRICA
      NBR6118-17.4.2.2-W1-fibra-mais-tracionada registrado.
    checagem_numerica: >-
      Geometria C (25×40 cm, ell = 1,25 m — a única classe NÃO QUADRADA que
      satisfaz as duas fronteiras de REQ-PILARETE-17), N_(gf=1) = 857 kN,
      M_Sd,x = 90 e M_Sd,y = 70 kN·m, cortante no plano de h (b_w = 25 cm,
      d = 35,7 cm):
        W_1x/A_c = 6,667 cm -> M_0x = 57,13 kN·m -> r_x = 0,6348;
        W_1y/A_c = 4,167 cm -> M_0y = 35,71 kN·m -> r_y = 0,5102;
        V_c0 = 68,68 kN; V_c conservador = 103,7 kN; V_c otimista = 112,3 kN.
        Diferença: 8,56 kN (+8,3 %, lado INSEGURO se escolhido o maior).
      Na geometria A (30×30) a diferença é exatamente ZERO. O caso 25×40 é
      OBRIGATÓRIO no GATE 3.
    observacao: >-
      NAO_DECLARADO_NA_FONTE reconfirmado por leitura visual do a2 na p.
      impressa 138: a designação de W_1 está na mesma linha da expressão de M_0
      e não há nota alguma sobre flexão oblíqua em todo o §17.4.

  - id: DER-NBR6118-17.4.2.3-Vc1-interpolacao-linear
    natureza: DERIVACAO_ALGEBRICA_DE_ITEM_NORMATIVO
    metodo: calculo
    status: APROVADA_COM_USO_RESTRITO
    decidida_por: "a2-verificador. Álgebra sobre dois pontos que a Norma escreve; não é interpretação de mérito."
    formula: >-
      V_c1 = V_c0                                 , se V_Sd <= V_c0;
      V_c1 = V_c0·(V_Rd2 − V_Sd)/(V_Rd2 − V_c0)   , se V_c0 < V_Sd <= V_Rd2.
      V_Rd2 é o do MODELO II com o theta DECLARADO, nunca o do Modelo I.
    itens_de_origem:
      - "NBR 6118:2023, 17.4.2.3-b) (p. 139): 'V_c1 = V_c0 quando V_Sd <= V_c0; V_c1 = 0 quando V_Sd = V_Rd2, interpolando-se linearmente para valores intermediários' — regra NBR6118-17.4.2.3-modelo-II-theta-arbitrado"
      - "NBR 6118:2023, lista de símbolos (p. 119): 'V_c0 — valor de referência para V_c, quando theta = 45°' e 'V_c1 — valor de referência para V_c, quando 30° <= theta <= 45°' — conferido visualmente pelo a2"
    passos_de_interpretacao: >-
      A Norma dá DOIS PONTOS e a palavra "linearmente"; a expressão fechada NÃO
      está escrita em lugar nenhum. Escrevê-la é DERIVAÇÃO — legítima, e
      declarada como tal, JAMAIS registrada como transcrição. Reta por
      (V_c0, V_c0) e (V_Rd2, 0) na variável V_Sd.
    uso_autorizado: >-
      A fórmula acima, no Modelo II, dentro de 30° <= theta <= 45° declarado.
      DEGENERAÇÃO OBRIGATÓRIA COMO TESTE: nos dois extremos a expressão tem de
      reproduzir EXATAMENTE V_c0 e 0.
    nao_autorizado: >-
      (1) Extrapolar a reta para V_Sd > V_Rd2. Nesse caso 17.4.2.1 já REPROVOU
          e o software reprova ANTES de avaliar V_c1. É PROIBIDO devolver V_c1
          negativo ou truncá-lo em zero em silêncio.
      (2) Usar V_Rd2 do Modelo I na interpolação.
      (3) Concluir que os DOIS MODELOS COINCIDEM em theta = 45°. Coincidem em
          V_Rd2 e em V_sw; NÃO coincidem em V_Rd3, porque V_c1 <= V_c0 sempre
          que V_Sd > V_c0. Um teste que exija V_Rd3(II) == V_Rd3(I) em
          theta = 45° está ERRADO e quebra uma implementação correta.
    citacao_em_codigo: "[deriv: DER-NBR6118-17.4.2.3-Vc1-interpolacao-linear]"
    checagem_dimensional: >-
      kN·(kN/kN) = kN. Rodado em tools/checar_dimensoes.py
      (DER-NBR6118-17.4.2.3-Vc1-interpolacao-linear, OK) e
      SANITY-modelo-II-NAO-coincide-com-I-em-VRd3 (−13,08 kN).
    checagem_numerica: >-
      Geometria A, theta = 45°, V_Sd = 120 kN, V_Rd2 = 334,6 kN, V_c0 =
      59,33 kN: V_c1 = 59,33 × 214,6/275,27 = 46,25 kN.
      Extremos: V_Sd = 59,33 kN -> V_c1 = 59,33 kN; V_Sd = 334,6 kN -> 0,00 kN.
    observacao: >-
      Sem contraprova externa: a Tabela A-5 do Bastos traz só V_Rd2 do Modelo II
      e nenhum exemplo resolvido da apostila usa o modelo.

  - id: DER-NBR6118-composicao-18.3.3.2-com-18.4.3
    natureza: INTERPRETACAO_DE_ITEM_NORMATIVO
    metodo: calculo
    status: APROVADA
    decidida_por: "a2-verificador. A Norma resolve metade da composição; a outra metade é lógica de requisitos simultâneos, declarada aqui."
    formula: >-
      TETOS (espaçamentos, diâmetro máximo do estribo): adota-se o MENOR entre
      18.4.3 e 18.3.3.2.
      PISOS (diâmetro mínimo do estribo, phi_long >= phi_t, taxa rho_sw,mín):
      adota-se o MAIOR. Nunca o menor.
    itens_de_origem:
      - "NBR 6118:2023, 18.4.3, último parágrafo (p. 154): '... devem ser comparados com os mínimos especificados em 18.3 para vigas, adotando-se o menor dos limites especificados' — regra NBR6118-18.4.3-armaduras-transversais-pilarete"
      - "NBR 6118:2023, 18.3.3.2 (p. 150-151): diâmetro e espaçamentos máximos do estribo por cortante, mais a INCLUSÃO da Em1:2026 — regra NBR6118-18.3.3.2-detalhamento-do-estribo-por-cortante"
      - "NBR 6118:2023, 17.4.1.1.6 (p. 135): 'os espaçamentos máximos e mínimos entre elementos da armadura devem atender às exigências da Seção 18' — regra NBR6118-17.4.1.1.5-17.4.1.1.6-intervalo-de-alpha-e-remissao-a-secao-18"
      - "NBR 6118:2023, 17.4.1.1.2-c), período final (p. 134): 'Nesse caso, a armadura transversal mínima é a definida na Seção 18'"
      - "NBR 6118:2023, 17.4.1.1.1 (p. 134): rho_sw >= 0,2 f_ct,m/f_ywk — regra NBR6118-17.4.1.1.1-armadura-transversal-minima-por-resistencia"
    passos_de_interpretacao: >-
      (1) A própria Norma resolve a sobreposição de TETOS: 18.4.3 manda comparar
          com 18.3 "adotando-se o menor dos limites especificados".
      (2) A frase é PERIGOSA se aplicada mecanicamente, porque os dois itens
          contêm limites de DOIS SINAIS: tetos (espaçamento máximo, diâmetro
          máximo) e PISOS (diâmetro mínimo, taxa mínima). Tomar "o menor" de
          dois PISOS AFROUXA a exigência — erro do lado INSEGURO, e é
          exatamente o erro que uma leitura literal-preguiçosa produz.
      (3) A leitura correta é a única compatível com requisitos SIMULTÂNEOS: a
          condição resultante é a INTERSEÇÃO dos conjuntos admissíveis. Em teto
          isso é o mínimo; em piso, o máximo. A frase da Norma se refere ao caso
          de teto, que é o que os dois itens têm em comum no espaçamento.
    uso_autorizado: >-
      TETOS (adota-se o MENOR):
        s   <= min(200 mm, b_mín, k_phi·phi)            [18.4.3; k_phi = 12
                                                         (CA-50) ou 24 (CA-25)]
        s   <= min(0,6·d, 300 mm) se V_Sd <= 0,67·V_Rd2,
               senão min(0,3·d, 200 mm)                 [18.3.3.2]
        s_t <= min(d, 800 mm) se V_Sd <= 0,20·V_Rd2,
               senão min(0,6·d, 350 mm)                 [18.3.3.2]
        phi_t <= b_mín/10                               [18.3.3.2, interpretado]
        phi_t <= 12 mm se barra lisa                    [18.3.3.2]
      PISOS (adota-se o MAIOR):
        phi_t >= max(5 mm, phi/4)                       [18.4.3]
        phi_t >= 5 mm                                   [18.3.3.2]
        phi_long >= phi_t nas barras de canto           [18.3.3.2, Em1:2026]
        A_sw/(b_w·s·sen alpha) >= 0,2·f_ct,m/f_ywk      [17.4.1.1.1, salvo a
                                                         exceção de
                                                         17.4.1.1.2-c)]
      A alternativa phi_t < phi/4 de 18.4.3, com o s_máx adicional de
      90000·(phi_t²/phi)/f_yk, continua valendo como em REQ-PILARETE-08 e é
      ADICIONAL, nunca substitutiva.
      O memorial imprime, para cada teto e cada piso, o valor de CADA fonte e o
      valor adotado, com o item que governou.
    nao_autorizado: >-
      (1) Aplicar "o menor dos limites" a qualquer linha do bloco PISOS.
      (2) Substituir um bloco pelo outro. São CUMULATIVOS.
      (3) Usar V_Rd2 de um modelo nos limiares de 18.3.3.2 e do outro na
          verificação de 17.4.2.1.
      (4) Inventar valor numérico para o espaçamento MÍNIMO: o critério da Norma
          é qualitativo ("suficiente para permitir a passagem do vibrador") e o
          software NÃO reprova por ele.
    citacao_em_codigo: "[deriv: DER-NBR6118-composicao-18.3.3.2-com-18.4.3]"
    checagem_dimensional: >-
      Comprimentos contra comprimentos. Rodado em tools/checar_dimensoes.py
      (DER-COMPOSICAO-18.4.3-com-18.3.3.2-TETOS e -PISOS, OK).
    checagem_numerica: >-
      Geometria A (30×30, phi 16, phi_t 5, d = 25,7 cm, V_Sd = 120 kN,
      V_Rd2 = 334,6 kN):
        teto por 18.4.3 ..... 192,0 mm
        teto por 18.3.3.2 ... 154,2 mm
        ADOTADO (menor) ..... 154,2 mm   <- quem governa é 18.3.3.2
        piso por 18.4.3 ..... 5,0 mm ; piso por 18.3.3.2 ... 5,0 mm
        ADOTADO (maior) ..... 5,0 mm
        phi_t <= b/10 = 30 mm OK ; phi_long 16 >= phi_t 5 OK (Em1:2026).
      RESULTADO QUE PRECISA SER DITO EM VOZ ALTA: acrescentar o cortante ao
      escopo TORNOU o detalhamento MAIS RESTRITIVO do que a v12 exigia
      (154,2 mm contra 192,0 mm). Um pilarete detalhado conforme a v12 pode
      REPROVAR na v13. Isso não é regressão — é a v12 estar incompleta — e é
      mais um motivo pelo qual esta versão invalida aprovações anteriores
      (CLAUDE.md, regra 5).
    observacao: >-
      Este é o ponto em que a extração do a1 estava certa na conclusão ("adotar
      o menor dos limites") e incompleta no alcance: ela não separava tetos de
      pisos, e aplicada literalmente ao rho_sw,mín de 17.4.1.1.1 ou ao
      phi_t >= phi/4 de 18.4.3 produziria erro do lado inseguro. A separação por
      sinal é acréscimo do a2.

# =============================================================================
requisitos_para_a4:
  - id: REQ-PROP-01-pressao-liquida
    texto: >-
      q passado a qualquer das duas funções é a pressão LÍQUIDA na base
      (q_serviço - sigma'_v0 na cota da base), não a pressão total. É o que
      `recalques.py:255-260` já faz. Usar a total superestima dsigma em toda a
      profundidade. O rótulo na tela e no memorial deve dizer qual foi usada,
      com o valor — "q_líq = ... kPa", como `pranchas.py:575` já faz.
      Ressalva de citação: aquela docstring diz "conforme prática da NBR 6122";
      alívio de escavação aparece na NBR 6122:2022 §7.2 como um dos doze fatores
      a considerar, NÃO como fórmula prescrita. Não emitir [rule: ] por isso.
  - id: REQ-PROP-02-guarda-de-dominio
    texto: >-
      Validar no chamador, antes de chamar: z >= 0 (origem na BASE da sapata),
      a > 0, b > 0, q >= 0. Erro explícito, não retorno silencioso. Motivo em
      `dominio_de_validade` das duas entradas — hoje z<0 devolve q no Boussinesq
      e 4q no 2V:1H, ambos sem exceção.
  - id: REQ-PROP-03-sem-veredito
    versao_do_texto: 7      # REESCRITO. O texto da v6 definia L1/L2/L3 errado.
    texto: >-
      (A) SEM VEREDITO — inalterado desde a v6 e é a parte que sustenta a
      aprovação. O cálculo de propagação produz VALORES INFORMATIVOS. É
      PROIBIDO derivar deles qualquer PASSA/NÃO PASSA, cor de reprovação,
      alerta de segurança ou linha em lista de verificações. Não é preciosismo:
      é a fronteira que separa esta aprovação de uma que o a2 não pode dar
      sozinho.
      (B) DEFINIÇÃO OPERACIONAL DOS SÍMBOLOS DO CROQUI — reescrita na v7; o
      texto da v6 dizia "q1/q2/q3 nas cotas das interfaces, com L1/L2/L3 as
      espessuras" e a segunda metade estava ERRADA. Duas famílias de grandeza,
      dois universos de índice, e nunca o mesmo símbolo para as duas:
        * POR INTERFACE (grandeza de PONTO; i = 0..n, com i = 0 na BASE da
          sapata; vem de `PontoPropagacao`):
            q_i     = `delta_sigma` na cota da interface i [kPa];
            a_eq,i  = `largura_equivalente_a` na MESMA interface [m], exibida
            b_eq,i  = `largura_equivalente_b`, no corte do eixo correspondente.
          São essas duas famílias que o croqui clássico mostra, e é por isso
          que elas compartilham o índice: são a mesma cota. Comportamento
          esperado e verificável: q_i estritamente decrescente, a_eq,i
          estritamente crescente com a profundidade, nos DOIS métodos.
        * POR CAMADA (grandeza de TRECHO; i = 1..n; vem de `CamadaPropagacao`):
            h_i        = `espessura` do trecho analisado [m] — exibição
                         OPCIONAL, a coluna estratigráfica já a informa;
            Δσ_méd,i   = `delta_sigma_medio`, amostrado na MEIA-ALTURA do
                         trecho — exibição opcional e, se exibida, com este
                         rótulo, jamais como "q_i".
      (C) PROIBIÇÃO DE SÍMBOLO. "L", "L_i", "L1/L2/L3" não podem aparecer neste
      croqui, no núcleo, na tela nem no memorial, em nenhuma acepção — o
      símbolo está queimado por ter significado espessura e largura ao mesmo
      tempo em artefatos diferentes (ver a seção de colisão de símbolo).
      Também não usar "B_eq", pelo motivo registrado lá.
      (D) q EXIBIDO É O DE INTERFACE, não a média. Reforço explícito, porque
      isto já valia pela v6 (`uso_autorizado` das duas práticas: "nas
      profundidades das interfaces") e mesmo assim a tela exibe hoje um único
      `delta_sigma_medio` por camada. Medido pelo a6 em caso real: camada que
      vai de 158,6 a 18,1 kPa (9x) resumida em "q2 = 48,3 kPa"; medido pelo a2
      no perfil de referência: camada que vai de 223,0 a 53,7 kPa exibida como
      130,3 kPa. O croqui existe para mostrar a QUEDA da tensão ao longo da
      profundidade — um número por camada apaga justamente isso. Os dois
      valores de interface de cada camada já estão calculados e expostos pelo
      a4 (`delta_sigma_topo`/`delta_sigma_base`) e nunca foram consumidos.
      Interfaces internas são compartilhadas por duas camadas: exibir UM valor
      por interface, não dois iguais.
      (E) LARGURA INDEFINIDA NÃO VIRA NÚMERO. `largura_equivalente` devolve
      None quando q_líq = 0 ou Δσ <= 0, e nessa situação devolve None em TODOS
      os pontos. O idioma `largura_equivalente_a or dim` de `visual2d.py:693`
      substitui o None pela dimensão da sapata e a rotula como se fosse largura
      calculada, ao lado de um Δσ = 0 — engano por silêncio. Sem largura
      definida: não escrever número (traço, ou omitir o rótulo), e deixar o
      aviso de pressão líquida nula visível.
      (F) FAIXA DE SANIDADE, para teste de regressão: a_eq(z=0) = a exatamente;
      na cota do teto z = 2·B, a_eq/B entre 2,7 e 3,1 nos dois métodos e em
      todas as geometrias medidas (2x2, 2x4, 1,2x1,2, 4x4, 1,5x3,0). Fora dessa
      faixa, suspeitar de transcrição — a análise dimensional não pega, porque
      largura e espessura são ambas [length].
  - id: REQ-PROP-04-metodo-explicito
    texto: >-
      O método usado (Boussinesq/Newmark ou 2V:1H) tem de viajar junto com o
      número até o memorial — não pode ficar só no estado da UI. Dois números de
      dsigma para a mesma camada, calculados por métodos diferentes, diferem em
      até 37 % (ver checagem_numerica de PC-ESPRAIAMENTO-2V1H); um memorial que
      não diga qual foi usado é irrastreável.
    estado_v8: ATENDIDO_NA_TELA_PENDENTE_NO_MEMORIAL
    nota_de_escopo_v8: >-
      REGISTRO ACRESCENTADO NA v8, gêmeo do de REQ-UI-01 — o requisito NÃO foi
      relaxado. Na tela, o método já viaja junto com o número e vem de
      `prop.rotulo_metodo`, não do estado da UI (REQ-UI-07 (f), verificado por
      render pelo a6). No MEMORIAL, não viaja: `pranchas.py` não emite nada
      desta feature, e portanto `fonte_espraiamento` segue sendo estado
      exclusivamente de UI — que é precisamente o que este requisito nomeia.
      A frase "o método tem de viajar junto com o número até o memorial" fica,
      então, satisfeita por VACUIDADE: nenhum número desta feature chega ao
      memorial, logo não há número desacompanhado de método. É satisfação
      frágil e por isso está escrita aqui: no instante em que um único valor de
      propagação for para o PDF sem o rótulo de método junto, este requisito
      passa a estar VIOLADO, não pendente. Mesmos gatilhos de reabertura
      listados em REQ-UI-01 > nota_de_escopo_v8.
  - id: REQ-PROP-05-nao-expor-2v1h-em-recalque
    texto: >-
      PROIBIDO ligar `usar_boussinesq=False` em `recalques.py`, expor esse
      seletor na UI ou mudar o default. Fator medido: recalque ~25 % menor, lado
      inseguro. Manter default True e nenhum chamador passando False.
  - id: REQ-PROP-06-testes
    texto: >-
      Criar testes para `acrescimo_tensao_2v1h`, que hoje não tem nenhum:
      (a) z=0 -> q exato; (b) equilíbrio vertical dsigma·(a+z)(b+z) = q·a·b em
      pelo menos 4 profundidades; (c) monotonicidade decrescente em z;
      (d) z<0 levanta erro (depende de REQ-PROP-02);
      (e) razão 2V1H/Boussinesq em z=1,0 m com a=b=2,0 m fica em 0,63 +/- 0,01 —
      teste de regressão que trava a troca acidental do ângulo, que é o único
      erro que a análise dimensional não pega.
      Para Boussinesq, os testes existentes (I(10,10)~0,25; z->0 -> q; z=20 -> <2)
      são fracos: acrescentar I(1,1) = 0,17522 +/- 1e-4 e ao menos um ponto do
      ramo m²n² > m²+n²+1, ex. I(2,2) = 0,23247 +/- 1e-4.
  - id: REQ-PROP-07-unificar-2v1h
    texto: >-
      `recalques.py:265-266` deve chamar `acrescimo_tensao_2v1h` em vez de
      reescrever a expressão. Nenhum número muda.
  - id: REQ-PROP-08-namespace
    texto: >-
      Colisão de símbolo (a2-verificador.md §3): estas funções usam 'a' e 'b'
      para dimensões em planta e 'z' para profundidade — 'z' aqui é
      GEOTÉCNICO (profundidade abaixo da base), e não deve ser confundido com
      braço/altura estrutural; 'b' aqui é dimensão em planta, e no domínio
      estrutural 'b' aparece como largura de seção. Docstrings e campo
      `implementacao` usam o namespace `geotecnico.propagacao.*`, como acima.
      NÃO renomear API existente nesta rodada (quebraria UI e testes).
  - id: REQ-PROP-09-simbolos-e-testes-do-croqui
    versao_do_texto: 8      # v7: NOVO, decorre de REQ-PROP-03 (B) a (F).
                            # v8: só o item (d) — ResultadoRecalque ->
                            # ResultadoSapata. (a)/(b)/(c) inalterados.
    texto: >-
      Decorrências da v7 no núcleo. Nenhuma muda número algum.
      (a) DOCSTRING DE `CamadaPropagacao` (geotecnia.py:471-478) está ERRADA e
      é uma das três fontes do conflito: diz que `espessura` "corresponde aos
      L1/L2/L3 do desenho". Não corresponde, e "L" deixou de existir. Redigir:
      `espessura` = h_i, grandeza de TRECHO; os símbolos do croqui por
      interface são q_i e a_eq,i/b_eq,i, em `PontoPropagacao`. Enquanto essa
      docstring não for corrigida, o mesmo defeito volta na próxima leitura —
      foi ela que respaldou a leitura "espessura" do a6.
      (b) A docstring de `PontoPropagacao` passa a nomear explicitamente
      `largura_equivalente_a/_b` como a_eq/b_eq, e a de `largura_equivalente`
      mantém, com destaque, a ressalva de que sob Boussinesq o valor é leitura
      ilustrativa.
      (c) TESTES a criar, que travam exatamente o que a análise dimensional não
      pega (as duas grandezas são [length]):
        1. a_eq(z=0) == a e b_eq(z=0) == b, exatos, nos dois métodos;
        2. a_eq estritamente crescente com z em >= 4 profundidades, nos dois
           métodos — é a propriedade que distingue largura de espessura;
        3. em z = 2·B, 2,7 <= a_eq/B <= 3,1 nos dois métodos, em pelo menos
           três geometrias (2x2, 2x4, 1,5x3,0);
        4. com q_líq = 0, `largura_equivalente` é None em TODOS os pontos —
           trava o contrato que REQ-PROP-03 (E) obriga a UI a respeitar;
        5. com z_max = 2·B e perfil que termina abaixo disso, a última camada
           vem truncada e `espessura` NÃO é monótona crescente — registra em
           teste o contraexemplo que derrubou a leitura "espessura", para que
           ninguém a ressuscite;
        6. `delta_sigma_medio` fixado na MEIA-ALTURA do trecho (mata o mutante
           M10 do a6, hoje sobrevivente): para uma camada de z=0 a z=2 m,
           delta_sigma_medio == acrescimo_tensao(fonte, q, a, b, 1.0), e é
           estritamente menor que `delta_sigma_topo`.
      (d) CORRIGIDO NA v8 — o texto da v7 dizia `ResultadoRecalque` e estava
      errado no OBJETO (o requisito, esse, é o mesmo). `ResultadoSapata` deve
      expor `q_servico` para eliminar a reconstituição q_líquido + sobrecarga
      que a UI faz hoje (a6, E3/E2 em visual2d.py:616 e :620). Sem isso, com
      `verificar_recalque=False` e perfil PRESENTE, o croqui não aparece e a
      tela culpa o perfil.
      POR QUE `ResultadoRecalque` ESTAVA ERRADO, e não é preferência de
      arquitetura: `ResultadoRecalque` é exatamente `None` no caso que este
      requisito existe para consertar (`verificar_recalque=False`), então o
      campo seria inalcançável justamente quando é necessário — o texto da v7
      pedia o dado onde ele não pode ser lido. Conferido no código pelo a2:
      `recalques.py:210-223` não tem `q_servico` (tem `q_liquido`), e
      `ResultadoSapata.q_servico` (sapata.py:215) é construído num único sítio
      (sapata.py:1019) que sempre passa o valor. `Sapata._pressao_servico` é
      extração literal do bloco que já existia em `_analisar_recalques`
      (max(N_qp) + peso próprio, dividido pela área), com guarda a>0/b>0
      acrescentada: nenhuma fórmula nova, nenhum número alterado.
      RESSALVA ANEXA, que não é este item mas vive nele: este requisito é
      satisfeito pela EXISTÊNCIA do campo e por ele ser sempre preenchido — não
      pelo seu valor default. Um default fisicamente plausível (`float = 0.0`,
      como estava na rodada 2) faz um esquecimento futuro sair na tela como
      "pressão líquida nula", diagnóstico coerente e falso, em vez de "sem
      dado"; `Optional[float] = None` faz a ausência aparecer como ausência,
      que é o comportamento que a UI já trata. É defeito BAIXA despachado ao a4
      (sapata.py:215) e não vira requisito na v8 — fica registrado para que a
      escolha não seja revertida por acidente.

  # === VERSÃO 9 — requisitos de sigma_adm e majoração por vento ==============
  # A aprovação das regras e formulações da v9 é DESTES itens JUNTOS com as
  # fórmulas, nunca da fórmula solta. A4 que implemente a aritmética sem estes
  # requisitos NÃO cumpriu a regra aprovada, e o a6 deve tratar como defeito.

  - id: REQ-SIGMA-01-proibir-mistura-de-metodo
    texto: >-
      GUARDA DE MÉTODO DE SEGURANÇA, EM TEMPO DE EXECUÇÃO — não em comentário.
      Toda função que produza ou consuma sigma_adm nesta versão carrega um campo
      `metodo_de_seguranca` com valor obrigatório 'admissivel'. É PROIBIDO, e
      deve levantar exceção explícita:
        (a) aplicar gamma_m (2,15 / 1,40) a qualquer resultado desta versão —
            a rota de valores de cálculo NÃO está implementada
            (NBR6122-6.3.3-..., PENDENTE_HUMANO);
        (b) comparar um sigma_adm produzido aqui contra tensão obtida de
            combinação de CÁLCULO (ações majoradas). A NBR 6122:2022 §3.47
            define tensão de trabalho como "em valores característicos", e a
            comparação com ações majoradas é erro de método, não de arredondamento;
        (c) aplicar gamma_f = 1,4 sobre a ação E dividir por FSg — as duas
            colunas da Tabela 1 são ALTERNATIVAS, não cumulativas (a aritmética
            está em NBR6122-6.2.1.1.1 > checagem_numerica: 3,00/2,15 ~= 1,4).
      A guarda existe porque esta é a primeira versão em que calc_core ESCOLHE
      um método de segurança em vez de receber o valor pronto.

  - id: REQ-SIGMA-02-FS-embutido-e-metadado-verificado
    texto: >-
      O FS embutido de cada correlação semiempírica NÃO pode viver só no
      ruleset. Cada função semiempírica devolve, junto com o número, o campo
      `FS_embutido: float` e o campo `FS_embutido_origem: str`, e EXECUTA a
      asserção `FS_embutido >= 3.00` (piso da Tabela 1, linha "Semiempíricos"),
      levantando exceção se falhar. Valores aprovados:
        FB-REGRA-BRASILEIRA-Nspt-50-argila .. 3.0 (álgebra exata sobre a dedução
                                              impressa: (0,01·N·6)/3)
        FB-TEIXEIRA-1996-areia .............. 3.0 (piso verificado; medido pelo
                                              a2 entre 3,05 e 4,55 no domínio)
      MOTIVO, e é o que separa esta aprovação de uma confiança cega no autor: a
      Tabela 1 exige "valores propostos no próprio processo E no mínimo 3,00" —
      a Norma quer que o valor seja VERIFICÁVEL, não presumido. Um número que só
      existe em prosa de ruleset não é verificável em produção. Correlação sem
      FS_embutido demonstrável NÃO pode ser usada: é por isso que Mello (1975)
      está PENDENTE_HUMANO.
      ATENÇÃO À REDAÇÃO DA TABELA 1: 3,00 é PISO e não valor fixo para os
      semiempíricos. Se o método de origem propuser MAIS, prevalece o do método.
      Não escrever `FSg = 3.0` como constante do caminho semiempírico.

  - id: REQ-SIGMA-03-guarda-de-unidade
    texto: >-
      DUAS ARMADILHAS QUE A ANÁLISE DIMENSIONAL NÃO PEGA, ambas confirmadas em
      `tools/checar_dimensoes.py`, e por isso viram guarda explícita:
        (a) `sigma_a = N_spt/50 + q` — como "+ q" JÁ é tensão, passar q em kPa
            em vez de MPa dá erro de fator 1000 que nenhuma checagem de dimensão
            acusa: os dois termos são "tensão". A API deve receber q com nome
            explícito de unidade (`q_MPa`) ou receber em kPa e converter dentro,
            documentado. Não aceitar float anônimo.
        (b) `sigma_a = 0,05 + (1 + 0,4·B)·N_spt/100` — B em cm produz número
            grande e PLAUSÍVEL sem erro dimensional algum. Parâmetro `B_m`, com
            validação de faixa (REQ-SIGMA-04) que rejeita valores compatíveis
            com centímetros.
      Todas as funções desta versão devolvem kPa na fronteira do módulo, mesmo
      que a fórmula da fonte esteja em MPa. A conversão fica num único ponto,
      não espalhada.

  - id: REQ-SIGMA-04-guarda-de-dominio-que-recusa
    texto: >-
      IMPLEMENTAÇÃO DA OBRIGAÇÃO (a) DO §7.3.3 ("devem ser observados os
      domínios de validade de suas aplicações"), que é NORMATIVA. A função
      RECUSA — levanta exceção com mensagem que nomeia o parâmetro, o valor
      recebido e o intervalo declarado — em vez de aproximar, extrapolar,
      clampar ou avisar e seguir. Não há "melhor esforço" aqui: fora do domínio
      a fonte não autoriza a fórmula, e um número devolvido fora do domínio é um
      número sem procedência.
      FB-REGRA-BRASILEIRA-Nspt-50-argila:
        5 <= N_spt <= 20 (DECLARADO EM TEXTO na fonte); solo declarado
        "puramente argiloso"; forma retangular ou quadrada.
      FB-TEIXEIRA-1996-areia:
        solo declarado "areia"; forma QUADRADA; h == 1,5 m; gamma == 18 kN/m³;
        1,0 <= B <= 3,0 m e 4 <= N_spt <= 25.
        As duas últimas faixas vêm da EXTENSÃO DA FIG. 4.1, não do texto —
        marcar em código como
        `origem: extensao_da_Fig_4_1_nao_declarada_em_texto`. As duas primeiras
        (h e gamma) são igualdade estrita, tolerância ZERO até decisão humana:
        medido pelo a2, h = 3,0 m em vez de 1,5 m move o resultado 59 %.
      FB-CINTRA-TERZAGHI-VESIC-capacidade-de-carga: ver REQ-SIGMA-07.
      Toda guarda declara em qual campo do ruleset ela se apoia, para que o a6
      possa conferir uma a uma.

  - id: REQ-SIGMA-05-dispersao-lado-a-lado
    texto: >-
      IMPLEMENTAÇÃO DA OBRIGAÇÃO (b) DO §7.3.3 ("bem como as dispersões dos
      dados"). Nenhuma correlação desta rodada publica desvio-padrão ou
      intervalo de confiança, e o software NÃO pode inventar um. O que ele deve
      exibir é a dispersão OBSERVÁVEL: quando mais de uma correlação estiver
      DENTRO do seu domínio para o mesmo caso, mostrar TODAS lado a lado, com o
      nome de cada uma, em vez de um número só. Medido pelo a2 em N_spt = 15,
      B = 2,0 m: Teixeira areia 320 kPa, regra N/50 300 kPa, Mello 287 kPa.
      Mello entra nessa comparação APENAS como valor informativo (é
      PENDENTE_HUMANO): sem veredito, sem ser selecionável como sigma_adm de
      projeto, sem entrar em verificação alguma.
      A seleção de QUAL valor vira o sigma_adm de projeto é do engenheiro. O
      software não escolhe, não faz média e não pega o menor automaticamente.

  - id: REQ-SIGMA-06-declaracao-regional
    texto: >-
      IMPLEMENTAÇÃO DA OBRIGAÇÃO (c) DO §7.3.3 ("as limitações regionais
      associadas a cada um dos métodos"), reforçada pela nota (a) da Tabela 1
      ("atendendo ao domínio de validade para o terreno LOCAL"). O software NÃO
      pode inferir aplicabilidade regional de um perfil SPT, e não pode ficar
      calado. Exigir DECLARAÇÃO EXPLÍCITA do usuário, sem default afirmativo, e
      registrá-la no memorial junto com o valor. Texto mínimo a exibir: estas
      correlações são brasileiras e foram calibradas em solos do Sudeste — a
      própria fonte compara a Fig. 4.1 com "valores de experiência prática em
      São Paulo, relatados por Vargas (1951)". A Norma não define "região".
      Um software que aceite N_SPT e devolva sigma_adm sem essa declaração NÃO
      cumpre 7.3.3, mesmo com a aritmética correta.

  - id: REQ-SIGMA-07-guardas-do-caminho-teorico
    texto: >-
      Guardas de FB-CINTRA-TERZAGHI-VESIC-capacidade-de-carga, todas RECUSANDO:
        (a) 0 <= phi <= 50 graus (extensão declarada da Tab. 2.2). Que a forma
            fechada saiba calcular phi = 55° não é autorização.
        (b) h <= B (hipótese 2 de Terzaghi, declarada na fonte). É o que
            autoriza trocar a camada acima da base pela sobrecarga q = gamma·h.
        (c) solo HOMOGÊNEO no bulbo. O caso estratificado está no item 2.5 da
            fonte, NÃO EXTRAÍDO — é o risco que o CLAUDE.md nomeia
            explicitamente. Recusar perfil multicamada ou exigir camada
            equivalente declarada.
        (d) modo de ruptura declarado, 'geral' ou 'puncionamento' apenas
            (REQ-SIGMA-12).
        (e) c >= 0, B > 0, L >= B, gamma > 0.
        (f) Nc em phi = 0: a forma fechada cotg(phi)·[...] é 0/0. Usar o limite
            2 + pi = 5,14159..., NÃO um epsilon, NÃO um try/except que devolva
            zero. Este é o caso de ARGILA NÃO DRENADA, isto é, o caminho mais
            usado — um bug aqui não é caso de canto.
        (g) fatores de forma de DE BEER apenas (Tab. 2.3). Não implementar a
            Tab. 2.1 de Terzaghi-Peck e não permitir mistura dos dois conjuntos.
        (h) Nq/Nc SEMPRE calculado de Nc e Nq, jamais lido de tabela — ver
            FB-CINTRA-TERZAGHI-VESIC > decisao_2.
        (i) puncionamento: phi* = arctg((2/3)·tg phi), NUNCA phi* = (2/3)·phi;
            c* = (2/3)·c; os fatores de FORMA não são reduzidos.

  - id: REQ-SIGMA-08-drenado-ou-nao-drenado
    texto: >-
      EXIGÊNCIA NORMATIVA EXPRESSA da NBR 6122:2022 §7.3.2 na redação de 2022 —
      "desde que contemplem todas as particularidades do projeto, INCLUSIVE A
      NATUREZA DO CARREGAMENTO (DRENADO OU NÃO DRENADO)". Achado do a2 nesta
      rodada: a edição 2010 citada pelo livro dizia "que contemplam" (descrição)
      e a de 2022 diz "desde que contemplem" (condição suspensiva). Vira campo
      obrigatório: a entrada declara se c e phi são DRENADOS ou NÃO DRENADOS, o
      resultado carrega essa informação e o memorial a imprime.
      MOTIVO ADICIONAL, específico desta fonte: Cintra/Aoki/Albiero avisa na
      impressa 26 que na SUA notação "c e phi geralmente representam os valores
      NÃO DRENADOS" — convenção diferente da usual em Mecânica dos Solos. Quem
      ler a fonte e o código sem esse campo vai misturar as duas convenções.
      Coerência a verificar e sinalizar: phi = 0 com c > 0 é análise NÃO
      DRENADA; phi > 0 com c = 0 é análise em tensões efetivas. A combinação
      declarada tem de bater com os parâmetros recebidos.

  - id: REQ-SIGMA-09-rotulo-ELU-e-nao-tensao-admissivel
    texto: >-
      DECORRE DE NBR6122-7.3-7.4-conjuncao-ELU-ELS, e é o requisito que impede
      o software de anunciar conformidade que não tem. PROIBIDO rotular a saída
      de qualquer função desta versão como "tensão admissível conforme a NBR
      6122" — em nome de variável, em retorno, em tela ou em memorial. Nenhum
      caminho aprovado na v9 verifica ELS (recalque), e a definição 3.45 da
      Norma é CONJUNTIVA (ELU **e** ELS).
      Nome de retorno: `sigma_adm_ELU`, nunca `sigma_adm`.
      Rótulo obrigatório, colado ao número: "parcela de ELU da tensão admissível
      (NBR 6122:2022 §7.3) — §7.4 (ELS/recalque) NÃO verificado".
      Vale IGUALMENTE para o caminho semiempírico: a alegação de que correlações
      empíricas "já embutem" o recalque é plausível e NÃO é verificável a partir
      do valor entregue, e em nenhum caso traz o recalque aceitável C do projeto
      em questão — que a Norma expressamente não fixa (6.2.2.2.2 lista sete
      fatores, nenhum calculável de um perfil SPT).

  - id: REQ-SIGMA-10-vento-nada-e-inferido
    texto: >-
      Da regra NBR6122-6.3.2. TRÊS entradas declaradas pelo usuário, todas com
      default que NÃO majora, e NENHUMA inferida pelo software:
        `vento_e_acao_variavel_principal: bool = False` — quem define isso é a
            ABNT NBR 8681 (remissão de 6.3.1), vem da análise estrutural a
            montante e não é dedutível dentro do módulo de fundação. A NBR
            8681:2025 está no acervo mas NUNCA foi varrida.
        `tipo_de_obra_da_lista_dos_30_por_cento: bool = False` — lista FECHADA e
            taxativa de sete: galpões industriais, torres de linhas de
            transmissão, reservatórios elevados, silos graneleiros, torres
            eólicas, torres de telecomunicações, tanques de produtos químicos.
            Nada de "obra semelhante a galpão".
        `k_v: float = 0.0` — a majoração EFETIVAMENTE adotada. A Norma dá o
            TETO ("em ATÉ 15 %"), não o valor. É decisão de engenharia.
      Guardas a executar, nesta ordem:
        se not vento_principal: exigir k_v == 0 (a Norma escreve "NÃO É
            PERMITIDA a majoração"), exceção se k_v > 0;
        k_v <= 0.30 se lista fechada, senão k_v <= 0.15;
        FSg/(1 + k_v) >= 1.6 — ver a decisão de leitura em
            NBR6122-6.3.2 > decisao_do_a2_sobre_o_piso_FSg_1_6. Esta guarda
            BINDA de fato em FSg = 2,00 com k_v = 0,30 (dá 1,538), e nesse caso
            o k_v máximo cai para 0,25.
      A majoração é GEOTÉCNICA: k_v não pode se propagar para nenhuma função
      estrutural (flexão, cisalhamento, punção, ancoragem). "Em qualquer caso,
      deve ser feita a verificação estrutural do elemento de fundação" é
      literal.

  - id: REQ-SIGMA-11-tabela-2.2-como-fixture-de-teste
    texto: >-
      A Tab. 2.2 de Vesic NÃO é fonte de consulta no código (ver
      FB-CINTRA-TERZAGHI-VESIC > decisao_1) — é FIXTURE DE VALIDAÇÃO, e é um
      uso melhor do que o de tabela. Teste obrigatório: para phi = 0..50 inteiro,
      as formas fechadas implementadas devem reproduzir as 51 linhas x 3 colunas
      (Nc, Nq, N_gamma) publicadas, com tolerância de 0,05 absoluto OU 0,1 %
      relativo, o que for maior. O a2 rodou exatamente esta comparação nesta
      rodada e obteve 255/255 células dentro de 0,1 %.
      Casos de contorno a fixar em teste: phi = 0 -> Nc = 5,14 (2+pi),
      Nq = 1,00, N_gamma = 0,00; phi = 30 -> 30,14 / 18,40 / 22,40.
      NÃO transformar em teste a coluna Nq/Nc na linha phi = 0: a fonte imprime
      0,20 e o valor correto é 0,1945. Testar contra o impresso ali seria
      congelar o erro tipográfico da fonte.
      Fonte dos números: kb/formulas.yaml, id
      CINTRA-VESIC-tabela-2.2-fatores-capacidade-carga.

  - id: REQ-SIGMA-12-modo-de-ruptura-e-entrada
    texto: >-
      O MODO DE RUPTURA é ENTRADA DECLARADA PELO USUÁRIO, restrita a dois
      valores: 'geral' ou 'puncionamento'. O software NÃO infere o modo e NÃO
      oferece um terceiro. Motivo em FB-CINTRA-2.4-ruptura-local-media e
      FB-CINTRA-2.9.4-diagrama-modo-de-ruptura: a "ruptura local" dos autores é
      média aritmética confessadamente sem respaldo bibliográfico, e o seletor
      que a acionaria (Fig. 2.21) não tem equação de fronteira publicada.
      ARMADILHA DE NOMENCLATURA, obrigatória de respeitar em código e em tela: o
      que TERZAGHI chamou de "ruptura local" é o que esta fonte chama de
      PUNCIONAMENTO. A interface NÃO pode usar o termo "ruptura local" para
      nomear o puncionamento, e o memorial tem de usar o vocabulário da fonte
      citada.

  - id: REQ-SIGMA-13-parcela-q-facultativa-default-zero
    texto: >-
      Em FB-REGRA-BRASILEIRA-Nspt-50-argila a parcela "+ q" é FACULTATIVA por
      declaração da fonte ("pode ou não ser considerada"), e a dedução que a
      sustenta é para sapata na SUPERFÍCIE (h = 0), onde q seria zero. A fonte
      não concilia as duas coisas e o a2 não arbitra: `considerar_q: bool =
      False`, isto é, q = 0 no default, que é a forma que a dedução sustenta.
      Ligar q só pode AUMENTAR sigma_a, logo o default é o lado seguro. Quando
      ligado, exibir aviso de que é acréscimo não sustentado pela dedução da
      fonte, e q em MPa (REQ-SIGMA-03).

# =============================================================================
# requisitos_para_a5 — SEÇÃO CRIADA NA VERSÃO 11.
#
# Até a v10 este ruleset só tinha requisitos para A4 (geotécnico) e A3
# (interface), porque o único motor auditado era geotécnico e as regras de
# NBR 6118 já implementadas vieram no pacote externo do escopo amplo. A v11 é a
# primeira que MANDA construir elemento estrutural novo, e o destinatário é o
# A5. Requisitos aqui são condição da aprovação: as regras e derivações da v11
# estão aprovadas PARA SEREM USADAS DESTE JEITO, não em geral.
#
# DECISÃO DE MÓDULO, com a justificativa que o despacho pediu:
#
#   O pilarete vai para um pacote NOVO — `calc_core/estrutural/`, com
#   `pilarete.py` e `materiais_6118.py` — e NÃO como extensão de
#   `calc_core/sapata_isolada/`. Quatro razões, em ordem de peso:
#
#   1. GRAU DE CONFIANÇA. O CLAUDE.md separa os dois motores existentes
#      justamente por grau de auditoria: `geotecnico/` é 100 % auditado,
#      `sapata_isolada/` é o pacote externo PARCIALMENTE auditado, com partes
#      em PENDENTE_HUMANO que a UI é obrigada a exibir como "em conferência".
#      O pilarete nasce 100 % rastreado por este GATE 1. Colocá-lo dentro do
#      pacote parcialmente auditado destruiria a informação que o usuário mais
#      precisa ler — qual parte do memorial está auditada e qual não está.
#   2. `Pilar` NÃO É O PILARETE. `sapata_isolada/acoes.py::Pilar` é GEOMETRIA
#      PURA (ap, bp, phi_arranque_mm, n_barras, as_calc_efetiva) e existe como
#      CONDIÇÃO DE CONTORNO da sapata: alimenta perímetro crítico de punção,
#      bielas e ancoragem do arranque. O pilarete é elemento com resistência,
#      esbeltez, detalhamento e domínio de ELU próprios. Enfiar altura, ell_e,
#      vinculação, estribos, cobrimento próprio e tipo de junta dentro de
#      `Pilar` forçaria `Sapata` a carregar campos que não usa e mudaria em
#      silêncio o esquema de `.s7proj` e do Excel (`ui/completo/projeto.py`),
#      quebrando arquivos salvos — efeito colateral em superfície já aprovada
#      por A6/A7, sem necessidade.
#   3. DIREÇÃO DE DEPENDÊNCIA. O pilarete não precisa de nada da geotecnia. A
#      sapata é que, no futuro, poderá consumir o resultado do pilarete (N_d na
#      base). Módulo novo mantém a seta apontando para o lado certo.
#   4. TESTABILIDADE. O GATE 3 desta feature não tem exemplo de terceiros (ver
#      REQ-PILARETE-13). Um módulo isolado, sem solo e sem combinações, é
#      testável por invariância e por mutação de forma direta; dentro de
#      `Sapata` cada teste arrastaria um projeto inteiro.
#
#   FRONTEIRA DE DEPENDÊNCIA PERMITIDA (REQ-PILARETE-01): `estrutural/` pode
#   importar `sapata_isolada/materiais.py` (Concreto/Aco — §8 já conferido item
#   a item, ver relatorios/revisao_codigo.md, adendo) e nada mais do pacote
#   amplo. É PROIBIDO importar geotecnia, rigidez, recalques, bielas, grelha,
#   solo_mef ou sapata.
# =============================================================================
requisitos_para_a5:

  - id: REQ-PILARETE-01-modulo-novo-e-fronteira-de-dependencia
    texto: >-
      Criar `calc_core/estrutural/` com `pilarete.py` (elemento) e
      `materiais_6118.py` (eta_c, n, eps_c2, eps_cu, sigma_c, sigma_s, f_cd,
      f_yd). Importar de `calc_core/sapata_isolada/materiais.py` apenas
      `Concreto` e `Aco`; é PROIBIDO importar qualquer outro módulo do pacote
      amplo, e é PROIBIDO que `sapata.py` passe a importar `estrutural/`
      nesta versão (a integração pilarete<->sapata é rodada própria, com novo
      GATE). Toda função pública leva docstring com item normativo, página e
      `[rule: <id>]`, `[deriv: <id>]` ou `[pratica: <id>]` conforme a categoria
      — CLAUDE.md regra 3. Um `[rule: ]` apontando para id de `derivacoes` é
      defeito com veto do a6.
      NAMESPACE OBRIGATÓRIO (colisão de símbolo, cascata do a2 item 3). Este
      elemento traz QUATRO colisões novas, e uma delas já está no código:
        - `h`: altura da SEÇÃO do pilarete na direção considerada (6118 13.2.3,
          11.3.3.4.3) x altura da SAPATA (6118 22.6.1) x espessura de camada e
          embutimento no domínio geotécnico. Usar `h_secao` no pilarete.
        - `b`: menor dimensão da seção do pilarete em CENTÍMETROS (13.2.3,
          Tabela 13.1) x largura da sapata em METROS (`B` em geotecnico/).
          Usar `b_min_cm` onde a fórmula de gamma_n exigir cm.
        - `lambda`: índice de esbeltez (15.8.2) x relação y/x do diagrama
          retangular (17.2.2), que JÁ EXISTE como `Concreto.lambda_x` em
          `materiais.py`. Usar `lambda_esbeltez` e nunca `lambda`.
        - `alpha_b` (15.8.2) x `alpha_c` (17.2.2, já em `materiais.py`): manter
          os dois nomes completos, jamais abreviar para `alpha`.
      Também: `gamma_n` (13.2.3, seção reduzida) x `gamma_n1` (15.8.1, 2ª ordem
      para lambda > 140) — nomes completos sempre, e o segundo não existe nesta
      versão.
      COLISÃO ACRESCENTADA NA v12, e é a pior de todas porque as duas grandezas
      estão na MESMA PÁGINA 125 e as duas declaram valor "para seção
      retangular". São agora CINCO `alpha` no ruleset:
        - `alpha_interacao` — expoente de 17.2.5; 1,0 em geral, 1,2 retangular.
          É o do VEREDITO, e nesta versão vale 1,0.
        - `alpha_fissuracao` — fator de forma de M_r em 17.3.1; 1,5 retangular.
          NÃO EXISTE nesta versão (é ELS) e é PROIBIDO introduzi-lo.
        - `alpha_c` — 0,85 do bloco retangular, 17.2.2-e (já em `materiais.py`).
        - `alpha_b` — 15.8.2, alíneas a) a d).
        - `alpha_ancoragem` — 9.4.2.5, = 1,0 para barra comprimida.
      É PROIBIDO um símbolo chamado `alpha` em qualquer lugar de
      `calc_core/estrutural/`. Encontrar `alpha` nu, ou `alpha = 1.5` na
      interação, é VETO do a6 — o 1,5 passa por toda a checagem dimensional e
      produz envoltória mais cheia, isto é, erro do lado INSEGURO.
      E mais duas colisões de momento, que são de SUBSCRITO e não de letra:
        - `M_Rd_x` (componente OBLÍQUA, incógnita de 17.2.5) x `M_Rd_xx`
          (resistente em flexão composta NORMAL). Um "x" a mais ou a menos
          troca o significado. Usar `M_Rd_obliquo_x` e `M_Rd_normal_xx`.
        - `M_1d_min_*` (Figura 11.3, lado SOLICITANTE, expoente 2) x
          `M_d_tot_min_*` (Figura 15.2, com 2ª ordem, REJEITADA por escopo).
          O segundo não pode existir no código.
      COLISÕES ACRESCENTADAS NA v13 pelo ELU de força cortante, e a primeira
      delas atravessa a fronteira entre os dois motores do repositório:
        - `alpha_v2` (17.4.2.2/17.4.2.3, elemento linear) x `alpha_v` (19.5.3.1,
          punção de laje, já em uso no motor amplo). A DEFINIÇÃO é idêntica
          (1 − f_ck/250); o NOME difere por UM CARACTERE e os itens são
          diferentes. É PROIBIDO um símbolo `alpha_v` em
          `calc_core/estrutural/` e um `alpha_v2` em
          `calc_core/sapata_isolada/`. Confundir os dois não muda número nenhum
          e QUEBRA a rastreabilidade do memorial — item citado errado. Isso
          agora são SEIS `alpha` no ruleset. Ver
          [rule: NBR6118-DELIMITACAO-17.4-vs-19.4-19.5].
        - `V_Rd2` (17.4.2.2, FORÇA em b_w·d, kN) x `tau_Rd2` (19.5.3.1, TENSÃO
          em contorno crítico, MPa). É PROIBIDO um `V_Rd2` em
          `sapata_isolada/` e um `tau_Rd2` em `estrutural/`.
        - `theta` (17.4.2.3, inclinação da BIELA, 30°-45°, entrada do
          projetista) x `alpha_estribo` (17.4.1.1.5, inclinação da ARMADURA,
          45°-90°). Dois ângulos, dois papéis, na mesma expressão. Usar
          `theta_biela` e `alpha_estribo`, nomes completos, sempre. É PROIBIDO
          um símbolo chamado `theta` nu.
        - `d` (17.4.2.2, altura útil NO PLANO de V_Sd) x `d_util` das
          solicitações normais x `d` = profundidade de assentamento no domínio
          geotécnico. Usar `d_util_no_plano_do_cortante` no módulo de cortante.
        - `b_w` (17.4.2.2, menor largura NO PLANO de V_Sd) x `b_min_cm`
          (13.2.3) x `B` (largura da sapata, em metros). Usar
          `b_w_no_plano_do_cortante`.
        - `V_c0` (theta = 45°) x `V_c1` (30° <= theta <= 45°) x `V_c` (o valor
          efetivamente usado, já com o ramo de estado e a majoração). Três
          objetos distintos que a lista de símbolos da p. 119 separa
          explicitamente; nomes completos sempre.
      `tau_wd` é PROIBIDO em qualquer lugar de `calc_core/`: é símbolo da NBR
      6118:2014, não existe na edição de 2023 e não há regra que o sustente.

  - id: REQ-PILARETE-02-entradas-explicitas-e-recusa-por-ausencia
    texto: >-
      O construtor do pilarete EXIGE, sem default silencioso, e RECUSA (exceção
      com mensagem que nomeia o campo e o item normativo) se faltar:
        (a) seção b×h e altura livre ell;
        (b) condição de vinculação, como enumeração fechada:
            ENGASTADO_BASE_LIVRE_TOPO (e aí ell_e = 2·ell, calculado pelo núcleo
            com [rule: NBR6118-15.8.2-dispensa-2a-ordem-local]) ou
            VINCULADO_DOIS_EXTREMOS (e aí ell_e é ENTRADA NUMÉRICA EXPLÍCITA do
            usuário, com ell_0 e ell declarados — 15.6, uso restrito). Não há
            terceira opção e não há valor inferido. Isto é um AJUSTE ao
            despacho, e o motivo está registrado: o despacho pedia ell_e sempre
            como entrada; mas para o caso engastado-livre a própria Norma
            escreve ell_e = 2·ell em 15.8.2, e transformar texto normativo em
            entrada do usuário seria jogar fora rastreabilidade. O princípio
            "nunca inferir" é preservado: o que o usuário declara é a
            VINCULAÇÃO, não o número; e sem a declaração o software recusa.
        (c) categoria do aço (CA-25/CA-50/CA-60 — a última só para recusar,
            REQ-PILARETE-08) e classe do concreto (lista fechada C20..C90);
        (d) classe de agressividade ambiental e dimensão máxima do agregado;
        (e) tipo de junta com a sapata (REQ-PILARETE-11);
        (f) declaração de que a verificação é em idade j >= 28 dias;
        (g) situação de aderência para f_bd (eta_2 = 1,0 boa / 0,7 má, 9.3.2.1)
            — DECLARADA, nunca assumida boa;
        (h) gamma_c e gamma_s, com 1,4 e 1,15 como PADRÃO EXIBIDO e editável,
            mais a pergunta explícita sobre condições desfavoráveis de execução
            (12.4.1: gamma_c × 1,1 é OBRIGATÓRIO quando previstas, e "concretagem
            deficiente por concentração de armadura" é caso plausível num
            pilarete de seção pequena com 100 % das barras emendadas).
      ACRESCENTADO NA v13, para o ELU de força cortante — os detalhes de cada
      um estão em REQ-PILARETE-18, que é onde eles são usados:
        (i) H_x e H_y, as DUAS componentes da força horizontal de cálculo na
            base (a v11/v12 exigia um H escalar; passam a ser duas, porque a
            recusa do cortante biaxial depende de saber que são duas);
        (j) MODELO_DE_CALCULO {MODELO_I, MODELO_II} — escolha do projetista,
            sem default;
        (k) theta_biela, só com MODELO_II, em [30°, 45°];
        (l) alpha_estribo (só 90° nesta versão);
        (m) N_gamma_f_1, a normal da combinação com gamma_f = 1,0, para o
            numerador de M_0 — campo PRÓPRIO, e sem ele o software não majora
            V_c;
        (n) A_sw e s do estribo adotado.
      GUARDA DE UNIDADE (a checagem dimensional NÃO pega estes erros, e está
      registrado por que): h em METROS na expressão de M_1d,min e b em
      CENTÍMETROS na de gamma_n; nos dois casos o coeficiente carrega a unidade
      e um valor na unidade errada produz número plausível. Parâmetros nomeados
      com a unidade (`h_secao_m`, `b_min_cm`) e validação de faixa.
      ACRESCENTADA NA v13 uma guarda de unidade nova, do mesmo tipo: em
      alpha_v2 = (1 − f_ck/250) o f_ck entra OBRIGATORIAMENTE EM MPa, enquanto
      f_cd, na mesma expressão de V_Rd2, entra na unidade coerente com b_w·d.
      Misturar as duas é o erro clássico deste item e produz número plausível.
      Parâmetro nomeado `f_ck_MPa` na expressão de alpha_v2.

  - id: REQ-PILARETE-03-geometria-limite-e-recusas-duras
    texto: >-
      [rule: NBR6118-13.2.3-dimensoes-limites-pilarete] e
      [rule: NBR6118-18.4.1-campo-de-aplicacao-detalhamento].
      Verificar, nesta ordem, e RECUSAR (não calcular, não aproximar):
        (1) b_min < 14 cm -> PROIBIDO pela Norma;
        (2) A_c < 360 cm² -> PROIBIDO "em qualquer caso", mesmo com b >= 14 cm
            (um 19×18 cm passa em (1) e reprova aqui — teste obrigatório);
        (3) 14 <= b_min < 19 cm -> admissível SOMENTE com gamma_n = 1,95 -
            0,05·b majorando os esforços de cálculo; aplicar e REGISTRAR no
            memorial que foi aplicado, com o valor;
        (4) h_max > 5·b_min -> é pilar-parede (18.5), FORA do escopo: RECUSA.
      A recusa cita item, valor obtido e valor-limite. Mensagem sem número é
      defeito.

  - id: REQ-PILARETE-04-M1d-min-obrigatorio-nas-duas-direcoes
    revisado_na_v12: true
    texto: >-
      [rule: NBR6118-11.3.3.4.3-momento-minimo-pilarete],
      [rule: NBR6118-11.3.3.4.3-fig11.3-envoltoria-minima-1a-ordem],
      [rule: NBR6118-16.3-proibicao-de-carga-centrada].
      NÃO EXISTE, na API do pilarete, caminho de "compressão centrada pura".
      Mesmo que o motor geotécnico chame o caso de "carga centrada" e passe
      M = 0, o núcleo calcula M_1d,min em CADA direção. A ausência desse caminho
      é estrutural, não convencional: não deve existir função pública que aceite
      só N_d e devolva veredito. A proibição tem, desde a v12, ITEM-FONTE
      PRÓPRIO — 16.3, p. 116, "não se aceita o dimensionamento de pilares para
      carga centrada" — e não depende mais de inferência sobre 11.3.3.4.3.
      CRUZAMENTO EIXO↔DIMENSÃO, agora desambiguado pela Figura 11.3 e
      OBRIGATÓRIO: M_1d,min,xx = N_d·(0,015 + 0,03·h) e
      M_1d,min,yy = N_d·(0,015 + 0,03·b), h e b em METROS, cada momento usando a
      dimensão da seção medida no plano em que ele flexiona. Em seção QUADRADA a
      troca é invisível — o teste que a pega tem de usar seção não quadrada
      (REQ-PILARETE-13).
      CORREÇÃO DA v11, e é o achado D2 do cabeçalho: a v11 mandava usar
      `M_d = max(M_entrada, M_1d,min)` POR DIREÇÃO e tratar o resultado como o
      par de projeto. Tomar os dois máximos SIMULTANEAMENTE é o CANTO do
      retângulo circunscrito à elipse da Figura 11.3, e é 41 % mais severo do
      que o critério que a Norma escreve (medido: 48,00 contra 33,94 kN·m no
      sanity check). Passa a valer:
        (a) `max(M_entrada, M_1d,min)` por direção CONTINUA sendo o que alimenta
            e_1 e lambda_1 em REQ-PILARETE-05 — ali é grandeza por direção e a
            v11 está certa;
        (b) para o VEREDITO de ELU, o critério é o de REQ-PILARETE-15: o par
            solicitante REAL de um lado, e a ELIPSE inteira do outro. O canto
            só pode ser usado como atalho que APROVA, nunca que reprova.
      O memorial imprime SEMPRE M_1d,min das duas direções e a frase de que a
      NBR 6118 não admite dimensionar pilar à compressão estritamente centrada
      (16.3, citado com página), com a hipótese declarada de que M_1d,min
      substitui as imperfeições locais de 11.3.3.4.2 (ver `observacao` da regra:
      é ~10x mais conservador que a rota alternativa para um pilarete de 1 m).

  - id: REQ-PILARETE-05-esbeltez-com-recusa-fora-do-pilar-curto
    texto: >-
      [rule: NBR6118-15.8.2-dispensa-2a-ordem-local],
      [rule: NBR6118-15.8.1-campo-de-aplicacao-esbeltez],
      [rule: NBR6118-15.8.3-metodos-de-2a-ordem] (REJEITADA -> recusa),
      [deriv: DER-GEOM-raio-de-giracao], [deriv: DER-NBR6118-15.8.2-e1-de-M1d-min].
      Sequência obrigatória, e cada passo tem seu próprio motivo de recusa:
        (1) Campo de 15.8.1: seção constante e armadura constante ao longo do
            eixo. Pilarete com seção variável -> RECUSA.
        (2) Classificar como elemento isolado (15.4.4-a) ou exigir declaração
            do usuário [rule: NBR6118-15.4.4-elementos-isolados].
        (3) i = sqrt(I/A) CALCULADO NO NÚCLEO a partir da geometria — nunca
            pedido à UI, nunca digitado. Avaliar as duas direções e tomar o
            MENOR i, isto é, o MAIOR lambda.
        (4) lambda = ell_e/i por direção.
        (5) lambda_1 = min(90, max(35, (25 + 12,5·e_1/h_secao)/alpha_b)) POR
            DIREÇÃO, CALCULADO PELA FÓRMULA. É PROIBIDO fixar 35 no código, e a
            proibição vale mesmo sabendo (ver a checagem numérica da derivação)
            que sob M_1d,min o resultado é exatamente 35 em todo o domínio
            admissível: basta o M de entrada superar M_1d,min — o que acontece
            sempre que M ou H entram como dado na base do pilar metálico — para
            lambda_1 subir. alpha_b = 1,0 pelas alíneas c) e d) de 15.8.2, com o
            motivo registrado no memorial.
        (6) lambda < lambda_1 (ESTRITO) -> pilar curto, segue.
            lambda >= lambda_1 -> RECUSA, mensagem citando 15.8.2/15.8.3, o
            lambda obtido, o lambda_1 calculado e a direção que governou.
        (7) Verificar ainda lambda <= 200 (15.8.1 com a redação da Em1:2026,
            com N_d — força normal DE CÁLCULO — na exceção de elemento pouco
            comprimido).

  - id: REQ-PILARETE-06-NRd0-e-a-recusa-de-veredito-de-ELU
    revisado_na_v12: true
    nota_de_id: >-
      O id é da v11 e ficou parcialmente vencido: a v12 PASSA a emitir veredito
      de ELU, por REQ-PILARETE-15. O id NÃO foi renomeado de propósito —
      identificador citado em relatórios e em kb/ é estável, e renomeá-lo
      quebraria rastreabilidade para economizar uma palavra. O que este
      requisito continua proibindo, e a v12 mantém intacto, é o veredito SAIR
      DE N_Rd0.
    texto: >-
      [deriv: DER-NBR6118-NRd0-compressao-centrada],
      [rule: NBR6118-8.2.10.1-diagrama-idealizado-do-concreto],
      [rule: NBR6118-8.3.5-8.3.6-aco-passivo].
      (A) IMPLEMENTAR eta_c, n, eps_c2 e eps_cu com os limiares EXPLÍCITOS e
          separados: eta_c muda em f_ck = 40 MPa; n, eps_c2 e eps_cu mudam em
          C50/C55. São DOIS limiares nesta lei constitutiva — a correção da
          premissa do despacho está registrada na `observacao` da regra. O
          terceiro limiar (C60, parâmetro s de beta_1, Emenda 1) pertence a
          j < 28 dias, que é RECUSADO em (D). Um `if fck <= 50: 0.85 else ...`
          sem eta_c é DEFEITO com veto: erra em silêncio em 40 < f_ck <= 50.
          Só classes normalizadas C20 a C90; f_ck fora da lista -> RECUSA (a
          Norma define eta_c/n por f_ck contínuo e eps_c2/eps_cu por classe, e
          os dois critérios divergem entre 50 e 55 MPa).
      (B) IMPLEMENTAR o patamar: sigma_c(eps_c) é a parábola só até eps_c2 e
          CONSTANTE de eps_c2 a eps_cu. Avaliar a expressão acima de eps_c2 é
          defeito (a expressão decresce).
      (C) N_Rd0 é EXPOSTO como valor informativo e como denominador de
          nu = N_d/N_Rd0. É PROIBIDO qualquer caminho de código em que
          `N_d <= N_Rd0` produza "aprovado", cor verde, ou ausência de aviso.
          N_d > N_Rd0 PODE reprovar (condição suficiente para reprovar).
          ALTERADO NA v12: a frase da v11 — "o relatório diz que a verificação
          de ELU de seção sob flexo-compressão NÃO é feita" — CAI, porque agora
          ela é feita, por REQ-PILARETE-15. O que NÃO cai é a proibição acima:
          N_Rd0 continua sendo condição NECESSÁRIA E NÃO SUFICIENTE, e o
          veredito continua PROIBIDO de sair dele. N_Rd0 ganha duas funções
          novas: (i) guarda de entrada da varredura — se N_Sd > N_Rd0 o
          equilíbrio não existe e o código RECUSA em vez de iterar; (ii)
          verificação cruzada obrigatória — a varredura de M_Rd tem de
          reproduzir N_Rd0 na reta b (x -> infinito), e o desvio admitido é o
          declarado no critério de convergência (REQ-PILARETE-13).
      (D) RECUSAR verificação em idade j < 28 dias
          [rule: NBR6118-12.3.3-12.4.1-valores-de-calculo], citando 12.3.3-b e
          a exigência de dupla verificação (aos t dias e aos 28).

  - id: REQ-PILARETE-07-armadura-longitudinal
    texto: >-
      [rule: NBR6118-17.3.5.3-armaduras-limite-pilarete],
      [rule: NBR6118-18.4.2-armaduras-longitudinais-pilarete].
      Verificar: A_s >= max(0,15·N_d/f_yd ; 0,004·A_c); A_s <= 0,08·A_c na seção
      corrente E na seção de emenda com a armadura DUPLICADA (o que na prática
      limita a 4 % fora da emenda quando 100 % das barras emendam na mesma
      seção — é a restrição que costuma governar); phi >= 10 mm e phi <=
      b_min/8; mínimo uma barra por vértice (4 na seção retangular);
      espaçamento livre >= max(20 mm, phi, 1,2·d_agregado) INCLUSIVE na região
      de emenda, com as barras duplicadas; espaçamento máximo entre eixos <=
      min(2·b_min, 400 mm). O N_d de A_s,min é o da combinação mais
      desfavorável — interpretação declarada no memorial, porque a Norma não
      diz qual combinação usar.

  - id: REQ-PILARETE-08-estribos-e-a-recusa-do-CA-60
    texto: >-
      [rule: NBR6118-18.4.3-armaduras-transversais-pilarete].
      phi_t >= max(5 mm, phi/4); s <= min(200 mm, b_min, k_phi·phi) com
      k_phi = 24 (CA-25) ou 12 (CA-50). Estribos em TODA a altura do pilarete.
      RECUSA EXPLÍCITA se a armadura longitudinal for CA-60: o item não fornece
      k_phi para CA-60 e o valor é NAO_DECLARADO_NA_FONTE. É PROIBIDO
      interpolar por f_yk, extrapolar de CA-50, ou "adotar 12 phi por
      analogia". A mensagem cita 18.4.3 e diz que a Norma não cobre o caso.
      A alternativa phi_t < phi/4 só é oferecida com o MESMO tipo de aço nas
      duas armaduras e aplica a limitação ADICIONAL s_max = 90000·(phi_t²/phi)/
      f_yk (f_yk em MPa, s em mm) — adicional, nunca substitutiva do
      min(200, b_min, k_phi·phi). ATENÇÃO À TRANSCRIÇÃO: NÃO há raiz quadrada
      nessa expressão; a camada de texto do PDF sugere um expoente 1/2 que não
      existe, e o mutante correspondente está em tools/checar_dimensoes.py.
      A NOTA de 18.4.3 sobre C55-C90 (reduzir 50 %, ganchos a 135°) é
      RECOMENDAÇÃO: pode virar aviso, JAMAIS verificação de reprovação.
      ALTERADO NA v13, e é alteração de COMPORTAMENTO, não de redação: quando
      há verificação de força cortante (FAIXA A de REQ-PILARETE-17), estes
      limites de 18.4.3 deixam de ser os únicos e passam a ser COMPOSTOS com os
      de 18.3.3.2 por [deriv: DER-NBR6118-composicao-18.3.3.2-com-18.4.3] —
      TETOS pelo MENOR, PISOS pelo MAIOR. Na geometria de referência
      (30×30, phi 16, d = 25,7 cm) quem passa a governar o espaçamento é
      18.3.3.2, com 154,2 mm contra os 192,0 mm de 18.4.3: um pilarete
      detalhado conforme a v12 pode REPROVAR na v13. Acrescenta-se ainda a
      exigência NOVA da Emenda 1:2026 em 18.3.3.2 (phi_long >= phi_t nas barras
      de canto), que junto com o phi_t >= phi/4 daqui encaixota a relação em
      phi/4 <= phi_t <= phi — par de desigualdades que nenhuma das duas fontes
      enuncia junto e que o software verifica em conjunto.
      É PROIBIDO aplicar a regra do "menor dos limites" ao PISO phi_t >=
      max(5 mm, phi/4): tomar o menor de dois pisos afrouxa a exigência, e é
      erro do lado INSEGURO.

  - id: REQ-PILARETE-09-cobrimento-proprio-e-a-incompatibilidade-com-Sapata
    texto: >-
      [rule: NBR6118-Tab7.2-nota-d-cobrimento-pilarete].
      O pilarete tem CAMPO DE COBRIMENTO PRÓPRIO, separado do da sapata:
      c_nom,pilarete = max(45 mm ; valor da Tabela 7.2 para a classe de
      agressividade na linha aplicável ; phi ; d_agregado/1,2). Medido à face
      externa do ESTRIBO (7.4.7.5).
      INCOMPATIBILIDADE REGISTRADA COM O CÓDIGO EXISTENTE, e a instrução é para
      NÃO consertá-la à força: `sapata_isolada/sapata.py::Sapata` recebe UM
      único `cobrimento` para a peça inteira (`__init__`, default 0,05 m), e
      esse número atravessa `ui/completo/formulario.py`, `modelo.py`,
      `projeto.py` (schema `.s7proj`), `relatorio.py`, `pranchas.py` e
      `visual3d.py`. O pilarete NÃO reusa esse campo e NÃO o altera nesta
      versão. Quando a integração pilarete<->sapata for feita (rodada própria),
      o campo novo entra como `cobrimento_pilarete` com default None e
      migração que preserva arquivos salvos — mudar o significado do campo
      existente invalidaria aprovações de A6/A7 sobre `ui/` sem necessidade.
      A redução de 5 mm por classe de resistência superior à mínima e a de
      7.4.7.4 (Delta_c = 5 mm, que exige ABNT NBR 9062, ausente do acervo) NÃO
      são implementadas.

  - id: REQ-PILARETE-10-emenda-por-traspasse-pilarete-sapata
    texto: >-
      [rule: NBR6118-9.5.2.3-traspasse-comprimidas],
      [rule: NBR6118-9.5.2.1-emenda-100-por-cento-comprimida],
      [rule: NBR6118-9.5.2.4.2-armadura-transversal-na-emenda].
      ell_0c = ell_b,nec >= max(0,6·ell_b ; 15·phi ; 200 mm), com
      ell_b = (phi/4)·(f_yd/f_bd) >= 25·phi, f_bd = eta_1·eta_2·eta_3·f_ctd
      (9.3.2.1, eta_2 DECLARADO por REQ-PILARETE-02-g) e alpha = 1,0 em
      ell_b,nec (barra comprimida não tem gancho nem barra transversal soldada).
      phi > 32 mm -> traspasse PROIBIDO (9.5.2): RECUSA.
      NÃO REUSAR `sapata.py::_ancoragem_pilar`. Aquela função calcula
      ANCORAGEM DENTRO DA SAPATA e usa `max(0,6·ell_b, 10 phi, 100 mm)`, que é
      um híbrido: o 0,6·ell_b vem do mínimo de EMENDA (9.5.2.3) e o 10 phi /
      100 mm vêm do mínimo de ANCORAGEM (9.4.2.5, que tem 0,3·ell_b). Não
      corresponde a nenhum dos dois itens. Conservador na primeira parcela, mas
      sem rastreabilidade — kb/pendencias.md > V12. O pilarete calcula ell_0c
      do seu próprio jeito, com [rule: ] correto.
      VERIFICAR A HIPÓTESE, não assumi-la: "armadura permanentemente
      comprimida" é o que autoriza 100 % das barras emendadas na mesma seção.
      Se QUALQUER combinação tracionar a armadura do pilarete, a autorização
      cai, passam a valer 9.5.2.2 e a Tabela 9.4 (não implementadas) e o
      software RECUSA.
      Armadura transversal da emenda: impor o TEXTO (estribo fechado, uma barra
      a 4·phi além de cada extremidade da emenda, concentração nos terços
      extremos) e NÃO dimensionar Soma A_st pelos valores que só existem na
      Figura 9.5 — não conferidos por leitura vetorial (V11). Remeter ao
      projetista com aviso no memorial.

  - id: REQ-PILARETE-11-junta-de-concretagem-tres-casos-e-duas-recusas
    revisado_na_v12: true
    decisao_humana: >-
      V13 RESPONDIDA PELO USUÁRIO EM 2026-09-03: RECUSAR, e não avisar. Razão
      dada: mais restritivo, mais seguro — a mesma doutrina já adotada no
      projeto de recusar em vez de aproximar quando não há fonte normativa de
      verificação no acervo. A v11 registrava AVISO OBRIGATÓRIO; esta versão
      substitui por RECUSA. kb/pendencias.md > V13, fechada.
    texto: >-
      [rule: NBR6118-21.6-junta-de-concretagem-pilarete-sapata].
      Enumeração fechada, sem default. O tipo de junta é ENTRADA OBRIGATÓRIA
      (REQ-PILARETE-02-e) e H (força horizontal na base do pilarete) também.
        MONOLITICO -> segue, sem exigência adicional de 21.6. Com H != 0 vale
          ainda REQ-PILARETE-16 (rotulagem do veredito por faixa de 14.4.1) e,
          na FAIXA A, a verificação de força cortante de REQ-PILARETE-18 — que
          na v13 deixou de ser lacuna e passou a ser cálculo. ATENÇÃO: são
          coisas DIFERENTES e é fácil confundi-las. 21.6 trata da JUNTA entre
          pilarete e sapata (transferência na interface); §17.4 trata do
          CORTANTE AO LONGO DA ALTURA do pilarete. Verificar §17.4 NÃO cobre a
          junta, e a recusa da junta aderente com H != 0 continua valendo
          integralmente — a NBR 9062 continua ausente do acervo.
        JUNTA_COM_ADERENCIA_DECLARADA e H == 0 -> segue. A declaração é
          DECLARADO_PELO_USUARIO, vai LITERAL no memorial junto com a exigência
          do 1º parágrafo de 21.6 (o projeto de execução deve indicar de forma
          precisa o local e a configuração da superfície da junta), e a espera
          dimensionada por 9.5.2.3 é a armadura que atravessa a junta.
        JUNTA_COM_ADERENCIA_DECLARADA e H != 0 -> RECUSA. É A MUDANÇA DA v12.
          Mensagem obrigatória, com estes elementos e nesta ordem: (i) o valor
          de H declarado; (ii) que a junta foi declarada aderente; (iii) que a
          NBR 6118:2023, item 21.6 (p. 181), trata a junta apenas por armadura
          de costura e NÃO fornece nenhum modelo de transferência de CORTANTE
          na interface — sem coeficiente de atrito, sem coesão, sem rugosidade
          em milímetros, sem taxa mínima; (iv) que a ABNT NBR 9062, que
          forneceria o modelo de cisalhamento-atrito, NÃO ESTÁ NO ACERVO; (v)
          que a alternativa é executar a ligação MONOLITICA. É PROIBIDO
          oferecer "prosseguir mesmo assim", caixa de confirmação, aviso no
          memorial em lugar da recusa, ou qualquer cálculo por Eurocódigo, ACI
          ou analogia com atrito-cisalhamento.
          SEM TOLERÂNCIA NUMÉRICA: o gatilho é H != 0 como DECLARADO. É PROIBIDO
          criar faixa de "H pequeno", "H desprezível" ou fração de N — não há
          base normativa nenhuma para o limiar, e inventá-lo seria exatamente o
          que a decisão do usuário recusou.
        JUNTA_SEM_ADERENCIA_ASSEGURADA -> RECUSA, com ou sem H. Mensagem: 21.6
          exige armadura de costura, a NBR 6118 não fornece modelo de
          cisalhamento na interface e a ABNT NBR 9062 NÃO ESTÁ NO ACERVO.
      TESTE OBRIGATÓRIO no GATE 3, porque recusa que não recusa é pior que
      recusa nenhuma: JUNTA_COM_ADERENCIA_DECLARADA com H = 0,001 kN tem de
      RECUSAR; com H = 0,0 tem de seguir. Testar em cima do zero.

  - id: REQ-PILARETE-12-memorial-e-o-que-ele-e-obrigado-a-dizer
    revisado_na_v12: true
    texto: >-
      O relatório do pilarete imprime, sem exceção: (a) os itens normativos de
      cada verificação com página; (b) M_1d,min das duas direções e a frase
      sobre compressão centrada não ser estado admissível, citando 16.3 p. 116;
      (c) lambda, lambda_1, i e ell_e por direção, com a vinculação DECLARADA;
      (d) N_Rd0 e nu = N_d/N_Rd0 rotulados como INFORMATIVOS; (e) gamma_c e
      gamma_s efetivamente usados e se a correção × 1,1 de 12.4.1 foi aplicada;
      (f) o tipo de junta, o valor de H e, no caso declarado, o texto da
      declaração; (g) as hipóteses declaradas: j >= 28 dias, eta_2 de aderência,
      cobrimento de 45 mm aplicado ao pilarete inteiro, M_1d,min substituindo as
      imperfeições locais fora de estrutura reticulada.
      ACRESCENTADO NA v12, junto com o veredito:
        (h) M_Rd,xx e M_Rd,yy com o N_Sd para o qual foram calculados, a
            profundidade de linha neutra x de cada um e o DOMÍNIO em que cada
            um caiu (nomeado conforme a Figura 17.1; é para nomear o domínio,
            e só para isso, que eps_yd = f_yd/E_s é usado);
        (i) os dois índices de verificação, com a fórmula ao lado: o do par
            solicitante real e o da inclusão da envoltória mínima;
        (j) a declaração, literal, de que a Norma escreve "= 1" em 17.2.5 e que
            o uso como "<= 1" é interpretação declarada
            [deriv: DER-NBR6118-17.2.5-criterio-menor-ou-igual-a-1];
        (k) o alpha usado (1,0) COM a frase de que 17.2.5 autorizaria 1,2 para
            seção retangular, seguido do valor que o índice teria com 1,2,
            rotulado "informativo — não usado no veredito";
        (l) SUBSTITUÍDO NA v13 — a frase da v12 ("ELU de força cortante NÃO
            verificado, fora do escopo desta versão") era verdadeira enquanto
            §17.4 não existia no ruleset e passou a ser FALSA na FAIXA A.
            Vale agora a rotulagem por faixa de REQ-PILARETE-16.
      ACRESCENTADO NA v13, junto com o ELU de força cortante:
        (m) a razão de 14.4.1 (ell/máx(b,h)), o limite 3,0 e a FAIXA
            resultante, SEMPRE e nas duas faixas, com o mesmo destaque de
            lambda e lambda_1 — e a advertência de que as duas verificações são
            independentes;
        (n) na FAIXA A: o MODELO declarado (I ou II) e, se II, o theta
            declarado, com a frase de que a escolha do modelo e de theta é do
            PROJETISTA e que este software não a faz nem a otimiza; V_Sd,
            V_Rd2, V_c0 (e V_c1 no Modelo II), M_0, a razão M_0/M_Sd,máx
            adotada e qual das duas fibras a governou, V_c, V_sw, V_Rd3, o
            ESTADO da seção que escolheu o ramo de V_c, e se o teto de 2·V_c0
            (ou 2·V_c1) governou;
        (o) na FAIXA A: os DOIS valores de normal lado a lado — N_d e
            N_(gamma_f=1,0) — com a frase literal de que a Norma manda calcular
            a tensão que M_0 anula com gamma_f = 1,0 e que M_Sd,máx é de
            cálculo; e, quando N_(gamma_f=1,0) não foi declarado, a frase de que
            a majoração de V_c NÃO foi aplicada;
        (p) na FAIXA A: a declaração de que "f_ctk" de 17.4.1.1.2-c) foi lido
            como f_ctk,inf (a Norma escreve o símbolo sem sufixo e 8.2.5 só
            define inf e sup), e de que "predominantemente à compressão" não é
            quantificado pela Norma;
        (q) na FAIXA A: as duas ausências deliberadas — reduções de V_Sd junto
            aos apoios (17.4.1.2.1) e decalagem (17.4.2.2-c) NÃO aplicadas, com
            o motivo;
        (r) na FAIXA A: para cada teto e cada piso de detalhamento, o valor de
            CADA fonte (18.4.3 e 18.3.3.2) e o adotado, com o item que governou;
        (s) na FAIXA B: as duas frases obrigatórias de REQ-PILARETE-16-(e), e a
            declaração de que §17.2 é aplicado por interpretação declarada.
      O VEREDITO PASSA A SER PERMITIDO, com o nome exato e nunca outro, e o
      nome DEPENDE DA FAIXA (REQ-PILARETE-16):
        FAIXA A: "ELU de solicitações NORMAIS (NBR 6118:2023, 17.2.1) e ELU de
                  FORÇA CORTANTE (NBR 6118:2023, 17.4.2.1): ATENDIDO /
                  NÃO ATENDIDO";
        FAIXA B: "ELU de solicitações NORMAIS (NBR 6118:2023, 17.2.1):
                  ATENDIDO / NÃO ATENDIDO", com os avisos de 14.4.1.
      CONTINUA PROIBIDO o memorial emitir "APROVADO"/"OK" global, "pilarete
      verificado", cor verde de peça inteira ou qualquer formulação que um
      leitor apressado leia como aprovação do elemento. Mesmo na FAIXA A, o que
      foi verificado é o ELU de solicitações normais, o ELU de força cortante e
      o detalhamento — e NÃO o ELS, nem a fadiga, nem a torção (§17.5, não
      extraída), nem a ligação com a sapata além da emenda por traspasse.

  - id: REQ-PILARETE-13-testes-sem-exemplo-de-terceiros
    texto: >-
      ACHADO QUE MUDA A ESTRATÉGIA DE TESTE, e ele vem da busca negativa do a1,
      reconferida pelo a2: NÃO HÁ UM ÚNICO EXEMPLO RESOLVIDO DE PILARETE em
      toda a bibliografia do acervo — Bastos ("pilarete": 0 ocorrências;
      "esbeltez": 0) e Cintra/Aoki/Albiero tratam o pilar só como condição de
      contorno da sapata. O GATE 3 NÃO terá conferência numérica de terceiros.
      Isso não bloqueia o GATE 1, mas obriga o A5 a entregar, e o A7 a exigir:
        (1) INVARIÂNCIA: sob M_1d,min apenas, lambda_1 = 35 EXATAMENTE, para
            h de 0,14 m a 2,00 m e para qualquer N_d (o N_d cancela). Testar a
            faixa inteira, não um ponto.
        (2) FRONTEIRA ESTRITA: lambda == lambda_1 NÃO dispensa a 2ª ordem —
            teste em cima do valor.
        (3) FRONTEIRAS DURAS de 13.2.3: b = 13,9 cm recusa; b = 19×18 cm (A_c =
            342 cm²) recusa mesmo com b >= 14 cm; b = 14,0 cm aceita com
            gamma_n = 1,25.
        (4) MUTAÇÃO: remover eta_c do cálculo de sigma_c deve QUEBRAR um teste
            com f_ck = 45 MPa (e não pode quebrar nenhum com f_ck = 25 MPa —
            é assim que se prova que o teste testa o que diz testar).
        (5) FÍSICA: N_Rd0 monótono crescente em A_s e em f_ck; ell_0c monótono
            crescente em phi e decrescente em f_ck; lambda cresce com ell.
        (6) CONTRA-PROVA PARCIAL DISPONÍVEL, e é o único ponto com valor
            externo: ell_b/phi = 37,7 para C25/CA-50 boa aderência sem gancho,
            contra o valor de tabela clássico de 38·phi; e sigma_s2 = 420 MPa
            para CA-50 em eps_c2 = 2 ‰. Usar como fixtures, declarando que a
            referência é tabela consagrada e não fonte do acervo.
      ACRESCENTADO NA v12 — a envoltória agrava a lacuna de validação, porque a
      busca negativa do a1 (reconferida pelo a2) mostrou que NÃO HÁ NO ACERVO um
      único exemplo resolvido de seção de pilar sob N + Mx + My. O "Exemplo 4 —
      Sapata Isolada Sob Flexão Oblíqua" de Bastos NÃO serve: é problema
      GEOTÉCNICO de pressões na base (e_x = M_x/N, tensões nos quatro vértices,
      tombamento), não dimensiona seção nenhuma. Testes obrigatórios adicionais,
      todos de propriedade interna:
        (7) DEGENERAÇÃO NA RETA b: a varredura com x -> infinito tem de
            reproduzir N_Rd0 da forma fechada já aprovada, dentro do critério de
            convergência declarado. É a única verificação cruzada forte
            disponível — dois caminhos independentes, um numérico e um
            algébrico. Medido pelo a2: 0,000 % de diferença com 4000 faixas.
        (8) DEGENERAÇÃO UNIAXIAL: com M_Sd,y = 0 a verificação oblíqua tem de
            dar exatamente a normal em torno de x, e vice-versa.
        (9) ORDENAÇÃO DOS CRITÉRIOS: canto >= indice(alpha=1) >= indice(alpha
            =1,2), sempre. Se a implementação inverter, há erro de expoente ou
            de sinal. (Consequência de t^1,2 <= t em [0,1]; verificado pelo a2
            em 20.000 pares, zero violações.)
        (10) FORMA FECHADA CONTRA VARREDURA: o índice de inclusão por
            sqrt((p/M_Rd,xx)² + (q/M_Rd,yy)²) tem de coincidir com o máximo
            numérico da interação alpha = 1 sobre a elipse. Conferido pelo a2 em
            6 casas decimais, em seção quadrada e em 20×40.
        (11) SEÇÃO NÃO QUADRADA OBRIGATÓRIA em pelo menos um caso: 20×40 cm,
            N_d = 800 kN -> M_Rd,xx = 91,41 e M_Rd,yy = 37,05 kN·m,
            M_1d,min,xx = 21,60 (usa h) e M_1d,min,yy = 16,80 kN·m (usa b),
            índice = 0,5114. Trocando h por b nos semieixos o índice vai a
            0,6113. EM SEÇÃO QUADRADA ESSA TROCA É INVISÍVEL — um conjunto de
            testes só com 30×30 não prova nada sobre o cruzamento de eixos.
        (12) MUTAÇÃO DA RAIZ: remover a raiz quadrada do índice de inclusão tem
            de QUEBRAR um teste. Sem raiz o valor cai de 0,5307 para 0,2817 no
            caso do sanity check — lado inseguro, e invisível ao pint.
        (13) MUTAÇÃO DO EXPOENTE: trocar 2 (elipse mínima) por 1,2 (interação),
            ou por 1,5 (o alpha de 17.3.1, mesma página 125), tem de quebrar
            testes DIFERENTES — é assim que se prova que os dois expoentes são
            objetos distintos no código.
        (14) FÍSICA DA CURVA N-M: M_Rd tem de subir e depois descer quando N
            cresce de 0 a N_Rd0 (bojo da flexão composta balanceada), e valer
            zero em N_Rd0. Uma curva monótona é sinal de defeito. Valores do
            a2 para 30×30/C25/CA-50/4 phi 16: 39,05 (N=0), 78,70 (N=500),
            63,95 (N=1000), 32,21 kN·m (N=1400).
        (15) RECUSA POR FALTA DE EQUILÍBRIO: N_Sd > N_Rd0 tem de RECUSAR com
            mensagem, nunca devolver o último valor da iteração.
      NENHUM DESTES SUBSTITUI CONFERÊNCIA DE TERCEIRO. Continua registrado como
      LACUNA DE VALIDAÇÃO de GATE 3 (kb/exemplos.yaml >
      BUSCA-NEG-exemplo-pilar-flexao-composta-obliqua): o a7 NÃO pode declarar
      confiança ALTA nesta feature com base só em propriedade interna, e o
      caminho para fechá-la é um caso resolvido por engenheiro humano. Isto NÃO
      bloqueia o GATE 1.

  - id: REQ-PILARETE-14-proibicao-de-mistura-de-metodo-e-de-majoracao-por-vento
    texto: >-
      COLISÃO DE MÉTODO DE SEGURANÇA (cascata do a2, item 3), e esta versão é a
      primeira em que ela fica perigosa de verdade, porque passam a coexistir um
      bloco `admissivel` (geotécnico, característico + FS global) e um bloco
      inteiramente `calculo` (pilarete, gamma_f/gamma_m):
        (a) A API do pilarete aceita SOMENTE valores de cálculo (N_d, M_d), e o
            parâmetro carrega o metadado do método, como já se faz em
            REQ-SIGMA-01/02. Receber valor característico é ERRO EXPLÍCITO, não
            conversão automática: o software NÃO multiplica por 1,4 sozinho.
        (b) É PROIBIDO comparar qualquer grandeza do pilarete com tensão
            admissível do solo, e é PROIBIDO alimentar o pilarete com o N que
            foi usado na verificação geotécnica de ELS.
        (c) MAJORAÇÃO POR VENTO: as regras NBR 6122 §6.3.2 (15 %/30 %) e §6.3.3
            (10 %) são EXCLUSIVAS da tensão do SOLO e NÃO TÊM NENHUMA aplicação
            ao pilarete. É PROIBIDO majorar N_Rd0, f_cd, f_yd ou qualquer
            resistência de concreto/aço por vento. A ação do vento entra no
            pilarete pelos coeficientes de combinação da NBR 8681/NBR 6118
            §11, do lado das AÇÕES, e só. Encontrar em `estrutural/` qualquer
            referência a 6.3.2/6.3.3 é veto do a6.

  - id: REQ-PILARETE-15-veredito-de-ELU-de-solicitacoes-normais
    criado_na_v12: true
    texto: >-
      É O REQUISITO QUE SUBSTITUI A RECUSA DE VEREDITO DA v11. A v11 só podia
      REJEITAR (N_Rd0 como limite superior); esta versão fecha o critério de
      APROVAÇÃO. Regras e derivações que o sustentam:
      [rule: NBR6118-17.2.1-envoltoria-criterio-de-seguranca],
      [rule: NBR6118-17.2.5-flexao-composta-obliqua],
      [rule: NBR6118-11.3.3.4.3-fig11.3-envoltoria-minima-1a-ordem],
      [rule: NBR6118-17.2.2-fig17.1-limites-dos-dominios],
      [rule: NBR6118-8.2.10.1-diagrama-idealizado-do-concreto],
      [rule: NBR6118-8.3.5-8.3.6-aco-passivo],
      [rule: NBR6118-17.2.4.1-concentracao-de-armaduras] (citado para dizer que
      NÃO é usado),
      [deriv: DER-NBR6118-17.2.2-MRd-varredura],
      [deriv: DER-NBR6118-8.3.6-sigma-s-ate-10-por-mil],
      [deriv: DER-NBR6118-17.2.5-criterio-menor-ou-igual-a-1],
      [deriv: DER-NBR6118-11.3.3.4.3-inclusao-de-envoltorias],
      [deriv: DER-NBR6118-NRd0-compressao-centrada] (guarda e verificação
      cruzada).
      SEQUÊNCIA OBRIGATÓRIA, e cada passo tem seu motivo de recusa próprio:
        (1) PRÉ-CONDIÇÕES. Só entra aqui quem já passou por REQ-PILARETE-03
            (seção retangular, limites de 13.2.3), -05 (pilar curto, lambda <
            lambda_1 estrito), -06-D (j >= 28 dias) e -11 (junta). Falhou
            qualquer um: RECUSA antes de calcular envoltória nenhuma. O critério
            elíptico da Figura 11.3 e o alpha = 1,2 de 17.2.5 são AMBOS
            condicionados a seção retangular — sem essa guarda, os dois caem.
        (2) GUARDA DE N. Se N_Sd > N_Rd0: RECUSA, citando
            [deriv: DER-NBR6118-NRd0-compressao-centrada] e os dois valores.
            Não existe equilíbrio a procurar.
        (3) VARREDURA, UMA POR EIXO PRINCIPAL. Calcular M_Rd,xx (flexão no
            plano de h) e M_Rd,yy (flexão no plano de b), AMBOS para
            N_Rd = N_Sd, por DER-NBR6118-17.2.2-MRd-varredura: perfis de
            deformação pivotando nos polos A (10 ‰), B (eps_cu) e C
            (eps_c2, a (eps_cu-eps_c2)h/eps_cu da borda comprimida) da Figura
            17.1; sigma_c pela parábola-retângulo de 8.2.10.1 integrada sobre a
            área comprimida (tração do concreto desprezada, 17.2.2-d); sigma_s
            camada a camada, sem agrupar no centroide; momentos tomados no
            CENTROIDE da seção bruta. É PROIBIDO misturar a parábola-retângulo
            com o bloco retangular simplificado de 17.2.2-e no mesmo cálculo.
            Se |eps_s| > 10 ‰ em qualquer camada: RECUSA (fora do domínio
            aprovado da derivação do aço).
            Se a raiz de N_Rd(x) = N_Sd não estiver colchetada: RECUSA. É
            PROIBIDO devolver o valor do último passo da iteração.
        (4) VERIFICAÇÃO A — PAR SOLICITANTE REAL (17.2.1 + 17.2.5):
              I_A = (|M_Sd,x|/M_Rd,xx)^alpha + (|M_Sd,y|/M_Rd,yy)^alpha <= 1,
            com alpha = 1,0. M_Sd,x e M_Sd,y são os momentos de cálculo REAIS na
            base do pilarete, na combinação considerada.
        (5) VERIFICAÇÃO B — INCLUSÃO DA ENVOLTÓRIA MÍNIMA (11.3.3.4.3):
              I_B = sqrt( (M_1d,min,xx/M_Rd,xx)² + (M_1d,min,yy/M_Rd,yy)² ) <= 1,
            forma fechada EXATA do máximo da interação alpha = 1 sobre a elipse
            (Cauchy-Schwarz). É PROIBIDO omitir a raiz — lado inseguro,
            invisível à checagem dimensional. É PROIBIDO usar esta forma fechada
            com alpha != 1.
        (6) VEREDITO = A **e** B. As duas são necessárias e nenhuma implica a
            outra: A cobre o esforço real, B cobre o momento mínimo que a Norma
            impõe independentemente do carregamento. Aprovar com uma só é
            defeito com veto do a6.
        (7) ATALHO PERMITIDO, COM DIREÇÃO ÚNICA. O teste do CANTO —
            (max(|M_Sd,x|, M_1d,min,xx)/M_Rd,xx) + (max(|M_Sd,y|,
            M_1d,min,yy)/M_Rd,yy) <= 1 — implica (4) e (5) simultaneamente,
            porque o retângulo contém a elipse e o conjunto resistente de
            17.2.5 com alpha >= 1 é convexo. Ele PODE ser usado para aprovar
            direto. NÃO PODE, em nenhuma hipótese, reprovar: falhando o canto,
            o código É OBRIGADO a calcular (4) e (5). O canto é 41 % mais severo
            que a Norma no caso do sanity check (48,00 contra 33,94 kN·m de
            M_R exigido) e reprovar por ele seria substituir o critério escrito
            na Figura 11.3 por outro, mais duro, inventado aqui.
        (8) SIMETRIA. A redução aos valores absolutos em (4) pressupõe arranjo
            de armadura simétrico nos dois eixos. O código VERIFICA a simetria
            do arranjo; se não for simétrico, avalia os quatro quadrantes com
            os sinais, ou RECUSA. É PROIBIDO assumir simetria.
        (9) alpha = 1,2 é calculado e EXIBIDO como informativo
            (REQ-PILARETE-12-k) e é PROIBIDO que ele decida o veredito nesta
            versão — ver NBR6118-17.2.5-flexao-composta-obliqua,
            `nao_autorizado` (1), e kb/pendencias.md > V18.
      NOME DO VEREDITO: "ELU de solicitações NORMAIS: ATENDIDO / NÃO ATENDIDO".
      Nunca "pilarete OK". Ver REQ-PILARETE-12 e REQ-PILARETE-16.

  - id: REQ-PILARETE-16-escopo-do-veredito-e-o-cortante-nao-verificado
    criado_na_v12: true
    reescrito_na_v13: true
    prioridade: ALTA
    nota_de_id: >-
      O id ficou VENCIDO e foi mantido DE PROPÓSITO, pela mesma razão registrada
      em REQ-PILARETE-06: identificador citado em relatórios, em kb/ e nos
      requisitos vizinhos (-11 e -12) é estável, e renomeá-lo quebraria
      rastreabilidade para economizar uma palavra. Leia-se o sufixo
      "e-o-cortante-nao-verificado" como histórico: na v12 este requisito
      existia porque §17.4 NÃO TINHA SIDO EXTRAÍDO e o veredito precisava de
      rotulagem estrita. A v13 extraiu, conferiu e aprovou §17.4 — a rotulagem
      deixa de ser tapa-buraco de escopo e passa a ser a expressão de uma
      FRONTEIRA NORMATIVA REAL (14.4.1). O título corrente do requisito é
      "escopo do veredito e as duas faixas de 14.4.1".
    texto: >-
      [deriv: DER-NBR6118-14.4.1-faixa-B-recusa-do-cortante].
      O QUE CAI DA v12, e é preciso dizer explicitamente porque é uma proibição
      que some:
        • Cai a alínea (d) da v12 ("é PROIBIDO a `estrutural/` conter qualquer
          expressão de V_Rd, V_Sd, V_c, V_sw ou tau_wd"). Ela existia porque
          §17.4 não tinha regra aprovada; agora tem. `estrutural/` PASSA A
          PODER conter V_Rd2, V_Rd3, V_c, V_c0, V_c1, V_sw e V_Sd, cada um com
          `[rule: ]` para a regra correspondente da v13.
        • `tau_wd` CONTINUA PROIBIDO: é símbolo da NBR 6118:2014, não existe na
          edição de 2023, e não há regra aprovada que o sustente.
        • Cai a frase obrigatória "ELU de força cortante (17.4) NÃO verificado —
          fora do escopo desta versão", que passa a ser FALSA na FAIXA A.
      O QUE PASSA A VALER — DUAS FAIXAS, decididas pela guarda de
      REQ-PILARETE-17:
        FAIXA A (razao_14_4_1 >= 3,0, e demais guardas satisfeitas):
          (a) O veredito se chama, em todo lugar (API, relatório, tela):
              "ELU de solicitações NORMAIS (NBR 6118:2023, 17.2.1) e ELU de
              FORÇA CORTANTE (NBR 6118:2023, 17.4.2.1): ATENDIDO" ou
              "NÃO ATENDIDO". Nenhum atalho para "ELU", "resistência do
              pilarete" ou "pilarete OK".
          (b) O veredito é a CONJUNÇÃO dos dois: REQ-PILARETE-15 (N+M) E
              REQ-PILARETE-18 (V). Falhar em qualquer um reprova.
          (c) O memorial continua dizendo, sempre, o que NÃO foi verificado:
              ELS, fadiga, torção (§17.5), e a ligação com a sapata além da
              emenda por traspasse. A lista encolheu — não desapareceu.
        FAIXA B (razao_14_4_1 < 3,0):
          (d) O veredito volta a se chamar EXATAMENTE "ELU de solicitações
              NORMAIS (NBR 6118:2023, 17.2.1): ATENDIDO / NÃO ATENDIDO", como
              na v12, e é PROIBIDA qualquer formulação que contenha "ELU" sem o
              qualificador "de solicitações NORMAIS".
          (e) O memorial traz, SEMPRE e não só quando H != 0, DUAS frases, com
              estes elementos: (i) "Este pilarete NÃO satisfaz a definição de
              elemento linear da NBR 6118:2023, 14.4.1 (p. 83): a razão
              comprimento/maior dimensão da seção é <razão>, abaixo do mínimo
              de 3,0 (seriam necessários <3·máx(b,h)> m)."; (ii) "Por esse
              motivo o ELU de força cortante NÃO FOI VERIFICADO. A Seção 17.4
              da NBR 6118:2023 aplica-se a elementos lineares e exclui
              expressamente elementos de volume, vigas-parede e consolos
              curtos; a Seção 22 (elementos especiais) não trata pilarete,
              pedestal nem pilar curto de fundação. Não há, na Norma, rota
              alternativa para este caso — o cortante é responsabilidade do
              engenheiro, por modelo de bielas e tirantes ou outro caminho,
              fora deste software."
          (f) Quando H != 0 as duas frases são REPETIDAS junto ao valor de H,
              com o valor.
          (g) A verificação de §17.2 continua sendo feita, e o memorial declara
              que ela é aplicada com base na remissão nominal a "pilares" de
              17.2.1 e na natureza de SEÇÃO da verificação — INTERPRETAÇÃO
              declarada [deriv: DER-NBR6118-14.4.1-faixa-B-recusa-do-cortante].
      EM AMBAS AS FAIXAS:
        (h) A razão obtida e o limite 3,0 vão ao memorial, com o número.
        (i) A FAIXA é campo próprio do valor de retorno da API (enumeração
            fechada), não apenas texto. Um consumidor programático tem de poder
            distinguir sem interpretar string.
        (j) CONTINUA PROIBIDO emitir "APROVADO"/"OK" global, "pilarete
            verificado", cor verde de peça inteira ou qualquer formulação que um
            leitor apressado leia como aprovação do elemento.
      ARMADILHA DE LEITURA, mantida da v12 e AGORA COM A OUTRA METADE: na v12 o
      risco era concluir, dos estribos de 18.4.3, que o cortante estava coberto
      (não estava). Na v13 o risco é o simétrico e maior: concluir que, porque
      §17.4 foi implementado, ele se aplica sempre. NÃO SE APLICA — a FAIXA B é
      comum, e a `checagem_numerica` de
      NBR6118-14.4.1-elemento-linear-classificacao mostra que, no caso
      engastado-livre sob M_1d,mín, seções com h/b >= 1,684 NUNCA entram na
      FAIXA A.

  - id: REQ-PILARETE-17-guarda-de-elemento-linear-14.4.1
    criado_na_v13: true
    prioridade: ALTA
    texto: >-
      [rule: NBR6118-14.4.1-elemento-linear-classificacao],
      [rule: NBR6118-17.4.1-campo-de-aplicacao-do-cortante],
      [deriv: DER-NBR6118-14.4.1-faixa-B-recusa-do-cortante].
      GUARDA NOVA, que NENHUMA regra da v11 nem da v12 fazia. Ela é
      determinística, barata e decide se metade da feature existe.
      SEQUÊNCIA OBRIGATÓRIA:
        (1) `razao_14_4_1 = ell / max(b_secao, h_secao)`, com `ell` o
            COMPRIMENTO LONGITUDINAL REAL do pilarete (o mesmo `ell` de
            REQ-PILARETE-02-a). É PROIBIDO usar `ell_e` aqui — no caso
            ENGASTADO_BASE_LIVRE_TOPO ell_e = 2·ell e a razão DOBRA. Nome
            obrigatório do parâmetro: `ell` (nunca `ell_e`, nunca `L`), e o
            teste de mutação que troca um pelo outro tem de quebrar
            (REQ-PILARETE-19).
        (2) Classificar: `razao_14_4_1 >= 3,0` -> FAIXA_A_ELEMENTO_LINEAR;
            caso contrário -> FAIXA_B_FORA_DE_14_4_1. Enumeração fechada,
            exposta no retorno da API.
        (3) FAIXA B: a função de verificação de cortante LEVANTA EXCEÇÃO
            (`RecusaForaDeDominio`) com a mensagem de REQ-PILARETE-16-(e). NÃO
            devolve None, NÃO devolve zero, NÃO devolve "não aplicável" como se
            fosse resultado. É PROIBIDO qualquer parâmetro, flag, variável de
            ambiente ou caixa de diálogo que permita prosseguir.
        (4) FAIXA B: a verificação de REQ-PILARETE-15 (N+M) SEGUE normalmente e
            o veredito é o escopado de REQ-PILARETE-16-(d).
        (5) A ordem importa: esta guarda roda DEPOIS de REQ-PILARETE-03
            (geometria) e -05 (pilar curto) e ANTES de qualquer expressão de
            §17.4. Um V_Rd2 calculado antes de a faixa ser conhecida é defeito
            com veto do a6, mesmo que o valor nunca chegue à tela.
      ESTA VERIFICAÇÃO É DIFERENTE DE lambda <= lambda_1, E A CONFUSÃO É O ERRO
      MAIS PROVÁVEL AQUI. 15.8.2 decide se os efeitos locais de 2ª ordem podem
      ser dispensados; 14.4.1 decide a CLASSE do elemento. As duas são
      independentes e o software as verifica SEPARADAMENTE, imprimindo os dois
      resultados. A geometria 30×30 com ell = 0,80 m passa em uma e reprova na
      outra.
      FRONTEIRA QUANTIFICADA, e ela precisa estar na documentação da feature
      porque muda o que o usuário deve esperar: com
      ENGASTADO_BASE_LIVRE_TOPO (ell_e = 2·ell) e sob M_1d,mín (lambda_1 = 35,
      já provado em REQ-PILARETE-13(1)), as duas fronteiras só coexistem se
      h_máx/b_mín < 1,684, e então só na janela 3·h_máx <= ell < 5,052·b_mín.
      Seção 30×30: janela [0,90; 1,515) m. Seção 25×40: [1,20; 1,263) m —
      6 cm. Seção 20×40: VAZIA. Com M real > M_1d,mín, lambda_1 sobe e a janela
      alarga; com VINCULADO_DOIS_EXTREMOS ela alarga muito mais.
      A UI (a3) exibe a razão e a faixa junto de lambda e lambda_1, com o mesmo
      destaque — não em nota de rodapé.

  - id: REQ-PILARETE-18-verificacao-de-forca-cortante
    criado_na_v13: true
    prioridade: ALTA
    texto: >-
      [rule: NBR6118-17.4.2.1-duas-condicoes-simultaneas-do-ELU-de-cortante],
      [rule: NBR6118-17.4.2.2-modelo-I-VRd2-Vsw-Vc],
      [rule: NBR6118-17.4.2.3-modelo-II-theta-arbitrado],
      [rule: NBR6118-17.4.1.1.1-armadura-transversal-minima-por-resistencia],
      [rule: NBR6118-17.4.1.1.2-c-excecao-dos-pilares-e-o-f-ctk-sem-sufixo],
      [rule: NBR6118-17.4.1.1.5-17.4.1.1.6-intervalo-de-alpha-e-remissao-a-secao-18],
      [rule: NBR6118-18.3.3.2-detalhamento-do-estribo-por-cortante],
      [rule: NBR6118-17.4.1.2.1-reducoes-junto-aos-apoios] (REJEITADA — citada
      para dizer que NÃO é usada),
      [rule: NBR6118-17.4.2.2-c-17.4.2.3-c-decalagem] (REJEITADA — idem),
      [deriv: DER-NBR6118-17.4.2.2-M0-nivel-de-carregamento],
      [deriv: DER-NBR6118-17.4.2.2-W1-fibra-mais-tracionada],
      [deriv: DER-NBR6118-17.4.2.3-Vc1-interpolacao-linear],
      [deriv: DER-NBR6118-composicao-18.3.3.2-com-18.4.3].

      ENTRADAS NOVAS E OBRIGATÓRIAS, todas sem default silencioso, todas com
      RECUSA nomeando o campo e o item quando faltarem (acrescentam-se às de
      REQ-PILARETE-02):
        (i) H_x e H_y — as duas componentes da força horizontal de CÁLCULO na
            base do pilarete, em eixos da seção. Já eram exigidas por
            REQ-PILARETE-11 como um H escalar; passam a ser DUAS componentes
            declaradas, porque a decisão de recusar o cortante biaxial depende
            de saber que são duas.
        (j) MODELO_DE_CALCULO — enumeração fechada {MODELO_I, MODELO_II}. É
            ESCOLHA DO PROJETISTA e a Norma não escolhe. Sem declaração:
            RECUSA. É PROIBIDO default, é PROIBIDO "tentar os dois", é PROIBIDO
            adotar o que aprova.
        (k) theta — SÓ quando MODELO_II, no intervalo 30° <= theta <= 45°
            (17.4.2.3). Fora do intervalo: RECUSA citando o item. Ausente com
            MODELO_II declarado: RECUSA. É PROIBIDO otimizar, varrer ou inferir
            theta; encontrar em `estrutural/` qualquer laço sobre theta é VETO
            do a6. Mesma doutrina já aplicada a ell_e.
        (l) alpha_estribo — inclinação da armadura transversal. A Norma admite
            45° <= alpha <= 90°; ESTA VERSÃO só aceita 90° e RECUSA o resto
            citando o ESCOPO desta versão, nunca a Norma (motivo em
            NBR6118-17.4.1.1.5-...: alpha = 90° é o lado conservador em V_sw, é
            o que 18.4.3 detalha para pilar, e o caminho com sen/cos != trivial
            ficaria sem validação). A expressão geral é implementada INTEIRA.
        (m) N_gamma_f_1 — a força normal da combinação com gamma_f = 1,0, para
            o numerador de M_0. Campo PRÓPRIO. Sem ele o software NÃO majora
            V_c (V_c = V_c0 / V_c1). É PROIBIDO obtê-lo dividindo N_d por
            gamma_f suposto [deriv:
            DER-NBR6118-17.4.2.2-M0-nivel-de-carregamento].
        (n) A_sw e s do estribo adotado (ou o par que o software propõe, se
            houver dimensionamento) — a verificação é de um estribo CONCRETO,
            não de uma área abstrata.

      SEQUÊNCIA OBRIGATÓRIA, e cada passo tem seu motivo de recusa próprio:
        (1) PRÉ-CONDIÇÕES. Só entra aqui quem já passou por REQ-PILARETE-03,
            -05, -06-D, -11 e -17 (FAIXA A). Falhou qualquer um: RECUSA antes de
            calcular V_Rd nenhum.
        (2) GUARDA DE CORTANTE BIAXIAL. Se H_x != 0 E H_y != 0: RECUSA. §17.4 é
            escrito para UM V_Sd atuando no plano de b_w·d, e a Norma NÃO
            fornece regra de interação entre duas cortantes — o contraste com
            17.2.5, que fornece a interação para os MOMENTOS oblíquos, é
            evidência de que a omissão não é descuido. É PROIBIDO compor
            sqrt(V_x² + V_y²), somar linearmente, ou verificar cada direção
            isoladamente como se fossem independentes. Mensagem citando 17.4.2.1
            e 17.2.5 (o que existe para momento e não existe para cortante).
            SEM TOLERÂNCIA NUMÉRICA: o gatilho é "as duas componentes
            declaradas não nulas", pelo mesmo motivo de REQ-PILARETE-11 — não há
            base normativa para um limiar de "H_y desprezível" e inventá-lo
            seria exatamente o que esta doutrina recusa.
        (3) PLANO DE VERIFICAÇÃO. Com cortante uniaxial, o plano é o de atuação
            de V_Sd. Nele, `b_w` é a dimensão PERPENDICULAR ao plano de V_Sd e
            `d` é a altura útil MEDIDA NO plano de V_Sd. A troca dos dois passa
            por toda a checagem dimensional e muda V_Rd2 e V_c0 na mesma
            proporção — teste obrigatório em seção NÃO quadrada
            (REQ-PILARETE-19).
        (4) CLASSIFICAÇÃO DO ESTADO, antes de escolher o ramo de V_c:
            tracionado com LN fora da seção -> V_c = 0;
            flexão simples ou flexo-tração com LN cortando a seção -> V_c = V_c0
            (Modelo I) ou V_c1 (Modelo II);
            flexo-compressão -> V_c = V_c0·(1 + M_0/M_Sd,máx) <= 2·V_c0 (ou com
            V_c1 e teto 2·V_c1 no Modelo II).
            O estado é IMPRESSO no memorial. Aplicar a majoração fora da
            flexo-compressão é defeito com veto.
        (5) M_0 = N_gamma_f_1 · W_1/A_c, com W_1 escolhido por
            [deriv: DER-NBR6118-17.4.2.2-W1-fibra-mais-tracionada]: calcular
            r_x e r_y emparelhados POR PLANO e adotar o MENOR. Sem
            N_gamma_f_1 declarado, não majora.
        (6) V_Rd2 pelo modelo declarado; V_sw pelo modelo declarado; V_c1 por
            [deriv: DER-NBR6118-17.4.2.3-Vc1-interpolacao-linear] quando
            MODELO_II.
        (7) VEREDITO DE CORTANTE = (V_Sd <= V_Rd2) **e** (V_Sd <= V_c + V_sw).
            As duas, sempre. Aprovar com uma só é defeito com veto do a6.
        (8) ARMADURA MÍNIMA. Verificar rho_sw >= 0,2·f_ct,m/f_ywk de
            17.4.1.1.1, SALVO se a exceção de 17.4.1.1.2-c) for atendida — e
            atendê-la exige as DUAS condições simultâneas, com f_ctk,inf
            (decisão V20(1)) e com a seção em ESTÁDIO I. Mesmo dentro da
            exceção, os mínimos da Seção 18 continuam valendo INTEGRALMENTE.
        (9) DETALHAMENTO COMPOSTO por
            [deriv: DER-NBR6118-composicao-18.3.3.2-com-18.4.3]: TETOS pelo
            MENOR, PISOS pelo MAIOR. É PROIBIDO aplicar "o menor dos limites" a
            um piso. Inclui a exigência nova da Emenda 1:2026
            (phi_long >= phi_t nas barras de canto), que junto com o
            phi_t >= phi/4 de 18.4.3 encaixota phi/4 <= phi_t <= phi.
        (10) O QUE NÃO SE FAZ, e é deliberado: NÃO se aplicam as reduções de
            V_Sd junto aos apoios (17.4.1.2.1, regra REJEITADA — reduziriam a
            solicitação fora de domínio) e NÃO se calcula decalagem
            (17.4.2.2-c/17.4.2.3-c, regra REJEITADA — o pilarete não tem banzo
            tracionado de vão). As duas ausências vão ao memorial como
            deliberadas.
      INTERAÇÃO N-V — É EXATAMENTE UMA, E SÓ ELA: a majoração de V_c do passo
      (4). Não há nenhum efeito de N sobre V_Rd2 (a biela). É PROIBIDO
      introduzir qualquer outra interação N-V por analogia com outra norma, e é
      PROIBIDO transportar para cá a dispensa de interação da PUNÇÃO
      (19.5.2.7), que diz o oposto e vale para laje.
      NAMESPACE: ver REQ-PILARETE-01, bloco acrescentado na v13.

  - id: REQ-PILARETE-19-testes-do-cortante-sem-exemplo-de-terceiros-para-pilar
    criado_na_v13: true
    texto: >-
      COMPLEMENTA REQ-PILARETE-13 e não o substitui. A situação de validação
      MELHOROU em relação à v12 — pela primeira vez neste backlog há contraprova
      de terceiros —, mas ela é PARCIAL e o a7 precisa saber exatamente o que
      ela cobre.
      O QUE TEM CONTRAPROVA EXTERNA (BASTOS, Sapatas.pdf, FONTE SECUNDÁRIA,
      reproduzida pelo a2 a partir das expressões literais da Norma, sem olhar a
      tabela — quatro coincidências independentes):
        (a) V_Rd2 do Modelo I: 0,35487 contra 0,35·b_w·d da Tabela A-4 (C20);
        (b) a expressão de A_sw: 2,5543 e 0,16938 contra 2,55 e 0,17;
        (c) V_Sd,mín: 0,10093 contra 0,101·b_w·d — e este ÚNICO número amarra
            simultaneamente rho_sw,mín de 17.4.1.1.1, V_c0 de 17.4.2.2 e o teto
            de 435 MPa de f_ywd. É a melhor fixture do acervo;
        (d) a FORMA do V_Rd2 do Modelo II: 0,70974 contra 0,71·b_w·d·sen·cos.
      O QUE NÃO TEM CONTRAPROVA EXTERNA NENHUMA, e são justamente as três coisas
      novas: (i) a majoração V_c = V_c0(1 + M_0/M_Sd,máx) da FLEXO-COMPRESSÃO;
      (ii) o Modelo II com theta arbitrado em serviço; (iii) a exceção de
      17.4.1.1.2-c) para pilares. O a7 NÃO pode declarar confiança ALTA nessas
      três com base só em propriedade interna — kb/pendencias.md > V22.
      TESTES DE PROPRIEDADE OBRIGATÓRIOS, todos internos:
        (1) FRONTEIRA ENTRE MODELOS: em theta = 45° e alpha = 90°,
            V_Rd2(II) == V_Rd2(I) EXATAMENTE, e V_sw(II) == V_sw(I). Medido:
            diferença 0,0 kN.
        (2) NÃO-FRONTEIRA, e este é o teste que uma leitura apressada erra: nas
            MESMAS condições V_Rd3(II) != V_Rd3(I), porque V_c1 <= V_c0 sempre
            que V_Sd > V_c0. Medido na geometria A com V_Sd = 120 kN: V_c1 =
            46,25 contra V_c0 = 59,33 kN. Um teste que exija igualdade de V_Rd3
            está ERRADO e vai quebrar uma implementação correta.
        (3) TETO DE V_c: com M_Sd,máx -> 0 o valor tem de travar em exatamente
            2·V_c0 (ou 2·V_c1). Mutação que remova o teto TEM de quebrar.
        (4) DISCRIMINANTE DE V20(2), OBRIGATÓRIO: o caso A1 (30×30,
            M_Sd,máx = 24 kN·m) MASCARA a decisão — as duas leituras estouram o
            teto e dão 118,7 kN. Só o caso A2 (M_Sd,máx = 60 kN·m) discrimina:
            94,63 contra 108,77 kN. Um conjunto de testes só com A1 não prova
            nada sobre M_0.
        (5) DISCRIMINANTE DE V20(3), OBRIGATÓRIO E EM SEÇÃO NÃO QUADRADA:
            geometria C (25×40, ell = 1,25 m), N_(gf=1) = 857 kN, M_Sd,x = 90 e
            M_Sd,y = 70 kN·m -> V_c = 103,7 kN pela fibra conservadora contra
            112,3 kN pela outra (8,3 %). Em 30×30 a diferença é ZERO.
        (6) MUTAÇÃO DE 14.4.1: trocar `ell` por `ell_e` na razão tem de QUEBRAR
            um teste. O caso que pega é a geometria B (30×30, ell = 0,80 m):
            razão 2,667 -> FAIXA B; com ell_e daria 5,333 -> FAIXA A. Um
            conjunto de testes só com ell >= 1,50 m não pega.
        (7) FAIXA B RECUSA DE VERDADE: geometria B tem de levantar exceção na
            verificação de cortante E emitir veredito escopado em §17.2. Testar
            EM CIMA da fronteira: razão = 3,000 exata segue (FAIXA A);
            razão = 2,999 recusa.
        (8) MUTAÇÃO DE sen²theta: trocar sen²(theta) por sen(theta) tem de
            quebrar o teste (1) — em theta = 45° leva o coeficiente de 0,27 a
            0,382, +41 %.
        (9) MUTAÇÃO DE PLANO: trocar b_w por d (ou o plano de V_Sd) tem de
            quebrar um teste em seção NÃO quadrada. Em 30×30 é invisível.
        (10) DEGENERAÇÃO DE V_c1: nos extremos, V_Sd = V_c0 -> V_c1 = V_c0 e
            V_Sd = V_Rd2 -> V_c1 = 0, exatamente.
        (11) FÍSICA DE theta: theta menor tem de AUMENTAR V_sw e DIMINUIR
            V_Rd2, monotonamente em [30°, 45°]. Medido: 30° dá V_Rd2 = 289,7 kN
            e V_sw = 54,72 kN contra 334,6 e 31,59 kN em 45°.
        (12) COMPOSIÇÃO DE DETALHAMENTO: numa geometria em que 18.3.3.2 governa
            (a geometria A: 154,2 mm contra 192,0 mm de 18.4.3), o valor adotado
            tem de ser 154,2 mm. E a mutação que aplica "o menor dos limites" ao
            PISO de phi_t tem de quebrar.
        (13) RECUSA DE CORTANTE BIAXIAL: H_x = 10 kN e H_y = 0,001 kN tem de
            RECUSAR; H_y = 0,0 tem de seguir. Testar em cima do zero, como já se
            faz em REQ-PILARETE-11.
        (14) RECUSA POR MODELO NÃO DECLARADO e por theta fora de [30°, 45°], com
            mensagem que cite o item.
        (15) TETO DE f_ywd: um caso com CA-60 tem de usar 435 MPa e não
            521,7 MPa. Mutação que remova o teto tem de quebrar esse caso e NÃO
            pode quebrar nenhum caso em CA-50 — é assim que se prova que o teste
            testa o que diz testar. (CA-60 continua RECUSADO como armadura
            LONGITUDINAL por REQ-PILARETE-08; este teste é sobre a armadura
            TRANSVERSAL e pode ser feito em nível de função.)
      REPRODUZIR O CASO DO BASTOS (viga, flexão simples, Modelo I) como fixture
      de integração é OBRIGATÓRIO, com duas ressalvas escritas no teste: é VIGA
      e não pilar, e o autor arredonda 0,35487 para 0,35 — o que põe o caso a
      0,1 kN da fronteira dos 0,67·V_Rd2. Com o valor exato da Norma a folga
      passa a 8,1 kN e o ramo é o mesmo, mas o caso é frágil por construção e
      NÃO deve ser usado como teste de fronteira.

  - id: REQ-ETA-C-01-eta-c-ausente-no-motor-amplo-lado-inseguro
    prioridade: ALTA
    lado: INSEGURO
    texto: >-
      NÃO É REQUISITO DO PILARETE. É defeito PREEXISTENTE em
      `calc_core/sapata_isolada/`, encontrado por esta rodada porque foi ela que
      extraiu 8.2.10.1 pela primeira vez, e despachado ao a5 por ser matéria
      estrutural.
      O QUE A NORMA DIZ (conferido por leitura visual da p. impressa 121 pelo
      a2, item 17.2.2, alínea e): a tensão constante do diagrama retangular é
      "alpha_c·eta_c·f_cd", com eta_c definido em 8.2.10.1 — eta_c = 1,0 para
      f_ck <= 40 MPa e eta_c = (40/f_ck)^(1/3) acima.
      O QUE O CÓDIGO FAZ: `materiais.py::Concreto.alpha_c` devolve 0,85 (ou
      0,85·[1-(f_ck-50)/200]) e eta_c NÃO EXISTE em `calc_core/`. O consumidor é
      `sapata.py::_armadura_flexao_simples`, que monta
      `A = alpha_c·f_cd·b_w·lambda`. Como `Concreto.__post_init__` aceita f_ck
      até 90 MPa, o bloco comprimido fica superestimado em 1/eta_c para
      f_ck > 40: +4,0 % (C45), +7,7 % (C50), +14,5 % (C60), +31,0 % (C90).
      IMPACTO MEDIDO, executando a própria fórmula do código: em seção pouco
      armada o déficit de A_s é < 1 % (M_d = 300 kN·m/m, d = 0,45 m: 15,60
      contra 15,69 cm²/m em C90); em seção próxima do limite de dutilidade o
      déficit chega a 9,0 % de A_s A MENOS, e x/d sai 0,486 contra 0,700
      corretos — a verificação `x/d <= csi_limite` PASSA quando deveria
      REPROVAR. Lado inseguro nos dois efeitos.
      O QUE FAZER: acrescentar `Concreto.eta_c` com [rule:
      NBR6118-8.2.10.1-diagrama-idealizado-do-concreto] e multiplicá-lo onde
      alpha_c é usado no diagrama retangular. NÃO mexer em `bielas.py:102`
      (`0,85·alpha_v2·f_cd`) nesta rodada: é outro item (nós de bielas e
      tirantes), não extraído, e mudar por analogia seria o erro que este
      pipeline existe para impedir.
      CONSEQUÊNCIA DE PROCESSO, explícita porque é obrigatória: este conserto
      TOCA `sapata_isolada/materiais.py` e `sapata_isolada/sapata.py` e portanto
      INVALIDA as aprovações de A6 (GATE 2) e A7 (GATE 3) para a superfície de
      flexão da sapata — nova rodada de a6 e a7 sobre ela antes de release.
      Enquanto não for feito, a interface deve avisar que o motor amplo não é
      confiável para f_ck > 40 MPa em flexão. kb/pendencias.md > V15.

requisitos_para_a3:
  - id: REQ-UI-SIGMA-01-rotulo-de-ELU
    texto: >-
      Espelho de REQ-SIGMA-09 na interface. O número devolvido pelos caminhos
      da v9 NÃO pode aparecer na tela rotulado como "tensão admissível". Rótulo
      permanente, legível, ao lado do valor e repetido no memorial: "parcela de
      ELU da tensão admissível (NBR 6122:2022 §7.3) — §7.4 (ELS/recalque) NÃO
      verificado". Sem sigla, sem asterisco de rodapé — mesmo padrão de
      REQ-UI-01.

  - id: REQ-UI-SIGMA-02-rotulo-nao-normativo-da-formulacao
    texto: >-
      As fórmulas da v9 são de FONTE SECUNDÁRIA NÃO NORMATIVA. Rótulo visível
      junto ao resultado e no memorial: "Formulação de CINTRA, AOKI e ALBIERO,
      'Fundações Diretas: Projeto Geotécnico', Oficina de Textos, 2011 — fonte
      bibliográfica, NÃO normativa. A NBR 6122:2022 autoriza o procedimento
      (§7.3.2 / §7.3.3) mas não prescreve a fórmula." O memorial cita
      `[pratica: <id>]`, nunca `[rule: <id>]`, para tudo que venha desta fonte.
      Acrescentar, para as correlações semiempíricas, a advertência que a
      própria fonte publica (Mello, 1975, p. 61) sobre "formulários de bolso".

  - id: REQ-UI-SIGMA-03-avisar-recusa-de-dominio
    texto: >-
      Quando a4 RECUSAR uma entrada por estar fora do domínio (REQ-SIGMA-04 e
      REQ-SIGMA-07), a UI tem de dizer O QUÊ e POR QUÊ, não "erro de cálculo":
      nome do parâmetro, valor informado, intervalo declarado pela fonte e o
      fato de que é limite DA FONTE e não do software. Exemplo de redação:
      "N_SPT = 25 fora do domínio declarado (5 a 20) da regra sigma_a = N/50.
      A fonte não autoriza a fórmula fora dessa faixa — escolha outro método ou
      informe outro N_SPT." Recusa silenciosa, valor clampado ou resultado
      aproximado são PROIBIDOS: o usuário tem de saber que o método não se
      aplica ao caso dele.
      Distinguir na tela o que é limite DECLARADO EM TEXTO na fonte (5-20 da
      regra N/50) do que é limite ADOTADO PELO a2 a partir da extensão de uma
      figura (1-3 m e 4-25 de Teixeira) — os dois recusam, mas têm força
      diferente e o segundo é revisável por decisão humana.

  - id: REQ-UI-SIGMA-04-gamma-efetivo-e-dois-campos
    texto: >-
      gamma é ENTRADA, nunca derivado de tabela (FB-CINTRA-2.9.3-pesos-
      especificos, REJEITADA). DOIS campos separados, porque a fonte avisa que
      gamma acima e abaixo da cota da base podem diferir sob o mesmo símbolo. E
      a interface tem de dizer, com todas as letras, que abaixo do nível d'água
      o valor pedido é o peso específico EFETIVO (submerso, tipicamente
      9-11 kN/m³), não o saturado (19-21 kN/m³). Motivo, e é grave: a própria
      fonte se contradiz nesse ponto (impressa 46), e aplicar 19-21 kN/m³ como
      efetivo abaixo do N.A. erra gamma por um fator de ~2, SEMPRE DO LADO
      INSEGURO.
      PROIBIDO exibir classificação de solo ("areia medianamente compacta",
      "argila rija") como se fosse resultado de cálculo: as faixas de N_SPT vêm
      da ABNT NBR 6484/2001 por citação secundária, e essa norma está AUSENTE
      do acervo.

  - id: REQ-UI-SIGMA-05-vento-explicito-e-nunca-automatico
    texto: >-
      Espelho de REQ-SIGMA-10. As três entradas de vento são controles
      explícitos, com default que NÃO majora, e a tela deve deixar claro que a
      Norma dá um TETO ("em até 15 %"), não um valor a aplicar. Se o usuário
      marcar "vento é ação variável principal", a UI deve dizer que quem define
      isso é a ABNT NBR 8681 e vem da análise estrutural — o software não
      verifica. A lista dos sete tipos de obra é apresentada como lista fechada,
      por seleção, nunca como texto livre. Exibir o FSg efetivo resultante
      (FSg/(1+k_v)) ao lado, para que a guarda do piso de 1,6 seja visível
      quando bindar.

  - id: REQ-UI-SIGMA-06-declaracao-regional-e-de-escopo
    texto: >-
      Espelho de REQ-SIGMA-06. Caixa de declaração, sem default afirmativo, e o
      texto tem de aparecer no memorial junto com o valor. Acrescentar o aviso
      de escopo desta versão: sapata isolada, carga CENTRADA, solo HOMOGÊNEO. O
      caminho teórico recusa perfil estratificado (item 2.5 da fonte não
      extraído) e nenhum caminho da v9 trata excentricidade — a regra de área
      efetiva de Meyerhof está em kb mas NÃO foi aprovada.


  # ===========================================================================
  # REQ-UI-CAMADA-01 a 07 — VERSÃO 10. Camada única de dados: phi'/c'/gamma na
  # base derivados da camada em h_f (backlog #12).
  #
  # PROBLEMA: `ui/completo/formulario.py::_secao_solo` pede o MESMO dado
  # geotécnico duas vezes e sem ligação nenhuma entre as duas — nos campos
  # soltos `v_gamma_solo`/`v_phi_solo`/`v_coesao` (linhas 325-327) e dentro da
  # `Camada` que contém a cota h_f, no "Perfil em camadas". Quem preenche o
  # perfil digita de novo, à mão, o que já digitou; e nada impede que os dois
  # lados divirjam depois.
  #
  # NENHUMA CONTA NOVA. Tudo o que estes sete requisitos mandam exibir sai de
  # `PerfilGeotecnico.camada_em(z)` (geotecnia.py:117-123), `Camada.gamma
  # (abaixo_na)` (:66-67), `Camada.phi` e `Camada.coesao`. CLAUDE.md regra 4
  # continua valendo sem atenuação: a tela LÊ, não calcula, e não pode conter
  # aritmética própria sobre esses valores (nem soma de espessuras para achar
  # a camada — `camada_em` já faz isso).
  #
  # NOMES FIXADOS PELO a2, e são normativos para esta rodada, para que o teste
  # automatizado e o a6 tenham alvo determinístico (foi a falta disso que
  # custou rodadas no GATE 2 de sigma_adm):
  #   `PainelEntrada.ultima_derivacao_de_camada: dict | None`  (atributo de
  #       CLASSE com default None, como `ultimo_sigma_adm_calculado`
  #       (formulario.py:581), para que `getattr` antes da construção seja
  #       seguro). Chaves: `nome_camada`, `hf`, `abaixo_na`, `gamma`, `phi`,
  #       `coesao`, `extrapolada`.
  #   `PainelEntrada._preenchendo_solo_derivado: bool`   (guard de escrita)
  #   `PainelEntrada._carregando_solo: bool`             (guard de carregamento)
  #   `PainelEntrada.lbl_solo_derivado: ttk.Label`       (rótulo)
  #   `PainelEntrada._atualizar_rotulo_solo_derivado()`  (único ponto de rótulo)
  #   `PainelEntrada._derivar_solo_da_camada()`          (única derivação)
  #   `PainelEntrada._ao_editar_solo_derivado(*args)`    (trace de invalidação)
  # ===========================================================================

  - id: REQ-UI-CAMADA-01-gatilho-e-fonte-da-derivacao
    texto: >-
      Existindo perfil em camadas, os três campos soltos "γ_solo [kN/m³]",
      "φ' na base [graus]" e "c' na base [kPa]" passam a ser PREENCHIDOS a
      partir da camada vigente na cota de assentamento, em vez de digitados de
      novo. A derivação é `camada = PerfilGeotecnico(camadas=self._camadas,
      nivel_agua=<N.A. atual>).camada_em(<h_f atual>)` e escreve
      `camada.gamma(abaixo_na)` em `v_gamma_solo`, `camada.phi` em
      `v_phi_solo` e `camada.coesao` em `v_coesao`, com
      `abaixo_na = <N.A.> is not None and <h_f> > <N.A.>`. Nenhuma conversão de
      unidade: `Camada.phi` já é grau e `Camada.coesao` já é kPa, exatamente as
      unidades dos rótulos da tela.
      PREENCHE, NUNCA TRAVA — herdado de REQ-UI-SIGMA e do texto que já está
      fixo na tela (NBR 6122:2022 §7.2, formulario.py:330-336): os três campos
      continuam `ttk.Entry` editáveis, sem `state="readonly"`, sem
      `state="disabled"`, sem validador que recuse o valor digitado. O
      engenheiro sobrescreve quando quiser, e é ele quem assina a ART.
      GATILHOS, lista FECHADA — só ação interativa do usuário sobre o perfil ou
      sobre as duas cotas que definem qual camada vale: `_adicionar_camada`,
      `_editar_camada`, `_remover_camada` (os três já existentes) e trace de
      escrita em `v_hf` e em `v_nivel_agua`. Nada mais dispara derivação; em
      particular NÃO dispara em `ler_solo`, `ler_perfil`, dimensionamento,
      exportação ou repintura de tela.
      ONDE O GANCHO NÃO PODE FICAR, e é a armadilha desta tarefa:
      `_atualizar_tree_camadas` é chamada pelos três pontos de edição de camada
      MAS TAMBÉM por `preencher_solo` (formulario.py:646). Pendurar a derivação
      nela viola REQ-UI-CAMADA-04 em silêncio. O gancho vai nos três métodos de
      edição, depois do `_atualizar_tree_camadas` de cada um.
      DESEMPATES, decididos aqui para não sobrarem para o código: (a) h_f
      exatamente sobre uma interface pertence à camada DE BAIXO — é a convenção
      que `camada_em` já implementa (`z0 <= z < z1`) e é a fisicamente certa,
      porque a sapata se apoia sobre o que está abaixo da sua base; (b) h_f
      exatamente igual ao N.A. conta como ACIMA (`abaixo_na = False`, portanto
      `gamma_nat`), por ser `>` estrito.
      LEITURA DOS DOIS NÚMEROS DE ENTRADA: h_f e N.A. são lidos com os MESMOS
      auxiliares que `ler_solo`/`ler_perfil` usam (`_float`/`_float_opt`,
      incluindo a normalização de vírgula decimal), nunca com `float()` cru —
      senão a tela pode derivar de uma cota e o núcleo calcular com outra.
      ESCRITA DOS TRÊS NÚMEROS DE SAÍDA: `f"{valor:.10g}"`, exatamente o
      formato que todos os `preencher_*` e `_abrir_calculadora_sigma_adm` já
      usam (formulario.py:414, 639-642). Não é preferência estética: é o que
      garante que 34.0 vire "34" e não "34.00", que o valor derivado seja
      textualmente indistinguível de um digitado à mão, e que os critérios de
      aceite abaixo sejam comparações exatas de string.
    criterio_de_aceite:
      - >-
        Perfil [Camada("Aterro", 1.0, phi=28, coesao=5, gamma_nat=17,
        gamma_sat=19), Camada("Areia", 2.0, phi=34, coesao=0, gamma_nat=18,
        gamma_sat=20)], N.A. vazio, h_f = 1,50: adicionar a segunda camada pela
        UI deixa v_phi_solo == "34", v_coesao == "0" e v_gamma_solo == "18".
      - >-
        Mesmo perfil com N.A. = 1,20 e h_f = 1,50: v_gamma_solo == "20"
        (gamma_sat, `abaixo_na` verdadeiro).
      - >-
        h_f = 1,00 (exatamente a interface) deriva da camada "Areia", não da
        "Aterro"; h_f = 1,20 com N.A. = 1,20 deriva gamma_nat = 18, não 20.
      - >-
        Editar a camada que contém h_f (`_editar_camada`) atualiza os três
        campos; editar uma camada que NÃO contém h_f também roda a derivação e
        os três campos permanecem coerentes com a camada em h_f.
      - >-
        Digitar "1,80" (vírgula) em v_hf deriva da mesma camada que "1.80".
      - >-
        Busca textual em `ui/` não encontra soma de espessuras, `limites()`,
        `float()` cru sobre esses campos nem qualquer aritmética sobre gamma /
        phi / coesao fora das chamadas ao núcleo (CLAUDE.md regra 4).

  - id: REQ-UI-CAMADA-02-guardas-de-recusa-e-extrapolacao-nunca-silenciosa
    texto: >-
      A derivação RECUSA-SE a agir, sem exceção, sem diálogo modal e sem tocar
      nos três campos, em qualquer destes casos: (a) `self._camadas` vazia —
      não há perfil, os campos continuam sendo entrada manual pura, como hoje;
      (b) o texto de `v_hf` está em branco ou não é número (o trace dispara a
      CADA tecla: "1", "1.", "1.e" são estados normais de digitação e não podem
      levantar exceção nem abrir `messagebox`); (c) o texto de `v_nivel_agua`
      não é número (em branco É válido e significa N.A. ausente); (d) h_f <= 0.
      POR QUE (d) É OBRIGATÓRIO, e não é zelo: `camada_em(-1.0)` devolve a
      camada MAIS PROFUNDA do perfil (verificado por execução pelo a2 —
      geotecnia.py:121-122 tem `if self.camadas: return self.camadas[-1]` como
      saída final). Sem a guarda, uma cota negativa digitada por engano
      preencheria os três campos com a camada de fundo e ainda a rotularia como
      derivada.
      POR QUE (b) NÃO DERIVA COM O DEFAULT: `ler_solo` faz `_float(self.v_hf.
      get(), 1.5)`, isto é, campo em branco vira 1,5 m para o núcleo em
      silêncio. Esse comportamento é PRÉ-EXISTENTE e esta versão não o altera
      (REQ-UI-CAMADA-07), mas a derivação não pode se apoiar nele: derivar de
      um 1,5 m que o usuário não digitou seria inventar proveniência.
      EXTRAPOLAÇÃO ABAIXO DO PERFIL — deriva, mas JAMAIS em silêncio. Quando
      h_f > `perfil.profundidade_total`, `camada_em` devolve a última camada
      sem avisar (verificado: perfil de 3,00 m, `camada_em(10.0)` devolve a
      camada de fundo). Nesse caso a derivação acontece (o dado é do próprio
      usuário e é sempre sobrescrevível) mas `ultima_derivacao_de_camada
      ["extrapolada"]` é `True` e o rótulo de REQ-UI-CAMADA-03 tem de dizer, em
      texto, que h_f está ABAIXO da base do perfil e informar a profundidade
      total. Mesma doutrina de REQ-UI-SIGMA-03: extrapolação silenciosa,
      clamp e valor aproximado sem aviso são PROIBIDOS.
    criterio_de_aceite:
      - >-
        Sem camadas: escrever "2.0" em v_hf não altera nenhum dos três campos e
        `ultima_derivacao_de_camada is None`.
      - >-
        Com perfil válido, escrever "abc", "" ou "1.e" em v_hf: nenhuma
        exceção propaga, nenhum `messagebox` é aberto, os três campos ficam
        como estavam.
      - >-
        h_f = "-1" ou "0": nenhuma derivação; em particular v_phi_solo NÃO
        recebe o phi da camada mais profunda.
      - >-
        Perfil de 3,00 m e h_f = 4,00: os três campos são preenchidos com a
        camada de fundo, `ultima_derivacao_de_camada["extrapolada"] is True` e
        `lbl_solo_derivado.cget("text")` contém a profundidade total do perfil
        e a informação de que h_f está abaixo dela.
      - >-
        N.A. com texto inválido ("x"): sem derivação, sem exceção.

  - id: REQ-UI-CAMADA-03-proveniencia-conjunta-e-invalidacao-pelos-tres
    texto: >-
      Mesma arquitetura de `ultimo_sigma_adm_calculado` /
      `_ao_editar_sigma_adm` / `_preenchendo_sigma_adm_calculado`
      (formulario.py:320, 403-447) — não outra. Reaproveitar, não reinventar:
      guard de flag ligado ANTES dos `.set()` programáticos e desligado em
      `finally`, trace de escrita que invalida em qualquer outra edição, e uma
      ÚNICA função de rótulo chamada dos dois pontos (o que preenche e o que
      invalida), para que rótulo e estado nunca saiam de sincronia.
      OS TRÊS SÃO UM CONJUNTO, e esta é a decisão que fecha a ambiguidade:
      edição manual de QUALQUER um dos três (`v_gamma_solo`, `v_phi_solo`,
      `v_coesao`) invalida a proveniência dos TRÊS ao mesmo tempo —
      `ultima_derivacao_de_camada = None` e rótulo vazio. Deixar phi'/c' ainda
      marcados como "derivados" porque só gamma foi tocado criaria um estado
      ambíguo PIOR que a duplicação de hoje: o rótulo afirmaria uma origem
      comum que já não existe.
      O RÓTULO: `ttk.Label` discreta ao lado dos três campos, mesmo padrão
      visual de `lbl_sigma_adm_elu` (`style="PainelFraco.TLabel"`, `wraplength`,
      `justify="left"`), atualizada SÓ por `_atualizar_rotulo_solo_derivado()`.
      Dois estados, e apenas dois: (i) proveniência válida — texto que contém
      obrigatoriamente o radical "derivad", o NOME da camada exatamente como
      está em `Camada.nome`, e o valor de h_f usado; (ii) proveniência inválida
      — string VAZIA. Nunca um terceiro estado.
      VAZIO MESMO QUE OS NÚMEROS COINCIDAM: se o engenheiro apagar e redigitar
      à mão o mesmo "34" que a derivação havia posto, a proveniência morre
      assim mesmo. O rótulo afirma DE ONDE veio, não QUANTO vale; um "derivado"
      que sobrevive à digitação manual é falso ainda que o número bata.
      O guard `_preenchendo_solo_derivado` existe exatamente para o
      preenchimento programático não se autoinvalidar nos três `.set()` — os
      três ficam DENTRO do mesmo `try/finally`, e `ultima_derivacao_de_camada`
      só é gravado DEPOIS de os três terem sido escritos.
    criterio_de_aceite:
      - >-
        Após uma derivação bem-sucedida, `ultima_derivacao_de_camada` é um
        dict com as sete chaves e `lbl_solo_derivado.cget("text")` contém o
        nome da camada e o h_f usado.
      - >-
        `painel.v_phi_solo.set("31")` (edição manual simulada) zera
        `ultima_derivacao_de_camada` E esvazia o rótulo; idem para
        `v_gamma_solo` e para `v_coesao`, um teste por campo.
      - >-
        Redigitar no campo exatamente o mesmo texto que a derivação escreveu
        também invalida (rótulo vazio).
      - >-
        A derivação NÃO se autoinvalida: logo após `_derivar_solo_da_camada()`,
        `ultima_derivacao_de_camada is not None`.
      - >-
        `_preenchendo_solo_derivado` volta a `False` mesmo se um `.set()`
        levantar exceção (bloco `finally`).

  - id: REQ-UI-CAMADA-04-preencher-solo-nao-deriva-e-a-assimetria-do-guard
    texto: >-
      `preencher_solo()` — caminho de "Abrir projeto..." (`app.py:359`) — NÃO
      dispara derivação, mesmo quando o `Solo` carregado traz `perfil` com
      camadas. RAZÃO REGISTRADA, para que ninguém "conserte" isso depois: um
      projeto salvo já tem valores EXPLÍCITOS gravados para `gamma_solo`,
      `phi` e `coesao` (`ui/completo/projeto.py:366`), possivelmente diferentes
      da camada em h_f DE PROPÓSITO — o engenheiro pode tê-los sobrescrito à
      mão antes de salvar, e a NBR 6122:2022 §7.2 lhe dá esse direito. Repor os
      três exatamente como vieram do arquivo, sem reinterpretar, é o mesmo
      princípio que já rege `preencher_casos`: dado explícito de arquivo
      carregado não é substituído por reinterpretação silenciosa.
      ASSIMETRIA DO GUARD, e errar o sinal aqui produz exatamente o defeito que
      a MÉDIA #4 do GATE 2 do sigma_adm criou: `_carregando_solo` suprime a
      DERIVAÇÃO e NUNCA suprime a INVALIDAÇÃO. Depois de `preencher_solo`, os
      três campos são valores de arquivo, portanto NÃO são derivados:
      `ultima_derivacao_de_camada` tem de terminar `None` e o rótulo vazio. É o
      mesmo desfecho que `_ao_editar_sigma_adm` já produz para sigma_adm nessa
      função, e pela mesma razão.
      POR QUE O GUARD É INDISPENSÁVEL (não basta "não chamar a derivação"):
      `preencher_solo` escreve `v_hf` na linha 639 e `v_nivel_agua` na 648, e
      os traces de REQ-UI-CAMADA-01 disparariam nas duas. Pior, a ordem torna
      isso ativamente errado: `self._camadas` só é substituída na linha 645 —
      um trace disparado pela linha 639 leria as camadas do projeto ANTERIOR e
      derivaria da estratigrafia errada. O guard cobre o corpo INTEIRO de
      `preencher_solo`, em `try/finally`.
      DEPOIS DE CARREGADO, TUDO VOLTA AO NORMAL: a primeira edição interativa
      de camada, de h_f ou do N.A. deriva como sempre e o rótulo reaparece.
    criterio_de_aceite:
      - >-
        `preencher_solo(Solo(sigma_adm=250, gamma_solo=15, hf=1.5, phi=22,
        coesao=7, perfil=<perfil cuja camada em 1,5 m tem phi=34, coesao=0,
        gamma=20>))` deixa v_gamma_solo == "15", v_phi_solo == "22" e
        v_coesao == "7" — os valores do arquivo, NÃO os da camada.
      - >-
        Após essa chamada, `ultima_derivacao_de_camada is None` e
        `lbl_solo_derivado.cget("text") == ""`.
      - >-
        Teste de ordem: carregar um projeto A (perfil A) e em seguida um
        projeto B (perfil B) não deixa nenhum dos três campos com valor da
        estratigrafia de A.
      - >-
        Depois do carregamento, escrever "1.8" em v_hf deriva normalmente do
        perfil recém-carregado e o rótulo volta a aparecer.
      - >-
        `_carregando_solo` volta a `False` mesmo se `preencher_solo` levantar
        exceção no meio.

  - id: REQ-UI-CAMADA-05-gamma-solo-tem-dois-papeis-e-o-aviso-e-obrigatorio
    texto: >-
      ACHADO DO a2 (C2 do cabeçalho da v10), e é o ponto de segurança desta
      rodada. `gamma_solo` não tem UM significado no núcleo, tem dois, e qual
      deles vale depende de haver perfil:
      (i) COM perfil, `Solo.sobrecarga_no_nivel_da_base()` devolve
      `perfil.tensao_vertical_efetiva(hf)` e NÃO usa `gamma_solo`
      (geotecnia.py:360-364); `gamma_solo` sobra apenas no peso do solo sobre a
      sapata, `self.solo.gamma_solo * g["v_solo"]` (sapata.py:366), onde o que
      se quer é peso TOTAL. É por isso, e SÓ nessa condição, que derivar
      `Camada.gamma(abaixo_na)` — que devolve `gamma_sat`, peso saturado total
      — é defensável.
      (ii) SEM perfil, `gamma_solo * hf` PASSA A SER a sobrecarga efetiva na
      cota da base. Um `gamma_sat` deixado ali pela derivação superestima q.
      Medido pelo a2 no perfil de referência (N.A. = 1,20 m, h_f = 1,50 m):
      correto 23,66 kPa, derivado 30,0 kPa, +27 %, DO LADO INSEGURO — q maior
      significa capacidade de carga maior — e a distorção cresce até o fator
      ~2 de V7 conforme o N.A. sobe.
      EXIGÊNCIA 1 — TRANSIÇÃO PARA PERFIL VAZIO. Quando `_remover_camada`
      esvaziar `self._camadas` (última camada removida) estando a proveniência
      válida, a proveniência é invalidada E a tela exibe aviso explícito de que
      γ_solo mudou de papel: sem perfil ele passa a valer como sobrecarga na
      cota da base e, abaixo do N.A., o valor a informar é o EFETIVO
      (tipicamente 9-11 kN/m³), não o saturado (19-21) — mesmíssima redação já
      exigida por REQ-UI-SIGMA-04 e pela pendência V7. O aviso é passivo
      (rótulo/linha de texto), nunca um `messagebox` que exija clique, e NUNCA
      altera o número: quem decide é o engenheiro.
      EXIGÊNCIA 2 — HONESTIDADE DO RÓTULO. Quando a derivação usar
      `abaixo_na = True`, o texto de REQ-UI-CAMADA-03 tem de dizer que o γ
      derivado é o SATURADO (total) da camada. Proibido o rótulo sugerir que o
      software escolheu por conta própria entre saturado, efetivo e natural: o
      valor foi lido da camada que o próprio usuário cadastrou.
      EXIGÊNCIA 3 — LIMITE DA APROXIMAÇÃO, dito e não escondido. O solo apoiado
      sobre a sapata vai de h_f até a superfície e pode atravessar o N.A. e
      várias camadas; um único γ não representa isso exatamente. O rótulo diz
      "derivado da camada X em h_f", que é verdade, e não pode afirmar mais do
      que isso (nada de "peso do maciço sobrejacente" ou equivalente).
      ESTE REQUISITO ESTÁ AMARRADO A UMA PENDÊNCIA HUMANA. A pergunta de fundo
      — qual peso específico o núcleo deve usar no solo sobre a sapata abaixo
      do N.A., dado que `_peso_proprio` alimenta também as verificações de
      deslizamento e tombamento, onde peso maior é FAVORÁVEL e portanto
      superestimá-lo é inseguro — é julgamento de engenharia e o a2 não a
      decide. Está em kb/pendencias.md como V8 (filha de V7, PRIORIDADE ALTA,
      lado inseguro). Enquanto V8 não for resolvida por decisão humana
      registrada, os avisos das Exigências 1 e 2 são OBRIGATÓRIOS e o a6 os
      trata como veto se ausentes.
    criterio_de_aceite:
      - >-
        Derivação com `abaixo_na = True`: `lbl_solo_derivado.cget("text")`
        contém a informação de que o γ exibido é o saturado/total da camada.
      - >-
        Remover a última camada com proveniência válida:
        `ultima_derivacao_de_camada is None` e há na tela texto visível dizendo
        que γ_solo passa a valer como sobrecarga na cota da base e que abaixo
        do N.A. o valor pedido é o efetivo, não o saturado.
      - >-
        Essa remoção NÃO altera o número em `v_gamma_solo` (o software avisa,
        não corrige) e NÃO abre `messagebox` modal.
      - >-
        Nenhum texto da tela chama o γ derivado de peso do maciço
        sobrejacente, peso médio ou equivalente.

  - id: REQ-UI-CAMADA-06-importacao-de-perfil-por-excel-nao-e-carregamento-de-arquivo
    texto: >-
      CORREÇÃO DE PREMISSA FEITA PELO a2 (C3 do cabeçalho da v10). "Importar do
      Excel..." NÃO é, neste ponto, um carregamento de arquivo como "Abrir
      projeto...", e tratá-lo como tal reintroduz o defeito que o item #12
      existe para eliminar. `ui/completo/app.py:513` faz
      `preencher_solo(replace(solo_atual, perfil=perfil))` com
      `solo_atual = self.formulario.ler_solo()` (app.py:442) — os três valores
      NÃO vêm da planilha (`excel_import.importar_perfil_geotecnico` devolve só
      o perfil): são sobra da TELA, casados com um perfil novo e possivelmente
      de outra obra. REQ-UI-CAMADA-04 continua valendo para `preencher_solo`,
      que permanece um setter burro; a decisão é do CHAMADOR.
      REGRA, com dois ramos determinísticos, avaliada no ramo `else` de sucesso
      da importação do perfil (app.py:512-515). O estado da proveniência é
      capturado ANTES de chamar `preencher_solo` (que o zera):
      RAMO A — proveniência VÁLIDA antes da importação: os três campos eram
      derivados do perfil ANTIGO, que acabou de ser descartado; nada que o
      engenheiro tenha digitado se perde. Deriva-se do perfil NOVO
      imediatamente depois de `preencher_solo`, chamando o mesmo
      `_derivar_solo_da_camada()` de REQ-UI-CAMADA-01, com as mesmas guardas de
      REQ-UI-CAMADA-02.
      RAMO B — proveniência INVÁLIDA (valores digitados à mão ou vindos de um
      projeto aberto): NÃO sobrescrever, nunca. Em vez disso, acrescentar à
      mensagem de resumo da importação (`msg_perfil`, que já existe) uma linha
      de DIVERGÊNCIA quando qualquer um dos três diferir do valor da camada em
      h_f do perfil novo, informando os dois valores lado a lado para cada um
      dos três e a camada de referência.
      POR QUE A MENSAGEM E NÃO UM RÓTULO NOVO: `_importar_excel` já usa esse
      resumo exatamente para esta classe de silêncio — "aba ausente, perfil
      MANTIDO" (D6 do GATE 2, rodada 1) e "Hx/Hy zeradas" (BAIXA da rodada 2)
      nasceram da mesma regra: o que a importação faz ou deixa de fazer com os
      dados da tela tem de ser dito ali.
      NÃO SE EXIGE O MESMO DE "Abrir projeto...", e é decisão consciente: lá os
      três valores e o perfil vieram do MESMO arquivo, gravados juntos pelo
      mesmo engenheiro na mesma sessão; a divergência, se houver, é deliberada
      e já foi decidida uma vez. Aqui o perfil é novo e os valores são velhos —
      a divergência é acidental por construção.
    criterio_de_aceite:
      - >-
        Ramo A: com proveniência válida, importar planilha com aba de perfil
        cuja camada em h_f tem phi=38 deixa v_phi_solo == "38" e a proveniência
        VÁLIDA de novo, apontando para a camada do perfil novo.
      - >-
        Ramo B: com os três digitados à mão (proveniência inválida), a
        importação NÃO altera nenhum dos três, e a mensagem final contém uma
        linha citando o valor da tela e o da camada nova para cada um dos três
        que divergir.
      - >-
        Ramo B sem divergência (os três já iguais à camada em h_f): nenhuma
        linha de divergência é acrescentada.
      - >-
        Ramos `AbaAusente` e `ValueError` (app.py:489-511) não derivam nada e
        não tocam nos três campos — o perfil antigo foi mantido, os valores
        também.

  - id: REQ-UI-CAMADA-07-fronteira-com-o-nucleo-e-com-o-memorial
    texto: >-
      `ler_solo()` NÃO MUDA. Continua lendo o texto corrente dos três
      `StringVar` com `_float(...)`, sem consultar
      `ultima_derivacao_de_camada`, sem ramo condicional por proveniência e sem
      preferir a camada ao campo. O núcleo nunca vê o rótulo "derivado" — só o
      número final. É o mesmo contrato que já vale para sigma_adm depois de
      REQ-UI-SIGMA-01: quem calcula não precisa saber se o número foi digitado
      ou preenchido, e é isso que mantém `calc_core/` independente da tela
      (CLAUDE.md, princípio mestre). Corolário: a derivação nunca pode ser a
      ÚNICA fonte de um valor — se ela não rodar, os campos continuam com o que
      estiver neles e o cálculo sai igual ao de hoje.
      NENHUMA OBRIGAÇÃO NOVA DE MEMORIAL, PDF OU EXCEL nesta rodada, e o
      contraste com REQ-UI-SIGMA-01 é o que justifica: lá o rótulo ELU
      acompanha um número que entra numa verificação normativa de ELU e
      qualificá-lo é parte da rastreabilidade do resultado; aqui a proveniência
      é auxílio de preenchimento de campo, e o número que chega ao núcleo é
      idêntico venha de onde vier. `ultima_derivacao_de_camada` NÃO é repassada
      a `ui.completo.resultado`, a `relatorio.py`, a `pranchas.py` nem ao
      exportador Excel. (`relatorio.py:84` já imprime gamma_solo e phi' hoje;
      continua imprimindo o mesmo, sem adjetivo.)
      DECISÃO DE ESCOPO REGISTRADA, não esquecimento: se uma rodada futura
      quiser a proveniência no memorial, isso é requisito NOVO, com sua própria
      rodada de a6/a7 — e este parágrafo existe para que a ausência não seja
      lida como lacuna, do mesmo modo que a nota de escopo de REQ-UI-01.
    criterio_de_aceite:
      - >-
        O diff da rodada não toca `calc_core/`; o corpo de `ler_solo` sai
        idêntico ao da v9 (comparação textual).
      - >-
        Com proveniência válida, `ler_solo()` devolve exatamente os números que
        estão nos campos; sobrescrever v_phi_solo à mão para "20" e chamar
        `ler_solo()` devolve `phi == 20.0` (o valor da camada NÃO prevalece).
      - >-
        Busca textual por `ultima_derivacao_de_camada` não encontra ocorrência
        fora de `ui/completo/formulario.py`, `ui/completo/app.py` e dos testes.
      - >-
        O memorial/PDF/Excel gerados antes e depois desta rodada, para a mesma
        entrada, são idênticos no conteúdo de solo.

  - id: REQ-UI-01-rotulo-nao-normativo
    texto: >-
      Rótulo permanente e visível junto ao desenho e repetido no memorial:
      "Propagação de tensão em profundidade — método não normativo. A NBR
      6122:2022 não prescreve método de espraiamento. Valores informativos."
      Sem sigla, sem asterisco de rodapé: texto legível ao lado do resultado.
    estado_v8: PARCIALMENTE_ATENDIDO_POR_DECISAO_DE_ESCOPO
    nota_de_escopo_v8: >-
      REGISTRO ACRESCENTADO NA v8 — o requisito NÃO foi relaxado; o que muda é
      que a lacuna deixa de ser tácita. A metade "junto ao desenho" está
      atendida e verificada por render (a6, rodada 2). A metade "repetido no
      memorial" continua ABERTA: `calc_core/sapata_isolada/pranchas.py` não foi
      tocado por nenhum dos quatro commits desta feature (72b9987, 783b3c3,
      3f92b39, 9ecebd2 — confirmado pelo a2 com
      `git log 8e46372..HEAD --name-only`), em nenhuma das três rodadas. O
      espraiamento por camada, o rótulo de método e os dois avisos permanentes
      existem só na tela.
      NATUREZA DA LACUNA: é de OMISSÃO, não de erro. Nenhum número errado é
      emitido no PDF porque nada desta feature chega ao PDF. Por isso NÃO é
      bloqueante para o GATE 2 desta feature, e a v8 registra isso
      explicitamente para que a próxima leitura não confunda "deliberadamente
      adiado" com "esquecido" — que é a confusão que o a6 apontou ao dizer que
      "hoje o requisito está parcialmente aberto sem nenhum registro de que
      isso é deliberado" (defeito BAIXA/E4, pranchas.py:496, reincidente do
      item 13 da rodada 1).
      FORMA DO ADIAMENTO — pendência aberta com GATILHO, não com data. Prazo em
      calendário não tem como ser cumprido nem cobrado por este pipeline; um
      gatilho tem. A integração ao memorial fica para rodada posterior e passa
      a ser BLOQUEANTE assim que qualquer uma destas ocorrer:
        (i) o croqui de espraiamento for exposto em release ao usuário final
            com o memorial PDF apresentado como completo para esta feature; ou
        (ii) `pranchas.py` passar a emitir QUALQUER valor de propagação — a
             partir daí o rótulo não-normativo e o rótulo de método viajam
             junto ou nada é emitido (REQ-PROP-04); ou
        (iii) o A7 rodar sobre esta feature: caso de validação que confira o
              PDF não pode ser declarado ALTA com a seção ausente.
      Enquanto nenhuma delas ocorrer, o estado correto é o atual e a tela é a
      única superfície da feature. Registrado também em kb/pendencias.md.
  - id: REQ-UI-02-aviso-de-homogeneidade
    texto: >-
      O desenho vai mostrar camadas coloridas e um campo de tensão calculado
      como se o maciço fosse homogêneo. Essa contradição visual é a maior
      armadilha desta tela e precisa de aviso explícito: "As camadas são
      exibidas com suas propriedades reais; o campo de tensões é calculado em
      meio homogêneo e NÃO representa o contraste de rigidez entre camadas."
  - id: REQ-UI-03-sem-lastro
    texto: >-
      Não oferecer, nomear ou insinuar cálculo de lastro de rachão, colchão
      granular, camada de reforço ou substituição de solo mole. Nomear a
      funcionalidade pelo que ela é — espraiamento em perfil de solo natural.
      A NBR 6122:2022 §1 exclui melhoramento do solo do seu escopo por
      declaração; ver PC-ESPRAIAMENTO-2V1H > espaco_de_aplicacao.
  - id: REQ-UI-04-seletor-de-metodo
    texto: >-
      Seletor Boussinesq/Newmark (default, o que já existe) x 2V:1H, no mesmo
      lugar do checkbox "Bulbo de tensões" de `ui/completo/visualizacao.py:259`.
      O método escolhido aparece no desenho, não só no controle. Este seletor é
      de VISUALIZAÇÃO — não altera recalque nem verificação alguma
      (REQ-PROP-05).
  - id: REQ-UI-05-teto-de-profundidade
    texto: >-
      Não desenhar espraiamento abaixo da profundidade do perfil geotécnico
      informado. Profundidade sugerida de exibição 2·B, coerente com o bulbo de
      influência que `recalques.py:251` já usa.
  - id: REQ-UI-06-ui-nao-calcula
    texto: >-
      CLAUDE.md regra 4. q_i e a_eq,i/b_eq,i vêm prontos de calc_core (v7: e são
      LIDOS de `PontoPropagacao`, não recalculados nem derivados na tela).
      `ui/` recebe e desenha. Nenhuma reimplementação da fórmula na camada de
      desenho — foi assim que nasceu a duplicação de `recalques.py:265`.
  - id: REQ-UI-07-simbolos-do-croqui
    versao_do_texto: 8      # v7: NOVO. v8: só o item (a) — troca de fonte
                            # preferencial do q_i, sem mudar o que é exigido.
    texto: >-
      Rotulagem do croqui de espraiamento, conforme REQ-PROP-03 (B) a (F).
      Checável item a item:
      (a) Um rótulo de tensão POR INTERFACE, na cota da interface, nunca na
      meia-altura da camada, e a interface interna — compartilhada por duas
      camadas — recebe UM rótulo só. FONTE PREFERENCIAL DO VALOR (redigido na
      v8): `PontoPropagacao.delta_sigma`, isto é, `prop.pontos[i].delta_sigma`.
      `CamadaPropagacao.delta_sigma_topo`/`delta_sigma_base`, que o texto da v7
      nomeava, permanecem EQUIVALENTES E VÁLIDAS — não estão proibidas — mas
      deixam de ser a fonte recomendada. A troca é de preferência, não de
      número: são o mesmo número.
        * IDENTIDADE (o que sustenta a equivalência, e é fato de código, não
          convenção): para todo i, pontos[i].delta_sigma ==
          camadas[i].delta_sigma_topo, pontos[i+1].delta_sigma ==
          camadas[i].delta_sigma_base e pontos[i].z == camadas[i].z_topo, com
          igualdade EXATA. As duas famílias saem da MESMA chamada de
          `acrescimo_tensao(fonte, q_líq, a, b, z)` na MESMA cota
          (geotecnia.py:667-674 e :686-687). Conferido por execução pelo a6
          (184 pares: 2 fontes x 5 geometrias x 4 cotas de assentamento,
          diferença máxima 0,000e+00) e reconferido em amostra independente
          pelo a2 na v8 (2 fontes x 3 geometrias).
        * POR QUE PREFERIR O PONTO: `PontoPropagacao` carrega q_i e a_eq,i /
          b_eq,i JUNTOS, na mesma cota — que é literalmente a definição de
          REQ-PROP-03 (B). Ler a tensão de `CamadaPropagacao` e a largura de
          `PontoPropagacao` obrigaria a UI a reconstruir o mapeamento
          ponto-camada, que é a classe de erro que produziu o defeito original
          da rodada 1. A docstring de `CamadaPropagacao` (geotecnia.py:518-523)
          já diz, por escrito, que os símbolos do croqui não saem dali.
        * O QUE NÃO MUDOU: continua PROIBIDO exibir `delta_sigma_medio` como
          "q_i" (REQ-PROP-03 (D)); se exibido, rótulo próprio "Δσ_méd". Usar
          `delta_sigma_medio` como fator de COR do tronco não é rótulo e não
          viola este item.
        * A PREFERÊNCIA SÓ VALE ENQUANTO A IDENTIDADE VALER, e é isto que a v8
          registra em vez de deixar tácito. As duas famílias são produzidas por
          trechos independentes da MESMA função: se uma passar a amostrar com
          offset, ou se `limites()` deixar de ser contíguo a partir da cota da
          base, croqui e memorial exibirão números diferentes para a mesma
          interface, em silêncio, e a justificativa desta alínea cai sem que
          ninguém seja avisado. O teste de contrato que trava a identidade
          (igualdade EXATA, `==`, não `approx`, parametrizado por fonte e
          geometria, incluindo o alinhamento de cota) foi despachado ao a4 como
          defeito MÉDIA da rodada 2 do GATE 2 (geotecnia.py:667) e é a rede
          desta alínea: enquanto não existir, a preferência vale sem rede;
          existindo, não pode ser removido sem revisitar este texto. A v8 NÃO
          cria requisito novo por isso — apenas nomeia a dependência.
      (b) Um rótulo de largura POR INTERFACE, na mesma cota do q_i
      correspondente: "a_eq" no corte X, "b_eq" no corte Y, com unidade.
      (c) "L", "L1/L2/L3" e "B_eq" não aparecem em lugar nenhum da tela nem do
      memorial. A espessura da camada, se exibida, é "h" e vem de
      `CamadaPropagacao.espessura` — e a recomendação é NÃO exibi-la no tronco,
      porque a coluna estratigráfica ao lado já a informa por cota.
      (d) Sob Boussinesq, o rótulo de largura carrega a ressalva de leitura
      ilustrativa (o método não tem tronco de espraiamento); sob 2V:1H, não
      precisa. A ressalva pode ficar na legenda do método, desde que visível
      junto ao desenho.
      (e) Largura None (q_líq = 0) não vira número: traço ou omissão, com o
      aviso de pressão líquida nula visível — nunca a dimensão da sapata
      apresentada como largura calculada (`or dim` de `visual2d.py:693`).
      (f) O rótulo do método vem de `prop.rotulo_metodo`, não do estado da UI
      (REQ-PROP-04; a6, visual2d.py:669).

