      mutante MUTANTE-lb-sem-dividir-por-fbd REJEITADO (mm·MPa).
    checagem_numerica: >-
      phi 16 mm, C25, CA-50, boa aderência (eta_1 = 2,25; eta_2 = 1,0;
      eta_3 = 1,0): f_ctd = 1,283 MPa, f_bd = 2,886 MPa, ell_b = 602,7 mm =
      37,7·phi. CONTRA-PROVA INDEPENDENTE: o valor de tabela clássico para
      C25/CA-50 em boa aderência, sem gancho, é 38·phi — bate. ell_0c,min =
      max(0,6·602,7; 15·16; 200) = 361,6 mm; com A_s,calc/A_s,ef = 1,0,
      ell_0c = ell_b,nec = 602,7 mm, que governa. Ordem de grandeza correta
      (~60 cm de traspasse para phi 16 em C25).
    observacao: >-
      Conferido por LEITURA VISUAL DO a2 (PDF p. 62 = impressa 44):
      ell_0c = ell_b,nec >= ell_0c,min, com ell_0c,min = maior valor entre
      0,6·ell_b, 15·phi e 200 mm. Confirmada a extração do a1.
      Conferida também a Emenda 1:2026 (PDF p. 8 = impressa 4): o 1º parágrafo
      de 9.5.2 é substituído acrescentando "na execução" e estendendo os
      cuidados especiais a "demais elementos estruturais lineares de seção
      inteiramente tracionada". O limite de 32 mm NÃO muda e nada afeta o
      pilarete comprimido — mas o software cita a redação EMENDADA.
      DISTINÇÃO QUE O CÓDIGO ATUAL NÃO FAZ E QUE É A ARMADILHA DESTA REGRA:
      ell_0c (EMENDA por traspasse, acima do topo da sapata, mínimo 0,6·ell_b /
      15 phi / 200 mm) é grandeza DIFERENTE de ell_b,nec (ANCORAGEM da espera
      DENTRO da sapata, 9.4.2.5, mínimo 0,3·ell_b / 10 phi / 100 mm).
      `sapata_isolada/sapata.py::_ancoragem_pilar` usa hoje
      `max(0,6·ell_b, 10 phi, 100 mm)` — um HÍBRIDO dos dois mínimos, que não
      corresponde a nenhum dos itens: conservador na primeira parcela, mas sem
      rastreabilidade limpa. O módulo do pilarete NÃO deve reusar essa função;
      ver REQ-PILARETE-10 e kb/pendencias.md > V12.
      alpha = 1,0 (9.4.2.5): barra comprimida não tem gancho e não há barra
      transversal soldada — os outros três valores de alpha não se aplicam.

  - id: NBR6118-9.5.2.4.2-armadura-transversal-na-emenda
