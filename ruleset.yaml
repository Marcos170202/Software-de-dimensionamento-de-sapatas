    hash_trecho:
      '7.1': sha256:345202eaac7529a694582fc6dbf391e648b3421e2dd7c615934f56b2baf2b0cf
      '7.4': sha256:7496ae728c85ac50643c9f1c98a02d20dd203d8caa7c102f42f9a1bf98de464c
    trecho_literal:
      - Essas tensões devem satisfazer simultaneamente aos estados limites últimos (ELU) e de serviço (ELS), para cada elemento isolado de fundação, bem como para o conjunto.
      - A tensão admissível ou tensão resistente de cálculo é, neste caso, o valor máximo da tensão aplicada ao terreno que atenda aos requisitos em 6.2.2.
    itens_relacionados:
      - {item: 6.2.2.1, clausula_kb: NBR6122-2022-6.2.2.1, pagina: [20], pagina_pdf: [32], hash_trecho: "sha256:479e98952ca73226d73e7eaa166f1f218c2974770bc9ac6369be495032aaf743"}
    origem: DERIVADA_DO_TEXTO
    justificativa_derivacao: >-
      "Satisfazer simultaneamente" ELU e ELS = atender aos dois limites. No metodo admissivel, em que
      ELU e ELS se expressam ambos em valores caracteristicos, isso equivale a sigma_adm = menor dos
      dois limites. No metodo de calculo NAO se toma o minimo: o ELU compara valores de calculo
      (sigma_solo_d <= sigma_Rd_ELU, regra 3.31) e o ELS compara valores CARACTERISTICOS
      (6.2.2.1: "calculado considerando-se ... acoes caracteristicas"), logo e uma segunda
      verificacao separada, sigma_solo_k <= sigma_ELS. Tomar min(sigma_Rd, sigma_ELS) misturaria
      bases (RT-01). Operacoes logicas, sem parametro novo.
    sympy:
      - "Eq(sigma_adm, Min(sigma_adm_ELU, sigma_ELS))"
      - "sigma_solo_k <= sigma_ELS"
    variaveis:
      sigma_adm: {unidade_pint: kPa, implementacao: geotecnico.sigma_adm, metodo: admissivel}
      sigma_adm_ELU: {unidade_pint: kPa, implementacao: geotecnico.sigma_adm_ELU, metodo: admissivel}
      sigma_ELS: {unidade_pint: kPa, implementacao: geotecnico.sigma_ELS, entrada_obrigatoria: true, natureza: caracteristica, nota: "maior tensao caracteristica que atende 6.2.2 (E_k <= C), determinada pelo engenheiro; o v0 NAO calcula recalque"}
      sigma_solo_k: {unidade_pint: kPa, implementacao: geotecnico.sigma_solo_k, natureza: caracteristica}
    aplica_se_a:
      admissivel_modo_B: "sigma_adm = Min(sigma_adm_ELU, sigma_ELS)"
      admissivel_modo_A: "sigma_adm fornecido ja atende ELU e ELS por definicao (3.45) -- declaracao obrigatoria, sigma_ELS dispensado"
      calculo_modos_A_e_B: "verificacao adicional obrigatoria sigma_solo_k <= sigma_ELS; sigma_Rd (3.48) e definido so pela ruptura, logo o ELS nunca esta implicito nele"
    decisao_A2: >-
      Achado adversarial: sigma_r_k/FS_g sozinho NAO e a "tensao admissivel" da 3.45 (que exige ELU
      E ELS). Sem esta regra o v0 apresentaria o limite de ELU como tensao admissivel. A saida da
      Tabela 1 deve ser rotulada sigma_adm_ELU / sigma_Rd_ELU e nunca exibida como tensao de projeto.
      "Para o conjunto" (efeito de grupo) nao e verificado no v0 -> memorial.

