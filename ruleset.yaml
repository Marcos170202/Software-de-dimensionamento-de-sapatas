  - id: NBR6122-3.30-verificacao-admissivel
    status: APROVADA
    tipo: verificacao
    metodo: admissivel
    titulo: Condicao de seguranca -- metodo de valores admissiveis
    norma: ABNT NBR 6122:2022
    item: '3.30'
    pagina: [6]
    pagina_pdf: [18]
    clausula_kb: NBR6122-2022-3.30
    hash_trecho: sha256:d246cae14d3778a831b56d2fa1a3d3b6b939bfcb4ab7ff2f9c64458ca2de386c
    trecho_literal:
      - Padm = Rk/FSg e Padm ≥ Sk
      - Padm é a tensão admissível de sapatas e tubulões e carga admissível de estacas
    itens_relacionados:
      - {item: '3.45', clausula_kb: NBR6122-2022-3.45, pagina: [8], pagina_pdf: [20], hash_trecho: "sha256:a6a74718c740ceff74f2e6f0c4e795205024ef53440bc40b8e51451e8415b209"}
      - {item: '3.47', clausula_kb: NBR6122-2022-3.47, pagina: [9], pagina_pdf: [21], hash_trecho: "sha256:0bd33bce770266a1548dee60129a159aca11fd6ca4028465e45b0adaa0d2c612"}
    origem: LITERAL_COM_VINCULACAO
    sympy: ["sigma_solo_k <= sigma_adm"]
    variaveis:
      sigma_solo_k: {unidade_pint: kPa, implementacao: geotecnico.sigma_solo_k, metodo: admissivel}
      sigma_adm: {unidade_pint: kPa, implementacao: geotecnico.sigma_adm, metodo: admissivel}
    vinculacao_A2: >-
      Checagem dimensional: na leitura literal, P_adm (tensao, para sapatas) >= S_k ("solicitacoes
      caracteristicas", esforcos) e dimensionalmente inconsistente -- defeito da redacao da FONTE
      (conferido na pagina rasterizada), nao da transcricao do A1. Para sapatas, o unico S_k
      homogeneo com P_adm e a "tensao de trabalho ... em valores caracteristicos" definida em 3.47,
      i.e. sigma_solo_k da regra NBR6122-7.6.1-tensao-uniforme. Vinculacao S_k := sigma_solo_k.

