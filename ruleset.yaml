  - modulo: "sapata_isolada.geotecnia"
    cobre: "Perfil estratigráfico, tensão geostática, correlação SPT->sigma_adm"
    status: PENDENTE_HUMANO
    observacao: >-
      ATUALIZADO em 2026-08-27 (versão 6). Esta linha citava "propagação de
      Boussinesq/Newmark" na enumeração; a propagação SAIU daqui e virou
      registro próprio: `praticas_consagradas > PC-BOUSSINESQ-NEWMARK-canto-
      retangulo` (APROVADA) e `PC-ESPRAIAMENTO-2V1H`
      (APROVADA_COM_USO_RESTRITO), ambas com uso autorizado explícito.
      RESOLVE a zona cinzenta apontada pelo a1 (kb/pendencias.md, rodada
      2026-08-27 (b), item 3): `acrescimo_tensao_2v1h` estava no módulo listado
      mas não na enumeração do que a linha cobria, e portanto não estava
      coberta nem por esta pendência nem por regra alguma. Agora está.
      O QUE CONTINUA PENDENTE_HUMANO nesta linha: perfil estratigráfico, tensão
      vertical total/efetiva/poropressão, tensão de pré-adensamento e a
      correlação SPT -> sigma_adm (`sigma_adm_por_spt`, que é também a pendência
      §7.3.3 listada no CLAUDE.md). Nada disso foi conferido nesta rodada.
      ATUALIZADO EM 2026-08-31 (VERSÃO 9), e a atualização resolve MENOS do que
      pode parecer à primeira leitura. A v9 aprovou um caminho NOVO e AUDITADO
      de sigma_adm a partir de SPT (regras NBR6122-7.3.2 / 7.3.3 / 7.3-7.4 e
      formulações FB-CINTRA-TERZAGHI-VESIC-capacidade-de-carga,
      FB-CINTRA-4.1.1-sigma-adm-teorico-FS3,
      FB-REGRA-BRASILEIRA-Nspt-50-argila e FB-TEIXEIRA-1996-areia). Isso NÃO
      aprova a função `sigma_adm_por_spt` QUE JÁ EXISTE neste módulo: ela não
      foi lida, não foi conferida contra fonte alguma, e não se sabe que
      correlação implementa nem com que domínio de validade. Continua
      PENDENTE_HUMANO integralmente.
      O que a v9 muda é o desfecho possível: quando a4 encostar neste módulo, o
      caminho correto é SUBSTITUIR `sigma_adm_por_spt` pela implementação
      aprovada na v9 — com guarda de domínio que recusa (REQ-SIGMA-04), FS
      embutido verificado (REQ-SIGMA-02) e rótulo de ELU (REQ-SIGMA-09) — e NÃO
      tentar validar a posteriori o que já está escrito. Se a função existente
      concordar numericamente com a aprovada, isso é coincidência a confirmar,
      não credencial.
      Perfil estratigráfico segue PENDENTE e é BLOQUEANTE para o caminho
      teórico da v9, que exige solo HOMOGÊNEO (REQ-SIGMA-07 c) porque o item
      2.5 da fonte (solo estratificado, impressas 36-40) não foi extraído em
      nenhuma rodada.
  - modulo: "sapata_isolada.sapata (geometria/estabilidade sob carga excêntrica)"
    cobre: "Núcleo central, diagrama trapezoidal/triangular, área efetiva de Meyerhof, FS deslizamento/tombamento (NBR 6122 §6.2.1.1.2/§7.6.2/§7.6.3)"
    status: PENDENTE_HUMANO
    observacao: >-
      Testado numericamente (equilíbrio, casos de contorno) mas os
      coeficientes/fórmulas ainda não foram lidos da norma nesta rodada.
      CORRIGIDO em 2026-08-27 (versão 4): esta linha citava "§6.2.1.2", que é
      "Segurança de fundações PROFUNDAS". O item de fundação rasa é §6.2.1.1.2.
      A correção da citação NESTE arquivo não autoriza a mesma troca cega no
      código: §6.2.1.1.2 prescreve coeficientes parciais, não FS global — ver
      regra NBR6122-6.2.1.1.2-tracao-deslizamento-tombamento (PENDENTE_HUMANO).
      SEGUNDO ACHADO nesta rodada, também do lado inseguro e independente do
      primeiro: `geotecnia.py:217` define `coef_sigma_max_excentrico = 1.2`
      ("majoração admitida no vértice") e `sapata.py:359` aplica
      `limite = sigma_adm * 1.2` SEMPRE que a seção fica parcialmente
      comprimida (k > 1), sem condição alguma. Não há na NBR 6122:2022
      majoração de 20 % da tensão admissível por excentricidade. A única
      majoração de tensão admissível da norma é a de VENTO (§6.3.2: até 15 %,
      30 % em galpões/torres/silos/reservatórios elevados/torres eólicas/
      telecomunicações/tanques químicos), condicionada a vento ser a ação
      variável PRINCIPAL e a FSg >= 1,6; §6.3.3 dá 10 % no método de valores
      de cálculo. Constante incondicional de 1,2 excede o teto geral de 15 %
      e ignora as duas condições — é guarda condicional virada constante,
      exatamente o defeito que a2-verificador.md §3 manda proibir.
      PENDENTE_HUMANO; A5 não deve mexer neste valor nesta rodada.
      AGRAVADO NA VERSÃO 9, e o agravamento é de natureza nova. Até a v8 este
      defeito era "constante sem respaldo". A partir da v9 existe, no mesmo
      repositório, a ÚNICA majoração de tensão admissível que a NBR 6122:2022
      admite, aprovada e implementada como GUARDA CONDICIONAL
      (NBR6122-6.3.2-majoracao-vento-valores-admissiveis + REQ-SIGMA-10), com
      as três condições explícitas e default que não majora. Conviver com um
      `coef_sigma_max_excentrico = 1.2` incondicional ao lado dela deixa de ser
      apenas um valor sem fonte e passa a ser uma SEGUNDA majoração,
      contraditória com a primeira e invisível ao usuário — dois caminhos que
      majoram sigma_adm por critérios diferentes, um auditado e um não. A
      decisão humana sobre o 1,2 fica mais urgente, não menos, e deve ser
      tomada JUNTO com a de §6.3.3 (kb/pendencias.md > V2 e V7).
      Reafirmado: A5 e A4 continuam PROIBIDOS de alterar o valor 1,2 nesta
      rodada. Aprovar a majoração de vento NÃO é autorização para "consertar" o
      1,2 trocando-o por 1,15 — seriam duas coisas diferentes, e a segunda não
      está decidida. O que a v9 autoriza é NÃO propagar o 1,2 para nenhum
      caminho novo.
