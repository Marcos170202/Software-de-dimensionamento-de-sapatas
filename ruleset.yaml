# --- Versão 5: fonte secundária (apostila Bastos/UNESP) sobre a pendência ---
#     NBR6122-6.2.1.1.2-tracao-deslizamento-tombamento
#
# ATENÇÃO (CLAUDE.md regra 5): esta versão ALTERA o ruleset. As aprovações de
