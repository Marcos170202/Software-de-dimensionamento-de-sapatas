# =============================================================================
# ACHADO COLATERAL desta rodada — NÃO é regra, é aviso para quem for
# implementar a pendência de pilar de borda/canto (ver CLAUDE.md, "Pendente em
# ambos os motores", e a observação de NBR6118-19.5.2.2-K-Wp).
# A Emenda 1:2026 ALTERA 19.5.2.3 (p. 164 da norma-mãe). Conferido
# visualmente na Emenda 1, p. 14: a emenda reapresenta
#     tau_Sd = F_Sd/(u*·d) + K_1·M_Sd1/(W_p1·d),  M_Sd1 = (M_Sd - M*_Sd) >= 0
# com W_p1 calculado para o perímetro u e K_1 assumindo os valores de K da
# Tabela 19.2. Quem for implementar pilar de borda DEVE partir da redação da
# Em1:2026, não da de 2023. Não conferido item a item nesta rodada — fora do
# escopo desta consulta; extrair antes de implementar.
# =============================================================================

# Colisão de símbolo (a2-verificador.md, item 3): COLISÃO REAL DETECTADA nesta
# rodada, entre os dois motores que coexistem no repositório.
#   - calc_core/geotecnico/  chama as dimensões em planta de B e L
#     (restricoes.verificar_dimensao_minima(B, L), geometria.*).
#   - calc_core/sapata_isolada/  chama as MESMAS grandezas físicas de a e b
#     (rigidez.classificar(a, b, h, h0, ap, bp), sapata.Sapata).
#   - a NBR 6118:2023, 22.6.1, usa 'a' para a dimensão da sapata e 'a_p' para a
#     do pilar; a NBR 6122:2022, 7.7.1, não usa símbolo.
#   - 'h' é altura da SAPATA no domínio estrutural (22.6.1) e é usado para
#     espessura de camada/profundidade no domínio geotécnico.
# Exigência para A4/A5: usar namespace por domínio no campo `implementacao` e
# nas docstrings — `estrutural.<...>` e `geotecnico.<...>`, como já feito nas
# regras acima. NÃO renomear as APIs existentes nesta rodada (quebraria a UI e
# os testes); o namespace é de DOCUMENTAÇÃO e rastreabilidade. Uma unificação
# de nomenclatura entre os dois motores é candidata a tarefa própria, com nova
# rodada de A6/A7.
# 'd' (altura útil, estrutural) x 'd' (profundidade de assentamento,
# geotécnico): ainda sem colisão efetiva — o motor geotécnico chama a
# profundidade de assentamento de outra coisa. Revisitar se §7.3.3 entrar.
#
# Colisão de método de segurança: nenhuma regra aprovada mistura 'admissivel'
# e 'calculo' — todas usam metodo: ambos porque a fórmula em si (sigma=N/A)
# é neutra ao método; a diferença fica no valor de sigma_adm que o chamador
# fornece (característico+FSg OU já ponderado). calc_core não pondera nada
# sozinho — quem chama decide e passa o valor já pronto. Isso evita a mistura
# que a norma proíbe implicitamente.
#
# Majoração por vento (§6.3.2/§6.3.3): NÃO aprovada — fora do escopo (carga
# centrada permanente/acidental apenas, sem combinação de vento).

# =============================================================================
# escopo_amplo_em_conferencia — módulos portados de calc_core/sapata_isolada/
# que passaram no teste de sanidade do próprio pacote e num caso completo de
# ponta a ponta (ver relatorios/conformidade.md), mas cujas fórmulas NÃO
# foram, uma a uma, conferidas por leitura visual da norma nesta rodada.
# NENHUMA entrada abaixo é APROVADA — a interface e o memorial devem exibir
# aviso "em conferência" para os resultados que dependem delas.
# =============================================================================
escopo_amplo_em_conferencia:
  - modulo: "sapata_isolada.acoes"
    cobre: "Combinações ELU/ELS automáticas conforme NBR 8681 e NBR 6118 §11"
    status: PENDENTE_HUMANO
  - modulo: "sapata_isolada.geotecnia"
    cobre: "Perfil estratigráfico, tensão geostática, propagação de Boussinesq/Newmark, correlação SPT->sigma_adm"
    status: PENDENTE_HUMANO
  - modulo: "sapata_isolada.sapata (geometria/estabilidade sob carga excêntrica)"
    cobre: "Núcleo central, diagrama trapezoidal/triangular, área efetiva de Meyerhof, FS deslizamento/tombamento (NBR 6122 §6.2.1.1.2/§7.6.2/§7.6.3)"
    status: PENDENTE_HUMANO
    observacao: >-
      Testado numericamente (equilíbrio, casos de contorno) mas os
      coeficientes/fórmulas ainda não foram lidos da norma nesta rodada.
      CORRIGIDO em 2026-08-27 (versão 4): esta linha citava "§6.2.1.2", que é
      "Segurança de fundações PROFUNDAS". O item de fundação rasa é §6.2.1.1.2.
      A correção da citação NESTE arquivo não autoriza a mesma troca cega no
      código: §6.2.1.1.2 prescreve coeficientes parciais, não FS global — ver
      regra NBR6122-6.2.1.1.2-tracao-deslizamento-tombamento (PENDENTE_HUMANO).
      SEGUNDO ACHADO nesta rodada, também do lado inseguro e independente do
      primeiro: `geotecnia.py:217` define `coef_sigma_max_excentrico = 1.2`
      ("majoração admitida no vértice") e `sapata.py:359` aplica
      `limite = sigma_adm * 1.2` SEMPRE que a seção fica parcialmente
      comprimida (k > 1), sem condição alguma. Não há na NBR 6122:2022
      majoração de 20 % da tensão admissível por excentricidade. A única
      majoração de tensão admissível da norma é a de VENTO (§6.3.2: até 15 %,
      30 % em galpões/torres/silos/reservatórios elevados/torres eólicas/
      telecomunicações/tanques químicos), condicionada a vento ser a ação
      variável PRINCIPAL e a FSg >= 1,6; §6.3.3 dá 10 % no método de valores
      de cálculo. Constante incondicional de 1,2 excede o teto geral de 15 %
      e ignora as duas condições — é guarda condicional virada constante,
      exatamente o defeito que a2-verificador.md §3 manda proibir.
      PENDENTE_HUMANO; A5 não deve mexer neste valor nesta rodada.
  - modulo: "sapata_isolada.bielas"
    cobre: "Modelo de bielas e tirantes de Blévot generalizado (NBR 6118 §22.6.4.1); limites de nó CCC/CCT já conferidos via alpha_v/fcd (ver regras de punção acima)"
    status: PENDENTE_HUMANO
  - modulo: "sapata_isolada.rigidez, sapata_isolada.grelha"
    cobre: "Classificação rígida/flexível (NBR 6118 §22.6.1) e discretização em base elástica de Winkler (Hetényi, Hambly) — método numérico consagrado, não é texto literal da norma"
    status: PENDENTE_HUMANO   # PARCIALMENTE RESOLVIDO — ver abaixo
    observacao: >-
      ATUALIZADO em 2026-08-27 (versão 3). O critério geométrico
      h>=(a-ap)/3 (§22.6.1) FOI CONFERIDO nesta rodada e virou regra própria
      APROVADA: ver NBR6118-22.6.1-rigidez na lista `regras`. Texto lido
      visualmente na p. 191, checado dimensionalmente com pint e conferido
      numericamente contra o código em 4 casos — bate exatamente, inclusive
      a exigência "nas duas direções" (h_nec = max das duas).
      O QUE CONTINUA PENDENTE_HUMANO neste módulo: tudo o que NÃO é o critério
      geométrico — Winkler/Hetényi (lambda_L, classe curta/média/longa), a
      rigidez relativa K_r de Meyerhof, kv_por_tensao_admissivel (Bowles),
      kv_por_modulo (Vésic), a grelha e a distribuição de pressões dela
      resultante. Nada disso é texto normativo e nada disso pode receber
      [rule: ] de norma — é engenharia consagrada e deve ser rotulada como tal.
      DEFEITOS DE CITAÇÃO detectados neste módulo nesta rodada (corrigir via
      A5, não são erro de cálculo): rigidez.py:19 e :142 atribuem a punção de
      sapata flexível ao item "22.6.3", que na verdade é "Modelo de cálculo";
      o item correto é 22.6.2.3-b). rigidez.py:56 cita "NBR 6122:2019",
      edição inexistente no acervo (é 2022). Ver kb/pendencias.md.
  - modulo: "sapata_isolada.recalques"
    cobre: "Recalque imediato, Schmertmann (1978), adensamento de Terzaghi, evolução no tempo (NBR 6122 §6.2, §7.4)"
    status: PENDENTE_HUMANO
  - modulo: "sapata_isolada.solo_mef"
    cobre: "MEF axissimétrico do maciço — método numérico, não texto normativo"
    status: PENDENTE_HUMANO
