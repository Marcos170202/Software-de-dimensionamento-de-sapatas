# praticas_consagradas — SEÇÃO NOVA na versão 6.
#
# POR QUE UMA SEÇÃO SEPARADA, e não mais duas linhas em `regras`:
# a cascata do a2-verificador §1 exige norma + item + página + hash e manda
# REJEITAR sem apelo o que não tiver os quatro. Um método não normativo NUNCA
# terá os quatro — colocá-lo em `regras` com `norma: null` obrigaria a violar a
# própria cascata ou a inventar uma norma. Pior: qualquer consumidor que
# percorra `regras` para montar o memorial passaria a poder emitir um
# `[rule: ]` para algo que não é regra de norma nenhuma. A separação física
# impede o erro por construção.
#
# ESTATUTO DESTAS ENTRADAS:
#   - Para efeito da regra 2 do CLAUDE.md ("nada entra em calc_core/ sem regra
#     APROVADA correspondente"), uma entrada aqui com status APROVADA CONTA como
#     autorização — dentro, e apenas dentro, do `uso_autorizado` declarado.
#   - Para efeito da regra 3 do CLAUDE.md (docstring com item normativo), estas
#     entradas NÃO fornecem item normativo. A docstring cita
#     `[pratica: <id>]`, JAMAIS `[rule: <id>]`. Um `[rule: ]` apontando para um
#     id desta seção é defeito, e o a6 deve tratá-lo como tal.
#   - `norma`, `item`, `pagina`, `hash`: ausentes por definição, não por falha
#     de extração. O campo `origem_da_confianca` ocupa o lugar deles e diz, sem
#     eufemismo, em que a aprovação se apoia.
# =============================================================================
praticas_consagradas:

  - id: PC-BOUSSINESQ-NEWMARK-canto-retangulo
    natureza: PRATICA_CONSAGRADA        # NÃO é regra normativa. Nunca [rule: ].
    citacao_em_codigo: "[pratica: PC-BOUSSINESQ-NEWMARK-canto-retangulo]"
    metodo: ambos    # é campo de tensões, neutro ao método de segurança: não
                     # envolve FS global nem gamma_f/gamma_m. Ver guarda de
                     # método no campo `requisitos_para_a4`.
    status: APROVADA
    respaldo_normativo: NENHUM
    implementacao: >-
      geotecnico.propagacao.influencia_canto_retangulo (m, n) e
      geotecnico.propagacao.acrescimo_tensao_centro (q, a, b, z) —
      hoje em calc_core/sapata_isolada/geotecnia.py:162-188.
    formula: >-
      I(m,n) = (1/4pi) · [ 2mn·sqrt(m²+n²+1)/(m²+n²+1+m²n²) · (m²+n²+2)/(m²+n²+1)
                           + arctan( 2mn·sqrt(m²+n²+1) / (m²+n²+1-m²n²) ) ],
      com o arco-tangente tomado em (0, pi) — isto é, somando pi quando
      m²n² > m²+n²+1. m = B/z e n = L/z são as dimensões do RETÂNGULO cujo
      CANTO está sobre a vertical do ponto, divididas por z.
      Sob o CENTRO de sapata a x b: dsigma_z(z) = 4·q·I(a/2z, b/2z).
    origem_da_confianca: >-
      NÃO é autoridade bibliográfica — não há, neste acervo, nem norma nem livro
      que traga esta expressão, e o a2 não aprova por memória de tabela.
      É VERIFICAÇÃO MATEMÁTICA PRÓPRIA. A forma fechada é a integral exata da
      solução de carga pontual de Boussinesq (1885) sobre um retângulo, integral
      que Newmark (1935) publicou resolvida. O a2 refez a integração
      NUMERICAMENTE, do zero, a partir de dsigma_z = 3q z³/(2 pi R^5), quadratura
      de ponto médio 1500x1500, e comparou com a forma fechada do código em 11
      pares (m,n): diferença máxima 3,2e-08.
      Consequência do tipo de verificação: esta aprovação NÃO depende de
      ninguém confiar na citação "Boussinesq/Newmark". Ela é reprodutível em
      cinco minutos por qualquer pessoa com um integrador numérico, e é assim
      que deve ser reauditada. O nome do método é etiqueta, não fundamento.
    checagem_dimensional: >-
      pint: m = (a/2)/z e n = (b/2)/z saem `dimensionless` — pré-requisito do
      arco-tangente e da raiz. I é adimensional por construção. 4·q·I tem a
      dimensão de q ([mass]/[length]/[time]²  = kPa). Homogêneo.
      A checagem tem pouco poder aqui (I é adimensional, quase nada a
      desbalancear); quem carrega a verificação é a integração numérica.
    checagem_numerica: >-
      Contorno: z -> 0 dá exatamente q (I -> 0,25 por quadrante; I(1e4,1e4) =
      0,250000). I(1,1) = 0,17522, valor clássico. I(m,0) = 0. I(m,n) = I(n,m).
      Ramo crítico m²n² > m²+n²+1 conferido em (2;2), (5;5), (10;1,2) contra a
      integral — bate; o `atan2` do código resolve o acréscimo de pi.
      Faixa plausível com valores típicos (a=b=2,0 m, q_líq=200 kPa):
      186 kPa a 0,5 m; 140 kPa a 1,0 m; 67 kPa a 2,0 m (= B); 21,6 kPa a 4,0 m
      (= 2B, 11 % de q). Profundidade em que dsigma cai a 10 % de q: 2,09·B para
      sapata quadrada e 1,46·B para a=2/b=4 — coerente com o "bulbo de 2B" que
      `recalques.py:251` já adota como profundidade de influência.
    uso_autorizado: >-
      (1) Campo dsigma_z(z) do PERFIL GEOTÉCNICO GERAL abaixo da base da sapata,
      para visualização em corte e para a coluna de dsigma por camada do
      memorial, sempre rotulado como não normativo.
      (1.b) PRECISÃO DA VERSÃO 7, sem ampliar o uso: a largura equivalente
      a_eq/b_eq (`largura_equivalente`, derivada de dsigma por equivalência de
      carga total) é autorizada APENAS como traçado e rótulo do croqui. Sob
      Boussinesq ela é LEITURA GEOMÉTRICA ILUSTRATIVA — a solução elástica não
      tem tronco de espraiamento, não tem largura carregada e a tensão varia ao
      longo do plano horizontal —, e o desenho, que é um trapézio com setas,
      sugere o contrário. Por isso o rótulo tem de trazer a ressalva junto
      (REQ-UI-07). PROIBIDO usar a_eq/b_eq como área em conta alguma: não é
      área efetiva, não é área espraiada, não entra em verificação de tensão,
      de recalque nem de camada subjacente.
      (2) Manutenção do uso já existente: bulbo de `visual2d.PerfilCortes._bulbo`
      e parcela de acréscimo de tensão de `recalques.py:264`.
      Fora disso, nada. Em particular NÃO autoriza usar dsigma_z para checar
      capacidade de carga de camada subjacente (ver `nao_autorizado`).
    nao_autorizado: >-
      (a) VERIFICAÇÃO DE CAMADA SUBJACENTE. Comparar dsigma_z(z) + sigma'_v0(z)
      com um sigma_adm da camada de baixo e emitir PASSA/NÃO PASSA é critério de
      aceitação de projeto. A NBR 6122:2022 não prescreve esse procedimento e o
      a2 não o aprova. Se A4 quiser exibir o número, exiba como INFORMATIVO, sem
      veredito, sem cor de reprovação, sem entrar em lista de verificações.
      (b) O modelo, e não a fórmula. A fórmula está certa; a HIPÓTESE é meio
      semi-infinito homogêneo, isótropo, elástico-linear, sem peso, carregado
      por pressão uniforme em área flexível. O solo real é estratificado. Um
      contraste de rigidez entre camadas altera o campo de tensões e ESTA
      SOLUÇÃO NÃO REPRESENTA ISSO — as camadas coloridas do desenho são
      cenografia sobre um campo calculado como se o maciço fosse homogêneo.
      Isto tem que estar escrito na tela e no memorial, não só aqui.
      (c) Sapata rígida. A hipótese é de carregamento uniforme (placa flexível);
      sapata rígida real redistribui pressão para os bordos. Não modelado.
    dominio_de_validade: >-
      z >= 0 medido A PARTIR DA BASE da sapata (não da superfície do terreno) —
      erro de origem de eixo é o defeito mais provável no wiring; a
      `recalques.py` já usa `z_abaixo_base` e é o padrão a seguir.
      a > 0, b > 0. q = pressão LÍQUIDA (ver `requisitos_para_a4`).
      DEFEITO DE DOMÍNIO DETECTADO NESTA RODADA, do lado inseguro por silêncio:
      `acrescimo_tensao_centro(q,a,b,z)` com z = -1,0 m RETORNA q = 200 kPa sem
      erro, porque o guarda é `if z <= 1e-6: return q` e ele engole todo o
      semieixo negativo. Um erro de sinal no wiring não aparece como exceção —
      aparece como tensão plausível. A4 deve validar z >= 0 no chamador.
    observacao: >-
      FECHA PARCIALMENTE a linha `escopo_amplo_em_conferencia >
      sapata_isolada.geotecnia`, no que ela chama de "propagação de
      Boussinesq/Newmark". O resto daquela linha (perfil estratigráfico, tensão
      geostática, correlação SPT -> sigma_adm) CONTINUA PENDENTE_HUMANO.
      Nota de qualidade, não bloqueante: a docstring de
      `influencia_canto_retangulo` diz "m = B/z, n = L/z" sem dizer que B e L
      são as dimensões do retângulo com CANTO sobre o ponto. O chamador
      `acrescimo_tensao_centro` faz certo (a/2, b/2), e
      `visual2d._razao` também. A docstring é que induz ao erro de passar a
      largura inteira — o que subestimaria dsigma. Corrigir a redação quando A4
      encostar no arquivo.

  - id: PC-ESPRAIAMENTO-2V1H
    natureza: PRATICA_CONSAGRADA        # NÃO é regra normativa. Nunca [rule: ].
    citacao_em_codigo: "[pratica: PC-ESPRAIAMENTO-2V1H]"
    metodo: ambos    # convenção geométrica, neutra ao método de segurança.
    status: APROVADA_COM_USO_RESTRITO
    respaldo_normativo: NENHUM
    implementacao: >-
      geotecnico.propagacao.acrescimo_tensao_2v1h (q, a, b, z) — hoje em
      calc_core/sapata_isolada/geotecnia.py:191. Existe uma SEGUNDA cópia da
      mesma expressão, escrita à mão, em recalques.py:265-266 (ver
      `defeitos_detectados`).
    formula: "dsigma_z(z) = q · (a·b) / ((a+z)·(b+z))"
    origem_da_confianca: >-
      DUAS PERNAS, e é importante que fiquem separadas.
      PERNA 1, FORTE, verificação própria: dada a convenção "2 na vertical para
      1 na horizontal, com a resultante distribuída uniformemente sobre a área
      alargada", a fórmula acima é a ÚNICA consequência possível, e o a2 a
      verificou por equilíbrio vertical — dsigma_z(z)·(a+z)(b+z) = q·a·b exato
      em 4/4 profundidades. Alargamento de z/2 por lado = arctan(0,5) = 26,57°
      com a vertical = 2V:1H. Nada aqui é opinião.
      PERNA 2, FRACA, e declarada como fraca: que a convenção 2V:1H seja a
      convenção usual é CONHECIMENTO GERAL DE MECÂNICA DOS SOLOS afirmado pelo
      a2, presente em qualquer texto introdutório da disciplina (Terzaghi &
      Peck, Das, Pinto, Cintra & Aoki são as referências habituais), SEM NENHUM
      DOCUMENTO NO ACERVO QUE O COMPROVE. O a1 varreu a NBR 6122:2022 (120
      páginas) e a apostila do Bastos (119 páginas): zero ocorrência de
      espraiamento, 2:1, Boussinesq ou bulbo. Isto é um degrau abaixo do FS=1,5,
      que ao menos tinha a apostila — e o a1 fez bem em sinalizar.
      POR QUE, MESMO ASSIM, APROVA: o que a perna 2 sustenta é apenas o NOME e a
      escolha do ângulo; o número sai inteiro da perna 1. E o `uso_autorizado`
      abaixo foi cortado justamente até onde a perna 1 sozinha basta — nenhuma
      decisão de projeto depende do 26,57°. Se algum dia depender, volta a ser
      PENDENTE_HUMANO (é exatamente o que está registrado em `nao_autorizado`).
      Um humano refuta ou confirma a perna 2 em um minuto com qualquer livro da
      estante; se ela cair, cai só a etiqueta "2V:1H", não a aritmética.
    checagem_dimensional: >-
      pint: q·(a·b)/((a+z)(b+z)) -> [mass]/[length]/[time]² = kPa. Homogêneo.
      MUTANTES REJEITADOS pelo pint: (a+z)²(b+z) -> kPa/m; (a·b)/(a+z) -> kN/m;
      (b+z²) -> DimensionalityError; (a·z)(b·z) -> kPa/m².
      MUTANTE NÃO REJEITADO, e é o que interessa: q·a·b/((a+2z)(b+2z)) — que é
      1V:1H, 45°, e daria dsigma muito menor — é HOMOGÊNEO e passa. A análise
      dimensional NÃO distingue ângulo de espraiamento. Registrado no cabeçalho
      da versão 6 como limite conhecido da ferramenta.
    checagem_numerica: >-
      Contorno: z=0 -> exatamente q. z -> infinito -> 0. Monótona decrescente.
      Equilíbrio vertical exato em toda profundidade (a checagem que fixa o
      ângulo). Valores típicos (a=b=2,0 m, q_líq=200 kPa): 128 kPa a 0,5 m;
      88,9 kPa a 1,0 m; 50,0 kPa a 2,0 m; 22,2 kPa a 4,0 m. Faixa plausível.
      COMPARAÇÃO COM BOUSSINESQ — é o achado numérico desta rodada e é ele que
      define o `uso_autorizado`. O 2V:1H NÃO é uma aproximação neutra do bulbo:
        z = 0,5 m  ->  2V:1H dá  69 % de Boussinesq  (128 x 186 kPa)
        z = 1,0 m  ->            63 %                (88,9 x 140 kPa)
        z = 2,0 m  ->            74 %
        z = 3,78 m (= 1,89·B) -> 100 %  (cruzamento)
        z = 8,0 m  ->           138 %
      Isto é: SUBESTIMA na faixa rasa, que é onde o recalque se acumula, e
      superestima abaixo do bulbo, onde já quase não há tensão. Integrando
      dsigma·dz de 0 a 2B — proxy direto do recalque em meio homogêneo — o
      2V:1H entrega 0,748 do valor de Boussinesq, e o fator é praticamente
      invariante com a geometria (0,748 para 2x2, 2x4, 1,2x1,2 e 4x4; 0,797 se
      integrado até 4B). Ou seja: trocar Boussinesq por 2V:1H em recalque
      produz recalque cerca de 25 % MENOR, DO LADO INSEGURO, de forma
      sistemática e não aleatória.
    uso_autorizado: >-
      (1) VISUALIZAÇÃO. Traçado da pirâmide/tronco de espraiamento no corte, como
      ALTERNATIVA selecionável ao bulbo de Boussinesq já existente, e os valores
      de dsigma_z NAS COTAS DAS INTERFACES (q_i, i = 0 na base da sapata)
      exibidos junto ao desenho e no memorial, cada um acompanhado da largura
      equivalente da MESMA interface (a_eq,i / b_eq,i). Aqui — e só aqui, ao
      contrário do Boussinesq — a largura é a própria geometria do método:
      a_eq = a+z e b_eq = b+z, exato por construção do 2V:1H (perna 1). Ver
      REQ-PROP-03 para a definição operacional dos símbolos, obrigatória.
      (2) Comparação lado a lado com Boussinesq — inclusive, e de preferência,
      mostrando a divergência acima, que é informação útil ao projetista.
      Em ambos os casos, com rótulo visível de método não normativo.
    nao_autorizado: >-
      (a) ALIMENTAR RECALQUE. O ramo `usar_boussinesq=False` de
      `recalques.py:263-266` está PROIBIDO de ser exposto na UI, ligado por
      default ou usado em memorial, pelo fator 0,748 medido acima. Fica
      PENDENTE_HUMANO próprio — ver kb/pendencias.md, rodada 2026-08-27 (c).
      Hoje o default é `usar_boussinesq: bool = True` e nenhum chamador passa
      False; o ramo é inalcançável na prática. MANTER assim. A4 não pode
      adicionar o seletor.
      (b) VERIFICAÇÃO DE CAMADA SUBJACENTE — mesma proibição, e pelo mesmo
      motivo, de PC-BOUSSINESQ-NEWMARK-canto-retangulo > nao_autorizado (a).
      Com o 2V:1H o risco é maior: subestima dsigma em até 37 % na faixa rasa,
      que é justamente onde costuma estar a camada mole que se quer verificar.
      (c) ÂNGULO VARIÁVEL POR CAMADA. Aprovou-se UM ângulo, 26,57°, constante do
      topo ao fundo. Adotar ângulos diferentes por camada (30°, 45° em camada de
      reforço etc.) é OUTRO método, não é este, não tem verificação de
      equilíbrio feita e NÃO está aprovado. Nem a perna 1 sustenta isso: com
      ângulo variável a área alargada deixa de ser (a+z)(b+z) e a fórmula muda.
      (d) CAMADA DE REFORÇO / LASTRO DE RACHÃO — ver `espaco_de_aplicacao`.
    espaco_de_aplicacao: >-
      DECLARAÇÃO EXPLÍCITA, pedida nesta rodada e necessária para não prometer
      cobertura que não existe. Este método é autorizado para o PERFIL
      GEOTÉCNICO GERAL abaixo da base da sapata — solo natural estratificado,
      mesmíssimo uso que o bulbo de Boussinesq já tem em `_bulbo()`. A
      visualização continua desenhando as camadas de solo natural coloridas que
      `PerfilCortes` já desenha, ganhando o espraiamento simplificado como
      alternativa ao bulbo.
      NÃO É AUTORIZADO como cálculo de camada de reforço, lastro de rachão,
      colchão granular ou substituição de solo mole. Dois motivos independentes,
      e cada um bastaria:
      (i) NORMATIVO — a NBR 6122:2022 §1 (Escopo) EXCLUI "melhoramento do solo"
      do que ela cobre. Levantamento do a1, conferido: a exclusão é por
      declaração da norma, não por omissão. Não existe, e não existirá, item da
      NBR 6122 para citar num dimensionamento de lastro. Qualquer memorial que
      insinue isso é falso.
      (ii) FÍSICO, e é o que realmente impede — o 2V:1H de ângulo único pressupõe
      MEIO HOMOGÊNEO. O efeito inteiro de um lastro de rachão é o contraste de
      rigidez: a camada rígida espraia MAIS que o solo mole embaixo dela, e é
      disso que vem o benefício. Um método de ângulo constante não enxerga
      contraste de rigidez — logo não pode quantificar o benefício que o lastro
      existe para produzir. Usá-lo ali não é falta de respaldo normativo: é
      erro de modelo.
    dominio_de_validade: >-
      z >= 0 a partir da BASE da sapata. a > 0, b > 0. q = pressão LÍQUIDA.
      TETO DE PROFUNDIDADE — não há teto na implementação e a fórmula segue
      "funcionando" para qualquer z (tende a 0, o que é correto). Limite
      RECOMENDADO de exibição: z <= 2·B (mesmo bulbo de 2B que
      `recalques.py:251` já usa) e, de todo modo, nunca além da profundidade do
      perfil geotécnico informado. Abaixo de ~1,9·B o 2V:1H passa a superestimar
      Boussinesq e a comparação entre os dois inverte de sinal — exibir sem
      aviso ali confunde o leitor do memorial.
      LIMITES LATERAIS ASSUMIDOS, registrados e NÃO implementados por decisão
      (registrar, não implementar — foi o pedido, e é o certo: implementar
      contorno lateral exigiria decidir o que fazer quando a pirâmide sai do
      terreno, e isso é julgamento):
      (i) MACIÇO LATERALMENTE ILIMITADO. A pirâmide de espraiamento pode, para z
      grande, exceder as dimensões do terreno modelado, de um talude próximo, de
      uma divisa ou de uma escavação vizinha. Nada disso é verificado. Se a
      pirâmide "sai" do maciço, o resultado deixa de ter significado e o
      software não avisa.
      (ii) SAPATA ISOLADA, SEM VIZINHA. Pirâmides de sapatas vizinhas se
      superpõem e as tensões se somam — o método, como está, ignora
      completamente. Fora do escopo declarado do projeto ("sapata isolada"), mas
      registrado porque é o erro que um usuário comete sozinho, olhando um
      desenho bonito de uma sapata só.
      ARMADILHA DE CITAÇÃO, herdada do levantamento do a1 e repetida aqui porque
      é onde alguém vai procurar: NÃO citar §7.7.4 (alfa >= 60°/45°/30°) como
      ângulo de espraiamento — é proteção geométrica entre fundações em cotas
      diferentes, e cresce quando o solo PIORA, comportamento oposto ao de um
      ângulo de difusão. NÃO citar §7.8.2 (beta >= 60°) — é geometria do bloco
      de concreto. NÃO citar §8.3 (sapata hipotética a f/3) — é fundação
      profunda e mantém o contorno do grupo SEM alargamento com a profundidade.
    defeitos_detectados: >-
      Três, todos para A4 tratar, nenhum bloqueante da aprovação:
      (1) DUPLICAÇÃO. `recalques.py:265-266` reescreve a expressão à mão em vez
      de chamar `acrescimo_tensao_2v1h`. Duas cópias da mesma fórmula em módulos
      diferentes é exatamente como uma delas fica para trás numa correção
      futura. Unificar chamando a função — sem alterar resultado.
      (2) z NEGATIVO SEM GUARDA, pior que no Boussinesq: `acrescimo_tensao_2v1h`
      não tem guarda nenhuma. Com a=b=2,0 m e q=200 kPa, z = -1,0 m retorna
      800 kPa — QUATRO VEZES q, tensão crescendo para cima, fisicamente
      impossível — e z = -2,0 m (z = -a) levanta ZeroDivisionError. Validar
      z >= 0 no chamador.
      (3) A função está sem teste. `tests/test_sapata_isolada_sanidade.py`
      cobre `influencia_canto_retangulo` e `acrescimo_tensao_centro` e não toca
      no 2V:1H. Os testes a criar estão em `requisitos_para_a4`.

  # ===========================================================================
  # VERSÃO 9 — FORMULAÇÕES BIBLIOGRÁFICAS (Cintra/Aoki/Albiero, 2011).
  #
  # `natureza: FORMULACAO_BIBLIOGRAFICA_SECUNDARIA` é subtipo criado na v9. Vive
  # nesta seção pelos mesmos motivos das duas entradas acima e com as mesmas
  # consequências: conta como autorização para a regra 2 do CLAUDE.md, NÃO
  # fornece item normativo para a regra 3, e a docstring cita `[pratica: <id>]`,
  # JAMAIS `[rule: <id>]`. Um `[rule: ]` apontando para um id desta seção é
  # defeito e o a6 deve tratá-lo como tal.
  #
  # A diferença para `PRATICA_CONSAGRADA`: ali a confiança vinha de verificação
  # matemática própria do a2 sobre uma expressão SEM fonte no acervo. Aqui há
  # fonte — um livro-texto de referência (EESC-USP, Oficina de Textos) — mas ela
  # é NÃO NORMATIVA, é de 2011, refere-se à NBR 6122:2010 e reproduz autores
  # cujos textos primários (Teixeira 1996/SEFE III, Vesic 1975, Terzaghi 1943,
  # Skempton 1951, De Beer 1967) continuam AUSENTES do acervo. Toda entrada
  # abaixo é, portanto, citação de segunda mão, e isso está dito em cada uma.
  # ===========================================================================

  - id: FB-CINTRA-TERZAGHI-VESIC-capacidade-de-carga
    natureza: FORMULACAO_BIBLIOGRAFICA_SECUNDARIA
    citacao_em_codigo: "[pratica: FB-CINTRA-TERZAGHI-VESIC-capacidade-de-carga]"
    metodo: admissivel
    status: APROVADA_COM_USO_RESTRITO
    respaldo_normativo: >-
      NENHUM quanto à EQUAÇÃO. A NBR 6122:2022 §7.3.2 AUTORIZA "métodos
      analíticos (teorias de capacidade de carga)" mas não reproduz nenhum —
      busca negativa do a1 reconferida pelo a2 na camada de texto do PDF do
      acervo. O que é normativo é o invólucro: 7.3.2 (autorização + condição
      suspensiva de 2022), Tabela 1 linha "Analíticos" (FSg = 3,00 fixo), nota
      (b) da Tabela 1 (c e phi CARACTERÍSTICOS, sem minoração) e 7.4 (ELS).
    fonte: >-
      CINTRA, J.C.A.; AOKI, N.; ALBIERO, J.H. "Fundações Diretas: Projeto
      Geotécnico". São Paulo: Oficina de Textos, 2011. Itens 2.2.1, 2.2.2,
      2.2.4, 2.2.6, 2.3.1 e Tabs. 2.2 e 2.3, impressas 28-33.
      Cláusulas: CINTRA-2.2-terzaghi-hipoteses,
      CINTRA-2.2.1-2.2.4-terzaghi-equacao-geral,
      CINTRA-2.2.6-puncionamento-reducao-2-3,
      CINTRA-2.3.1-vesic-Ngamma-e-tabela-2.2, CINTRA-Tab2.3-fatores-forma-de-beer.
      Fórmulas: CINTRA-2.2.4-terzaghi-capacidade-de-carga,
      CINTRA-2.3.1-vesic-N-gamma, CINTRA-Tab2.3-de-beer-fatores-de-forma,
      CINTRA-VESIC-tabela-2.2-fatores-capacidade-carga,
      CINTRA-2.2.6-terzaghi-puncionamento.
    formula: |
      sigma_r = c·Nc·Sc + q·Nq·Sq + (1/2)·gamma·B·N_gamma·S_gamma       [kPa]
      com q = gamma·h

      Nq      = e^(pi·tg phi) · tg²(45° + phi/2)          (Reissner, 1924)
      Nc      = (Nq - 1)·cotg phi                          (Prandtl, 1921)
      Nc(0)   = 2 + pi = 5,14159...                        (limite; ver guarda)
      N_gamma = 2·(Nq + 1)·tg phi                          (Caquot-Kérisel/Vesic)

      Fatores de forma de De Beer (Tab. 2.3):
        Corrida ............ Sc = 1        Sq = 1              S_gamma = 1
        Retangular ......... Sc = 1+(B/L)(Nq/Nc)  Sq = 1+(B/L)tg phi
                             S_gamma = 1 - 0,4(B/L)
        Circular/Quadrada .. Sc = 1+(Nq/Nc)       Sq = 1+tg phi
                             S_gamma = 0,60

      Puncionamento (solos fofos ou moles):
        c*   = (2/3)·c
        phi* = arctg( (2/3)·tg phi )        <-- reduz a TANGENTE, não o ângulo
        Nc', Nq', N_gamma' calculados com phi*; os fatores de FORMA NÃO são
        reduzidos (aparecem sem linha na fonte — conferido em duas passadas
        pelo a1 e coerente com a redação).
    decisao_1_forma_fechada_e_nao_consulta_a_tabela: >-
      DECISÃO CENTRAL DESTA ENTRADA, e ela resolve de uma vez quatro problemas
      que o a1 despachou separados. O software deve calcular Nc, Nq e N_gamma
      pelas FORMAS FECHADAS acima, e NÃO por consulta à Tab. 2.2.
      FUNDAMENTO — a própria fonte diz que a tabela FOI DERIVADA das equações:
      "Com essa equação e as equações de Nq e Nc apresentadas no item 2.2.2,
      Vesic calcula os valores dos fatores de capacidade de carga em função de
      phi, reproduzidos na Tab. 2.2" (impressa 32). A tabela é saída, não
      entrada. E o a2 CONFIRMOU essa derivação numericamente: recalculadas as
      51 linhas x 5 colunas a partir das formas fechadas, as 255 células batem
      com erro relativo < 0,1 % (230 por arredondamento exato a duas casas; 24
      diferindo apenas no último dígito, sempre para cima, +0,005 a +0,03).
      O QUE ISSO RESOLVE:
      (a) INTERPOLAÇÃO — a Tab. 2.2 só tem phi INTEIRO de 0 a 50, e a fonte não
          declara regra de interpolação (o a1 registrou como NAO_DECLARADO e
          deixou para o a2). Com forma fechada não há o que interpolar: phi
          real entra direto. O problema deixa de existir em vez de ser
          decidido por arbitragem.
      (b) PUNCIONAMENTO — phi* = arctg((2/3)tg phi) quase nunca é inteiro, o
          que reintroduziria a interpolação com força total. Some também.
      (c) A ANOMALIA phi = 0 DA COLUNA Nq/Nc — ver decisão 2.
      (d) phi > 50° — a tabela não cobre; a forma fechada cobre, mas o domínio
          declarado da FONTE continua sendo 0 a 50 e a guarda permanece (ver
          `dominio_de_validade`). Forma fechada não amplia domínio; só remove
          a limitação de granularidade.
      A Tab. 2.2 permanece em kb/formulas.yaml e passa a ter OUTRO papel, que é
      melhor do que o de tabela de consulta: FIXTURE DE VALIDAÇÃO. Ver
      REQ-SIGMA-11.
    decisao_2_o_Nq_sobre_Nc_de_phi_igual_a_zero: >-
      QUESTÃO 3 DESPACHADA AO a2: a fonte imprime Nq/Nc = 0,20 na linha phi = 0,
      mas 1,00/5,14 = 0,1945, que arredondaria para 0,19.
      DECISÃO: o software CALCULA Nq/Nc a partir de Nc e Nq. Nunca armazena a
      coluna, nunca usa o 0,20 impresso.
      FUNDAMENTO 1, e é o decisivo: Nq/Nc NÃO É UM DADO. É um QUOCIENTE DE DUAS
      OUTRAS COLUNAS DA MESMA TABELA, publicado por conveniência porque os
      fatores de forma de De Beer o exigem (a própria fonte diz isso: "que
      contém duas colunas adicionais para a relação Nq/Nc e para tg phi, valores
      que serão exigidos no próximo item"). Uma coluna derivada não pode
      sobrepor-se aos seus próprios operandos. Usar 0,20 junto com Nc = 5,14 e
      Nq = 1,00 tornaria a tabela internamente incoerente.
      FUNDAMENTO 2, quantitativo: nas 255 células, o desvio relativo desta é
      2,8 % — cerca de VINTE VEZES o de qualquer outra. Não é o padrão de
      arredondamento da fonte; é anomalia isolada.
      FUNDAMENTO 3, o mecanismo: o a2 verificou no render da impressa 33 que a
      linha phi = 1 TAMBÉM imprime 0,20 — e ali 0,20 está CERTO
      (1,09/5,38 = 0,2026). É repetição de célula entre linhas adjacentes,
      erro tipográfico banal e reconhecível.
      IMPACTO, medido e pequeno, mas no lugar errado: afeta Sc = 1 + Nq/Nc de
      sapata quadrada/retangular em solo com phi = 0 — que é exatamente o caso
      de ARGILA NÃO DRENADA. Com o valor calculado, Sc(quadrada, phi=0) =
      1,1945; com o impresso, 1,2000. Diferença de 0,5 %, do lado conservador
      ao calcular. CORROBORAÇÃO INDEPENDENTE: Skempton (item 2.4.1 da mesma
      fonte) dá Sc = 1 + 0,2(B/L), isto é, 1,20 para B = L. Os dois caminhos da
      fonte convergem em 0,5 %, o que confirma que 0,1945 é o valor coerente e
      sugere que o 0,20 impresso é arredondamento na direção do valor de
      Skempton. Nada disso muda a decisão: calcular.
    decisao_3_de_onde_vem_c_e_phi: >-
      NESTA VERSÃO, c e phi são ENTRADA DIRETA DO ENGENHEIRO, em valores
      CARACTERÍSTICOS, e NÃO são derivados de N_SPT.
      FUNDAMENTO NORMATIVO: é o que a nota (b) da Tabela 1 pressupõe ("sem
      aplicação de coeficientes de ponderação aos parâmetros de resistência do
      terreno") e o que a NBR 6122:2022 §4.6.2 contempla como origem prescrita
      de c e phi ("Ensaio de cisalhamento direto [...] visa determinar os
      parâmetros de resistência ao cisalhamento do solo (coesão e ângulo de
      atrito)") — item da Seção 4.6, ensaios de LABORATÓRIO. Para a Norma, c e
      phi vêm de ensaio.
      FUNDAMENTO MEDIDO: as correlações N_SPT -> phi da fonte NÃO são
      aprováveis nesta rodada (ver FB-CINTRA-2.9.2-phi-por-Nspt) e injetá-las
      aqui contaminaria um caminho que de resto é sólido. Ligar as duas coisas
      depois é trivial; separá-las depois, não.
      CONSEQUÊNCIA PARA O ESCOPO: "sigma_adm a partir de SPT" é entregue nesta
      versão pelo caminho SEMIEMPÍRICO (Teixeira, regra N/50). O caminho
      teórico é entregue como "capacidade de carga a partir de c e phi
      fornecidos". São duas features, não uma.
    decisao_4_a_ruptura_local_dos_autores_nao_entra: >-
      QUESTÃO 2 DESPACHADA AO a2 (registro
      CINTRA-2.4-procedimento-adotado-pelos-autores, status
      HIPOTESE_DE_AUTOR_AGUARDA_A2). Os autores adotam, "na ausência de
      indicação específica na literatura", a MÉDIA ARITMÉTICA entre ruptura
      geral e puncionamento para o modo intermediário que chamam de "ruptura
      local". NÃO ENTRA nesta versão. Ver o registro dedicado
      FB-CINTRA-2.4-ruptura-local-media, PENDENTE_HUMANO — a razão principal é
      que a média é inseparável do SELETOR de modo (Fig. 2.21), e o seletor não
      é implementável (ver FB-CINTRA-2.9.4-diagrama-modo-de-ruptura,
      REJEITADA).
      CONSEQUÊNCIA DIRETA: o MODO DE RUPTURA é ENTRADA DECLARADA PELO USUÁRIO,
      restrita a dois valores — "geral" ou "puncionamento". O software NÃO
      infere o modo. Não há terceira opção nesta versão. REQ-SIGMA-12.
    dominio_de_validade: >-
      DECLARADO EXPLICITAMENTE NA FONTE (item 2.2, impressa 26) e é o campo que
      impede o uso indevido. Cada item vira guarda que RECUSA (REQ-SIGMA-07):
      (1) SAPATA CORRIDA, L >= 5B, no desenvolvimento original. Os fatores de
          forma de De Beer relaxam ESTA hipótese e SOMENTE ela — é para isso
          que servem — e cobrem corrida, retangular, quadrada e circular.
      (2) EMBUTIMENTO h <= B. É o que autoriza desprezar a resistência ao
          cisalhamento da camada acima da cota de apoio e trocá-la pela
          sobrecarga q = gamma·h. Para h > B a substituição NÃO está
          justificada pela fonte, e o erro é do lado INSEGURO (subestima-se a
          resistência mobilizada acima da base, mas superestima-se a validade
          da equação). GUARDA DURA: recusar h > B.
      (3) RUPTURA GERAL (maciço rígido) ou PUNCIONAMENTO (fofo/mole, com c* e
          phi*), declarados pelo usuário. Sem terceiro modo.
      (4) SOLO HOMOGÊNEO. O caso estratificado é tratado no item 2.5 da fonte
          (impressas 36-40), NÃO EXTRAÍDO em nenhuma rodada. É o risco que o
          CLAUDE.md nomeia. GUARDA DURA: recusar perfil com mais de uma camada
          no bulbo, ou exigir que o usuário declare a camada equivalente.
      (5) phi entre 0 e 50 graus — extensão declarada da Tab. 2.2 da fonte.
          Recusar fora. Que a forma fechada saiba calcular phi = 55° não é
          autorização para usá-la.
      (6) A própria fonte qualifica a equação de APROXIMADA, por ser
          superposição de três casos particulares que não se somam
          rigorosamente. O rótulo do memorial deve dizê-lo.
      (7) gamma é o peso específico EFETIVO (declarado na impressa 26), e a
          fonte avisa que gamma acima e abaixo da cota da base podem ser
          diferentes apesar do mesmo símbolo. Dois campos separados na
          interface, nunca um só. Ver o alerta em `nao_autorizado` (c).
    checagem_dimensional: >-
      `tools/checar_dimensoes.py` (criado nesta rodada), com pint. As três
      parcelas fecham em kPa: c·Nc·Sc [kPa]; q·Nq·Sq com q = gamma·h
      [kN/m³·m = kPa]; (1/2)·gamma·B·N_gamma·S_gamma [kN/m³·m = kPa]. Soma
      homogênea. TRÊS MUTANTES PLANTADOS E TODOS REJEITADOS pelo pint:
      (i) parcela de peso sem o B -> kN/m³, DimensionalityError;
      (ii) B² no lugar de B -> kN/m, DimensionalityError;
      (iii) q trocado por h (gamma esquecido) -> m, DimensionalityError.
      Ou seja, a checagem dimensional TEM poder real aqui — ao contrário do que
      acontece nas correlações empíricas — e pegaria os erros de transcrição
      mais prováveis desta equação. Os fatores de forma e Nq/Nc saem
      `dimensionless`, pré-requisito de tg e das somas "1 + ...".
    checagem_numerica: >-
      Valores típicos de a2-verificador.md (N_SPT = 15, B = 2,0 m, h = 1,5 m,
      quadrada, De Beer):
      - AREIA, c = 0, phi = 32,3°, gamma = 19 kN/m³: sigma_r = 1481 kPa,
        sigma_r/3 = 494 kPa. Dentro da faixa plausível de 50-600 kPa.
      - ARGILA NÃO DRENADA, phi = 0, c = 150 kPa: Nc = 5,142, Nq = 1,00,
        N_gamma = 0, Sc = 1,1945; sigma_r = 950 kPa, sigma_r/3 = 317 kPa.
        Dentro da faixa.
      Contorno: phi = 0 -> Nq = 1,00 exato, N_gamma = 0,00 exato, Nc = 2+pi.
      Bate com a linha phi = 0 da Tab. 2.2 impressa. phi = 30 -> Nc 30,14,
      Nq 18,40, N_gamma 22,40: idênticos aos impressos.
      DISPERSÃO MEDIDA E REGISTRADA COMO ALERTA, não como defeito: trocar os
      fatores de forma de De Beer (Tab. 2.3) pelos de Terzaghi-Peck (Tab. 2.1)
      no mesmo caso muda sigma_adm de 494 para 369 kPa — 26,8 %. Os dois
      conjuntos estão na mesma fonte e a fonte NÃO autoriza misturá-los. Ver
      `nao_autorizado` (a).
    uso_autorizado: >-
      (1) Cálculo de sigma_r (capacidade de carga do SISTEMA sapata-solo) a
          partir de c e phi CARACTERÍSTICOS fornecidos pelo engenheiro, com
          modo de ruptura declarado (geral ou puncionamento), dentro do domínio
          de (1)-(7) acima, com os fatores de forma de DE BEER (Tab. 2.3).
      (2) Divisão por FSg conforme FB-CINTRA-4.1.1-sigma-adm-teorico-FS3, para
          obter a PARCELA DE ELU da tensão admissível — nunca "a tensão
          admissível" (NBR6122-7.3-7.4-conjuncao-ELU-ELS).
      (3) A Tab. 2.2 como fixture de teste (REQ-SIGMA-11).
      Fora disso, nada.
    nao_autorizado: >-
      (a) MISTURAR OS DOIS CONJUNTOS DE FATORES. Sc/Sq/S_gamma de Terzaghi-Peck
          (Tab. 2.1) com N de Vesic, ou vice-versa. São dois pacotes coerentes
          entre si e a fonte não autoriza cruzá-los. A v9 aprova SOMENTE o
          pacote Vesic + De Beer. A Tab. 2.1 NÃO é aprovada e não deve ser
          implementada: ela sequer cobre sapata retangular, e interpolar entre
          "quadrada" e "corrida" seria invenção.
      (b) N_gamma DE TERZAGHI PURO. A fonte afirma textualmente que "não há
          solução analítica para N_gamma" e a expressão que exibe,
          N_gamma = 4·Ep/(gamma·B²)·cos(alpha - phi), depende do empuxo passivo
          Ep, que ela NÃO fornece, e de um ângulo alpha obtido por minimização
          numérica. NÃO transformar em código, em nenhuma hipótese. Nada foi
          escrito em kb a partir dela e nada deve ser escrito em calc_core. A
          Fig. 2.9 é GRÁFICO e também não é fonte de número.
      (c) gamma ÚNICO ACIMA E ABAIXO DA BASE quando os solos diferem, e gamma
          TOTAL onde a fonte pede EFETIVO. A fonte tem, na impressa 46, uma
          CONTRADIÇÃO INTERNA NÃO RESOLVIDA sobre peso específico saturado x
          submerso (ver FB-CINTRA-2.9.3-pesos-especificos, REJEITADA nesta
          versão). Consequência: o software NÃO deve derivar gamma de tabela
          alguma nesta versão. gamma é entrada, e a interface tem de dizer, com
          todas as letras, que abaixo do nível d'água o valor pedido é o
          EFETIVO (submerso). Aplicar 19-21 kN/m³ como se fosse efetivo abaixo
          do N.A. erra gamma por um fator de ~2, sempre do lado INSEGURO.
      (d) SOLO ESTRATIFICADO. Ver domínio (4).
      (e) EXCENTRICIDADE. A regra de área efetiva de Meyerhof (B' = B - 2e_B)
          está extraída em kb (CINTRA-2.4.2-meyerhof-area-efetiva) mas NÃO é
          aprovada nesta versão: está fora do escopo mínimo do CLAUDE.md e a
          fonte não declara limite de excentricidade, nem o que fazer se
          2e_B >= B, nem se as excentricidades são características ou de
          cálculo. Não usar.
      (f) O MÉTODO DE VESIC PARA SOLOS COMPRESSÍVEIS (índice de rigidez Ir,
          Ir_crit, fatores de compressibilidade). A fonte DESCREVE em prosa e
          NÃO imprime nenhuma das fórmulas (registro
          CINTRA-2.3.2-vesic-compressibilidade-formulas-ausentes). Nada foi
          reconstruído e nada pode ser.

  - id: FB-CINTRA-4.1.1-sigma-adm-teorico-FS3
    natureza: FORMULACAO_BIBLIOGRAFICA_SECUNDARIA
    citacao_em_codigo: "[pratica: FB-CINTRA-4.1.1-sigma-adm-teorico-FS3]"
    metodo: admissivel
    status: APROVADA
    respaldo_normativo: >-
      Aqui, ao contrário da entrada anterior, HÁ respaldo direto: a NBR
      6122:2022 Tabela 1, linha "Analíticos", crava FSg = 3,00 (SEM cláusula de
      "no mínimo"). A formulação bibliográfica apenas COINCIDE com a norma. Em
      caso de divergência futura, prevalece a norma, e a citação em memorial
      deve ser [rule: NBR6122-6.2.1.1.1-fatores-seguranca-tabela1], não esta.
    fonte: >-
      Cintra/Aoki/Albiero (2011), item 4.1.1, impressa 111. Cláusula
      CINTRA-4.1.1-metodos-teoricos-FS-3; fórmula
      CINTRA-4.1.1-tensao-admissivel-metodo-teorico.
    formula: "sigma_a <= sigma_r / 3,0        [kPa]"
    conferencia_de_edicao_pelo_a2: >-
      O livro escreve "De acordo com o item 7.3.2 da NRB 6122/2010" (com o typo
      "NRB" no original) e atribui o FS = 3,0 ao item 6.2.1.1.1. O a2
      reconferiu contra a edição 2022 do acervo: a numeração 6.2.1.1.1 e o
      valor 3,00 para "Analíticos" CONTINUAM VÁLIDOS em 2022. A remissão do
      livro sobrevive à mudança de edição neste ponto. NÃO sobrevive no §7.3.2,
      onde a redação mudou de "que contemplam" para "desde que contemplem" —
      ver NBR6122-7.3.2-metodos-teoricos-condicao-2022.
    sigma_r_e_valor_MEDIO: >-
      A fonte insiste, e é requisito de coerência do FS global: sigma_r é o
      VALOR MÉDIO da capacidade de carga, porque "o conceito de FS global é
      inerente ao valor médio de resistência" (impressa 108, citando Cintra e
      Aoki 2010). Consequência prática: alimentar esta divisão com um sigma_r
      calculado a partir de c e phi já tomados como valores CARACTERÍSTICOS
      BAIXOS (quantil inferior) é contar segurança duas vezes. A nota (b) da
      Tabela 1 aponta na mesma direção ao proibir ponderar os parâmetros do
      terreno. Registrar no memorial qual estatística de c e phi foi usada.
    condicao_declarada: >-
      FS = 3,0 vale "na ausência de prova de carga" (declarado na fonte), o que
      corresponde exatamente às duas primeiras linhas da Tabela 1. Com duas ou
      mais provas de carga na fase de projeto, a Tabela 1 permite FSg = 2,00 —
      mas isso exige as duas condições declaradas e verificadas, e não é
      oferecido por default.
    checagem_dimensional: "sigma_r [kPa] / 3,0 [adimensional] -> kPa. Homogêneo."
    checagem_numerica: >-
      sigma_r = 950 kPa (argila não drenada do caso típico) -> 317 kPa;
      sigma_r = 1481 kPa (areia do caso típico) -> 494 kPa. Ambos na faixa
      plausível de 50-600 kPa.
    uso_autorizado: >-
      Dividir por 3,0 o sigma_r produzido por
      FB-CINTRA-TERZAGHI-VESIC-capacidade-de-carga, obtendo a PARCELA DE ELU da
      tensão admissível. Rótulo obrigatório de
      NBR6122-7.3-7.4-conjuncao-ELU-ELS aplica-se.
    nao_autorizado: >-
      Aplicar este FS = 3,0 sobre resultado de correlação SEMIEMPÍRICA. Aquelas
      já embutem o seu próprio FS e a dupla divisão seria erro grosseiro. Ver
      FB-TEIXEIRA-1996-areia > decisao_do_a2_sobre_o_FS_embutido.

  - id: FB-REGRA-BRASILEIRA-Nspt-50-argila
    natureza: FORMULACAO_BIBLIOGRAFICA_SECUNDARIA
    citacao_em_codigo: "[pratica: FB-REGRA-BRASILEIRA-Nspt-50-argila]"
    metodo: admissivel
    status: APROVADA_COM_USO_RESTRITO
    respaldo_normativo: >-
      NENHUM quanto à fórmula. A NBR 6122:2022 §7.3.3 autoriza o PROCEDIMENTO
      (método semiempírico SPT -> sigma_adm) e impõe as três obrigações
      (domínio, dispersão, limitações regionais); não nomeia método nem
      reproduz correlação.
    fonte: >-
      Cintra/Aoki/Albiero (2011), item 4.1.2 a), impressa 112. Cláusula
      CINTRA-4.1.2a-sigma-adm-SPT-regra-Nspt-50; fórmula
      CINTRA-4.1.2a-sigma-adm-SPT-Nspt-50. Página lida integralmente pelo a2 a
      200 dpi nesta rodada (V4 do cabeçalho da v9): todos os elementos
      conferidos, zero divergência com a transcrição do a1.
    formula: |
      sigma_a = N_spt/50 + q        [MPa]      com  5 <= N_spt <= 20
      N_spt = valor MÉDIO NO BULBO DE TENSÕES (não o valor na cota de apoio)
      q     = sobrecarga, PARCELA FACULTATIVA (ver `q_e_facultativo`)
    nome_correto_no_memorial: >-
      PONTO DE ATRIBUIÇÃO LEVANTADO PELO a1 E CONFIRMADO PELO a2 NA LEITURA
      PRÓPRIA DA IMPRESSA 112: a fonte apresenta esta expressão como "regra
      CONHECIDA NO MEIO TÉCNICO BRASILEIRO", e NÃO como "o método de Teixeira".
      O papel de Teixeira (1996) aqui é o de ter DEMONSTRADO a regra para um
      caso particular. Rotular esta fórmula no memorial como "método de
      Teixeira (1996)" é impreciso em relação a esta fonte. Rótulo obrigatório:
      "regra brasileira sigma_a = N_SPT/50, demonstrada por Teixeira (1996) para
      argila". O método de Teixeira propriamente dito é o de AREIA, e é outra
      entrada.
    decisao_do_a2_sobre_o_FS_embutido: >-
      QUESTÃO 1 DESPACHADA AO a2, e aqui ela se resolve por ÁLGEBRA EXATA, sem
      margem. DECISÃO: NÃO aplicar FSg = 3,00 da Tabela 1 sobre este resultado.
      Aplicar seria DUPLA CONTAGEM.
      A DECISÃO NÃO SE APOIA NA PALAVRA DO AUTOR — apoia-se na dedução que a
      fonte IMPRIME e que o a2 leu com os próprios olhos na impressa 112:
          sigma_r = c·Nc,  Nc = 6,  c = 0,01·N_spt [MPa]
          sigma_a = (0,01·N_spt·6)/3 = 0,02·N_spt = N_spt/50
      O "3" está literalmente NO DENOMINADOR da equação impressa. Refazendo:
      sigma_r/sigma_a = 0,06·N_spt / 0,02·N_spt = 3,0000 EXATO, para qualquer
      N_spt. Verificado pelo a2 em N = 5, 10, 15 e 20: 3,0000 nos quatro.
      CONFRONTO COM A NORMA: a Tabela 1, linha "Semiempíricos", exige FSg
      "Valores propostos no próprio processo E NO MÍNIMO 3,00". O valor
      proposto no próprio processo é 3, e 3 >= 3,00. A exigência normativa está
      DEMONSTRADA, não presumida — que é precisamente a distinção que o a1
      levantou ao dizer que "a norma exige que o valor seja verificável, não
      presumido". Aqui ele é verificável em uma linha de álgebra.
      COMO ISSO NÃO VIRA CONFIANÇA CEGA: o FS embutido não fica só neste
      comentário. Vira METADADO CARREGADO PELO CÓDIGO e ASSERÇÃO EXECUTADA em
      tempo de execução — REQ-SIGMA-02. Uma correlação que não declare
      FS_embutido verificável não pode ser usada; é por isso que Mello (1975)
      NÃO é aprovada (FB-MELLO-1975-sigma-adm-SPT).
    q_e_facultativo_e_a_incoerencia_da_fonte: >-
      A fonte diz que a parcela q "pode ou não ser considerada" — o a2 conferiu
      a frase na impressa 112. E a dedução vale para sapata na SUPERFÍCIE
      (h = 0), onde q seria zero por definição. A fonte NÃO concilia as duas
      coisas: exibe um termo "+ q" que a própria dedução exclui, e ainda o torna
      opcional.
      DECISÃO DO a2, conservadora e que não depende de resolver a incoerência:
      o software adota q = 0 por DEFAULT (a forma que a dedução sustenta), e
      permite ao usuário LIGAR a parcela q por escolha explícita, com aviso de
      que é acréscimo não sustentado pela dedução da fonte. Ligar q só pode
      AUMENTAR sigma_a; portanto o default (q = 0) é o lado seguro, e a
      incoerência da fonte fica registrada em vez de arbitrada. REQ-SIGMA-13.
    dominio_de_validade: >-
      FAIXA EXPLÍCITA, DECLARADA EM TEXTO NA FONTE e conferida pelo a2:
      5 <= N_spt <= 20. Fora dela a fonte NÃO autoriza a fórmula. Guarda dura:
      RECUSAR, com exceção, N_spt < 5 ou N_spt > 20. Não aproximar, não clampar.
      DOMÍNIO DA DEDUÇÃO, também declarado e igualmente vinculante:
      (1) terreno PURAMENTE ARGILOSO;
      (2) sapata RETANGULAR (inclui quadrada);
      (3) apoiada na SUPERFÍCIE (h = 0) — ver `q_e_facultativo...`;
      (4) capacidade de carga por SKEMPTON (1951) com Nc = 6;
      (5) c = 0,01·N_spt [MPa], correlação de Teixeira e Godoy (1996);
      (6) FS = 3 embutido;
      (7) N_spt é o VALOR MÉDIO NO BULBO DE TENSÕES, não o valor na cota de
          apoio. Erro provável de wiring, e nada no cálculo o denuncia: o
          resultado sai plausível de qualquer jeito. Guarda: a entrada tem de
          se chamar `N_spt_medio_bulbo` e a UI tem de dizer de onde vem.
      (8) unidade de saída MPa; se q for usado, q tem de entrar em MPa.
      A GUARDA DE FAIXA É TAMBÉM SANITY CHECK, e isso é uma propriedade útil
      desta regra: 5 <= N_spt <= 20 confina o resultado a 100-400 kPa, isto é,
      inteiramente DENTRO da faixa plausível de 50-600 kPa. Fora da faixa o
      resultado degenera depressa — N_spt = 50 daria 1000 kPa, muito acima do
      plausível para sapata. A guarda protege duas vezes.
    checagem_dimensional: >-
      NÃO HOMOGÊNEA por construção, e declarada como tal em
      `tools/checar_dimensoes.py`: N_spt/50 é número puro somado a q em MPa; só
      fecha atribuindo MPa/golpe ao divisor 50. A análise dimensional NÃO tem
      poder sobre esta fórmula e NÃO pode ser usada como validação dela.
      ARMADILHA QUE A ANÁLISE DIMENSIONAL NÃO PEGA, e por isso vira requisito:
      como o termo "+ q" JÁ é uma tensão, passar q em kPa em vez de MPa produz
      erro de fator 1000 que nenhuma checagem de dimensão acusa — os dois
      termos são "tensão". REQ-SIGMA-03.
    checagem_numerica: >-
      N_spt = 15 (caso típico de a2-verificador.md), q = 0: sigma_a = 0,300 MPa
      = 300 kPa. Faixa plausível OK. Contornos da faixa declarada: N = 5 ->
      100 kPa; N = 20 -> 400 kPa. Coerência com as outras duas correlações no
      mesmo N = 15: Teixeira areia (B = 2 m) 320 kPa, Mello 287 kPa. Três
      correlações de origem independente dentro de 11 % — convergência que
      apoia a transcrição das três.
    uso_autorizado: >-
      sigma_adm (parcela de ELU) de sapata retangular ou quadrada em terreno
      PURAMENTE ARGILOSO, com 5 <= N_spt <= 20 médio no bulbo, sem aplicação de
      FSg adicional, com o rótulo de NBR6122-7.3-7.4-conjuncao-ELU-ELS e com a
      declaração de aplicabilidade regional de REQ-SIGMA-06.
    nao_autorizado: >-
      (a) Aplicar FSg = 3,00 por cima. (b) Usar em areia, silte, solo
      intermediário ou perfil estratificado — é "puramente argiloso" na fonte.
      (c) Extrapolar N_spt fora de 5-20. (d) Usar N_spt da cota de apoio em vez
      da média no bulbo. (e) Rotular como "método de Teixeira" — ver
      `nome_correto_no_memorial`. (f) Somar q em kPa.

  - id: FB-TEIXEIRA-1996-areia
    natureza: FORMULACAO_BIBLIOGRAFICA_SECUNDARIA
    citacao_em_codigo: "[pratica: FB-TEIXEIRA-1996-areia]"
    metodo: admissivel
    status: APROVADA_COM_USO_RESTRITO
    respaldo_normativo: "NENHUM quanto à fórmula. NBR 6122:2022 §7.3.3 autoriza o procedimento."
    fonte: >-
      Cintra/Aoki/Albiero (2011), item 4.1.2 a), impressa 113, com Fig. 4.1.
      Cláusula CINTRA-4.1.2a-teixeira-1996-sigma-adm-areia; fórmula
      CINTRA-4.1.2a-teixeira-1996-areia. Referência PRIMÁRIA — TEIXEIRA, A.H.
      "Projeto e execução de fundações", SEFE III, São Paulo, 1996 — CONTINUA
      AUSENTE do acervo. Isto aqui é reprodução de segunda mão, e a aprovação é
      dada nessas condições, não apesar delas: ver `por_que_a_segunda_mao_basta`.
    formula: |
      sigma_a = 0,05 + (1 + 0,4·B)·N_spt/100        [MPa]
      B em METROS (o coeficiente 0,4 carrega 1/m; o 0,05 carrega MPa)
    parametros_CONGELADOS_na_deducao: >-
      NÃO SÃO VARIÁVEIS DA FÓRMULA. São hipóteses congeladas, e é o que torna o
      domínio desta correlação tão estreito:
        profundidade de apoio ....... h = 1,5 m  (FIXA)
        peso específico da areia .... gamma = 18 kN/m³  (FIXO)
        forma ....................... sapata QUADRADA de lado B
        correlação de phi ........... phi = sqrt(20·N_spt) + 15°  (de TEIXEIRA,
                                      NÃO a de Godoy)
        capacidade de carga base .... TERZAGHI
        fator de segurança .......... 3, JÁ EMBUTIDO
    decisao_do_a2_sobre_o_FS_embutido: >-
      QUESTÃO 1 DESPACHADA AO a2. Aqui, ao contrário da regra N/50, NÃO há
      álgebra fechada: a fonte declara "com o fator de segurança 3" mas não
      imprime a dedução. Aceitar a declaração do autor seria exatamente o que o
      enunciado da questão proíbe ("NÃO aplicar seria assumir que 'no mínimo
      3,00' já está satisfeito só porque o autor diz que está"). Então o a2
      MEDIU.
      RECONSTRUÇÃO INDEPENDENTE FEITA PELO a2 (V7 do cabeçalho da v9): partindo
      dos parâmetros congelados declarados — h = 1,5 m, gamma = 18 kN/m³,
      sapata quadrada, phi = sqrt(20·N_spt) + 15°, c = 0 (areia) — recalculou-se
      sigma_r = q·Nq·Sq + (1/2)·gamma·B·N_gamma·S_gamma pela equação de
      Terzaghi que a fonte diz ter sido usada, e comparou-se com a fórmula
      publicada. O FS embutido implícito é sigma_r_reconstruído /
      sigma_a_publicada:
              N_spt |  B=1m   B=2m   B=3m
                  5 |  3,05   3,17   3,27
                  8 |  3,07   3,15   3,21
                 10 |  3,12   3,20   3,25
                 15 |  3,38   3,46   3,51
                 20 |  3,77   3,88   3,95
                 25 |  4,30   4,45   4,55
      (com os fatores de forma de Terzaghi-Peck, que são a leitura MENOS
      favorável das duas; com De Beer o FS implícito é ainda MAIOR.)
      TRÊS CONCLUSÕES, todas medidas:
      (1) O FS embutido é >= 3,05 em TODO o domínio testado, e nunca menor que
          3,00. A exigência da Tabela 1 ("no mínimo 3,00") está SATISFEITA E
          DEMONSTRADA, não presumida.
      (2) O "3" declarado pelo autor é REAL. Controle: se o FS embutido fosse 1
          e não 3, os valores acima seriam 1,02 a 1,52 — inequivocamente abaixo
          de 3,00. A reconstrução distingue as duas hipóteses com folga.
      (3) A fórmula publicada é uma LINEARIZAÇÃO. O sigma_r verdadeiro cresce
          exponencialmente com N_spt (via phi no expoente de Nq), a fórmula
          cresce linearmente; por isso o FS implícito sobe de 3,05 para 4,55 ao
          longo do domínio. A divergência é sempre no sentido
          publicada < reconstruída, isto é, CONSERVADORA. Isso é evidência
          independente de que a transcrição está certa (uma constante trocada
          quebraria a concordância também no extremo inferior, onde ela é de
          2 a 9 %) e de que a extrapolação para N_spt alto, embora fora do
          domínio, não seria insegura.
      DECISÃO: NÃO aplicar FSg = 3,00 sobre este resultado. O FS embutido vira
      metadado carregado pelo código e asserção executada (REQ-SIGMA-02), com o
      valor conservador 3,0 registrado como piso verificado.
    por_que_a_segunda_mao_basta: >-
      O a2 não aprovaria uma fórmula de segunda mão apenas por estar impressa.
      O que sustenta esta aprovação é a reconstrução acima: ela verifica a
      fórmula publicada CONTRA a teoria que a fonte declara ter usado, com os
      parâmetros que a fonte declara ter congelado. Se a transcrição de
      Cintra/Aoki/Albiero tivesse deturpado Teixeira — trocado 0,05 por 0,5, ou
      0,4 por 0,04, ou o divisor 100 por 10 — a concordância de 2 a 9 % no
      extremo inferior do domínio não existiria. É o mesmo tipo de argumento
      usado em PC-BOUSSINESQ-NEWMARK-canto-retangulo: a aprovação não depende
      de confiar na citação, e é reprodutível por qualquer pessoa com uma
      planilha. O nome "Teixeira (1996)" é etiqueta; o que foi verificado é a
      aritmética.
    dominio_de_validade: >-
      MUITO ESTREITO. Sete condições, e TODAS viram guarda que RECUSA
      (REQ-SIGMA-04), porque nenhuma delas é aproximável:
      (1) SOLO AREIA. Não silte, não areia argilosa, não solo intermediário.
      (2) SAPATA QUADRADA de lado B. NÃO retangular: a dedução é para B = L.
      (3) B EM METROS. A fórmula não é adimensional.
      (4) h = 1,5 m EXATOS. Ver `por_que_h_nao_pode_ser_afrouxado`.
      (5) gamma = 18 kN/m³ EXATOS. Ver o mesmo campo.
      (6) phi pela correlação de TEIXEIRA — o usuário não escolhe outra aqui,
          porque ela já está dentro das constantes 0,05/0,4/100.
      (7) FS = 3 embutido: proibido dividir de novo.
      FAIXAS NUMÉRICAS — e este é o ponto em que o a2 vai além do texto, com o
      motivo declarado. A fonte NÃO declara em texto faixa de N_spt nem de B
      para esta fórmula; o a1 registrou corretamente que a Fig. 4.1 (eixo N_spt
      de 0 a 25, curvas B = 1, 2 e 3 m) é INDÍCIO e não declaração. O a2
      ADOTA a extensão da figura como guarda: 4 <= N_spt <= 25 e
      1,0 m <= B <= 3,0 m.
      JUSTIFICATIVA DA ADOÇÃO, e ela repousa numa assimetria: uma guarda que
      RECUSA só pode custar usabilidade, nunca segurança. Errar para o lado
      restritivo é gratuito em risco. Ler a extensão de uma figura da própria
      fonte para BOUNDAR não é inventar dado — seria inventar se se lessem
      VALORES da curva, e nenhum valor foi lido dela. Adicionalmente, a
      reconstrução do a2 mostra que a concordância com Terzaghi se degrada
      monotonicamente com N_spt (razão 1,02 em N = 5; 1,15 em N = 15; 1,48 em
      N = 25), o que é evidência independente de que o domínio útil termina
      onde a figura termina. A guarda fica marcada em código como
      `origem: extensao_da_Fig_4_1_nao_declarada_em_texto`, e o afrouxamento
      dela é decisão humana registrada em kb/pendencias.md > V3.
    por_que_h_nao_pode_ser_afrouxado: >-
      Medido pelo a2, porque "h fixo em 1,5 m" parece pedantismo até que se
      olhe o número. Na equação de Terzaghi para areia a parcela de sobrecarga
      q·Nq domina, e q = gamma·h. Recalculando o caso típico (N_spt = 15,
      B = 2,0 m, gamma = 18) apenas variando h:
          h = 0,5 m -> 225 kPa       h = 2,0 m -> 441 kPa  (+19,6 %)
          h = 1,0 m -> 297 kPa       h = 3,0 m -> 586 kPa  (+58,7 %)
          h = 1,5 m -> 369 kPa  (referência)
      A fórmula publicada NÃO TEM h como variável. Aplicá-la com h = 3,0 m não
      é "extrapolar um pouco": é usar um número calculado para outra situação,
      errando ~59 % PARA MENOS — conservador neste sentido, mas é sorte, não
      método, e a assimetria se inverte para h < 1,5 m, onde o uso passa a ser
      INSEGURO em até 39 %. Mesma lógica para gamma: +-2 kN/m³ move o resultado
      +-11 %. GUARDA DURA: recusar h != 1,5 m e gamma != 18 kN/m³. A tolerância
      admissível em torno desses valores é decisão de engenharia e está em
      kb/pendencias.md > V3; até que exista, tolerância zero.
    checagem_dimensional: >-
      NÃO HOMOGÊNEA por construção, declarada em `tools/checar_dimensoes.py`: o
      coeficiente 0,4 carrega 1/m e o 0,05 carrega MPa.
      ARMADILHA QUE A ANÁLISE DIMENSIONAL NÃO PEGA: passar B em centímetros
      produz um número grande e perfeitamente plausível sem nenhum erro
      detectável (B = 200 cm daria 0,05 + 81·0,15 = 12,2 MPa, absurdo, mas
      B = 50 cm daria 3,2 MPa, que "parece" só otimista). Guarda de unidade
      explícita e guarda de faixa: REQ-SIGMA-03 e REQ-SIGMA-04.
    checagem_numerica: >-
      Caso típico (N_spt = 15, B = 2,0 m): sigma_a = 0,05 + 1,8·0,15 = 0,320 MPa
      = 320 kPa. Faixa plausível OK. Contornos do domínio adotado:
      B = 1 m/N = 4 -> 106 kPa; B = 3 m/N = 25 -> 600 kPa (exatamente o topo da
      faixa plausível, o que reforça a guarda). Fora da guarda o resultado
      degenera sem limite: B = 10 m daria 800 kPa, sem base alguma.
      Monotonicidade em B e em N_spt: crescente nas duas, como a Fig. 4.1
      mostra. Coerência com a Fig. 4.1 nos três B plotados: 260/320/380 kPa em
      N = 15, compatíveis com a leitura do gráfico.
    uso_autorizado: >-
      sigma_adm (parcela de ELU) de sapata QUADRADA em AREIA, com h = 1,5 m,
      gamma = 18 kN/m³, 4 <= N_spt <= 25 e 1,0 <= B <= 3,0 m, sem FSg
      adicional, com o rótulo de NBR6122-7.3-7.4-conjuncao-ELU-ELS e a
      declaração regional de REQ-SIGMA-06.
    nao_autorizado: >-
      (a) Aplicar FSg = 3,00 por cima. (b) Sapata retangular ou corrida.
      (c) h != 1,5 m ou gamma != 18 kN/m³. (d) Solo que não seja areia.
      (e) B fora de 1-3 m ou N_spt fora de 4-25. (f) Substituir a correlação de
      phi por outra — as constantes já a incorporam. (g) Usar B em cm.

  - id: FB-MELLO-1975-sigma-adm-SPT
    natureza: FORMULACAO_BIBLIOGRAFICA_SECUNDARIA
    citacao_em_codigo: null
    metodo: admissivel
    status: PENDENTE_HUMANO
    fonte: >-
      Cintra/Aoki/Albiero (2011), item 4.1.2 a), impressa 112. Cláusula
      CINTRA-4.1.2a-mello-1975-sigma-adm-SPT; fórmula CINTRA-4.1.2a-mello-1975.
      Transcrição conferida pelo a2 na leitura própria da impressa 112: o
      radical cobre apenas N_spt, o "-1" está fora dele e o 0,1 multiplica o
      parêntese inteiro. A TRANSCRIÇÃO ESTÁ CERTA — não é por ela que esta
      entrada fica pendente.
    formula: "sigma_a = 0,1·(sqrt(N_spt) - 1)   [MPa]   com  4 <= N_spt <= 16"
    motivo_pendencia: >-
      NÃO É POSSÍVEL DEMONSTRAR O PISO DE 3,00 DA TABELA 1, e a aprovação das
      outras duas correlações desta versão apoia-se exatamente nessa
      demonstração. A diferença é substantiva e é o que justifica tratar as
      três de modo diferente, "regra a regra", como o a1 pediu:
      - regra N/50: FS embutido = 3,0000 por ÁLGEBRA EXATA sobre a dedução que
        a fonte imprime;
      - Teixeira areia: FS embutido = 3,05 a 4,55 por RECONSTRUÇÃO NUMÉRICA do
        a2 a partir dos parâmetros congelados declarados;
      - Mello 1975: a fonte NÃO declara FS algum, NÃO imprime dedução, NÃO diz
        de que teoria a expressão saiu e NÃO distingue tipo de solo ("sem
        distinção de solo", literal). Não há por onde reconstruir. O a1
        registrou honestamente que "por estar sob o título 'métodos
        semiempíricos' presume-se que sim, mas a fonte NÃO afirma isso para
        esta fórmula em particular".
      Aprovar por presunção seria fazer exatamente o que a Tabela 1 impede ao
      exigir "valores propostos no próprio processo E no mínimo 3,00": um valor
      que ninguém consegue exibir não é um valor proposto no processo.
      AGRAVANTE, e vem da própria fonte: a mesma página traz a advertência de
      Mello (1975, p. 61) contra o uso destas expressões — "é preciso analisar
      a origem e validade de tais FORMULÁRIOS DE BOLSO antes de passar a
      aplicá-los inconscientemente e mesmo prejudicialmente em condições que
      extravasam do campo experimental do qual decorreram" — e os autores
      acrescentam que "é sempre questionável a aplicabilidade de correlações
      empíricas desse tipo". Uma correlação cuja própria fonte adverte contra
      ela, e que não exibe FS, não passa por este portão sem um engenheiro.
      OBSERVAR que a faixa de Mello (4 a 16) é DIFERENTE da faixa da regra N/50
      (5 a 20). Não confundir, não unificar.
    pergunta_para_o_humano: >-
      Aceita-se usar sigma_a = 0,1(sqrt(N_spt) - 1) sem conseguir demonstrar
      que o FS embutido atinge o piso de 3,00 da Tabela 1 da NBR 6122:2022,
      apoiando-se apenas em ela estar publicada sob o título "métodos
      semiempíricos"? Impacto se a leitura estiver errada: no caso típico
      (N = 15) ela dá 287 kPa, 4 % abaixo da regra N/50 e 10 % abaixo de
      Teixeira — ou seja, se o FS embutido dela for menor que 3, o desvio é
      pequeno neste ponto, mas não se sabe como se comporta nos extremos da
      faixa. Registrada em kb/pendencias.md > V4.
    uso_ate_la: >-
      PODE ser exibida como valor COMPARATIVO na tela e no memorial, ao lado
      das aprovadas, cumprindo a obrigação (b) de dispersão de dados do §7.3.3
      (REQ-SIGMA-05) — e SOMENTE assim: sem veredito, sem ser selecionável como
      "o" sigma_adm de projeto, sem entrar em nenhuma verificação. É o mesmo
      tratamento de `nao_autorizado` (a) de PC-BOUSSINESQ.

  - id: FB-CINTRA-2.9.2-phi-por-Nspt
    natureza: FORMULACAO_BIBLIOGRAFICA_SECUNDARIA
    citacao_em_codigo: null
    metodo: admissivel
    status: PENDENTE_HUMANO
    fonte: >-
      Cintra/Aoki/Albiero (2011), itens 2.9.1 e 2.9.2, impressas 45-46.
      Cláusulas CINTRA-2.9.1-coesao-teixeira-godoy-1996 e
      CINTRA-2.9.2-angulo-de-atrito-godoy-e-teixeira; fórmulas
      CINTRA-2.9.1-coesao-por-Nspt e CINTRA-2.9.2-angulo-de-atrito-por-Nspt.
    formulas_em_causa: |
      c   = 10·N_spt                    [kPa]   (Teixeira e Godoy, 1996)
      phi = 28° + 0,4·N_spt                     (Godoy, 1983)
      phi = sqrt(20·N_spt) + 15°                (Teixeira, 1996)
    transcricao_conferida_pelo_a2: >-
      A GEOMETRIA DO RADICAL, que o a1 declarou o erro mais provável, foi
      conferida pelo a2 em recorte próprio da impressa 113 a 900 dpi: o vínculo
      da raiz termina depois de "N_spt" e ANTES do "+". Confirmado
      phi = sqrt(20·N_spt) + 15°, e NÃO sqrt(20·N_spt + 15). O a1 acertou, e
      isto fica registrado porque a checagem dimensional NÃO pega este erro
      (ambas as formas somam número puro a ângulo) — só a leitura visual pega.
      A correlação de coesão foi conferida na impressa 112 na forma
      c = 0,01·N_spt [MPa], idêntica a 10·N_spt [kPa]. Consistência interna da
      fonte confirmada em duas páginas.
    motivo_pendencia: >-
      DUAS RAZÕES INDEPENDENTES, e qualquer uma bastaria.
      RAZÃO 1 — DOMÍNIO DE VALIDADE INEXISTENTE, e ele é NORMATIVAMENTE
      OBRIGATÓRIO. A NBR 6122:2022 §7.3.3 manda "observar os domínios de
      validade" e a nota (a) da Tabela 1 repete a exigência. A fonte NÃO
      declara, para NENHUMA das três correlações: faixa de N_spt, tipo de solo,
      limite superior de c ou de phi, nem energia de referência do SPT. O a1
      registrou "NAO_DECLARADO_NA_FONTE" em todos esses campos. O a2 não pode
      inventar uma faixa (aqui, ao contrário do caso de Teixeira, não há sequer
      figura de onde bounder), e aprovar uma correlação de domínio ABERTO
      violaria 7.3.3 diretamente — c = 10·N_spt com N_spt = 40 daria c = 400
      kPa, resistência não drenada implausível para argila.
      RAZÃO 2 — DUAS CORRELAÇÕES DIVERGENTES DE phi SEM CRITÉRIO DE ESCOLHA. A
      fonte apresenta Godoy e Teixeira lado a lado e NÃO diz qual preferir nem
      em que caso. Não é diferença acadêmica: medido pelo a2 no caminho
      teórico, com o caso típico (N_spt = 15, B = 2,0 m, h = 1,5 m, quadrada,
      De Beer, gamma = 18), a escolha muda sigma_adm de 468 kPa (Teixeira,
      phi = 32,3°) para 592 kPa (Godoy, phi = 34,0°) — 26 %. E com
      gamma = 19 kN/m³ o ramo de Godoy dá 624 kPa, que SAI DA FAIXA PLAUSÍVEL
      de 50-600 kPa declarada em a2-verificador.md. Um caminho de cálculo cuja
      resposta depende 26 % de uma escolha que a fonte não fundamenta não é
      automatizável sem decisão de engenharia.
      OBSERVAÇÃO QUE AGRAVA, levantada pelo a1 e confirmada pelo a2: a própria
      fonte usa as duas correlações de forma INCONSISTENTE. As âncoras do
      diagrama da Fig. 2.21 (phi = 31° e 35° para N_spt = 8 e 18) só fecham com
      GODOY (28+0,4·8 = 31,2; 28+0,4·18 = 35,2); Teixeira daria 27,6° e 34,0°.
      Mas a correlação embutida na fórmula de sigma_adm para areia (impressa
      113) é a de TEIXEIRA. A fonte alterna entre as duas sem dizer.
    consequencia_para_esta_versao: >-
      É por isso que FB-CINTRA-TERZAGHI-VESIC-capacidade-de-carga recebe c e
      phi como ENTRADA DIRETA do engenheiro (em valores característicos, de
      ensaio, como a NBR 6122 §4.6.2 contempla) e NÃO os deriva de N_SPT. O
      caminho teórico fica sólido; a estimativa de parâmetros fica pendente.
      NOTA: isto NÃO afeta FB-TEIXEIRA-1996-areia, onde a correlação de
      Teixeira já está dissolvida nas constantes 0,05/0,4/100 e não é um passo
      separado que alguém possa trocar.
    pergunta_para_o_humano: >-
      (i) Qual faixa de N_spt e qual tipo de solo delimitam c = 10·N_spt e as
      duas correlações de phi, já que a fonte não declara nenhuma? (ii) Qual
      das duas correlações de phi o software deve usar, ou deve oferecer as
      duas e exibir as duas respostas? (iii) Qual energia de referência do SPT
      se assume (a NBR 6484, que a NBR 6122 §4.3 torna obrigatória para medir o
      N_SPT, está AUSENTE do acervo)? Registrada em kb/pendencias.md > V5.

  - id: FB-CINTRA-2.4-ruptura-local-media
    natureza: FORMULACAO_BIBLIOGRAFICA_SECUNDARIA
    citacao_em_codigo: null
    metodo: admissivel
    status: PENDENTE_HUMANO
    fonte: >-
      Cintra/Aoki/Albiero (2011), item 2.4, impressa 34. Cláusula
      CINTRA-2.4-procedimento-adotado-pelos-autores, status
      HIPOTESE_DE_AUTOR_AGUARDA_A2.
    hipotese: >-
      "Para RUPTURA LOCAL, na ausência de indicação específica na literatura,
      calcularemos o valor MÉDIO de capacidade de carga para as condições de
      ruptura geral e de puncionamento." — isto é,
      sigma_r_local = (sigma_r_geral + sigma_r_puncionamento)/2.
    decisao_do_a2: >-
      QUESTÃO 2 DESPACHADA AO a2. O enunciado oferecia duas saídas: entrar
      rotulada como "hipótese de autor, não requisito normativo", ou ficar de
      fora deste escopo. O a2 escolhe FICAR DE FORA, e o motivo não é o rótulo
      — rótulo resolveria o problema de honestidade — é que a hipótese é
      INSEPARÁVEL de um mecanismo que NÃO EXISTE.
      A média só tem uso depois que alguém decidiu que o modo é "ruptura
      local". Quem decide isso, na fonte, é o diagrama da Fig. 2.21. E a Fig.
      2.21 NÃO É IMPLEMENTÁVEL: a fonte imprime as quatro âncoras (c = 50 e
      100 kPa; phi = 31° e 35°) mas NÃO escreve a equação das duas retas
      divisórias, NÃO diz se as fronteiras são retas ligando exatamente esses
      pontos nos eixos, e NÃO diz a que região pertence um ponto sobre a
      fronteira. O a1 fez certo em não inferir a geometria do desenho — seria
      invenção. Ver FB-CINTRA-2.9.4-diagrama-modo-de-ruptura, REJEITADA.
      Aprovar a média sem o seletor seria aprovar meio mecanismo: o software
      teria uma fórmula para um modo que não sabe identificar. E aprovar o
      seletor exigiria inventar as retas. Nenhum dos dois é aceitável.
      SAÍDA ADOTADA, que não precisa de nenhum dos dois: o MODO DE RUPTURA é
      ENTRADA DECLARADA PELO USUÁRIO, restrita a "geral" ou "puncionamento" —
      os dois modos que TÊM equação própria e domínio declarado na fonte
      (2.2.4/2.3.1 e 2.2.6). Sem terceira opção. REQ-SIGMA-12.
      Nota de terminologia que precisa sobreviver a esta decisão, porque é
      armadilha real: o que TERZAGHI chamou de "ruptura local" é o que este
      livro chama de PUNCIONAMENTO. O "ruptura local" do livro é um terceiro
      modo, intermediário, que não existe em Terzaghi. A interface NÃO pode
      usar o termo "ruptura local" para nomear o puncionamento.
    pergunta_para_o_humano: >-
      Deve o software oferecer o modo intermediário "ruptura local"? Se sim,
      são necessárias DUAS decisões de engenharia, não uma: (i) aceitar a média
      aritmética como estimativa, rotulada como hipótese dos autores sem
      respaldo bibliográfico (a própria fonte diz "na ausência de indicação
      específica na literatura"); e (ii) fixar a geometria das duas fronteiras
      da Fig. 2.21, que a fonte não escreve. Impacto: a média fica entre os
      dois extremos, portanto o erro é limitado pelo intervalo
      [puncionamento, geral] — mas escolher o modo ERRADO tem impacto grande,
      já que puncionamento reduz c e tg phi a 2/3. Registrada em
      kb/pendencias.md > V6.

  - id: FB-CINTRA-2.9.4-diagrama-modo-de-ruptura
    natureza: FORMULACAO_BIBLIOGRAFICA_SECUNDARIA
    citacao_em_codigo: null
    metodo: admissivel
    status: REJEITADA
    fonte: >-
      Cintra/Aoki/Albiero (2011), item 2.9.4 e Fig. 2.21, impressa 47. Cláusula
      CINTRA-2.9.4-modo-ruptura-solo-c-phi, status HIPOTESE_DE_AUTOR_AGUARDA_A2.
    motivo_da_rejeicao: >-
      QUESTÃO 2 DESPACHADA AO a2 (segunda metade). REJEITADA para automação,
      por DOIS motivos cumulativos.
      (1) A FONTE NÃO IMPRIME AS FRONTEIRAS. Publica as quatro âncoras nos
      eixos (c = 50 e 100 kPa; phi = 31° e 35°) e um desenho com duas retas
      decrescentes. NÃO escreve a equação das retas, NÃO afirma que são retas
      ligando exatamente esses pontos, NÃO define a que região pertence um
      ponto sobre a fronteira. Extrair a geometria do desenho seria inventar
      dado — e seria inventar num ponto que decide entre usar c e phi integrais
      ou reduzidos a 2/3, o que é uma diferença grande no resultado.
      (2) É PROPOSIÇÃO DOS PRÓPRIOS AUTORES — a fonte usa o verbo "PROPOMOS".
      Não é teoria estabelecida, não é norma, não tem citação bibliográfica de
      terceiro. Automatizar a escolha do modo de ruptura a partir de uma
      proposição não referendada, num software que produz memorial de projeto,
      é transferir para o código um julgamento que é do engenheiro.
      MOTIVO ADICIONAL, apurado pelo a2: as âncoras são internamente
      INCONSISTENTES com o resto do que a v9 aprova. phi = 31° e 35° para
      N_spt = 8 e 18 só fecham com a correlação de GODOY (31,2° e 35,2°); a
      correlação embutida na fórmula de areia aprovada nesta versão é a de
      TEIXEIRA, que daria 27,6° e 34,0°. O a1 registrou isso como interpretação
      própria; o a2 recalculou e CONFIRMA. Automatizar o diagrama importaria
      uma terceira convenção de phi para dentro de um pipeline que já tem duas
      pendentes.
    o_que_permanece_registrado: >-
      As quatro âncoras SÃO transcritas do texto da fonte (não lidas do
      desenho) e portanto são dado confiável. Ficam em kb como material
      INFORMATIVO. Podem ser exibidas ao usuário como orientação qualitativa
      ("solos com c < 50 kPa e phi < 31° tendem a puncionamento") desde que sem
      veredito e sem selecionar coisa alguma. Não podem virar `if`.

  - id: FB-CINTRA-2.9.3-pesos-especificos
    natureza: FORMULACAO_BIBLIOGRAFICA_SECUNDARIA
    citacao_em_codigo: null
    metodo: admissivel
    status: REJEITADA
    fonte: >-
      Cintra/Aoki/Albiero (2011), item 2.9.3, Tabs. 2.4 e 2.5 (Godoy, 1972),
      impressas 45-46. Cláusula
      CINTRA-2.9.3-peso-especifico-e-classificacao-por-Nspt; fórmula
      CINTRA-2.9.3-tabelas-peso-especifico-e-classificacao.
    motivo_da_rejeicao: >-
      QUESTÃO 4 DESPACHADA AO a2, e a resposta é a que o enunciado antecipava:
      NÃO HÁ NADA A APROVAR AQUI. O a2 CONFIRMA que o a1 agiu certo ao NÃO
      escrever fórmula alguma de peso específico submerso a partir da impressa
      46 — verificado: a entrada CINTRA-2.9.3-* de kb/formulas.yaml contém as
      duas tabelas e o campo `CONTRADICAO_DA_FONTE_NAO_RESOLVIDA`, e NENHUMA
      equação. Correto. Não era papel do a1 resolver a contradição, e não é
      papel do a2 resolvê-la sozinho.
      TRÊS MOTIVOS CUMULATIVOS PARA A REJEIÇÃO:
      (1) CONTRADIÇÃO INTERNA DA FONTE, NÃO RESOLVIDA. O parágrafo sob a Tab.
      2.5 diz que a coluna "Saturada" JÁ É o peso específico SUBMERSO e, na
      frase seguinte, manda DESCONTAR o peso específico da água para obter o
      efetivo. As duas coisas não podem valer ao mesmo tempo. O a1 conferiu a
      500 dpi que não há um "não" na frase. Os valores 19/20/21 kN/m³ são
      ordens de grandeza de peso específico SATURADO (total), não de submerso
      (que ficaria em 9-11 kN/m³). Aplicar a leitura errada muda gamma por um
      fator de ~2 nas parcelas de sobrecarga e de peso próprio da equação de
      capacidade de carga, SEMPRE DO LADO INSEGURO se se usarem 19-21 kN/m³
      como efetivo abaixo do nível d'água. Isto sozinho já veta.
      (2) A CLASSIFICAÇÃO POR N_SPT É CITAÇÃO SECUNDÁRIA DE NORMA AUSENTE. As
      faixas de compacidade e consistência são atribuídas pela fonte à ABNT NBR
      6484/2001, que NÃO está no acervo — e em edição de 2001, possivelmente
      superada. A NBR 6122:2022 §4.3 torna obrigatório que a classificação
      venha da ABNT NBR 6502 e a medida do N_SPT da ABNT NBR 6484. Uma
      reprodução de 2011 de uma norma de 2001 ausente do acervo NÃO substitui a
      norma vigente. Mesmo raciocínio, e mesmo desfecho, que a busca negativa
      ACERVO-BUSCA-NEG-correlacoes-spt já apontava.
      (3) A ESTRUTURA DA TAB. 2.5 É AMBÍGUA POR IMPRESSÃO: cinco classes de
      compacidade mas apenas três linhas de valores ("Fofa" e "Pouca Compacta"
      compartilham 16/18/19; "Compacta" e "Muito Compacta" compartilham
      18/20/21). O a1 conferiu a 450 dpi que não é erro de transcrição, e
      desdobrou em cinco linhas sem interpolar nada — procedimento correto. Mas
      uma tabela cuja própria impressão funde classes não é base para
      classificação automática.
    consequencia: >-
      gamma é ENTRADA DIRETA do engenheiro nesta versão, com dois campos
      separados (acima e abaixo da cota de apoio, porque a própria fonte avisa
      que podem diferir sob o mesmo símbolo) e com a interface declarando
      explicitamente que abaixo do nível d'água o valor pedido é o EFETIVO
      (submerso). Ver FB-CINTRA-TERZAGHI-VESIC > nao_autorizado (c) e
      REQ-UI-SIGMA-04. O software NÃO deriva gamma de tabela alguma, NÃO
      classifica solo por N_SPT e NÃO exibe "areia medianamente compacta" como
      se fosse resultado de cálculo.
    armadilha_que_permanece_valida: >-
      REAFIRMADO NA v9, porque é do tipo que volta: a Tabela A.1 da NBR
      6120:2019 ("Peso específico aparente médio de materiais de armazenagem")
      traz colunas de gamma_ap E DE ÂNGULO DE ATRITO INTERNO para linhas
      chamadas "Areia com umidade natural", "Argila" etc. NÃO SÃO PARÂMETROS DE
      SOLO DE FUNDAÇÃO: são de MATERIAL A GRANEL ARMAZENADO (silos, funis), e o
      "ângulo de atrito interno" ali é definido em 3.10 da própria NBR 6120
      como ÂNGULO DE REPOUSO de pilha solta, não resistência ao cisalhamento de
      maciço natural in situ. O anexo remete a Eurocode 1 Part 4 e AS 3774, que
      são normas de SILO. Usar a Tabela A.1 como parâmetro geotécnico seria
      erro grave e do lado INSEGURO. PROIBIDO em todo o repositório.

  - id: FB-CINTRA-4.1.2b-CPT-e-4.1.3-boston
    natureza: FORMULACAO_BIBLIOGRAFICA_SECUNDARIA
    citacao_em_codigo: null
    metodo: admissivel
    status: PENDENTE_HUMANO
    fonte: >-
      Cintra/Aoki/Albiero (2011), itens 4.1.2 b) e 4.1.3, impressas 113 e 115.
      Cláusulas CINTRA-4.1.2b-CPT-teixeira-godoy-1996 e
      CINTRA-4.1.3-prova-de-carga-em-placa-boston.
    motivo_pendencia: >-
      FORA DO CAMINHO CRÍTICO POR AUSÊNCIA DE DADO DE ENTRADA, não por defeito
      de extração. O repositório não tem entrada de ensaio CPT nem de curva de
      prova de carga sobre placa. Extraídas e registradas para completude do
      §7.3 da NBR 6122, que admite TRÊS procedimentos (7.3.1 prova de carga,
      7.3.2 teóricos, 7.3.3 semiempíricos) e dos quais a v9 implementa dois.
      Transcrição conferida pelo a2 na leitura própria da impressa 113:
      sigma_a = q_c/10 <= 4,0 MPa (argila) e sigma_a = q_c/15 <= 4,0 MPa
      (areia), com q_c médio no bulbo e q_c >= 1,5 MPa. Bate com o a1.
    nota_que_evita_confusao_futura: >-
      Registrada porque o a1 a levantou e ela é fácil de errar depois. A síntese
      do capítulo 4 do livro atribui "FS = 2" à prova de carga em placa. A NBR
      6122:2022 Tabela 1 tem FSg = 2,00 numa linha DIFERENTE — "semiempíricos ou
      analíticos ACRESCIDOS DE DUAS OU MAIS provas de carga, necessariamente
      executadas na fase de projeto". Os dois "2" NÃO são o mesmo objeto: o do
      livro é o denominador do critério de Boston (sigma_a <= sigma_25/2); o da
      norma é o FSg de um processo combinado com no mínimo DUAS provas de carga.
      Não unificar.
      A própria fonte ainda adverte que o critério de Boston foi desenvolvido
      para placa QUADRADA de 0,30 m de lado e é usado no Brasil "sem nenhuma
      adaptação" para a placa CIRCULAR de 0,80 m de diâmetro — advertência
      explícita contra o uso acrítico, que teria de acompanhar qualquer
      implementação futura.

# Vale para A4 (cálculo) e A3 (interface). É a parte operacional da aprovação —
# a aprovação é DESTES itens juntos, não da fórmula solta.
# -----------------------------------------------------------------------------

# =============================================================================
# derivacoes — CATEGORIA CRIADA NA VERSÃO 11, e a criação é uma decisão do a2
# que precisa de justificativa explícita, porque o projeto já tinha duas
# categorias e nenhuma delas serve para o que entra aqui.
#
#   `regras`               = TRANSCRIÇÃO de item normativo. Citação [rule: id].
#                            Tem norma, item, página e hash.
#   `praticas_consagradas` = formulação de FONTE EXTERNA (Bastos, Cintra/Aoki/
#                            Albiero, Boussinesq/Newmark). Citação [pratica: id].
#                            Não tem item normativo, por definição.
#   `derivacoes`           = ÁLGEBRA DO PRÓPRIO AGENTE sobre primitivas
#                            normativas citadas. NÃO há fonte externa: cada
#                            passo aponta para um item da NBR 6118 que está em
#                            `regras`. Citação [deriv: id].
#
# Por que não cabe em `praticas_consagradas`: aquela seção diz, com todas as
# letras, que `norma`/`item`/`pagina`/`hash` estão "ausentes POR DEFINIÇÃO" e
# que o respaldo é `origem_da_confianca` — uma fonte bibliográfica. Aqui não há
# fonte bibliográfica NENHUMA: N_Rd0 sai de multiplicar tensão por área usando
# a lei constitutiva de 8.2.10.1 e o diagrama de 8.3.6. Chamar isso de "prática
# consagrada de Fulano" seria inventar autoridade onde há álgebra.
# Por que não cabe em `regras`: a NBR 6118 NÃO ESCREVE nenhuma dessas
# expressões. Emitir [rule: ] para elas seria atribuir à Norma texto que ela não
# tem — exatamente o defeito que este pipeline existe para impedir.
#
# ESTATUTO:
#   - Para a regra 2 do CLAUDE.md, uma entrada aqui com status APROVADA ou
#     APROVADA_COM_USO_RESTRITO CONTA como autorização, dentro do
#     `uso_autorizado`.
#   - Para a regra 3, a docstring cita `[deriv: <id>]` E os itens de origem.
#     Um `[rule: ]` apontando para um id desta seção é DEFEITO, e o a6 deve
#     tratá-lo como tal — mesmo tratamento já dado a `[pratica: ]`.
#   - Todo passo que a Norma não escreve fica listado em `passos_de_interpretacao`
#     com o item que o sustenta. Passo sem item de origem é motivo de rejeição.
# =============================================================================
derivacoes:

  - id: DER-NBR6118-12.3.1-fyd
    natureza: DERIVACAO_ALGEBRICA_SOBRE_A_NORMA
    citacao_em_codigo: "[deriv: DER-NBR6118-12.3.1-fyd]"
    metodo: calculo
    status: APROVADA
    formula: "f_yd = f_yk / gamma_s"
    itens_de_origem:
      - "NBR 6118:2023, 12.3.1 (p. 70): f_d = f_k / gamma_m — regra geral, transcrita em NBR6118-12.3.3-12.4.1-valores-de-calculo"
      - "NBR 6118:2023, Tabela 12.1 em 12.4.1 (p. 71): gamma_s = 1,15 para combinações normais"
    passos_de_interpretacao:
      - "ÚNICO passo: aplicar a regra geral f_d = f_k/gamma_m ao aço, tomando gamma_m = gamma_s da Tabela 12.1. A Norma não escreve 'f_yd = f_yk/1,15' em item algum; f_yd só aparece como rótulo de eixo na Figura 8.5."
    implementacao: "estrutural.materiais_6118.f_yd"
    checagem_dimensional: "MPa / adimensional = MPa. Homogêneo."
    checagem_numerica: "CA-50: 500/1,15 = 434,78 MPa. CA-25: 217,39 MPa. CA-60: 521,74 MPa. Valores universalmente tabelados — contra-prova externa disponível."
    observacao: >-
      Derivação de um passo só, registrada mesmo assim porque a AUSÊNCIA dessa
      expressão na Norma foi um achado explícito do a1, confirmado pelo a2 por
      leitura visual de 8.3.6. É o tipo de coisa que a memória do modelo
      escreveria como se fosse texto normativo.

  - id: DER-NBR6118-8.3.6-sigma-s
    natureza: DERIVACAO_ALGEBRICA_SOBRE_A_NORMA
    citacao_em_codigo: "[deriv: DER-NBR6118-8.3.6-sigma-s]"
    metodo: calculo
    status: APROVADA
    formula: "sigma_s(eps_s) = min(E_s·eps_s, f_yd), com eps_yd = f_yd/E_s"
    itens_de_origem:
      - "NBR 6118:2023, 8.3.6 e Figura 8.5 (p. 29-30): diagrama simplificado, ramo reto de inclinação arctg(E_s) e patamar em f_yd; autorização de uso à COMPRESSÃO no parágrafo da p. 30"
      - "NBR 6118:2023, 8.3.5 (p. 29): E_s = 210 GPa na falta de ensaio"
      - "DER-NBR6118-12.3.1-fyd para f_yd"
    passos_de_interpretacao:
      - "Ler do DESENHO da Figura 8.5 que o ramo inicial é linear com coeficiente angular E_s e que o patamar está no nível f_yd. A Norma não escreve a equação."
      - "Deduzir eps_yd = f_yd/E_s da interseção do ramo reto com o patamar. A Norma não define eps_yd nem lhe dá valor (busca negativa NBR6118-LACUNA-epsilon-su-epsilon-yd-nao-quantificados, confirmada pelo a2 por leitura da figura a alta resolução: não há rótulo)."
    implementacao: "estrutural.materiais_6118.sigma_s"
    checagem_dimensional: "E_s [GPa]·eps [adimensional] -> MPa, comparado com f_yd [MPa]. Homogêneo."
    checagem_numerica: "CA-50, eps = 2,0 ‰: min(420; 434,8) = 420 MPa. CA-25, eps = 2,0 ‰: min(420; 217,4) = 217,4 MPa (escoou). Coerente com o valor clássico de 420 MPa para CA-50 em compressão centrada."
    limite_declarado: >-
      eps_su NÃO tem valor na fonte. Portanto esta derivação vale enquanto o
      ponto de trabalho estiver no ramo reto ou no início do patamar. Para
      compressão do pilarete isso é inócuo (eps_c2 = 2,0 ‰ está muito abaixo de
      qualquer patamar de ruptura), mas QUALQUER verificação que dependa do FIM
      do patamar — flexão composta com armadura tracionada em domínio 2 ou 3 —
      está FORA desta aprovação e fora desta versão.

  - id: DER-GEOM-raio-de-giracao
    natureza: DERIVACAO_GEOMETRICA
    citacao_em_codigo: "[deriv: DER-GEOM-raio-de-giracao]"
    metodo: calculo
    status: APROVADA
    formula: "i = sqrt(I/A); para seção retangular b×h em torno do eixo considerado, i = h/sqrt(12)"
    itens_de_origem:
      - "NBR 6118:2023, 4.3 (p. 6): 'i — raio de giração mínimo da seção bruta de concreto da peça analisada' — a Norma DEFINE o símbolo e NÃO dá expressão"
      - "NBR 6118:2023, 15.8.2 (p. 107): lambda = ell_e/i (transcrita em NBR6118-15.8.2-dispensa-2a-ordem-local)"
    passos_de_interpretacao:
      - "i = sqrt(I/A) é a definição de raio de giração da Resistência dos Materiais, não da Norma."
      - "Para retângulo, I = b·h³/12 e A = b·h, donde i = h/sqrt(12). Álgebra exata, não aproximação."
    implementacao: "estrutural.pilarete.raio_de_giracao (NO NÚCLEO, nunca na UI — REQ-PILARETE-05)"
    checagem_dimensional: "sqrt(m⁴/m²) = m. Rodado em tools/checar_dimensoes.py (DER-GEOM-raio-de-giracao, OK)."
    checagem_numerica: "h = 0,30 m -> i = 0,0866 m; conferido que sqrt((b·h³/12)/(b·h)) e h/sqrt(12) coincidem em ponto flutuante para b arbitrário (o b cancela)."
    observacao: >-
      "Mínimo" é palavra da definição e tem consequência de código: avaliar as
      DUAS direções da seção e tomar o MENOR i, isto é, o MAIOR lambda. Um
      pilarete 20x40 cm tem i_min = 0,0577 m (governa a direção de 20 cm) e não
      0,1155 m.

  - id: DER-NBR6118-15.8.2-e1-de-M1d-min
    natureza: DERIVACAO_ALGEBRICA_SOBRE_A_NORMA
    citacao_em_codigo: "[deriv: DER-NBR6118-15.8.2-e1-de-M1d-min]"
    metodo: calculo
    status: APROVADA_COM_USO_RESTRITO
    formula: "e_1 = max(M_1d , M_1d,min)/N_d ; com M_1d = 0 -> e_1 = 0,015 + 0,03·h"
    itens_de_origem:
      - "NBR 6118:2023, 15.8.2 (p. 107): lambda_1 = (25 + 12,5·e_1/h)/alpha_b, com e_1 = excentricidade de 1ª ordem"
      - "NBR 6118:2023, 15.8.2, alínea d) (p. 108): alpha_b = 1,0 para momentos menores que o momento mínimo de 11.3.3.4.3"
      - "NBR 6118:2023, 11.3.3.4.3 (p. 60): M_1d,min = N_d·(0,015 + 0,03·h)"
    passos_de_interpretacao:
      - "Converter momento em excentricidade por e = M/N. A Norma não escreve como obter e_1 quando o momento de 1ª ordem é nulo e só existe M_1d,min."
      - "TENSÃO INTERNA DA NORMA, registrada e não escondida: 15.8.2 diz que e_1 'não inclui a excentricidade acidental' (simbologia 15.1), e M_1d,min É a substituição das imperfeições locais. Usar M_1d,min para formar e_1 é, portanto, INTERPRETAÇÃO. O a2 a adota porque a alínea d) do próprio 15.8.2 remete a 11.3.3.4.3 — a Norma casa os dois itens — e porque o efeito é irrelevante, como o achado abaixo demonstra."
    uso_autorizado: "Cálculo de lambda_1 para a fronteira pilar curto/esbelto."
    nao_autorizado: "Usar e_1 assim obtido como excentricidade de projeto para verificação de seção. Para isso vale M_1d,min diretamente (regra NBR6118-11.3.3.4.3-momento-minimo-pilarete)."
    checagem_dimensional: "M [kN·m]/N [kN] = m. Rodado em tools/checar_dimensoes.py (NBR6118-11.3.3.4.3-excentricidade-minima, OK)."
    checagem_numerica: >-
      ACHADO DO a2, e ele corrige uma premissa do despacho: e_1 = M_1d,min/N_d =
      0,015 + 0,03·h NÃO DEPENDE DE N_d — o N_d cancela. Logo
      e_1/h = 0,015/h + 0,03, função só de h. Avaliado em toda a faixa
      ADMISSÍVEL de h (0,14 m, mínimo absoluto de 13.2.3, a 2,00 m):
      lambda_1 bruto varia apenas entre 26,71 e 25,47 — SEMPRE abaixo de 35,
      logo SEMPRE truncado para lambda_1 = 35. Para o bruto passar de 35 seria
      preciso e_1/h > 0,8, isto é, h < 0,0195 m — proibido por 13.2.3.
      CONCLUSÃO: quando o único momento é M_1d,min, lambda_1 = 35 EXATAMENTE, e
      isso é um TEOREMA sobre o domínio admissível, não uma coincidência do caso
      testado. A consequência prática é a oposta da intuição: o valor 35 está
      certo, mas continua PROIBIDO fixá-lo no código (REQ-PILARETE-05), porque
      basta o pilarete ter momento de 1ª ordem REAL maior que M_1d,min — e ele
      tem, sempre que M ou H entram como dado na base do pilar metálico — para
      lambda_1 subir acima de 35 e a fronteira mudar. Vira teste de invariância
      obrigatório no GATE 3 (REQ-PILARETE-13).

  - id: DER-NBR6118-NRd0-compressao-centrada
    natureza: DERIVACAO_ALGEBRICA_SOBRE_A_NORMA
    citacao_em_codigo: "[deriv: DER-NBR6118-NRd0-compressao-centrada]"
    metodo: calculo
    status: APROVADA_COM_USO_RESTRITO
    formula: "N_Rd0 = 0,85·eta_c·f_cd·A_c + A_s·sigma_s(eps_c2), com sigma_s = min(E_s·eps_c2, f_yd)"
    itens_de_origem:
      - "NBR 6118:2023, 17.2.1 e 17.2.2 (p. 119-122): critério de envoltória (N_Rd, M_Rd) ⊇ (N_Sd, M_Sd); seções planas; igualdade de deformação aço-concreto (alínea b); tração do concreto desprezada (alínea d); compressão uniforme = 'reta b' da Figura 17.1 (alínea g)"
      - "NBR 6118:2023, 8.2.10.1 (p. 26): sigma_c = 0,85·eta_c·f_cd·[1-(1-eps_c/eps_c2)^n]; eps_c2; eta_c — regra NBR6118-8.2.10.1-diagrama-idealizado-do-concreto"
      - "NBR 6118:2023, 8.3.5 e 8.3.6 (p. 29-30): E_s e diagrama do aço aplicável à compressão — regra NBR6118-8.3.5-8.3.6-aco-passivo"
      - "NBR 6118:2023, 12.3.1, 12.3.3-a e Tabela 12.1 (p. 70-71): f_cd e f_yd — regra NBR6118-12.3.3-12.4.1-valores-de-calculo"
      - "DER-NBR6118-8.3.6-sigma-s e DER-NBR6118-12.3.1-fyd"
    passos_de_interpretacao:
      - "PASSO 1 — identificar a 'reta b' (compressão uniforme) com deformação uniforme eps = eps_c2. A Norma NÃO escreve isso em item algum: ela nomeia a reta b na Figura 17.1 e não lhe atribui deformação. É o passo mais forte da derivação."
      - "PASSO 2 — avaliar a lei de 8.2.10.1 em eps_c = eps_c2: [1-(1-1)^n] = 1, logo sigma_c = 0,85·eta_c·f_cd. Substituição algébrica exata, feita pelo agente."
      - "PASSO 3 — f_yd = f_yk/gamma_s combinando 12.3.1 com a Tabela 12.1 (DER-NBR6118-12.3.1-fyd)."
      - "PASSO 4 — sigma_s(eps_c2) = min(E_s·eps_c2, f_yd) pela geometria da Figura 8.5 (DER-NBR6118-8.3.6-sigma-s); usa a igualdade de deformação aço-concreto de 17.2.2-b."
      - "PASSO 5 — somar as duas parcelas sobre a seção. Equilíbrio de forças normais; não é item da Norma, é estática."
    uso_autorizado: >-
      (i) Como LIMITE SUPERIOR de referência da capacidade da seção, exibido
      como grandeza informativa; (ii) como denominador da taxa nu = N_d/N_Rd0
      no relatório; (iii) como GUARDA DE RECUSA: se N_d > N_Rd0 a seção está
      reprovada com certeza e o software pode dizer isso — a condição é
      SUFICIENTE para reprovar.
    nao_autorizado: >-
      Emitir VEREDITO DE APROVAÇÃO a partir de N_d <= N_Rd0. A condição é
      NECESSÁRIA e NÃO SUFICIENTE, e a razão é normativa, não de gosto: por
      11.3.3.4.3 existe M_1d,min nas duas direções, logo o estado real é de
      FLEXO-COMPRESSÃO OBLÍQUA e o critério aplicável é a envoltória
      (N_Rd, M_Rd) de 17.2.1 — que esta versão não implementa (faltam a
      Figura 11.3, a envoltória mínima de 1ª ordem, e 17.2.5, processo
      aproximado para flexão composta oblíqua; nenhuma das duas foi extraída, e
      eps_su/eps_yd não têm valor na fonte). Um software que dissesse "pilarete
      OK" com base só em N_Rd0 estaria escondendo o momento que a própria Norma
      impõe. É a recusa central desta versão — REQ-PILARETE-06.
    checagem_dimensional: >-
      Rodado em tools/checar_dimensoes.py: DER-NRd0-parcela-concreto (MPa·m² ->
      kN, OK), DER-NRd0-parcela-aco (cm²·MPa -> kN, OK),
      DER-NRd0-compressao-centrada (kN, OK). Dois mutantes REJEITADOS pelo pint:
      MUTANTE-NRd0-sem-sigma-s2 (parcela do aço sem tensão) e
      MUTANTE-NRd0-com-Ac-linear (A_c trocada por h).
    checagem_numerica: >-
      Pilarete 30x30 cm, C25, CA-50, A_s = 3,60 cm² (= A_s,min):
      parcela do concreto = 15,18 MPa × 0,09 m² = 1366 kN;
      parcela do aço = 3,60 cm² × 420 MPa = 151 kN;
      N_Rd0 = 1517 kN. Contra-prova de ordem de grandeza: 1517/0,09 = 16,9 MPa
      de tensão média na seção bruta, contra f_cd = 17,9 MPa — coerente, já que
      a armadura mínima quase compensa a redução de 0,85. Com N_d = 1000 kN,
      nu = 0,66. Faixa plausível para pilarete de fundação.

# =============================================================================
requisitos_para_a4:
  - id: REQ-PROP-01-pressao-liquida
    texto: >-
      q passado a qualquer das duas funções é a pressão LÍQUIDA na base
      (q_serviço - sigma'_v0 na cota da base), não a pressão total. É o que
      `recalques.py:255-260` já faz. Usar a total superestima dsigma em toda a
      profundidade. O rótulo na tela e no memorial deve dizer qual foi usada,
      com o valor — "q_líq = ... kPa", como `pranchas.py:575` já faz.
      Ressalva de citação: aquela docstring diz "conforme prática da NBR 6122";
      alívio de escavação aparece na NBR 6122:2022 §7.2 como um dos doze fatores
      a considerar, NÃO como fórmula prescrita. Não emitir [rule: ] por isso.
  - id: REQ-PROP-02-guarda-de-dominio
    texto: >-
      Validar no chamador, antes de chamar: z >= 0 (origem na BASE da sapata),
      a > 0, b > 0, q >= 0. Erro explícito, não retorno silencioso. Motivo em
      `dominio_de_validade` das duas entradas — hoje z<0 devolve q no Boussinesq
      e 4q no 2V:1H, ambos sem exceção.
  - id: REQ-PROP-03-sem-veredito
    versao_do_texto: 7      # REESCRITO. O texto da v6 definia L1/L2/L3 errado.
    texto: >-
      (A) SEM VEREDITO — inalterado desde a v6 e é a parte que sustenta a
      aprovação. O cálculo de propagação produz VALORES INFORMATIVOS. É
      PROIBIDO derivar deles qualquer PASSA/NÃO PASSA, cor de reprovação,
      alerta de segurança ou linha em lista de verificações. Não é preciosismo:
      é a fronteira que separa esta aprovação de uma que o a2 não pode dar
      sozinho.
      (B) DEFINIÇÃO OPERACIONAL DOS SÍMBOLOS DO CROQUI — reescrita na v7; o
      texto da v6 dizia "q1/q2/q3 nas cotas das interfaces, com L1/L2/L3 as
      espessuras" e a segunda metade estava ERRADA. Duas famílias de grandeza,
      dois universos de índice, e nunca o mesmo símbolo para as duas:
        * POR INTERFACE (grandeza de PONTO; i = 0..n, com i = 0 na BASE da
          sapata; vem de `PontoPropagacao`):
            q_i     = `delta_sigma` na cota da interface i [kPa];
            a_eq,i  = `largura_equivalente_a` na MESMA interface [m], exibida
            b_eq,i  = `largura_equivalente_b`, no corte do eixo correspondente.
          São essas duas famílias que o croqui clássico mostra, e é por isso
          que elas compartilham o índice: são a mesma cota. Comportamento
          esperado e verificável: q_i estritamente decrescente, a_eq,i
          estritamente crescente com a profundidade, nos DOIS métodos.
        * POR CAMADA (grandeza de TRECHO; i = 1..n; vem de `CamadaPropagacao`):
            h_i        = `espessura` do trecho analisado [m] — exibição
                         OPCIONAL, a coluna estratigráfica já a informa;
            Δσ_méd,i   = `delta_sigma_medio`, amostrado na MEIA-ALTURA do
                         trecho — exibição opcional e, se exibida, com este
                         rótulo, jamais como "q_i".
      (C) PROIBIÇÃO DE SÍMBOLO. "L", "L_i", "L1/L2/L3" não podem aparecer neste
      croqui, no núcleo, na tela nem no memorial, em nenhuma acepção — o
      símbolo está queimado por ter significado espessura e largura ao mesmo
      tempo em artefatos diferentes (ver a seção de colisão de símbolo).
      Também não usar "B_eq", pelo motivo registrado lá.
      (D) q EXIBIDO É O DE INTERFACE, não a média. Reforço explícito, porque
      isto já valia pela v6 (`uso_autorizado` das duas práticas: "nas
      profundidades das interfaces") e mesmo assim a tela exibe hoje um único
      `delta_sigma_medio` por camada. Medido pelo a6 em caso real: camada que
      vai de 158,6 a 18,1 kPa (9x) resumida em "q2 = 48,3 kPa"; medido pelo a2
      no perfil de referência: camada que vai de 223,0 a 53,7 kPa exibida como
      130,3 kPa. O croqui existe para mostrar a QUEDA da tensão ao longo da
      profundidade — um número por camada apaga justamente isso. Os dois
      valores de interface de cada camada já estão calculados e expostos pelo
      a4 (`delta_sigma_topo`/`delta_sigma_base`) e nunca foram consumidos.
      Interfaces internas são compartilhadas por duas camadas: exibir UM valor
      por interface, não dois iguais.
      (E) LARGURA INDEFINIDA NÃO VIRA NÚMERO. `largura_equivalente` devolve
      None quando q_líq = 0 ou Δσ <= 0, e nessa situação devolve None em TODOS
      os pontos. O idioma `largura_equivalente_a or dim` de `visual2d.py:693`
      substitui o None pela dimensão da sapata e a rotula como se fosse largura
      calculada, ao lado de um Δσ = 0 — engano por silêncio. Sem largura
      definida: não escrever número (traço, ou omitir o rótulo), e deixar o
      aviso de pressão líquida nula visível.
      (F) FAIXA DE SANIDADE, para teste de regressão: a_eq(z=0) = a exatamente;
      na cota do teto z = 2·B, a_eq/B entre 2,7 e 3,1 nos dois métodos e em
      todas as geometrias medidas (2x2, 2x4, 1,2x1,2, 4x4, 1,5x3,0). Fora dessa
      faixa, suspeitar de transcrição — a análise dimensional não pega, porque
      largura e espessura são ambas [length].
  - id: REQ-PROP-04-metodo-explicito
    texto: >-
      O método usado (Boussinesq/Newmark ou 2V:1H) tem de viajar junto com o
      número até o memorial — não pode ficar só no estado da UI. Dois números de
      dsigma para a mesma camada, calculados por métodos diferentes, diferem em
      até 37 % (ver checagem_numerica de PC-ESPRAIAMENTO-2V1H); um memorial que
      não diga qual foi usado é irrastreável.
    estado_v8: ATENDIDO_NA_TELA_PENDENTE_NO_MEMORIAL
    nota_de_escopo_v8: >-
      REGISTRO ACRESCENTADO NA v8, gêmeo do de REQ-UI-01 — o requisito NÃO foi
      relaxado. Na tela, o método já viaja junto com o número e vem de
      `prop.rotulo_metodo`, não do estado da UI (REQ-UI-07 (f), verificado por
      render pelo a6). No MEMORIAL, não viaja: `pranchas.py` não emite nada
      desta feature, e portanto `fonte_espraiamento` segue sendo estado
      exclusivamente de UI — que é precisamente o que este requisito nomeia.
      A frase "o método tem de viajar junto com o número até o memorial" fica,
      então, satisfeita por VACUIDADE: nenhum número desta feature chega ao
      memorial, logo não há número desacompanhado de método. É satisfação
      frágil e por isso está escrita aqui: no instante em que um único valor de
      propagação for para o PDF sem o rótulo de método junto, este requisito
      passa a estar VIOLADO, não pendente. Mesmos gatilhos de reabertura
      listados em REQ-UI-01 > nota_de_escopo_v8.
  - id: REQ-PROP-05-nao-expor-2v1h-em-recalque
    texto: >-
      PROIBIDO ligar `usar_boussinesq=False` em `recalques.py`, expor esse
      seletor na UI ou mudar o default. Fator medido: recalque ~25 % menor, lado
      inseguro. Manter default True e nenhum chamador passando False.
  - id: REQ-PROP-06-testes
    texto: >-
      Criar testes para `acrescimo_tensao_2v1h`, que hoje não tem nenhum:
      (a) z=0 -> q exato; (b) equilíbrio vertical dsigma·(a+z)(b+z) = q·a·b em
      pelo menos 4 profundidades; (c) monotonicidade decrescente em z;
      (d) z<0 levanta erro (depende de REQ-PROP-02);
      (e) razão 2V1H/Boussinesq em z=1,0 m com a=b=2,0 m fica em 0,63 +/- 0,01 —
      teste de regressão que trava a troca acidental do ângulo, que é o único
      erro que a análise dimensional não pega.
      Para Boussinesq, os testes existentes (I(10,10)~0,25; z->0 -> q; z=20 -> <2)
      são fracos: acrescentar I(1,1) = 0,17522 +/- 1e-4 e ao menos um ponto do
      ramo m²n² > m²+n²+1, ex. I(2,2) = 0,23247 +/- 1e-4.
  - id: REQ-PROP-07-unificar-2v1h
    texto: >-
      `recalques.py:265-266` deve chamar `acrescimo_tensao_2v1h` em vez de
      reescrever a expressão. Nenhum número muda.
  - id: REQ-PROP-08-namespace
    texto: >-
      Colisão de símbolo (a2-verificador.md §3): estas funções usam 'a' e 'b'
      para dimensões em planta e 'z' para profundidade — 'z' aqui é
      GEOTÉCNICO (profundidade abaixo da base), e não deve ser confundido com
      braço/altura estrutural; 'b' aqui é dimensão em planta, e no domínio
      estrutural 'b' aparece como largura de seção. Docstrings e campo
      `implementacao` usam o namespace `geotecnico.propagacao.*`, como acima.
      NÃO renomear API existente nesta rodada (quebraria UI e testes).
  - id: REQ-PROP-09-simbolos-e-testes-do-croqui
    versao_do_texto: 8      # v7: NOVO, decorre de REQ-PROP-03 (B) a (F).
                            # v8: só o item (d) — ResultadoRecalque ->
                            # ResultadoSapata. (a)/(b)/(c) inalterados.
    texto: >-
      Decorrências da v7 no núcleo. Nenhuma muda número algum.
      (a) DOCSTRING DE `CamadaPropagacao` (geotecnia.py:471-478) está ERRADA e
      é uma das três fontes do conflito: diz que `espessura` "corresponde aos
      L1/L2/L3 do desenho". Não corresponde, e "L" deixou de existir. Redigir:
      `espessura` = h_i, grandeza de TRECHO; os símbolos do croqui por
      interface são q_i e a_eq,i/b_eq,i, em `PontoPropagacao`. Enquanto essa
      docstring não for corrigida, o mesmo defeito volta na próxima leitura —
      foi ela que respaldou a leitura "espessura" do a6.
      (b) A docstring de `PontoPropagacao` passa a nomear explicitamente
      `largura_equivalente_a/_b` como a_eq/b_eq, e a de `largura_equivalente`
      mantém, com destaque, a ressalva de que sob Boussinesq o valor é leitura
      ilustrativa.
      (c) TESTES a criar, que travam exatamente o que a análise dimensional não
      pega (as duas grandezas são [length]):
        1. a_eq(z=0) == a e b_eq(z=0) == b, exatos, nos dois métodos;
        2. a_eq estritamente crescente com z em >= 4 profundidades, nos dois
           métodos — é a propriedade que distingue largura de espessura;
        3. em z = 2·B, 2,7 <= a_eq/B <= 3,1 nos dois métodos, em pelo menos
           três geometrias (2x2, 2x4, 1,5x3,0);
        4. com q_líq = 0, `largura_equivalente` é None em TODOS os pontos —
           trava o contrato que REQ-PROP-03 (E) obriga a UI a respeitar;
        5. com z_max = 2·B e perfil que termina abaixo disso, a última camada
           vem truncada e `espessura` NÃO é monótona crescente — registra em
           teste o contraexemplo que derrubou a leitura "espessura", para que
           ninguém a ressuscite;
        6. `delta_sigma_medio` fixado na MEIA-ALTURA do trecho (mata o mutante
           M10 do a6, hoje sobrevivente): para uma camada de z=0 a z=2 m,
           delta_sigma_medio == acrescimo_tensao(fonte, q, a, b, 1.0), e é
           estritamente menor que `delta_sigma_topo`.
      (d) CORRIGIDO NA v8 — o texto da v7 dizia `ResultadoRecalque` e estava
      errado no OBJETO (o requisito, esse, é o mesmo). `ResultadoSapata` deve
      expor `q_servico` para eliminar a reconstituição q_líquido + sobrecarga
      que a UI faz hoje (a6, E3/E2 em visual2d.py:616 e :620). Sem isso, com
      `verificar_recalque=False` e perfil PRESENTE, o croqui não aparece e a
      tela culpa o perfil.
      POR QUE `ResultadoRecalque` ESTAVA ERRADO, e não é preferência de
      arquitetura: `ResultadoRecalque` é exatamente `None` no caso que este
      requisito existe para consertar (`verificar_recalque=False`), então o
      campo seria inalcançável justamente quando é necessário — o texto da v7
      pedia o dado onde ele não pode ser lido. Conferido no código pelo a2:
      `recalques.py:210-223` não tem `q_servico` (tem `q_liquido`), e
      `ResultadoSapata.q_servico` (sapata.py:215) é construído num único sítio
      (sapata.py:1019) que sempre passa o valor. `Sapata._pressao_servico` é
      extração literal do bloco que já existia em `_analisar_recalques`
      (max(N_qp) + peso próprio, dividido pela área), com guarda a>0/b>0
      acrescentada: nenhuma fórmula nova, nenhum número alterado.
      RESSALVA ANEXA, que não é este item mas vive nele: este requisito é
      satisfeito pela EXISTÊNCIA do campo e por ele ser sempre preenchido — não
      pelo seu valor default. Um default fisicamente plausível (`float = 0.0`,
      como estava na rodada 2) faz um esquecimento futuro sair na tela como
      "pressão líquida nula", diagnóstico coerente e falso, em vez de "sem
      dado"; `Optional[float] = None` faz a ausência aparecer como ausência,
      que é o comportamento que a UI já trata. É defeito BAIXA despachado ao a4
      (sapata.py:215) e não vira requisito na v8 — fica registrado para que a
      escolha não seja revertida por acidente.

  # === VERSÃO 9 — requisitos de sigma_adm e majoração por vento ==============
  # A aprovação das regras e formulações da v9 é DESTES itens JUNTOS com as
  # fórmulas, nunca da fórmula solta. A4 que implemente a aritmética sem estes
  # requisitos NÃO cumpriu a regra aprovada, e o a6 deve tratar como defeito.

  - id: REQ-SIGMA-01-proibir-mistura-de-metodo
    texto: >-
      GUARDA DE MÉTODO DE SEGURANÇA, EM TEMPO DE EXECUÇÃO — não em comentário.
      Toda função que produza ou consuma sigma_adm nesta versão carrega um campo
      `metodo_de_seguranca` com valor obrigatório 'admissivel'. É PROIBIDO, e
      deve levantar exceção explícita:
        (a) aplicar gamma_m (2,15 / 1,40) a qualquer resultado desta versão —
            a rota de valores de cálculo NÃO está implementada
            (NBR6122-6.3.3-..., PENDENTE_HUMANO);
        (b) comparar um sigma_adm produzido aqui contra tensão obtida de
            combinação de CÁLCULO (ações majoradas). A NBR 6122:2022 §3.47
            define tensão de trabalho como "em valores característicos", e a
            comparação com ações majoradas é erro de método, não de arredondamento;
        (c) aplicar gamma_f = 1,4 sobre a ação E dividir por FSg — as duas
            colunas da Tabela 1 são ALTERNATIVAS, não cumulativas (a aritmética
            está em NBR6122-6.2.1.1.1 > checagem_numerica: 3,00/2,15 ~= 1,4).
      A guarda existe porque esta é a primeira versão em que calc_core ESCOLHE
      um método de segurança em vez de receber o valor pronto.

  - id: REQ-SIGMA-02-FS-embutido-e-metadado-verificado
    texto: >-
      O FS embutido de cada correlação semiempírica NÃO pode viver só no
      ruleset. Cada função semiempírica devolve, junto com o número, o campo
      `FS_embutido: float` e o campo `FS_embutido_origem: str`, e EXECUTA a
      asserção `FS_embutido >= 3.00` (piso da Tabela 1, linha "Semiempíricos"),
      levantando exceção se falhar. Valores aprovados:
        FB-REGRA-BRASILEIRA-Nspt-50-argila .. 3.0 (álgebra exata sobre a dedução
                                              impressa: (0,01·N·6)/3)
        FB-TEIXEIRA-1996-areia .............. 3.0 (piso verificado; medido pelo
                                              a2 entre 3,05 e 4,55 no domínio)
      MOTIVO, e é o que separa esta aprovação de uma confiança cega no autor: a
      Tabela 1 exige "valores propostos no próprio processo E no mínimo 3,00" —
      a Norma quer que o valor seja VERIFICÁVEL, não presumido. Um número que só
      existe em prosa de ruleset não é verificável em produção. Correlação sem
      FS_embutido demonstrável NÃO pode ser usada: é por isso que Mello (1975)
      está PENDENTE_HUMANO.
      ATENÇÃO À REDAÇÃO DA TABELA 1: 3,00 é PISO e não valor fixo para os
      semiempíricos. Se o método de origem propuser MAIS, prevalece o do método.
      Não escrever `FSg = 3.0` como constante do caminho semiempírico.

  - id: REQ-SIGMA-03-guarda-de-unidade
    texto: >-
      DUAS ARMADILHAS QUE A ANÁLISE DIMENSIONAL NÃO PEGA, ambas confirmadas em
      `tools/checar_dimensoes.py`, e por isso viram guarda explícita:
        (a) `sigma_a = N_spt/50 + q` — como "+ q" JÁ é tensão, passar q em kPa
            em vez de MPa dá erro de fator 1000 que nenhuma checagem de dimensão
            acusa: os dois termos são "tensão". A API deve receber q com nome
            explícito de unidade (`q_MPa`) ou receber em kPa e converter dentro,
            documentado. Não aceitar float anônimo.
        (b) `sigma_a = 0,05 + (1 + 0,4·B)·N_spt/100` — B em cm produz número
            grande e PLAUSÍVEL sem erro dimensional algum. Parâmetro `B_m`, com
            validação de faixa (REQ-SIGMA-04) que rejeita valores compatíveis
            com centímetros.
      Todas as funções desta versão devolvem kPa na fronteira do módulo, mesmo
      que a fórmula da fonte esteja em MPa. A conversão fica num único ponto,
      não espalhada.

  - id: REQ-SIGMA-04-guarda-de-dominio-que-recusa
    texto: >-
      IMPLEMENTAÇÃO DA OBRIGAÇÃO (a) DO §7.3.3 ("devem ser observados os
      domínios de validade de suas aplicações"), que é NORMATIVA. A função
      RECUSA — levanta exceção com mensagem que nomeia o parâmetro, o valor
      recebido e o intervalo declarado — em vez de aproximar, extrapolar,
      clampar ou avisar e seguir. Não há "melhor esforço" aqui: fora do domínio
      a fonte não autoriza a fórmula, e um número devolvido fora do domínio é um
      número sem procedência.
      FB-REGRA-BRASILEIRA-Nspt-50-argila:
        5 <= N_spt <= 20 (DECLARADO EM TEXTO na fonte); solo declarado
        "puramente argiloso"; forma retangular ou quadrada.
      FB-TEIXEIRA-1996-areia:
        solo declarado "areia"; forma QUADRADA; h == 1,5 m; gamma == 18 kN/m³;
        1,0 <= B <= 3,0 m e 4 <= N_spt <= 25.
        As duas últimas faixas vêm da EXTENSÃO DA FIG. 4.1, não do texto —
        marcar em código como
        `origem: extensao_da_Fig_4_1_nao_declarada_em_texto`. As duas primeiras
        (h e gamma) são igualdade estrita, tolerância ZERO até decisão humana:
        medido pelo a2, h = 3,0 m em vez de 1,5 m move o resultado 59 %.
      FB-CINTRA-TERZAGHI-VESIC-capacidade-de-carga: ver REQ-SIGMA-07.
      Toda guarda declara em qual campo do ruleset ela se apoia, para que o a6
      possa conferir uma a uma.

  - id: REQ-SIGMA-05-dispersao-lado-a-lado
    texto: >-
      IMPLEMENTAÇÃO DA OBRIGAÇÃO (b) DO §7.3.3 ("bem como as dispersões dos
      dados"). Nenhuma correlação desta rodada publica desvio-padrão ou
      intervalo de confiança, e o software NÃO pode inventar um. O que ele deve
      exibir é a dispersão OBSERVÁVEL: quando mais de uma correlação estiver
      DENTRO do seu domínio para o mesmo caso, mostrar TODAS lado a lado, com o
      nome de cada uma, em vez de um número só. Medido pelo a2 em N_spt = 15,
      B = 2,0 m: Teixeira areia 320 kPa, regra N/50 300 kPa, Mello 287 kPa.
      Mello entra nessa comparação APENAS como valor informativo (é
      PENDENTE_HUMANO): sem veredito, sem ser selecionável como sigma_adm de
      projeto, sem entrar em verificação alguma.
      A seleção de QUAL valor vira o sigma_adm de projeto é do engenheiro. O
      software não escolhe, não faz média e não pega o menor automaticamente.

  - id: REQ-SIGMA-06-declaracao-regional
    texto: >-
      IMPLEMENTAÇÃO DA OBRIGAÇÃO (c) DO §7.3.3 ("as limitações regionais
      associadas a cada um dos métodos"), reforçada pela nota (a) da Tabela 1
      ("atendendo ao domínio de validade para o terreno LOCAL"). O software NÃO
      pode inferir aplicabilidade regional de um perfil SPT, e não pode ficar
      calado. Exigir DECLARAÇÃO EXPLÍCITA do usuário, sem default afirmativo, e
      registrá-la no memorial junto com o valor. Texto mínimo a exibir: estas
      correlações são brasileiras e foram calibradas em solos do Sudeste — a
      própria fonte compara a Fig. 4.1 com "valores de experiência prática em
      São Paulo, relatados por Vargas (1951)". A Norma não define "região".
      Um software que aceite N_SPT e devolva sigma_adm sem essa declaração NÃO
      cumpre 7.3.3, mesmo com a aritmética correta.

  - id: REQ-SIGMA-07-guardas-do-caminho-teorico
    texto: >-
      Guardas de FB-CINTRA-TERZAGHI-VESIC-capacidade-de-carga, todas RECUSANDO:
        (a) 0 <= phi <= 50 graus (extensão declarada da Tab. 2.2). Que a forma
            fechada saiba calcular phi = 55° não é autorização.
        (b) h <= B (hipótese 2 de Terzaghi, declarada na fonte). É o que
            autoriza trocar a camada acima da base pela sobrecarga q = gamma·h.
        (c) solo HOMOGÊNEO no bulbo. O caso estratificado está no item 2.5 da
            fonte, NÃO EXTRAÍDO — é o risco que o CLAUDE.md nomeia
            explicitamente. Recusar perfil multicamada ou exigir camada
            equivalente declarada.
        (d) modo de ruptura declarado, 'geral' ou 'puncionamento' apenas
            (REQ-SIGMA-12).
        (e) c >= 0, B > 0, L >= B, gamma > 0.
        (f) Nc em phi = 0: a forma fechada cotg(phi)·[...] é 0/0. Usar o limite
            2 + pi = 5,14159..., NÃO um epsilon, NÃO um try/except que devolva
            zero. Este é o caso de ARGILA NÃO DRENADA, isto é, o caminho mais
            usado — um bug aqui não é caso de canto.
        (g) fatores de forma de DE BEER apenas (Tab. 2.3). Não implementar a
            Tab. 2.1 de Terzaghi-Peck e não permitir mistura dos dois conjuntos.
        (h) Nq/Nc SEMPRE calculado de Nc e Nq, jamais lido de tabela — ver
            FB-CINTRA-TERZAGHI-VESIC > decisao_2.
        (i) puncionamento: phi* = arctg((2/3)·tg phi), NUNCA phi* = (2/3)·phi;
            c* = (2/3)·c; os fatores de FORMA não são reduzidos.

  - id: REQ-SIGMA-08-drenado-ou-nao-drenado
    texto: >-
      EXIGÊNCIA NORMATIVA EXPRESSA da NBR 6122:2022 §7.3.2 na redação de 2022 —
      "desde que contemplem todas as particularidades do projeto, INCLUSIVE A
      NATUREZA DO CARREGAMENTO (DRENADO OU NÃO DRENADO)". Achado do a2 nesta
      rodada: a edição 2010 citada pelo livro dizia "que contemplam" (descrição)
      e a de 2022 diz "desde que contemplem" (condição suspensiva). Vira campo
      obrigatório: a entrada declara se c e phi são DRENADOS ou NÃO DRENADOS, o
      resultado carrega essa informação e o memorial a imprime.
      MOTIVO ADICIONAL, específico desta fonte: Cintra/Aoki/Albiero avisa na
      impressa 26 que na SUA notação "c e phi geralmente representam os valores
      NÃO DRENADOS" — convenção diferente da usual em Mecânica dos Solos. Quem
      ler a fonte e o código sem esse campo vai misturar as duas convenções.
      Coerência a verificar e sinalizar: phi = 0 com c > 0 é análise NÃO
      DRENADA; phi > 0 com c = 0 é análise em tensões efetivas. A combinação
      declarada tem de bater com os parâmetros recebidos.

  - id: REQ-SIGMA-09-rotulo-ELU-e-nao-tensao-admissivel
    texto: >-
      DECORRE DE NBR6122-7.3-7.4-conjuncao-ELU-ELS, e é o requisito que impede
      o software de anunciar conformidade que não tem. PROIBIDO rotular a saída
      de qualquer função desta versão como "tensão admissível conforme a NBR
      6122" — em nome de variável, em retorno, em tela ou em memorial. Nenhum
      caminho aprovado na v9 verifica ELS (recalque), e a definição 3.45 da
      Norma é CONJUNTIVA (ELU **e** ELS).
      Nome de retorno: `sigma_adm_ELU`, nunca `sigma_adm`.
      Rótulo obrigatório, colado ao número: "parcela de ELU da tensão admissível
      (NBR 6122:2022 §7.3) — §7.4 (ELS/recalque) NÃO verificado".
      Vale IGUALMENTE para o caminho semiempírico: a alegação de que correlações
      empíricas "já embutem" o recalque é plausível e NÃO é verificável a partir
      do valor entregue, e em nenhum caso traz o recalque aceitável C do projeto
      em questão — que a Norma expressamente não fixa (6.2.2.2.2 lista sete
      fatores, nenhum calculável de um perfil SPT).

  - id: REQ-SIGMA-10-vento-nada-e-inferido
    texto: >-
      Da regra NBR6122-6.3.2. TRÊS entradas declaradas pelo usuário, todas com
      default que NÃO majora, e NENHUMA inferida pelo software:
        `vento_e_acao_variavel_principal: bool = False` — quem define isso é a
            ABNT NBR 8681 (remissão de 6.3.1), vem da análise estrutural a
            montante e não é dedutível dentro do módulo de fundação. A NBR
            8681:2025 está no acervo mas NUNCA foi varrida.
        `tipo_de_obra_da_lista_dos_30_por_cento: bool = False` — lista FECHADA e
            taxativa de sete: galpões industriais, torres de linhas de
            transmissão, reservatórios elevados, silos graneleiros, torres
            eólicas, torres de telecomunicações, tanques de produtos químicos.
            Nada de "obra semelhante a galpão".
        `k_v: float = 0.0` — a majoração EFETIVAMENTE adotada. A Norma dá o
            TETO ("em ATÉ 15 %"), não o valor. É decisão de engenharia.
      Guardas a executar, nesta ordem:
        se not vento_principal: exigir k_v == 0 (a Norma escreve "NÃO É
            PERMITIDA a majoração"), exceção se k_v > 0;
        k_v <= 0.30 se lista fechada, senão k_v <= 0.15;
        FSg/(1 + k_v) >= 1.6 — ver a decisão de leitura em
            NBR6122-6.3.2 > decisao_do_a2_sobre_o_piso_FSg_1_6. Esta guarda
            BINDA de fato em FSg = 2,00 com k_v = 0,30 (dá 1,538), e nesse caso
            o k_v máximo cai para 0,25.
      A majoração é GEOTÉCNICA: k_v não pode se propagar para nenhuma função
      estrutural (flexão, cisalhamento, punção, ancoragem). "Em qualquer caso,
      deve ser feita a verificação estrutural do elemento de fundação" é
      literal.

  - id: REQ-SIGMA-11-tabela-2.2-como-fixture-de-teste
    texto: >-
      A Tab. 2.2 de Vesic NÃO é fonte de consulta no código (ver
      FB-CINTRA-TERZAGHI-VESIC > decisao_1) — é FIXTURE DE VALIDAÇÃO, e é um
      uso melhor do que o de tabela. Teste obrigatório: para phi = 0..50 inteiro,
      as formas fechadas implementadas devem reproduzir as 51 linhas x 3 colunas
      (Nc, Nq, N_gamma) publicadas, com tolerância de 0,05 absoluto OU 0,1 %
      relativo, o que for maior. O a2 rodou exatamente esta comparação nesta
      rodada e obteve 255/255 células dentro de 0,1 %.
      Casos de contorno a fixar em teste: phi = 0 -> Nc = 5,14 (2+pi),
      Nq = 1,00, N_gamma = 0,00; phi = 30 -> 30,14 / 18,40 / 22,40.
      NÃO transformar em teste a coluna Nq/Nc na linha phi = 0: a fonte imprime
      0,20 e o valor correto é 0,1945. Testar contra o impresso ali seria
      congelar o erro tipográfico da fonte.
      Fonte dos números: kb/formulas.yaml, id
      CINTRA-VESIC-tabela-2.2-fatores-capacidade-carga.

  - id: REQ-SIGMA-12-modo-de-ruptura-e-entrada
    texto: >-
      O MODO DE RUPTURA é ENTRADA DECLARADA PELO USUÁRIO, restrita a dois
      valores: 'geral' ou 'puncionamento'. O software NÃO infere o modo e NÃO
      oferece um terceiro. Motivo em FB-CINTRA-2.4-ruptura-local-media e
      FB-CINTRA-2.9.4-diagrama-modo-de-ruptura: a "ruptura local" dos autores é
      média aritmética confessadamente sem respaldo bibliográfico, e o seletor
      que a acionaria (Fig. 2.21) não tem equação de fronteira publicada.
      ARMADILHA DE NOMENCLATURA, obrigatória de respeitar em código e em tela: o
      que TERZAGHI chamou de "ruptura local" é o que esta fonte chama de
      PUNCIONAMENTO. A interface NÃO pode usar o termo "ruptura local" para
      nomear o puncionamento, e o memorial tem de usar o vocabulário da fonte
      citada.

  - id: REQ-SIGMA-13-parcela-q-facultativa-default-zero
    texto: >-
      Em FB-REGRA-BRASILEIRA-Nspt-50-argila a parcela "+ q" é FACULTATIVA por
      declaração da fonte ("pode ou não ser considerada"), e a dedução que a
      sustenta é para sapata na SUPERFÍCIE (h = 0), onde q seria zero. A fonte
      não concilia as duas coisas e o a2 não arbitra: `considerar_q: bool =
      False`, isto é, q = 0 no default, que é a forma que a dedução sustenta.
      Ligar q só pode AUMENTAR sigma_a, logo o default é o lado seguro. Quando
      ligado, exibir aviso de que é acréscimo não sustentado pela dedução da
      fonte, e q em MPa (REQ-SIGMA-03).

# =============================================================================
# requisitos_para_a5 — SEÇÃO CRIADA NA VERSÃO 11.
#
# Até a v10 este ruleset só tinha requisitos para A4 (geotécnico) e A3
# (interface), porque o único motor auditado era geotécnico e as regras de
# NBR 6118 já implementadas vieram no pacote externo do escopo amplo. A v11 é a
# primeira que MANDA construir elemento estrutural novo, e o destinatário é o
# A5. Requisitos aqui são condição da aprovação: as regras e derivações da v11
# estão aprovadas PARA SEREM USADAS DESTE JEITO, não em geral.
#
# DECISÃO DE MÓDULO, com a justificativa que o despacho pediu:
#
#   O pilarete vai para um pacote NOVO — `calc_core/estrutural/`, com
#   `pilarete.py` e `materiais_6118.py` — e NÃO como extensão de
#   `calc_core/sapata_isolada/`. Quatro razões, em ordem de peso:
#
#   1. GRAU DE CONFIANÇA. O CLAUDE.md separa os dois motores existentes
#      justamente por grau de auditoria: `geotecnico/` é 100 % auditado,
#      `sapata_isolada/` é o pacote externo PARCIALMENTE auditado, com partes
#      em PENDENTE_HUMANO que a UI é obrigada a exibir como "em conferência".
#      O pilarete nasce 100 % rastreado por este GATE 1. Colocá-lo dentro do
#      pacote parcialmente auditado destruiria a informação que o usuário mais
#      precisa ler — qual parte do memorial está auditada e qual não está.
#   2. `Pilar` NÃO É O PILARETE. `sapata_isolada/acoes.py::Pilar` é GEOMETRIA
#      PURA (ap, bp, phi_arranque_mm, n_barras, as_calc_efetiva) e existe como
#      CONDIÇÃO DE CONTORNO da sapata: alimenta perímetro crítico de punção,
#      bielas e ancoragem do arranque. O pilarete é elemento com resistência,
#      esbeltez, detalhamento e domínio de ELU próprios. Enfiar altura, ell_e,
#      vinculação, estribos, cobrimento próprio e tipo de junta dentro de
#      `Pilar` forçaria `Sapata` a carregar campos que não usa e mudaria em
#      silêncio o esquema de `.s7proj` e do Excel (`ui/completo/projeto.py`),
#      quebrando arquivos salvos — efeito colateral em superfície já aprovada
#      por A6/A7, sem necessidade.
#   3. DIREÇÃO DE DEPENDÊNCIA. O pilarete não precisa de nada da geotecnia. A
#      sapata é que, no futuro, poderá consumir o resultado do pilarete (N_d na
#      base). Módulo novo mantém a seta apontando para o lado certo.
#   4. TESTABILIDADE. O GATE 3 desta feature não tem exemplo de terceiros (ver
#      REQ-PILARETE-13). Um módulo isolado, sem solo e sem combinações, é
#      testável por invariância e por mutação de forma direta; dentro de
#      `Sapata` cada teste arrastaria um projeto inteiro.
#
#   FRONTEIRA DE DEPENDÊNCIA PERMITIDA (REQ-PILARETE-01): `estrutural/` pode
#   importar `sapata_isolada/materiais.py` (Concreto/Aco — §8 já conferido item
#   a item, ver relatorios/revisao_codigo.md, adendo) e nada mais do pacote
#   amplo. É PROIBIDO importar geotecnia, rigidez, recalques, bielas, grelha,
#   solo_mef ou sapata.
# =============================================================================
requisitos_para_a5:

  - id: REQ-PILARETE-01-modulo-novo-e-fronteira-de-dependencia
    texto: >-
      Criar `calc_core/estrutural/` com `pilarete.py` (elemento) e
      `materiais_6118.py` (eta_c, n, eps_c2, eps_cu, sigma_c, sigma_s, f_cd,
      f_yd). Importar de `calc_core/sapata_isolada/materiais.py` apenas
      `Concreto` e `Aco`; é PROIBIDO importar qualquer outro módulo do pacote
      amplo, e é PROIBIDO que `sapata.py` passe a importar `estrutural/`
      nesta versão (a integração pilarete<->sapata é rodada própria, com novo
      GATE). Toda função pública leva docstring com item normativo, página e
      `[rule: <id>]`, `[deriv: <id>]` ou `[pratica: <id>]` conforme a categoria
      — CLAUDE.md regra 3. Um `[rule: ]` apontando para id de `derivacoes` é
      defeito com veto do a6.
      NAMESPACE OBRIGATÓRIO (colisão de símbolo, cascata do a2 item 3). Este
      elemento traz QUATRO colisões novas, e uma delas já está no código:
        - `h`: altura da SEÇÃO do pilarete na direção considerada (6118 13.2.3,
          11.3.3.4.3) x altura da SAPATA (6118 22.6.1) x espessura de camada e
          embutimento no domínio geotécnico. Usar `h_secao` no pilarete.
        - `b`: menor dimensão da seção do pilarete em CENTÍMETROS (13.2.3,
          Tabela 13.1) x largura da sapata em METROS (`B` em geotecnico/).
          Usar `b_min_cm` onde a fórmula de gamma_n exigir cm.
        - `lambda`: índice de esbeltez (15.8.2) x relação y/x do diagrama
          retangular (17.2.2), que JÁ EXISTE como `Concreto.lambda_x` em
          `materiais.py`. Usar `lambda_esbeltez` e nunca `lambda`.
        - `alpha_b` (15.8.2) x `alpha_c` (17.2.2, já em `materiais.py`): manter
          os dois nomes completos, jamais abreviar para `alpha`.
      Também: `gamma_n` (13.2.3, seção reduzida) x `gamma_n1` (15.8.1, 2ª ordem
      para lambda > 140) — nomes completos sempre, e o segundo não existe nesta
      versão.

  - id: REQ-PILARETE-02-entradas-explicitas-e-recusa-por-ausencia
    texto: >-
      O construtor do pilarete EXIGE, sem default silencioso, e RECUSA (exceção
      com mensagem que nomeia o campo e o item normativo) se faltar:
        (a) seção b×h e altura livre ell;
        (b) condição de vinculação, como enumeração fechada:
            ENGASTADO_BASE_LIVRE_TOPO (e aí ell_e = 2·ell, calculado pelo núcleo
            com [rule: NBR6118-15.8.2-dispensa-2a-ordem-local]) ou
            VINCULADO_DOIS_EXTREMOS (e aí ell_e é ENTRADA NUMÉRICA EXPLÍCITA do
            usuário, com ell_0 e ell declarados — 15.6, uso restrito). Não há
            terceira opção e não há valor inferido. Isto é um AJUSTE ao
            despacho, e o motivo está registrado: o despacho pedia ell_e sempre
            como entrada; mas para o caso engastado-livre a própria Norma
            escreve ell_e = 2·ell em 15.8.2, e transformar texto normativo em
            entrada do usuário seria jogar fora rastreabilidade. O princípio
            "nunca inferir" é preservado: o que o usuário declara é a
            VINCULAÇÃO, não o número; e sem a declaração o software recusa.
        (c) categoria do aço (CA-25/CA-50/CA-60 — a última só para recusar,
            REQ-PILARETE-08) e classe do concreto (lista fechada C20..C90);
        (d) classe de agressividade ambiental e dimensão máxima do agregado;
        (e) tipo de junta com a sapata (REQ-PILARETE-11);
        (f) declaração de que a verificação é em idade j >= 28 dias;
        (g) situação de aderência para f_bd (eta_2 = 1,0 boa / 0,7 má, 9.3.2.1)
            — DECLARADA, nunca assumida boa;
        (h) gamma_c e gamma_s, com 1,4 e 1,15 como PADRÃO EXIBIDO e editável,
            mais a pergunta explícita sobre condições desfavoráveis de execução
            (12.4.1: gamma_c × 1,1 é OBRIGATÓRIO quando previstas, e "concretagem
            deficiente por concentração de armadura" é caso plausível num
            pilarete de seção pequena com 100 % das barras emendadas).
      GUARDA DE UNIDADE (a checagem dimensional NÃO pega estes erros, e está
      registrado por que): h em METROS na expressão de M_1d,min e b em
      CENTÍMETROS na de gamma_n; nos dois casos o coeficiente carrega a unidade
      e um valor na unidade errada produz número plausível. Parâmetros nomeados
      com a unidade (`h_secao_m`, `b_min_cm`) e validação de faixa.

  - id: REQ-PILARETE-03-geometria-limite-e-recusas-duras
    texto: >-
      [rule: NBR6118-13.2.3-dimensoes-limites-pilarete] e
      [rule: NBR6118-18.4.1-campo-de-aplicacao-detalhamento].
      Verificar, nesta ordem, e RECUSAR (não calcular, não aproximar):
        (1) b_min < 14 cm -> PROIBIDO pela Norma;
        (2) A_c < 360 cm² -> PROIBIDO "em qualquer caso", mesmo com b >= 14 cm
            (um 19×18 cm passa em (1) e reprova aqui — teste obrigatório);
        (3) 14 <= b_min < 19 cm -> admissível SOMENTE com gamma_n = 1,95 -
            0,05·b majorando os esforços de cálculo; aplicar e REGISTRAR no
            memorial que foi aplicado, com o valor;
        (4) h_max > 5·b_min -> é pilar-parede (18.5), FORA do escopo: RECUSA.
      A recusa cita item, valor obtido e valor-limite. Mensagem sem número é
      defeito.

  - id: REQ-PILARETE-04-M1d-min-obrigatorio-nas-duas-direcoes
    texto: >-
      [rule: NBR6118-11.3.3.4.3-momento-minimo-pilarete].
      NÃO EXISTE, na API do pilarete, caminho de "compressão centrada pura".
      Mesmo que o motor geotécnico chame o caso de "carga centrada" e passe
      M = 0, o núcleo calcula M_1d,min = N_d·(0,015 + 0,03·h_secao) em CADA
      direção e usa `M_d = max(M_entrada, M_1d,min)` por direção. A ausência
      desse caminho é estrutural, não convencional: não deve existir função
      pública que aceite só N_d e devolva veredito.
      O memorial imprime SEMPRE M_1d,min das duas direções e a frase de que a
      NBR 6118 não admite dimensionar pilar à compressão estritamente centrada,
      com a hipótese declarada de que M_1d,min substitui as imperfeições locais
      de 11.3.3.4.2 (ver `observacao` da regra: é ~10x mais conservador que a
      rota alternativa para um pilarete de 1 m).

  - id: REQ-PILARETE-05-esbeltez-com-recusa-fora-do-pilar-curto
    texto: >-
      [rule: NBR6118-15.8.2-dispensa-2a-ordem-local],
      [rule: NBR6118-15.8.1-campo-de-aplicacao-esbeltez],
      [rule: NBR6118-15.8.3-metodos-de-2a-ordem] (REJEITADA -> recusa),
      [deriv: DER-GEOM-raio-de-giracao], [deriv: DER-NBR6118-15.8.2-e1-de-M1d-min].
      Sequência obrigatória, e cada passo tem seu próprio motivo de recusa:
        (1) Campo de 15.8.1: seção constante e armadura constante ao longo do
            eixo. Pilarete com seção variável -> RECUSA.
        (2) Classificar como elemento isolado (15.4.4-a) ou exigir declaração
            do usuário [rule: NBR6118-15.4.4-elementos-isolados].
        (3) i = sqrt(I/A) CALCULADO NO NÚCLEO a partir da geometria — nunca
            pedido à UI, nunca digitado. Avaliar as duas direções e tomar o
            MENOR i, isto é, o MAIOR lambda.
        (4) lambda = ell_e/i por direção.
        (5) lambda_1 = min(90, max(35, (25 + 12,5·e_1/h_secao)/alpha_b)) POR
            DIREÇÃO, CALCULADO PELA FÓRMULA. É PROIBIDO fixar 35 no código, e a
            proibição vale mesmo sabendo (ver a checagem numérica da derivação)
            que sob M_1d,min o resultado é exatamente 35 em todo o domínio
            admissível: basta o M de entrada superar M_1d,min — o que acontece
            sempre que M ou H entram como dado na base do pilar metálico — para
            lambda_1 subir. alpha_b = 1,0 pelas alíneas c) e d) de 15.8.2, com o
            motivo registrado no memorial.
        (6) lambda < lambda_1 (ESTRITO) -> pilar curto, segue.
            lambda >= lambda_1 -> RECUSA, mensagem citando 15.8.2/15.8.3, o
            lambda obtido, o lambda_1 calculado e a direção que governou.
        (7) Verificar ainda lambda <= 200 (15.8.1 com a redação da Em1:2026,
            com N_d — força normal DE CÁLCULO — na exceção de elemento pouco
            comprimido).

  - id: REQ-PILARETE-06-NRd0-e-a-recusa-de-veredito-de-ELU
    texto: >-
      [deriv: DER-NBR6118-NRd0-compressao-centrada],
      [rule: NBR6118-8.2.10.1-diagrama-idealizado-do-concreto],
      [rule: NBR6118-8.3.5-8.3.6-aco-passivo].
      (A) IMPLEMENTAR eta_c, n, eps_c2 e eps_cu com os limiares EXPLÍCITOS e
          separados: eta_c muda em f_ck = 40 MPa; n, eps_c2 e eps_cu mudam em
          C50/C55. São DOIS limiares nesta lei constitutiva — a correção da
          premissa do despacho está registrada na `observacao` da regra. O
          terceiro limiar (C60, parâmetro s de beta_1, Emenda 1) pertence a
          j < 28 dias, que é RECUSADO em (D). Um `if fck <= 50: 0.85 else ...`
          sem eta_c é DEFEITO com veto: erra em silêncio em 40 < f_ck <= 50.
          Só classes normalizadas C20 a C90; f_ck fora da lista -> RECUSA (a
          Norma define eta_c/n por f_ck contínuo e eps_c2/eps_cu por classe, e
          os dois critérios divergem entre 50 e 55 MPa).
      (B) IMPLEMENTAR o patamar: sigma_c(eps_c) é a parábola só até eps_c2 e
          CONSTANTE de eps_c2 a eps_cu. Avaliar a expressão acima de eps_c2 é
          defeito (a expressão decresce).
      (C) N_Rd0 é EXPOSTO como valor informativo e como denominador de
          nu = N_d/N_Rd0. É PROIBIDO qualquer caminho de código em que
          `N_d <= N_Rd0` produza "aprovado", cor verde, ou ausência de aviso.
          O relatório desta versão diz, com todas as letras, que a verificação
          de ELU de seção sob flexo-composta NÃO é feita e que o resultado é
          verificação de DETALHAMENTO e DOMÍNIO, não de resistência. N_d > N_Rd0
          PODE reprovar (condição suficiente para reprovar).
      (D) RECUSAR verificação em idade j < 28 dias
          [rule: NBR6118-12.3.3-12.4.1-valores-de-calculo], citando 12.3.3-b e
          a exigência de dupla verificação (aos t dias e aos 28).

  - id: REQ-PILARETE-07-armadura-longitudinal
    texto: >-
      [rule: NBR6118-17.3.5.3-armaduras-limite-pilarete],
      [rule: NBR6118-18.4.2-armaduras-longitudinais-pilarete].
      Verificar: A_s >= max(0,15·N_d/f_yd ; 0,004·A_c); A_s <= 0,08·A_c na seção
      corrente E na seção de emenda com a armadura DUPLICADA (o que na prática
      limita a 4 % fora da emenda quando 100 % das barras emendam na mesma
      seção — é a restrição que costuma governar); phi >= 10 mm e phi <=
      b_min/8; mínimo uma barra por vértice (4 na seção retangular);
      espaçamento livre >= max(20 mm, phi, 1,2·d_agregado) INCLUSIVE na região
      de emenda, com as barras duplicadas; espaçamento máximo entre eixos <=
      min(2·b_min, 400 mm). O N_d de A_s,min é o da combinação mais
      desfavorável — interpretação declarada no memorial, porque a Norma não
      diz qual combinação usar.

  - id: REQ-PILARETE-08-estribos-e-a-recusa-do-CA-60
    texto: >-
      [rule: NBR6118-18.4.3-armaduras-transversais-pilarete].
      phi_t >= max(5 mm, phi/4); s <= min(200 mm, b_min, k_phi·phi) com
      k_phi = 24 (CA-25) ou 12 (CA-50). Estribos em TODA a altura do pilarete.
      RECUSA EXPLÍCITA se a armadura longitudinal for CA-60: o item não fornece
      k_phi para CA-60 e o valor é NAO_DECLARADO_NA_FONTE. É PROIBIDO
      interpolar por f_yk, extrapolar de CA-50, ou "adotar 12 phi por
      analogia". A mensagem cita 18.4.3 e diz que a Norma não cobre o caso.
      A alternativa phi_t < phi/4 só é oferecida com o MESMO tipo de aço nas
      duas armaduras e aplica a limitação ADICIONAL s_max = 90000·(phi_t²/phi)/
      f_yk (f_yk em MPa, s em mm) — adicional, nunca substitutiva do
      min(200, b_min, k_phi·phi). ATENÇÃO À TRANSCRIÇÃO: NÃO há raiz quadrada
      nessa expressão; a camada de texto do PDF sugere um expoente 1/2 que não
      existe, e o mutante correspondente está em tools/checar_dimensoes.py.
      A NOTA de 18.4.3 sobre C55-C90 (reduzir 50 %, ganchos a 135°) é
      RECOMENDAÇÃO: pode virar aviso, JAMAIS verificação de reprovação.

  - id: REQ-PILARETE-09-cobrimento-proprio-e-a-incompatibilidade-com-Sapata
    texto: >-
      [rule: NBR6118-Tab7.2-nota-d-cobrimento-pilarete].
      O pilarete tem CAMPO DE COBRIMENTO PRÓPRIO, separado do da sapata:
      c_nom,pilarete = max(45 mm ; valor da Tabela 7.2 para a classe de
      agressividade na linha aplicável ; phi ; d_agregado/1,2). Medido à face
      externa do ESTRIBO (7.4.7.5).
      INCOMPATIBILIDADE REGISTRADA COM O CÓDIGO EXISTENTE, e a instrução é para
      NÃO consertá-la à força: `sapata_isolada/sapata.py::Sapata` recebe UM
      único `cobrimento` para a peça inteira (`__init__`, default 0,05 m), e
      esse número atravessa `ui/completo/formulario.py`, `modelo.py`,
      `projeto.py` (schema `.s7proj`), `relatorio.py`, `pranchas.py` e
      `visual3d.py`. O pilarete NÃO reusa esse campo e NÃO o altera nesta
      versão. Quando a integração pilarete<->sapata for feita (rodada própria),
      o campo novo entra como `cobrimento_pilarete` com default None e
      migração que preserva arquivos salvos — mudar o significado do campo
      existente invalidaria aprovações de A6/A7 sobre `ui/` sem necessidade.
      A redução de 5 mm por classe de resistência superior à mínima e a de
      7.4.7.4 (Delta_c = 5 mm, que exige ABNT NBR 9062, ausente do acervo) NÃO
      são implementadas.

  - id: REQ-PILARETE-10-emenda-por-traspasse-pilarete-sapata
    texto: >-
      [rule: NBR6118-9.5.2.3-traspasse-comprimidas],
      [rule: NBR6118-9.5.2.1-emenda-100-por-cento-comprimida],
      [rule: NBR6118-9.5.2.4.2-armadura-transversal-na-emenda].
      ell_0c = ell_b,nec >= max(0,6·ell_b ; 15·phi ; 200 mm), com
      ell_b = (phi/4)·(f_yd/f_bd) >= 25·phi, f_bd = eta_1·eta_2·eta_3·f_ctd
      (9.3.2.1, eta_2 DECLARADO por REQ-PILARETE-02-g) e alpha = 1,0 em
      ell_b,nec (barra comprimida não tem gancho nem barra transversal soldada).
      phi > 32 mm -> traspasse PROIBIDO (9.5.2): RECUSA.
      NÃO REUSAR `sapata.py::_ancoragem_pilar`. Aquela função calcula
      ANCORAGEM DENTRO DA SAPATA e usa `max(0,6·ell_b, 10 phi, 100 mm)`, que é
      um híbrido: o 0,6·ell_b vem do mínimo de EMENDA (9.5.2.3) e o 10 phi /
      100 mm vêm do mínimo de ANCORAGEM (9.4.2.5, que tem 0,3·ell_b). Não
      corresponde a nenhum dos dois itens. Conservador na primeira parcela, mas
      sem rastreabilidade — kb/pendencias.md > V12. O pilarete calcula ell_0c
      do seu próprio jeito, com [rule: ] correto.
      VERIFICAR A HIPÓTESE, não assumi-la: "armadura permanentemente
      comprimida" é o que autoriza 100 % das barras emendadas na mesma seção.
      Se QUALQUER combinação tracionar a armadura do pilarete, a autorização
      cai, passam a valer 9.5.2.2 e a Tabela 9.4 (não implementadas) e o
      software RECUSA.
      Armadura transversal da emenda: impor o TEXTO (estribo fechado, uma barra
      a 4·phi além de cada extremidade da emenda, concentração nos terços
      extremos) e NÃO dimensionar Soma A_st pelos valores que só existem na
      Figura 9.5 — não conferidos por leitura vetorial (V11). Remeter ao
      projetista com aviso no memorial.

  - id: REQ-PILARETE-11-junta-de-concretagem-tres-casos-e-uma-recusa
    texto: >-
      [rule: NBR6118-21.6-junta-de-concretagem-pilarete-sapata].
      Enumeração fechada, sem default:
        MONOLITICO -> segue, sem exigência adicional de 21.6.
        JUNTA_COM_ADERENCIA_DECLARADA -> segue. A declaração é
          DECLARADO_PELO_USUARIO, vai LITERAL no memorial junto com a exigência
          do 1º parágrafo de 21.6 (o projeto de execução deve indicar de forma
          precisa o local e a configuração da superfície da junta), e a espera
          dimensionada por 9.5.2.3 é a armadura que atravessa a junta.
        JUNTA_SEM_ADERENCIA_ASSEGURADA -> RECUSA. Mensagem: 21.6 exige armadura
          de costura, a NBR 6118 não fornece modelo de cisalhamento na
          interface (sem coeficiente de atrito, sem coesão, sem rugosidade em
          mm, sem taxa mínima) e a ABNT NBR 9062 NÃO ESTÁ NO ACERVO. É PROIBIDO
          calcular por aproximação, por Eurocódigo ou por ACI.
      MITIGAÇÃO ACRESCENTADA PELO a2 (não estava no despacho): quando houver
      H != 0 na junta do caso JUNTA_COM_ADERENCIA_DECLARADA, o memorial traz
      AVISO de que a NBR 6118 não fornece verificação de transferência de
      cortante na junta e de que a adequação repousa na especificação de
      execução e na ART. Aviso, não recusa — recusar seria julgamento de
      engenharia que o a2 não pode aprovar sozinho. Pergunta em
      kb/pendencias.md > V13.

  - id: REQ-PILARETE-12-memorial-e-o-que-ele-e-obrigado-a-dizer
    texto: >-
      O relatório do pilarete imprime, sem exceção: (a) os itens normativos de
      cada verificação com página; (b) M_1d,min das duas direções e a frase
      sobre compressão centrada não ser estado admissível; (c) lambda,
      lambda_1, i e ell_e por direção, com a vinculação DECLARADA; (d) N_Rd0 e
      nu = N_d/N_Rd0 rotulados como INFORMATIVOS, com a frase "esta versão não
      verifica o ELU de seção sob flexo-compressão"; (e) gamma_c e gamma_s
      efetivamente usados e se a correção × 1,1 de 12.4.1 foi aplicada; (f) o
      tipo de junta e, no caso declarado, o texto da declaração; (g) as
      hipóteses declaradas: j >= 28 dias, eta_2 de aderência, cobrimento de
      45 mm aplicado ao pilarete inteiro, M_1d,min substituindo as imperfeições
      locais fora de estrutura reticulada.
      É PROIBIDO o memorial do pilarete emitir "APROVADO"/"OK" global.

  - id: REQ-PILARETE-13-testes-sem-exemplo-de-terceiros
    texto: >-
      ACHADO QUE MUDA A ESTRATÉGIA DE TESTE, e ele vem da busca negativa do a1,
      reconferida pelo a2: NÃO HÁ UM ÚNICO EXEMPLO RESOLVIDO DE PILARETE em
      toda a bibliografia do acervo — Bastos ("pilarete": 0 ocorrências;
      "esbeltez": 0) e Cintra/Aoki/Albiero tratam o pilar só como condição de
      contorno da sapata. O GATE 3 NÃO terá conferência numérica de terceiros.
      Isso não bloqueia o GATE 1, mas obriga o A5 a entregar, e o A7 a exigir:
        (1) INVARIÂNCIA: sob M_1d,min apenas, lambda_1 = 35 EXATAMENTE, para
            h de 0,14 m a 2,00 m e para qualquer N_d (o N_d cancela). Testar a
            faixa inteira, não um ponto.
        (2) FRONTEIRA ESTRITA: lambda == lambda_1 NÃO dispensa a 2ª ordem —
            teste em cima do valor.
        (3) FRONTEIRAS DURAS de 13.2.3: b = 13,9 cm recusa; b = 19×18 cm (A_c =
            342 cm²) recusa mesmo com b >= 14 cm; b = 14,0 cm aceita com
            gamma_n = 1,25.
        (4) MUTAÇÃO: remover eta_c do cálculo de sigma_c deve QUEBRAR um teste
            com f_ck = 45 MPa (e não pode quebrar nenhum com f_ck = 25 MPa —
            é assim que se prova que o teste testa o que diz testar).
        (5) FÍSICA: N_Rd0 monótono crescente em A_s e em f_ck; ell_0c monótono
            crescente em phi e decrescente em f_ck; lambda cresce com ell.
        (6) CONTRA-PROVA PARCIAL DISPONÍVEL, e é o único ponto com valor
            externo: ell_b/phi = 37,7 para C25/CA-50 boa aderência sem gancho,
            contra o valor de tabela clássico de 38·phi; e sigma_s2 = 420 MPa
            para CA-50 em eps_c2 = 2 ‰. Usar como fixtures, declarando que a
            referência é tabela consagrada e não fonte do acervo.

  - id: REQ-PILARETE-14-proibicao-de-mistura-de-metodo-e-de-majoracao-por-vento
    texto: >-
      COLISÃO DE MÉTODO DE SEGURANÇA (cascata do a2, item 3), e esta versão é a
      primeira em que ela fica perigosa de verdade, porque passam a coexistir um
      bloco `admissivel` (geotécnico, característico + FS global) e um bloco
      inteiramente `calculo` (pilarete, gamma_f/gamma_m):
        (a) A API do pilarete aceita SOMENTE valores de cálculo (N_d, M_d), e o
            parâmetro carrega o metadado do método, como já se faz em
            REQ-SIGMA-01/02. Receber valor característico é ERRO EXPLÍCITO, não
            conversão automática: o software NÃO multiplica por 1,4 sozinho.
        (b) É PROIBIDO comparar qualquer grandeza do pilarete com tensão
            admissível do solo, e é PROIBIDO alimentar o pilarete com o N que
            foi usado na verificação geotécnica de ELS.
        (c) MAJORAÇÃO POR VENTO: as regras NBR 6122 §6.3.2 (15 %/30 %) e §6.3.3
            (10 %) são EXCLUSIVAS da tensão do SOLO e NÃO TÊM NENHUMA aplicação
            ao pilarete. É PROIBIDO majorar N_Rd0, f_cd, f_yd ou qualquer
            resistência de concreto/aço por vento. A ação do vento entra no
            pilarete pelos coeficientes de combinação da NBR 8681/NBR 6118
            §11, do lado das AÇÕES, e só. Encontrar em `estrutural/` qualquer
            referência a 6.3.2/6.3.3 é veto do a6.

  - id: REQ-ETA-C-01-eta-c-ausente-no-motor-amplo-lado-inseguro
    prioridade: ALTA
    lado: INSEGURO
    texto: >-
      NÃO É REQUISITO DO PILARETE. É defeito PREEXISTENTE em
      `calc_core/sapata_isolada/`, encontrado por esta rodada porque foi ela que
      extraiu 8.2.10.1 pela primeira vez, e despachado ao a5 por ser matéria
      estrutural.
      O QUE A NORMA DIZ (conferido por leitura visual da p. impressa 121 pelo
      a2, item 17.2.2, alínea e): a tensão constante do diagrama retangular é
      "alpha_c·eta_c·f_cd", com eta_c definido em 8.2.10.1 — eta_c = 1,0 para
      f_ck <= 40 MPa e eta_c = (40/f_ck)^(1/3) acima.
      O QUE O CÓDIGO FAZ: `materiais.py::Concreto.alpha_c` devolve 0,85 (ou
      0,85·[1-(f_ck-50)/200]) e eta_c NÃO EXISTE em `calc_core/`. O consumidor é
      `sapata.py::_armadura_flexao_simples`, que monta
      `A = alpha_c·f_cd·b_w·lambda`. Como `Concreto.__post_init__` aceita f_ck
      até 90 MPa, o bloco comprimido fica superestimado em 1/eta_c para
      f_ck > 40: +4,0 % (C45), +7,7 % (C50), +14,5 % (C60), +31,0 % (C90).
      IMPACTO MEDIDO, executando a própria fórmula do código: em seção pouco
      armada o déficit de A_s é < 1 % (M_d = 300 kN·m/m, d = 0,45 m: 15,60
      contra 15,69 cm²/m em C90); em seção próxima do limite de dutilidade o
      déficit chega a 9,0 % de A_s A MENOS, e x/d sai 0,486 contra 0,700
      corretos — a verificação `x/d <= csi_limite` PASSA quando deveria
      REPROVAR. Lado inseguro nos dois efeitos.
      O QUE FAZER: acrescentar `Concreto.eta_c` com [rule:
      NBR6118-8.2.10.1-diagrama-idealizado-do-concreto] e multiplicá-lo onde
      alpha_c é usado no diagrama retangular. NÃO mexer em `bielas.py:102`
      (`0,85·alpha_v2·f_cd`) nesta rodada: é outro item (nós de bielas e
      tirantes), não extraído, e mudar por analogia seria o erro que este
      pipeline existe para impedir.
      CONSEQUÊNCIA DE PROCESSO, explícita porque é obrigatória: este conserto
      TOCA `sapata_isolada/materiais.py` e `sapata_isolada/sapata.py` e portanto
      INVALIDA as aprovações de A6 (GATE 2) e A7 (GATE 3) para a superfície de
      flexão da sapata — nova rodada de a6 e a7 sobre ela antes de release.
      Enquanto não for feito, a interface deve avisar que o motor amplo não é
      confiável para f_ck > 40 MPa em flexão. kb/pendencias.md > V15.

requisitos_para_a3:
  - id: REQ-UI-SIGMA-01-rotulo-de-ELU
    texto: >-
      Espelho de REQ-SIGMA-09 na interface. O número devolvido pelos caminhos
      da v9 NÃO pode aparecer na tela rotulado como "tensão admissível". Rótulo
      permanente, legível, ao lado do valor e repetido no memorial: "parcela de
      ELU da tensão admissível (NBR 6122:2022 §7.3) — §7.4 (ELS/recalque) NÃO
      verificado". Sem sigla, sem asterisco de rodapé — mesmo padrão de
      REQ-UI-01.

  - id: REQ-UI-SIGMA-02-rotulo-nao-normativo-da-formulacao
    texto: >-
      As fórmulas da v9 são de FONTE SECUNDÁRIA NÃO NORMATIVA. Rótulo visível
      junto ao resultado e no memorial: "Formulação de CINTRA, AOKI e ALBIERO,
      'Fundações Diretas: Projeto Geotécnico', Oficina de Textos, 2011 — fonte
      bibliográfica, NÃO normativa. A NBR 6122:2022 autoriza o procedimento
      (§7.3.2 / §7.3.3) mas não prescreve a fórmula." O memorial cita
      `[pratica: <id>]`, nunca `[rule: <id>]`, para tudo que venha desta fonte.
      Acrescentar, para as correlações semiempíricas, a advertência que a
      própria fonte publica (Mello, 1975, p. 61) sobre "formulários de bolso".

  - id: REQ-UI-SIGMA-03-avisar-recusa-de-dominio
    texto: >-
      Quando a4 RECUSAR uma entrada por estar fora do domínio (REQ-SIGMA-04 e
      REQ-SIGMA-07), a UI tem de dizer O QUÊ e POR QUÊ, não "erro de cálculo":
      nome do parâmetro, valor informado, intervalo declarado pela fonte e o
      fato de que é limite DA FONTE e não do software. Exemplo de redação:
      "N_SPT = 25 fora do domínio declarado (5 a 20) da regra sigma_a = N/50.
      A fonte não autoriza a fórmula fora dessa faixa — escolha outro método ou
      informe outro N_SPT." Recusa silenciosa, valor clampado ou resultado
      aproximado são PROIBIDOS: o usuário tem de saber que o método não se
      aplica ao caso dele.
      Distinguir na tela o que é limite DECLARADO EM TEXTO na fonte (5-20 da
      regra N/50) do que é limite ADOTADO PELO a2 a partir da extensão de uma
      figura (1-3 m e 4-25 de Teixeira) — os dois recusam, mas têm força
      diferente e o segundo é revisável por decisão humana.

  - id: REQ-UI-SIGMA-04-gamma-efetivo-e-dois-campos
    texto: >-
      gamma é ENTRADA, nunca derivado de tabela (FB-CINTRA-2.9.3-pesos-
      especificos, REJEITADA). DOIS campos separados, porque a fonte avisa que
      gamma acima e abaixo da cota da base podem diferir sob o mesmo símbolo. E
      a interface tem de dizer, com todas as letras, que abaixo do nível d'água
      o valor pedido é o peso específico EFETIVO (submerso, tipicamente
      9-11 kN/m³), não o saturado (19-21 kN/m³). Motivo, e é grave: a própria
      fonte se contradiz nesse ponto (impressa 46), e aplicar 19-21 kN/m³ como
      efetivo abaixo do N.A. erra gamma por um fator de ~2, SEMPRE DO LADO
      INSEGURO.
      PROIBIDO exibir classificação de solo ("areia medianamente compacta",
      "argila rija") como se fosse resultado de cálculo: as faixas de N_SPT vêm
      da ABNT NBR 6484/2001 por citação secundária, e essa norma está AUSENTE
      do acervo.

  - id: REQ-UI-SIGMA-05-vento-explicito-e-nunca-automatico
    texto: >-
      Espelho de REQ-SIGMA-10. As três entradas de vento são controles
      explícitos, com default que NÃO majora, e a tela deve deixar claro que a
      Norma dá um TETO ("em até 15 %"), não um valor a aplicar. Se o usuário
      marcar "vento é ação variável principal", a UI deve dizer que quem define
      isso é a ABNT NBR 8681 e vem da análise estrutural — o software não
      verifica. A lista dos sete tipos de obra é apresentada como lista fechada,
      por seleção, nunca como texto livre. Exibir o FSg efetivo resultante
      (FSg/(1+k_v)) ao lado, para que a guarda do piso de 1,6 seja visível
      quando bindar.

  - id: REQ-UI-SIGMA-06-declaracao-regional-e-de-escopo
    texto: >-
      Espelho de REQ-SIGMA-06. Caixa de declaração, sem default afirmativo, e o
      texto tem de aparecer no memorial junto com o valor. Acrescentar o aviso
      de escopo desta versão: sapata isolada, carga CENTRADA, solo HOMOGÊNEO. O
      caminho teórico recusa perfil estratificado (item 2.5 da fonte não
      extraído) e nenhum caminho da v9 trata excentricidade — a regra de área
      efetiva de Meyerhof está em kb mas NÃO foi aprovada.


  # ===========================================================================
  # REQ-UI-CAMADA-01 a 07 — VERSÃO 10. Camada única de dados: phi'/c'/gamma na
  # base derivados da camada em h_f (backlog #12).
  #
  # PROBLEMA: `ui/completo/formulario.py::_secao_solo` pede o MESMO dado
  # geotécnico duas vezes e sem ligação nenhuma entre as duas — nos campos
  # soltos `v_gamma_solo`/`v_phi_solo`/`v_coesao` (linhas 325-327) e dentro da
  # `Camada` que contém a cota h_f, no "Perfil em camadas". Quem preenche o
  # perfil digita de novo, à mão, o que já digitou; e nada impede que os dois
  # lados divirjam depois.
  #
  # NENHUMA CONTA NOVA. Tudo o que estes sete requisitos mandam exibir sai de
  # `PerfilGeotecnico.camada_em(z)` (geotecnia.py:117-123), `Camada.gamma
  # (abaixo_na)` (:66-67), `Camada.phi` e `Camada.coesao`. CLAUDE.md regra 4
  # continua valendo sem atenuação: a tela LÊ, não calcula, e não pode conter
  # aritmética própria sobre esses valores (nem soma de espessuras para achar
  # a camada — `camada_em` já faz isso).
  #
  # NOMES FIXADOS PELO a2, e são normativos para esta rodada, para que o teste
  # automatizado e o a6 tenham alvo determinístico (foi a falta disso que
  # custou rodadas no GATE 2 de sigma_adm):
  #   `PainelEntrada.ultima_derivacao_de_camada: dict | None`  (atributo de
  #       CLASSE com default None, como `ultimo_sigma_adm_calculado`
  #       (formulario.py:581), para que `getattr` antes da construção seja
  #       seguro). Chaves: `nome_camada`, `hf`, `abaixo_na`, `gamma`, `phi`,
  #       `coesao`, `extrapolada`.
  #   `PainelEntrada._preenchendo_solo_derivado: bool`   (guard de escrita)
  #   `PainelEntrada._carregando_solo: bool`             (guard de carregamento)
  #   `PainelEntrada.lbl_solo_derivado: ttk.Label`       (rótulo)
  #   `PainelEntrada._atualizar_rotulo_solo_derivado()`  (único ponto de rótulo)
  #   `PainelEntrada._derivar_solo_da_camada()`          (única derivação)
  #   `PainelEntrada._ao_editar_solo_derivado(*args)`    (trace de invalidação)
  # ===========================================================================

  - id: REQ-UI-CAMADA-01-gatilho-e-fonte-da-derivacao
    texto: >-
      Existindo perfil em camadas, os três campos soltos "γ_solo [kN/m³]",
      "φ' na base [graus]" e "c' na base [kPa]" passam a ser PREENCHIDOS a
      partir da camada vigente na cota de assentamento, em vez de digitados de
      novo. A derivação é `camada = PerfilGeotecnico(camadas=self._camadas,
      nivel_agua=<N.A. atual>).camada_em(<h_f atual>)` e escreve
      `camada.gamma(abaixo_na)` em `v_gamma_solo`, `camada.phi` em
      `v_phi_solo` e `camada.coesao` em `v_coesao`, com
      `abaixo_na = <N.A.> is not None and <h_f> > <N.A.>`. Nenhuma conversão de
      unidade: `Camada.phi` já é grau e `Camada.coesao` já é kPa, exatamente as
      unidades dos rótulos da tela.
      PREENCHE, NUNCA TRAVA — herdado de REQ-UI-SIGMA e do texto que já está
      fixo na tela (NBR 6122:2022 §7.2, formulario.py:330-336): os três campos
      continuam `ttk.Entry` editáveis, sem `state="readonly"`, sem
      `state="disabled"`, sem validador que recuse o valor digitado. O
      engenheiro sobrescreve quando quiser, e é ele quem assina a ART.
      GATILHOS, lista FECHADA — só ação interativa do usuário sobre o perfil ou
      sobre as duas cotas que definem qual camada vale: `_adicionar_camada`,
      `_editar_camada`, `_remover_camada` (os três já existentes) e trace de
      escrita em `v_hf` e em `v_nivel_agua`. Nada mais dispara derivação; em
      particular NÃO dispara em `ler_solo`, `ler_perfil`, dimensionamento,
      exportação ou repintura de tela.
      ONDE O GANCHO NÃO PODE FICAR, e é a armadilha desta tarefa:
      `_atualizar_tree_camadas` é chamada pelos três pontos de edição de camada
      MAS TAMBÉM por `preencher_solo` (formulario.py:646). Pendurar a derivação
      nela viola REQ-UI-CAMADA-04 em silêncio. O gancho vai nos três métodos de
      edição, depois do `_atualizar_tree_camadas` de cada um.
      DESEMPATES, decididos aqui para não sobrarem para o código: (a) h_f
      exatamente sobre uma interface pertence à camada DE BAIXO — é a convenção
      que `camada_em` já implementa (`z0 <= z < z1`) e é a fisicamente certa,
      porque a sapata se apoia sobre o que está abaixo da sua base; (b) h_f
      exatamente igual ao N.A. conta como ACIMA (`abaixo_na = False`, portanto
      `gamma_nat`), por ser `>` estrito.
      LEITURA DOS DOIS NÚMEROS DE ENTRADA: h_f e N.A. são lidos com os MESMOS
      auxiliares que `ler_solo`/`ler_perfil` usam (`_float`/`_float_opt`,
      incluindo a normalização de vírgula decimal), nunca com `float()` cru —
      senão a tela pode derivar de uma cota e o núcleo calcular com outra.
      ESCRITA DOS TRÊS NÚMEROS DE SAÍDA: `f"{valor:.10g}"`, exatamente o
      formato que todos os `preencher_*` e `_abrir_calculadora_sigma_adm` já
      usam (formulario.py:414, 639-642). Não é preferência estética: é o que
      garante que 34.0 vire "34" e não "34.00", que o valor derivado seja
      textualmente indistinguível de um digitado à mão, e que os critérios de
      aceite abaixo sejam comparações exatas de string.
    criterio_de_aceite:
      - >-
        Perfil [Camada("Aterro", 1.0, phi=28, coesao=5, gamma_nat=17,
        gamma_sat=19), Camada("Areia", 2.0, phi=34, coesao=0, gamma_nat=18,
        gamma_sat=20)], N.A. vazio, h_f = 1,50: adicionar a segunda camada pela
        UI deixa v_phi_solo == "34", v_coesao == "0" e v_gamma_solo == "18".
      - >-
        Mesmo perfil com N.A. = 1,20 e h_f = 1,50: v_gamma_solo == "20"
        (gamma_sat, `abaixo_na` verdadeiro).
      - >-
        h_f = 1,00 (exatamente a interface) deriva da camada "Areia", não da
        "Aterro"; h_f = 1,20 com N.A. = 1,20 deriva gamma_nat = 18, não 20.
      - >-
        Editar a camada que contém h_f (`_editar_camada`) atualiza os três
        campos; editar uma camada que NÃO contém h_f também roda a derivação e
        os três campos permanecem coerentes com a camada em h_f.
      - >-
        Digitar "1,80" (vírgula) em v_hf deriva da mesma camada que "1.80".
      - >-
        Busca textual em `ui/` não encontra soma de espessuras, `limites()`,
        `float()` cru sobre esses campos nem qualquer aritmética sobre gamma /
        phi / coesao fora das chamadas ao núcleo (CLAUDE.md regra 4).

  - id: REQ-UI-CAMADA-02-guardas-de-recusa-e-extrapolacao-nunca-silenciosa
    texto: >-
      A derivação RECUSA-SE a agir, sem exceção, sem diálogo modal e sem tocar
      nos três campos, em qualquer destes casos: (a) `self._camadas` vazia —
      não há perfil, os campos continuam sendo entrada manual pura, como hoje;
      (b) o texto de `v_hf` está em branco ou não é número (o trace dispara a
      CADA tecla: "1", "1.", "1.e" são estados normais de digitação e não podem
      levantar exceção nem abrir `messagebox`); (c) o texto de `v_nivel_agua`
      não é número (em branco É válido e significa N.A. ausente); (d) h_f <= 0.
      POR QUE (d) É OBRIGATÓRIO, e não é zelo: `camada_em(-1.0)` devolve a
      camada MAIS PROFUNDA do perfil (verificado por execução pelo a2 —
      geotecnia.py:121-122 tem `if self.camadas: return self.camadas[-1]` como
      saída final). Sem a guarda, uma cota negativa digitada por engano
      preencheria os três campos com a camada de fundo e ainda a rotularia como
      derivada.
      POR QUE (b) NÃO DERIVA COM O DEFAULT: `ler_solo` faz `_float(self.v_hf.
      get(), 1.5)`, isto é, campo em branco vira 1,5 m para o núcleo em
      silêncio. Esse comportamento é PRÉ-EXISTENTE e esta versão não o altera
      (REQ-UI-CAMADA-07), mas a derivação não pode se apoiar nele: derivar de
      um 1,5 m que o usuário não digitou seria inventar proveniência.
      EXTRAPOLAÇÃO ABAIXO DO PERFIL — deriva, mas JAMAIS em silêncio. Quando
      h_f > `perfil.profundidade_total`, `camada_em` devolve a última camada
      sem avisar (verificado: perfil de 3,00 m, `camada_em(10.0)` devolve a
      camada de fundo). Nesse caso a derivação acontece (o dado é do próprio
      usuário e é sempre sobrescrevível) mas `ultima_derivacao_de_camada
      ["extrapolada"]` é `True` e o rótulo de REQ-UI-CAMADA-03 tem de dizer, em
      texto, que h_f está ABAIXO da base do perfil e informar a profundidade
      total. Mesma doutrina de REQ-UI-SIGMA-03: extrapolação silenciosa,
      clamp e valor aproximado sem aviso são PROIBIDOS.
    criterio_de_aceite:
      - >-
        Sem camadas: escrever "2.0" em v_hf não altera nenhum dos três campos e
        `ultima_derivacao_de_camada is None`.
      - >-
        Com perfil válido, escrever "abc", "" ou "1.e" em v_hf: nenhuma
        exceção propaga, nenhum `messagebox` é aberto, os três campos ficam
        como estavam.
      - >-
        h_f = "-1" ou "0": nenhuma derivação; em particular v_phi_solo NÃO
        recebe o phi da camada mais profunda.
      - >-
        Perfil de 3,00 m e h_f = 4,00: os três campos são preenchidos com a
        camada de fundo, `ultima_derivacao_de_camada["extrapolada"] is True` e
        `lbl_solo_derivado.cget("text")` contém a profundidade total do perfil
        e a informação de que h_f está abaixo dela.
      - >-
        N.A. com texto inválido ("x"): sem derivação, sem exceção.

  - id: REQ-UI-CAMADA-03-proveniencia-conjunta-e-invalidacao-pelos-tres
    texto: >-
      Mesma arquitetura de `ultimo_sigma_adm_calculado` /
      `_ao_editar_sigma_adm` / `_preenchendo_sigma_adm_calculado`
      (formulario.py:320, 403-447) — não outra. Reaproveitar, não reinventar:
      guard de flag ligado ANTES dos `.set()` programáticos e desligado em
      `finally`, trace de escrita que invalida em qualquer outra edição, e uma
      ÚNICA função de rótulo chamada dos dois pontos (o que preenche e o que
      invalida), para que rótulo e estado nunca saiam de sincronia.
      OS TRÊS SÃO UM CONJUNTO, e esta é a decisão que fecha a ambiguidade:
      edição manual de QUALQUER um dos três (`v_gamma_solo`, `v_phi_solo`,
      `v_coesao`) invalida a proveniência dos TRÊS ao mesmo tempo —
      `ultima_derivacao_de_camada = None` e rótulo vazio. Deixar phi'/c' ainda
      marcados como "derivados" porque só gamma foi tocado criaria um estado
      ambíguo PIOR que a duplicação de hoje: o rótulo afirmaria uma origem
      comum que já não existe.
      O RÓTULO: `ttk.Label` discreta ao lado dos três campos, mesmo padrão
      visual de `lbl_sigma_adm_elu` (`style="PainelFraco.TLabel"`, `wraplength`,
      `justify="left"`), atualizada SÓ por `_atualizar_rotulo_solo_derivado()`.
      Dois estados, e apenas dois: (i) proveniência válida — texto que contém
      obrigatoriamente o radical "derivad", o NOME da camada exatamente como
      está em `Camada.nome`, e o valor de h_f usado; (ii) proveniência inválida
      — string VAZIA. Nunca um terceiro estado.
      VAZIO MESMO QUE OS NÚMEROS COINCIDAM: se o engenheiro apagar e redigitar
      à mão o mesmo "34" que a derivação havia posto, a proveniência morre
      assim mesmo. O rótulo afirma DE ONDE veio, não QUANTO vale; um "derivado"
      que sobrevive à digitação manual é falso ainda que o número bata.
      O guard `_preenchendo_solo_derivado` existe exatamente para o
      preenchimento programático não se autoinvalidar nos três `.set()` — os
      três ficam DENTRO do mesmo `try/finally`, e `ultima_derivacao_de_camada`
      só é gravado DEPOIS de os três terem sido escritos.
    criterio_de_aceite:
      - >-
        Após uma derivação bem-sucedida, `ultima_derivacao_de_camada` é um
        dict com as sete chaves e `lbl_solo_derivado.cget("text")` contém o
        nome da camada e o h_f usado.
      - >-
        `painel.v_phi_solo.set("31")` (edição manual simulada) zera
        `ultima_derivacao_de_camada` E esvazia o rótulo; idem para
        `v_gamma_solo` e para `v_coesao`, um teste por campo.
      - >-
        Redigitar no campo exatamente o mesmo texto que a derivação escreveu
        também invalida (rótulo vazio).
      - >-
        A derivação NÃO se autoinvalida: logo após `_derivar_solo_da_camada()`,
        `ultima_derivacao_de_camada is not None`.
      - >-
        `_preenchendo_solo_derivado` volta a `False` mesmo se um `.set()`
        levantar exceção (bloco `finally`).

  - id: REQ-UI-CAMADA-04-preencher-solo-nao-deriva-e-a-assimetria-do-guard
    texto: >-
      `preencher_solo()` — caminho de "Abrir projeto..." (`app.py:359`) — NÃO
      dispara derivação, mesmo quando o `Solo` carregado traz `perfil` com
      camadas. RAZÃO REGISTRADA, para que ninguém "conserte" isso depois: um
      projeto salvo já tem valores EXPLÍCITOS gravados para `gamma_solo`,
      `phi` e `coesao` (`ui/completo/projeto.py:366`), possivelmente diferentes
      da camada em h_f DE PROPÓSITO — o engenheiro pode tê-los sobrescrito à
      mão antes de salvar, e a NBR 6122:2022 §7.2 lhe dá esse direito. Repor os
      três exatamente como vieram do arquivo, sem reinterpretar, é o mesmo
      princípio que já rege `preencher_casos`: dado explícito de arquivo
      carregado não é substituído por reinterpretação silenciosa.
      ASSIMETRIA DO GUARD, e errar o sinal aqui produz exatamente o defeito que
      a MÉDIA #4 do GATE 2 do sigma_adm criou: `_carregando_solo` suprime a
      DERIVAÇÃO e NUNCA suprime a INVALIDAÇÃO. Depois de `preencher_solo`, os
      três campos são valores de arquivo, portanto NÃO são derivados:
      `ultima_derivacao_de_camada` tem de terminar `None` e o rótulo vazio. É o
      mesmo desfecho que `_ao_editar_sigma_adm` já produz para sigma_adm nessa
      função, e pela mesma razão.
      POR QUE O GUARD É INDISPENSÁVEL (não basta "não chamar a derivação"):
      `preencher_solo` escreve `v_hf` na linha 639 e `v_nivel_agua` na 648, e
      os traces de REQ-UI-CAMADA-01 disparariam nas duas. Pior, a ordem torna
      isso ativamente errado: `self._camadas` só é substituída na linha 645 —
      um trace disparado pela linha 639 leria as camadas do projeto ANTERIOR e
      derivaria da estratigrafia errada. O guard cobre o corpo INTEIRO de
      `preencher_solo`, em `try/finally`.
      DEPOIS DE CARREGADO, TUDO VOLTA AO NORMAL: a primeira edição interativa
      de camada, de h_f ou do N.A. deriva como sempre e o rótulo reaparece.
    criterio_de_aceite:
      - >-
        `preencher_solo(Solo(sigma_adm=250, gamma_solo=15, hf=1.5, phi=22,
        coesao=7, perfil=<perfil cuja camada em 1,5 m tem phi=34, coesao=0,
        gamma=20>))` deixa v_gamma_solo == "15", v_phi_solo == "22" e
        v_coesao == "7" — os valores do arquivo, NÃO os da camada.
      - >-
        Após essa chamada, `ultima_derivacao_de_camada is None` e
        `lbl_solo_derivado.cget("text") == ""`.
      - >-
        Teste de ordem: carregar um projeto A (perfil A) e em seguida um
        projeto B (perfil B) não deixa nenhum dos três campos com valor da
        estratigrafia de A.
      - >-
        Depois do carregamento, escrever "1.8" em v_hf deriva normalmente do
        perfil recém-carregado e o rótulo volta a aparecer.
      - >-
        `_carregando_solo` volta a `False` mesmo se `preencher_solo` levantar
        exceção no meio.

  - id: REQ-UI-CAMADA-05-gamma-solo-tem-dois-papeis-e-o-aviso-e-obrigatorio
    texto: >-
      ACHADO DO a2 (C2 do cabeçalho da v10), e é o ponto de segurança desta
      rodada. `gamma_solo` não tem UM significado no núcleo, tem dois, e qual
      deles vale depende de haver perfil:
      (i) COM perfil, `Solo.sobrecarga_no_nivel_da_base()` devolve
      `perfil.tensao_vertical_efetiva(hf)` e NÃO usa `gamma_solo`
      (geotecnia.py:360-364); `gamma_solo` sobra apenas no peso do solo sobre a
      sapata, `self.solo.gamma_solo * g["v_solo"]` (sapata.py:366), onde o que
      se quer é peso TOTAL. É por isso, e SÓ nessa condição, que derivar
      `Camada.gamma(abaixo_na)` — que devolve `gamma_sat`, peso saturado total
      — é defensável.
      (ii) SEM perfil, `gamma_solo * hf` PASSA A SER a sobrecarga efetiva na
      cota da base. Um `gamma_sat` deixado ali pela derivação superestima q.
      Medido pelo a2 no perfil de referência (N.A. = 1,20 m, h_f = 1,50 m):
      correto 23,66 kPa, derivado 30,0 kPa, +27 %, DO LADO INSEGURO — q maior
      significa capacidade de carga maior — e a distorção cresce até o fator
      ~2 de V7 conforme o N.A. sobe.
      EXIGÊNCIA 1 — TRANSIÇÃO PARA PERFIL VAZIO. Quando `_remover_camada`
      esvaziar `self._camadas` (última camada removida) estando a proveniência
      válida, a proveniência é invalidada E a tela exibe aviso explícito de que
      γ_solo mudou de papel: sem perfil ele passa a valer como sobrecarga na
      cota da base e, abaixo do N.A., o valor a informar é o EFETIVO
      (tipicamente 9-11 kN/m³), não o saturado (19-21) — mesmíssima redação já
      exigida por REQ-UI-SIGMA-04 e pela pendência V7. O aviso é passivo
      (rótulo/linha de texto), nunca um `messagebox` que exija clique, e NUNCA
      altera o número: quem decide é o engenheiro.
      EXIGÊNCIA 2 — HONESTIDADE DO RÓTULO. Quando a derivação usar
      `abaixo_na = True`, o texto de REQ-UI-CAMADA-03 tem de dizer que o γ
      derivado é o SATURADO (total) da camada. Proibido o rótulo sugerir que o
      software escolheu por conta própria entre saturado, efetivo e natural: o
      valor foi lido da camada que o próprio usuário cadastrou.
      EXIGÊNCIA 3 — LIMITE DA APROXIMAÇÃO, dito e não escondido. O solo apoiado
      sobre a sapata vai de h_f até a superfície e pode atravessar o N.A. e
      várias camadas; um único γ não representa isso exatamente. O rótulo diz
      "derivado da camada X em h_f", que é verdade, e não pode afirmar mais do
      que isso (nada de "peso do maciço sobrejacente" ou equivalente).
      ESTE REQUISITO ESTÁ AMARRADO A UMA PENDÊNCIA HUMANA. A pergunta de fundo
      — qual peso específico o núcleo deve usar no solo sobre a sapata abaixo
      do N.A., dado que `_peso_proprio` alimenta também as verificações de
      deslizamento e tombamento, onde peso maior é FAVORÁVEL e portanto
      superestimá-lo é inseguro — é julgamento de engenharia e o a2 não a
      decide. Está em kb/pendencias.md como V8 (filha de V7, PRIORIDADE ALTA,
      lado inseguro). Enquanto V8 não for resolvida por decisão humana
      registrada, os avisos das Exigências 1 e 2 são OBRIGATÓRIOS e o a6 os
      trata como veto se ausentes.
    criterio_de_aceite:
      - >-
        Derivação com `abaixo_na = True`: `lbl_solo_derivado.cget("text")`
        contém a informação de que o γ exibido é o saturado/total da camada.
      - >-
        Remover a última camada com proveniência válida:
        `ultima_derivacao_de_camada is None` e há na tela texto visível dizendo
        que γ_solo passa a valer como sobrecarga na cota da base e que abaixo
        do N.A. o valor pedido é o efetivo, não o saturado.
      - >-
        Essa remoção NÃO altera o número em `v_gamma_solo` (o software avisa,
        não corrige) e NÃO abre `messagebox` modal.
      - >-
        Nenhum texto da tela chama o γ derivado de peso do maciço
        sobrejacente, peso médio ou equivalente.

  - id: REQ-UI-CAMADA-06-importacao-de-perfil-por-excel-nao-e-carregamento-de-arquivo
    texto: >-
      CORREÇÃO DE PREMISSA FEITA PELO a2 (C3 do cabeçalho da v10). "Importar do
      Excel..." NÃO é, neste ponto, um carregamento de arquivo como "Abrir
      projeto...", e tratá-lo como tal reintroduz o defeito que o item #12
      existe para eliminar. `ui/completo/app.py:513` faz
      `preencher_solo(replace(solo_atual, perfil=perfil))` com
      `solo_atual = self.formulario.ler_solo()` (app.py:442) — os três valores
      NÃO vêm da planilha (`excel_import.importar_perfil_geotecnico` devolve só
      o perfil): são sobra da TELA, casados com um perfil novo e possivelmente
      de outra obra. REQ-UI-CAMADA-04 continua valendo para `preencher_solo`,
      que permanece um setter burro; a decisão é do CHAMADOR.
      REGRA, com dois ramos determinísticos, avaliada no ramo `else` de sucesso
      da importação do perfil (app.py:512-515). O estado da proveniência é
      capturado ANTES de chamar `preencher_solo` (que o zera):
      RAMO A — proveniência VÁLIDA antes da importação: os três campos eram
      derivados do perfil ANTIGO, que acabou de ser descartado; nada que o
      engenheiro tenha digitado se perde. Deriva-se do perfil NOVO
      imediatamente depois de `preencher_solo`, chamando o mesmo
      `_derivar_solo_da_camada()` de REQ-UI-CAMADA-01, com as mesmas guardas de
      REQ-UI-CAMADA-02.
      RAMO B — proveniência INVÁLIDA (valores digitados à mão ou vindos de um
      projeto aberto): NÃO sobrescrever, nunca. Em vez disso, acrescentar à
      mensagem de resumo da importação (`msg_perfil`, que já existe) uma linha
      de DIVERGÊNCIA quando qualquer um dos três diferir do valor da camada em
      h_f do perfil novo, informando os dois valores lado a lado para cada um
      dos três e a camada de referência.
      POR QUE A MENSAGEM E NÃO UM RÓTULO NOVO: `_importar_excel` já usa esse
      resumo exatamente para esta classe de silêncio — "aba ausente, perfil
      MANTIDO" (D6 do GATE 2, rodada 1) e "Hx/Hy zeradas" (BAIXA da rodada 2)
      nasceram da mesma regra: o que a importação faz ou deixa de fazer com os
      dados da tela tem de ser dito ali.
      NÃO SE EXIGE O MESMO DE "Abrir projeto...", e é decisão consciente: lá os
      três valores e o perfil vieram do MESMO arquivo, gravados juntos pelo
      mesmo engenheiro na mesma sessão; a divergência, se houver, é deliberada
      e já foi decidida uma vez. Aqui o perfil é novo e os valores são velhos —
      a divergência é acidental por construção.
    criterio_de_aceite:
      - >-
        Ramo A: com proveniência válida, importar planilha com aba de perfil
        cuja camada em h_f tem phi=38 deixa v_phi_solo == "38" e a proveniência
        VÁLIDA de novo, apontando para a camada do perfil novo.
      - >-
        Ramo B: com os três digitados à mão (proveniência inválida), a
        importação NÃO altera nenhum dos três, e a mensagem final contém uma
        linha citando o valor da tela e o da camada nova para cada um dos três
        que divergir.
      - >-
        Ramo B sem divergência (os três já iguais à camada em h_f): nenhuma
        linha de divergência é acrescentada.
      - >-
        Ramos `AbaAusente` e `ValueError` (app.py:489-511) não derivam nada e
        não tocam nos três campos — o perfil antigo foi mantido, os valores
        também.

  - id: REQ-UI-CAMADA-07-fronteira-com-o-nucleo-e-com-o-memorial
    texto: >-
      `ler_solo()` NÃO MUDA. Continua lendo o texto corrente dos três
      `StringVar` com `_float(...)`, sem consultar
      `ultima_derivacao_de_camada`, sem ramo condicional por proveniência e sem
      preferir a camada ao campo. O núcleo nunca vê o rótulo "derivado" — só o
      número final. É o mesmo contrato que já vale para sigma_adm depois de
      REQ-UI-SIGMA-01: quem calcula não precisa saber se o número foi digitado
      ou preenchido, e é isso que mantém `calc_core/` independente da tela
      (CLAUDE.md, princípio mestre). Corolário: a derivação nunca pode ser a
      ÚNICA fonte de um valor — se ela não rodar, os campos continuam com o que
      estiver neles e o cálculo sai igual ao de hoje.
      NENHUMA OBRIGAÇÃO NOVA DE MEMORIAL, PDF OU EXCEL nesta rodada, e o
      contraste com REQ-UI-SIGMA-01 é o que justifica: lá o rótulo ELU
      acompanha um número que entra numa verificação normativa de ELU e
      qualificá-lo é parte da rastreabilidade do resultado; aqui a proveniência
      é auxílio de preenchimento de campo, e o número que chega ao núcleo é
      idêntico venha de onde vier. `ultima_derivacao_de_camada` NÃO é repassada
      a `ui.completo.resultado`, a `relatorio.py`, a `pranchas.py` nem ao
      exportador Excel. (`relatorio.py:84` já imprime gamma_solo e phi' hoje;
      continua imprimindo o mesmo, sem adjetivo.)
      DECISÃO DE ESCOPO REGISTRADA, não esquecimento: se uma rodada futura
      quiser a proveniência no memorial, isso é requisito NOVO, com sua própria
      rodada de a6/a7 — e este parágrafo existe para que a ausência não seja
      lida como lacuna, do mesmo modo que a nota de escopo de REQ-UI-01.
    criterio_de_aceite:
      - >-
        O diff da rodada não toca `calc_core/`; o corpo de `ler_solo` sai
        idêntico ao da v9 (comparação textual).
      - >-
        Com proveniência válida, `ler_solo()` devolve exatamente os números que
        estão nos campos; sobrescrever v_phi_solo à mão para "20" e chamar
        `ler_solo()` devolve `phi == 20.0` (o valor da camada NÃO prevalece).
      - >-
        Busca textual por `ultima_derivacao_de_camada` não encontra ocorrência
        fora de `ui/completo/formulario.py`, `ui/completo/app.py` e dos testes.
      - >-
        O memorial/PDF/Excel gerados antes e depois desta rodada, para a mesma
        entrada, são idênticos no conteúdo de solo.

  - id: REQ-UI-01-rotulo-nao-normativo
    texto: >-
      Rótulo permanente e visível junto ao desenho e repetido no memorial:
      "Propagação de tensão em profundidade — método não normativo. A NBR
      6122:2022 não prescreve método de espraiamento. Valores informativos."
      Sem sigla, sem asterisco de rodapé: texto legível ao lado do resultado.
    estado_v8: PARCIALMENTE_ATENDIDO_POR_DECISAO_DE_ESCOPO
    nota_de_escopo_v8: >-
      REGISTRO ACRESCENTADO NA v8 — o requisito NÃO foi relaxado; o que muda é
      que a lacuna deixa de ser tácita. A metade "junto ao desenho" está
      atendida e verificada por render (a6, rodada 2). A metade "repetido no
      memorial" continua ABERTA: `calc_core/sapata_isolada/pranchas.py` não foi
      tocado por nenhum dos quatro commits desta feature (72b9987, 783b3c3,
      3f92b39, 9ecebd2 — confirmado pelo a2 com
      `git log 8e46372..HEAD --name-only`), em nenhuma das três rodadas. O
      espraiamento por camada, o rótulo de método e os dois avisos permanentes
      existem só na tela.
      NATUREZA DA LACUNA: é de OMISSÃO, não de erro. Nenhum número errado é
      emitido no PDF porque nada desta feature chega ao PDF. Por isso NÃO é
      bloqueante para o GATE 2 desta feature, e a v8 registra isso
      explicitamente para que a próxima leitura não confunda "deliberadamente
      adiado" com "esquecido" — que é a confusão que o a6 apontou ao dizer que
      "hoje o requisito está parcialmente aberto sem nenhum registro de que
      isso é deliberado" (defeito BAIXA/E4, pranchas.py:496, reincidente do
      item 13 da rodada 1).
      FORMA DO ADIAMENTO — pendência aberta com GATILHO, não com data. Prazo em
      calendário não tem como ser cumprido nem cobrado por este pipeline; um
      gatilho tem. A integração ao memorial fica para rodada posterior e passa
      a ser BLOQUEANTE assim que qualquer uma destas ocorrer:
        (i) o croqui de espraiamento for exposto em release ao usuário final
            com o memorial PDF apresentado como completo para esta feature; ou
        (ii) `pranchas.py` passar a emitir QUALQUER valor de propagação — a
             partir daí o rótulo não-normativo e o rótulo de método viajam
             junto ou nada é emitido (REQ-PROP-04); ou
        (iii) o A7 rodar sobre esta feature: caso de validação que confira o
              PDF não pode ser declarado ALTA com a seção ausente.
      Enquanto nenhuma delas ocorrer, o estado correto é o atual e a tela é a
      única superfície da feature. Registrado também em kb/pendencias.md.
  - id: REQ-UI-02-aviso-de-homogeneidade
    texto: >-
      O desenho vai mostrar camadas coloridas e um campo de tensão calculado
      como se o maciço fosse homogêneo. Essa contradição visual é a maior
      armadilha desta tela e precisa de aviso explícito: "As camadas são
      exibidas com suas propriedades reais; o campo de tensões é calculado em
      meio homogêneo e NÃO representa o contraste de rigidez entre camadas."
  - id: REQ-UI-03-sem-lastro
    texto: >-
      Não oferecer, nomear ou insinuar cálculo de lastro de rachão, colchão
      granular, camada de reforço ou substituição de solo mole. Nomear a
      funcionalidade pelo que ela é — espraiamento em perfil de solo natural.
      A NBR 6122:2022 §1 exclui melhoramento do solo do seu escopo por
      declaração; ver PC-ESPRAIAMENTO-2V1H > espaco_de_aplicacao.
  - id: REQ-UI-04-seletor-de-metodo
    texto: >-
      Seletor Boussinesq/Newmark (default, o que já existe) x 2V:1H, no mesmo
      lugar do checkbox "Bulbo de tensões" de `ui/completo/visualizacao.py:259`.
      O método escolhido aparece no desenho, não só no controle. Este seletor é
      de VISUALIZAÇÃO — não altera recalque nem verificação alguma
      (REQ-PROP-05).
  - id: REQ-UI-05-teto-de-profundidade
    texto: >-
      Não desenhar espraiamento abaixo da profundidade do perfil geotécnico
      informado. Profundidade sugerida de exibição 2·B, coerente com o bulbo de
      influência que `recalques.py:251` já usa.
  - id: REQ-UI-06-ui-nao-calcula
    texto: >-
      CLAUDE.md regra 4. q_i e a_eq,i/b_eq,i vêm prontos de calc_core (v7: e são
      LIDOS de `PontoPropagacao`, não recalculados nem derivados na tela).
      `ui/` recebe e desenha. Nenhuma reimplementação da fórmula na camada de
      desenho — foi assim que nasceu a duplicação de `recalques.py:265`.
  - id: REQ-UI-07-simbolos-do-croqui
    versao_do_texto: 8      # v7: NOVO. v8: só o item (a) — troca de fonte
                            # preferencial do q_i, sem mudar o que é exigido.
    texto: >-
      Rotulagem do croqui de espraiamento, conforme REQ-PROP-03 (B) a (F).
      Checável item a item:
      (a) Um rótulo de tensão POR INTERFACE, na cota da interface, nunca na
      meia-altura da camada, e a interface interna — compartilhada por duas
      camadas — recebe UM rótulo só. FONTE PREFERENCIAL DO VALOR (redigido na
      v8): `PontoPropagacao.delta_sigma`, isto é, `prop.pontos[i].delta_sigma`.
      `CamadaPropagacao.delta_sigma_topo`/`delta_sigma_base`, que o texto da v7
      nomeava, permanecem EQUIVALENTES E VÁLIDAS — não estão proibidas — mas
      deixam de ser a fonte recomendada. A troca é de preferência, não de
      número: são o mesmo número.
        * IDENTIDADE (o que sustenta a equivalência, e é fato de código, não
          convenção): para todo i, pontos[i].delta_sigma ==
          camadas[i].delta_sigma_topo, pontos[i+1].delta_sigma ==
          camadas[i].delta_sigma_base e pontos[i].z == camadas[i].z_topo, com
          igualdade EXATA. As duas famílias saem da MESMA chamada de
          `acrescimo_tensao(fonte, q_líq, a, b, z)` na MESMA cota
          (geotecnia.py:667-674 e :686-687). Conferido por execução pelo a6
          (184 pares: 2 fontes x 5 geometrias x 4 cotas de assentamento,
          diferença máxima 0,000e+00) e reconferido em amostra independente
          pelo a2 na v8 (2 fontes x 3 geometrias).
        * POR QUE PREFERIR O PONTO: `PontoPropagacao` carrega q_i e a_eq,i /
          b_eq,i JUNTOS, na mesma cota — que é literalmente a definição de
          REQ-PROP-03 (B). Ler a tensão de `CamadaPropagacao` e a largura de
          `PontoPropagacao` obrigaria a UI a reconstruir o mapeamento
          ponto-camada, que é a classe de erro que produziu o defeito original
          da rodada 1. A docstring de `CamadaPropagacao` (geotecnia.py:518-523)
          já diz, por escrito, que os símbolos do croqui não saem dali.
        * O QUE NÃO MUDOU: continua PROIBIDO exibir `delta_sigma_medio` como
          "q_i" (REQ-PROP-03 (D)); se exibido, rótulo próprio "Δσ_méd". Usar
          `delta_sigma_medio` como fator de COR do tronco não é rótulo e não
          viola este item.
        * A PREFERÊNCIA SÓ VALE ENQUANTO A IDENTIDADE VALER, e é isto que a v8
          registra em vez de deixar tácito. As duas famílias são produzidas por
          trechos independentes da MESMA função: se uma passar a amostrar com
          offset, ou se `limites()` deixar de ser contíguo a partir da cota da
          base, croqui e memorial exibirão números diferentes para a mesma
          interface, em silêncio, e a justificativa desta alínea cai sem que
          ninguém seja avisado. O teste de contrato que trava a identidade
          (igualdade EXATA, `==`, não `approx`, parametrizado por fonte e
          geometria, incluindo o alinhamento de cota) foi despachado ao a4 como
          defeito MÉDIA da rodada 2 do GATE 2 (geotecnia.py:667) e é a rede
          desta alínea: enquanto não existir, a preferência vale sem rede;
          existindo, não pode ser removido sem revisitar este texto. A v8 NÃO
          cria requisito novo por isso — apenas nomeia a dependência.
      (b) Um rótulo de largura POR INTERFACE, na mesma cota do q_i
      correspondente: "a_eq" no corte X, "b_eq" no corte Y, com unidade.
      (c) "L", "L1/L2/L3" e "B_eq" não aparecem em lugar nenhum da tela nem do
      memorial. A espessura da camada, se exibida, é "h" e vem de
      `CamadaPropagacao.espessura` — e a recomendação é NÃO exibi-la no tronco,
      porque a coluna estratigráfica ao lado já a informa por cota.
      (d) Sob Boussinesq, o rótulo de largura carrega a ressalva de leitura
      ilustrativa (o método não tem tronco de espraiamento); sob 2V:1H, não
      precisa. A ressalva pode ficar na legenda do método, desde que visível
      junto ao desenho.
      (e) Largura None (q_líq = 0) não vira número: traço ou omissão, com o
      aviso de pressão líquida nula visível — nunca a dimensão da sapata
      apresentada como largura calculada (`or dim` de `visual2d.py:693`).
      (f) O rótulo do método vem de `prop.rotulo_metodo`, não do estado da UI
      (REQ-PROP-04; a6, visual2d.py:669).

