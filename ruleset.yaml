# =============================================================================

# Colisão de símbolo (a2-verificador.md, item 3): COLISÃO REAL DETECTADA nesta
# rodada, entre os dois motores que coexistem no repositório.
#   - calc_core/geotecnico/  chama as dimensões em planta de B e L
#     (restricoes.verificar_dimensao_minima(B, L), geometria.*).
#   - calc_core/sapata_isolada/  chama as MESMAS grandezas físicas de a e b
#     (rigidez.classificar(a, b, h, h0, ap, bp), sapata.Sapata).
#   - a NBR 6118:2023, 22.6.1, usa 'a' para a dimensão da sapata e 'a_p' para a
#     do pilar; a NBR 6122:2022, 7.7.1, não usa símbolo.
#   - 'h' é altura da SAPATA no domínio estrutural (22.6.1) e é usado para
#     espessura de camada/profundidade no domínio geotécnico.
# Exigência para A4/A5: usar namespace por domínio no campo `implementacao` e
# nas docstrings — `estrutural.<...>` e `geotecnico.<...>`, como já feito nas
# regras acima. NÃO renomear as APIs existentes nesta rodada (quebraria a UI e
# os testes); o namespace é de DOCUMENTAÇÃO e rastreabilidade. Uma unificação
# de nomenclatura entre os dois motores é candidata a tarefa própria, com nova
# rodada de A6/A7.
# 'd' (altura útil, estrutural) x 'd' (profundidade de assentamento,
# geotécnico): ainda sem colisão efetiva — o motor geotécnico chama a
# profundidade de assentamento de outra coisa. Revisitar se §7.3.3 entrar.
#
# Colisão de método de segurança: nenhuma regra aprovada mistura 'admissivel'
# e 'calculo' — todas usam metodo: ambos porque a fórmula em si (sigma=N/A)
# é neutra ao método; a diferença fica no valor de sigma_adm que o chamador
# fornece (característico+FSg OU já ponderado). calc_core não pondera nada
# sozinho — quem chama decide e passa o valor já pronto. Isso evita a mistura
# que a norma proíbe implicitamente.
#
# Majoração por vento (§6.3.2/§6.3.3): NÃO aprovada — fora do escopo (carga
