# --- Versão 7: definição operacional dos símbolos do croqui de espraiamento ---
#     (REQ-PROP-03). Resolve o conflito ALTA/E1 apontado pelo a6 no GATE 2 do
#     commit a00401e.
#
# ATENÇÃO (CLAUDE.md regra 5): esta versão ALTERA o ruleset. As aprovações de A6
# e A7 ficam formalmente INVALIDADAS. Ressalva de escopo: NENHUMA fórmula,
# NENHUM valor numérico, NENHUM status e NENHUMA citação normativa mudou nesta
# versão. `PC-BOUSSINESQ-NEWMARK-canto-retangulo` continua APROVADA e
# `PC-ESPRAIAMENTO-2V1H` continua APROVADA_COM_USO_RESTRITO, com os mesmos
# `origem_da_confianca`, `formula`, `checagem_dimensional` e `checagem_numerica`
# da v6. O que muda é DEFINIÇÃO DE SÍMBOLO e semântica de rótulo: o que a tela
# e o memorial chamam de "q_i" e de "L_i". A nova rodada de A6/A7 pode
# restringir-se ao croqui de espraiamento (visual2d.PerfilCortes._espraiamento,
# ui/completo/visualizacao.py) e aos testes dele.
#
# O CONFLITO, COMO CHEGOU: o texto da v6 dizia "q1/q2/q3 nas cotas das
# interfaces, com L1/L2/L3 as ESPESSURAS"; o a3 implementou L_i como a LARGURA
# equivalente do tronco (`PontoPropagacao.largura_equivalente_a/_b`); a
# docstring de `CamadaPropagacao` (a4) repetia a leitura de espessura. Três
# artefatos, duas leituras, um símbolo. O a6 mediu: camada de espessura real
# 3,90 m exibida como "L2 = 6,69 m".
#
# DECISÃO: o texto da v6 é que estava errado, e o símbolo "L" é abolido deste
# croqui. Não basta corrigir "espessura" para "largura": "L" já significa
# dimensão em planta do retângulo carregado na docstring de
# `influencia_canto_retangulo` ("m = B/z, n = L/z") e comprimento de sapata no
# outro motor (`calc_core/geotecnico/`, que chama as dimensões em planta de B e
# L). Manter "L" seria trocar uma ambiguidade por outra. Ver a seção de colisão
# de símbolo, adiante.
#
# VERIFICAÇÃO DETERMINÍSTICA QUE SUSTENTA A DECISÃO (feita pelo a2, não aceita
# do a3 nem do a6):
#   1. ANÁLISE DIMENSIONAL É CEGA AQUI, e é preciso dizê-lo antes de tudo:
#      com pint, largura equivalente e espessura de camada têm a MESMA
#      dimensionalidade [length]. Nenhum mutante que troque um pelo outro será
#      rejeitado. É o mesmo limite já registrado na v6 para 2V:1H x 1V:1H. Logo
#      a proteção não pode ser dimensional — tem de ser de SEMÂNTICA DE ÍNDICE
#      (item 4 abaixo), e é isso que REQ-PROP-03 passa a exigir.
#   2. MONOTONICIDADE. A largura equivalente cresce estritamente com z nos DOIS
#      métodos: no 2V:1H por construção (a+z, b+z); no Boussinesq porque Δσ é
#      monótona decrescente e a_eq·b_eq = q_líq·a·b/Δσ. Medido no perfil de
#      referência (4 camadas, sapata 2,0x2,0 m, hf 1,5 m, q 250 kPa):
#      Boussinesq a_eq = 2,00 / 4,07 / 8,18 / 15,31 m; 2V:1H = 2,00 / 4,50 /
#      7,50 / 12,50 m. Confere com o croqui clássico de referência (L1<L2<L3
#      crescendo com a profundidade, q1>q2>q3 decrescendo). A espessura NÃO tem
#      essa propriedade.
#   3. CONTRAEXEMPLO QUE ENCERRA A LEITURA "ESPESSURA", e ele não depende de
#      perfil escolhido a dedo: com o teto de exibição que o PRÓPRIO ruleset
#      exige em REQ-UI-05 (z_max = 2·B), a última camada é TRUNCADA e as
#      espessuras do mesmo perfil ficam [2,50; 1,50] m — DECRESCENTES. Isto é:
#      na configuração default obrigatória, a leitura "espessura" contradiz o
#      croqui que a feature existe para reproduzir. Não é coincidência do perfil
#      de teste; é consequência do teto.
#   4. SEMÂNTICA DE ÍNDICE — a raiz do defeito, e a única guarda que resta de pé
#      depois do item 1. Δσ nas interfaces é grandeza DE PONTO (vive em
#      `PontoPropagacao`); espessura é grandeza DE TRECHO (vive em
#      `CamadaPropagacao`). O texto da v6 indexava as duas com o mesmo "i", o
#      que é impossível de satisfazer: há n+1 interfaces para n camadas. Largura
#      equivalente é grandeza de ponto, no MESMO dataclass e na MESMA cota de
#      Δσ — por isso ela, e não a espessura, é a companheira correta de q_i.
#   5. CONTORNO E FAIXA PLAUSÍVEL, para virar teste de regressão: a_eq(z=0) = a
#      exatamente (interface 0 = base da sapata, área equivalente = área real);
#      na cota do teto z = 2·B, a_eq/B fica em 2,78–3,04 nos dois métodos e em
#      5 geometrias (2x2, 2x4, 1,2x1,2, 4x4, 1,5x3,0). Largura equivalente da
#      ordem de 3·B a 2·B de profundidade é plausível e é o que o croqui deve
#      mostrar; qualquer coisa fora de ~[2,5·B; 3,5·B] ali é transcrição errada.
#   6. FALLBACK SILENCIOSO DETECTADO NESTA RODADA, do lado do engano por
#      silêncio, e que o a6 não pegou: `visual2d.py:693-696` faz
#      `getattr(pt, "largura_equivalente_a") or dim`. Com q_líq = 0 (q de
#      serviço não supera a sobrecarga na cota da base) `largura_equivalente`
#      devolve None em TODOS os pontos — verificado — e a tela passa a rotular a
#      dimensão da sapata como se fosse largura calculada, ao lado de Δσ = 0.
#      Vira requisito explícito em REQ-PROP-03: sem largura definida, não se
#      escreve número.
#
# O QUE ESTA VERSÃO NÃO FAZ: não reabre PC-BOUSSINESQ-NEWMARK-canto-retangulo
# nem PC-ESPRAIAMENTO-2V1H; não autoriza nenhum uso novo; não transforma
# largura equivalente em grandeza de cálculo. Sob Boussinesq ela continua sendo
# LEITURA GEOMÉTRICA ILUSTRATIVA — a solução elástica não tem tronco de
# espraiamento — e o rótulo na tela tem de dizer isso (ver `uso_autorizado` da
# entrada Boussinesq, item (1), e REQ-UI-07).

# --- Versão 6: propagação de tensão em profundidade (Boussinesq/Newmark e -----
#     espraiamento 2V:1H). Cria a seção `praticas_consagradas`.
#
# ATENÇÃO (CLAUDE.md regra 5): esta versão ALTERA o ruleset. As aprovações de
# A6 e A7 ficam formalmente INVALIDADAS. Ressalva de escopo, idêntica em espírito
# à da v5: NENHUM registro que estava APROVADA em `regras` mudou de status, de
# valor ou de citação. Esta versão (a) cria uma seção NOVA, (b) fecha
# parcialmente uma linha que já era PENDENTE_HUMANO em
# escopo_amplo_em_conferencia. A nova rodada de A6/A7 pode restringir-se aos
# dois registros novos e ao código que vier a depender deles.
#
# PREMISSA DO PEDIDO QUE ESTA RODADA CORRIGE — importa porque foi o fundamento
# oferecido para a decisão. Foi dito ao a2 que Winkler/Hetényi/Meyerhof já
# estariam "aprovados como prática consagrada sem fonte física no repo" e que
# bastaria aplicar o mesmo critério. NÃO É O CASO. Conferido linha a linha neste
# arquivo antes de decidir:
#   - escopo_amplo_em_conferencia > "sapata_isolada.rigidez, sapata_isolada.grelha"
#     tem status: PENDENTE_HUMANO, e sua observação diz textualmente que
#     Winkler/Hetényi (lambda_L), K_r de Meyerhof, kv de Bowles e kv de Vésic
#     "continuam PENDENTE_HUMANO".
#   - a regra NBR6118-22.6.1-rigidez, essa sim APROVADA, cobre SÓ o critério
#     geométrico h >= (a-ap)/3, que é texto normativo — e sua observação isola
#     explicitamente Winkler/Meyerhof do alcance da aprovação.
#   - o FS = 1,5 de tombamento/deslizamento foi ROTULADO prática consagrada na
#     v5 e mesmo assim ficou PENDENTE_HUMANO.
# Isto é: neste ruleset, "rotular como prática consagrada" NUNCA foi, sozinho,
# fundamento para APROVAR. O único caso em que um método não normativo saiu
# APROVADA é a folga 'c' de NBR6122-7.6.1 — e lá o que decide não é a
# consagração, é que a escolha não altera nenhuma verificação (a área A_nec já
# está fixada pela norma; a folga só reparte A_nec entre B e L).
# A decisão desta rodada NÃO se apoia, portanto, em precedente de "consagração".
# Ela se apoia noutro critério, que é o que efetivamente separa os casos acima:
#
#   CRITÉRIO ADOTADO E DECLARADO NESTA VERSÃO
#   O a2 pode aprovar sozinho um método não normativo quando as DUAS condições
#   valem:
#     (i)  a fórmula é uma AFIRMAÇÃO VERIFICÁVEL — identidade matemática ou
#          consequência exata de uma convenção geométrica declarada — e o a2 a
#          verificou de forma INDEPENDENTE do código e da bibliografia; e
#     (ii) o resultado NÃO decide, sozinho, nenhuma aprovação/reprovação de
#          projeto (não é nível de segurança, não é critério de aceitação).
#   Falhando (i): PENDENTE_HUMANO — é palpite. Falhando (ii): PENDENTE_HUMANO —
#   é julgamento de engenharia, e a2-verificador.md proíbe.
#   FS=1,5 falha (ii). kv de Bowles/Vésic falha (i) e (ii). As duas fórmulas
#   desta rodada passam em (i) por verificação numérica própria, e passam em
#   (ii) SOMENTE dentro do uso restrito declarado em cada registro — fora dele,
#   continuam pendentes. É por isso que as aprovações abaixo são GUARDADAS por
#   uso, e não abertas.
#
# VERIFICAÇÃO MATEMÁTICA INDEPENDENTE (a2, não aceita do a1 nem do código):
#   1. `influencia_canto_retangulo(m,n)` foi conferida contra uma INTEGRAÇÃO
#      NUMÉRICA DIRETA da solução de carga pontual de Boussinesq
#      (dsigma_z = 3 q z³ / (2 pi R^5)) sobre o retângulo m x n, quadratura de
#      ponto médio 1500x1500, escrita do zero pelo a2 sem olhar a forma fechada.
#      Diferença máxima 3,2e-08 em 11 pares (m,n) testados — inclusive
#      (2;2), (5;5) e (10;1,2), que caem no ramo m²n² > m²+n²+1 onde o arco-
#      tangente exige o acréscimo de pi. É esse ramo que quebra na maioria das
#      implementações erradas, e o `math.atan2(num, den2)` do código o resolve
#      corretamente. NÃO É "bate com a tabela": é identidade matemática
#      confirmada contra a integral de origem.
#      Limites: I(1e4,1e4) = 0,250000 (quadrante infinito); I(m,0) = 0;
#      I(m,n) = I(n,m) exata; I(1,1) = 0,17522, valor clássico de tabela.
#   2. `acrescimo_tensao_centro` = 4 x I(a/2z, b/2z) — superposição correta de
#      quatro quadrantes com o canto comum sob o centro. z -> 0 dá exatamente q.
#      z = 20 m sob sapata 2x2 dá 0,95 kPa (0,5 % de q). Monótona decrescente.
#   3. `acrescimo_tensao_2v1h` — a conferência aqui NÃO pode ser dimensional
#      (ver abaixo, a dimensão não distingue 2:1 de 1:1). Foi feita por
#      EQUILÍBRIO VERTICAL: sigma_z(z) x (a+z)(b+z) = q x a x b para todo z,
#      exato em ponto flutuante em 4/4 profundidades testadas. Ou seja, a
#      fórmula é a consequência exata e única da convenção "a resultante q·a·b
#      distribui-se uniformemente sobre a área alargada de z/2 por lado".
#      z/2 por lado <=> arctan(0,5) = 26,57° com a vertical <=> 2V:1H. Confere.
#      Contorno: z = 0 dá exatamente q. z -> infinito dá 0.
#
# LIMITE CONHECIDO DA CHECAGEM DIMENSIONAL, registrado porque é instrutivo:
# com pint, os mutantes (a+z)²(b+z), (a·b)/(a+z), (b+z²) e (a·z)(b·z) são todos
# REJEITADOS. Mas `q·a·b/((a+2z)(b+2z))` — que é espraiamento a 45°, 1V:1H, e
# daria tensões grosseiramente menores — passa como HOMOGÊNEO. A análise
# dimensional pega erro de transcrição; NÃO pega troca de ângulo de
# espraiamento. Por isso o teste de equilíbrio vertical do item 3 acima não é
# supérfluo: ele é a única checagem determinística que fixa o 2V:1H.

