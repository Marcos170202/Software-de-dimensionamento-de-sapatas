#
# ACHADO NORMATIVO NOVO DESTA RODADA — e é ele, não a apostila, que decide.
# A leitura da v4 (registrada como "a NBR 6122 §7.1 permite as duas rotas,
# logo a rota de valores admissíveis estaria disponível para deslizamento e
# tombamento") está LARGA DEMAIS e fica CORRIGIDA aqui. Texto literal de §7.1
# (PDF p. 33), relido nesta rodada:
#   "A grandeza fundamental para o projeto de fundações rasas é a TENSÃO
#    admissível, se o projeto for feito considerando fator de segurança global
#    e valores característicos, ou a TENSÃO resistente de cálculo, quando for
#    feito considerando coeficientes de ponderação e valores de cálculo."
# A escolha de rota que §7.1 oferece é sobre a TENSÃO — a grandeza da
# verificação de compressão. Não é uma licença geral de método para toda e
# qualquer verificação de fundação rasa. O mesmo se lê em §6.2.1.1.1, cujo
# título é "Segurança na COMPRESSÃO" e que abre com "A verificação da
# segurança pode ser feita com valores característicos e fator de segurança
# global ou com valores de cálculo (...) devendo ser obedecidos os valores da
# Tabela 1".
# A NBR 6122:2022 distribui a rota ITEM A ITEM, e não deixa o projetista
# escolher em cada verificação:
#   §6.2.1.1.1  compressão ............ AS DUAS rotas, explicitamente (Tabela 1)
#   §6.2.1.1.2  tração/deslizamento/
#               tombamento ............ SÓ coeficientes parciais. "Devem ser
#                                       adotados os seguintes coeficientes de
#                                       ponderação". Nenhum FS global.
#   §6.2.1.1.3  flutuação ............. SÓ fator de segurança global (1,1)
# Que §6.2.1.1.3 ofereça exclusivamente FS global, e §6.2.1.1.1 ofereça as
# duas com tabela, mostra que a omissão de FS global em §6.2.1.1.2 é
# deliberada e não lacuna de redação. Portanto: "escolher a rota de valores
# admissíveis" NÃO é uma opção livre para deslizamento e tombamento, e não
# pode ser usada como fundamento normativo para o par FS = 1,5/1,5.
#
# O QUE A APOSTILA MUDA (positivo, mas menor do que parece):
#   1. Confirma, por fonte independente, que 1,5 é valor de ENSINO E PRÁTICA
#      CORRENTE no Brasil para tombamento e escorregamento de sapata.
#   2. Confirma, por busca negativa, que esse 1,5 NÃO TEM ÂNCORA NORMATIVA.
#      A própria fonte, que cita a NBR 6122 dezesseis itens diferentes e o faz
#      com precisão (três trechos conferidos palavra por palavra contra a
#      edição 2022 do acervo), NÃO cita norma nenhuma ao dar o 1,5. A única
#      citação de toda a seção 1.8 é a nota 41, sobre empuxo passivo (§7.6.3),
#      e é para DESCARTAR o empuxo passivo — mais conservador que a norma.
#   Isto é: a apostila é evidência de PRÁTICA, e evidência (negativa) reforçada
#   de AUSÊNCIA DE RESPALDO NORMATIVO. Ela empurra o registro na direção de
#   "rotular como prática consagrada", não na direção de "aprovar como norma".
#
# POR QUE, MESMO ASSIM, O REGISTRO NÃO VIRA APROVADA NESTA RODADA:
#   Rotular 1,5 como prática consagrada é decisão documental, e essa o a2 toma
#   — está tomada abaixo. Manter 1,5 como constante de segurança em produção,
#   sabendo que o único item normativo aplicável implica equivalente de 1,68 a
#   2,35, é decisão de engenharia com consequência dimensional direta e do lado
#   inseguro. Não é do a2, não é de agente nenhum. Continua PENDENTE_HUMANO.
#   O ganho desta rodada é que a pergunta ao humano cai de duas para uma.
#
# CHECAGEM DIMENSIONAL (pint) DAS TRÊS FÓRMULAS DA FONTE — resultado:
#   eq. 1.72 (γ_tomb = M_estab/M_tomb) ............ HOMOGÊNEA, adimensional. OK
#   eq. 1.73 (modelo 1, atrito puro) .............. HOMOGÊNEA, adimensional. OK
#   eq. 1.74 (modelo 2, atrito + coesão) .......... REJEITADA. Ver abaixo.
#   eq. 1.48/1.49 (área comprimida) ............... HOMOGÊNEAS, adimensionais. OK
# A eq. 1.74, COM O SIGNIFICADO QUE A PRÓPRIA FONTE DÁ A "A" ("dimensão da
# base em contato com o solo", isto é, um comprimento), não fecha: pint acusa
# DimensionalityError ao somar (N+P)·tg(2/3φ) [kN] com A·(2/3 c) [m·kPa = kN/m].
# Falta um comprimento. O a1 sinalizou e não corrigiu — correto, não é função
# dele. A decisão do a2: a eq. 1.74, COMO ESCRITA NA FONTE, é REJEITADA por
# inconsistência dimensional e NÃO pode ser citada como respaldo de nada.
# Consequência prática: NENHUMA, porque o código não a implementa como escrita
# (ver a regra abaixo) — mas a fórmula fica marcada para que ninguém a use
# depois achando que passou por auditoria.
#
# NOTA DE MÉTODO: `tools/checar_dimensoes.py`, citado em a2-verificador.md,
# NÃO EXISTE neste repositório (tools/ contém apenas decodificar_nbr.py). A
# checagem acima foi feita com pint em script ad hoc. Criar essa ferramenta é
# dívida técnica aberta — enquanto ela não existir, a checagem dimensional
# depende de o a2 lembrar de fazê-la à mão, que é exatamente o que a cascata
# determinística deveria evitar.

# --- Versão 4: rodada NBR 6122 §6.2.1 (estabilidade de fundação rasa) -------
#
# ATENÇÃO: esta versão ALTERA o ruleset. Conforme CLAUDE.md regra 5, as
# aprovações de A6 e A7 ficam INVALIDADAS para tudo que dependa das regras
# NBR6122-6.2.1.* e do módulo sapata_isolada.sapata (estabilidade): nova
# rodada de A6 e A7 é obrigatória antes de qualquer release. As regras
# NBR6118-* e as demais NBR6122-* não foram tocadas nesta versão.
#
# Disparada por achado do a6 (citação "§6.2.1.2" para deslizamento/tombamento).
# Releitura da fonte pelo a2 (texto pymupdf + render 140 dpi das p. 17-18
# impressas = PDF p. 29-30) CONFIRMA o a6 na estrutura e vai ALÉM dele no
# conteúdo:
#   - 6.2.1.2 é "Segurança de fundações PROFUNDAS" — citação errada, confirmado.
#   - 6.2.1.1.2 existe, é "Coeficientes de ponderação para verificação de
#     tração, deslizamento e tombamento" e é o item aplicável a fundação rasa.
#   - MAS 6.2.1.1.2 NÃO prescreve fator de segurança global algum. Prescreve
#     APENAS coeficientes parciais (γm=1,2 / γm=1,4 / γf=1,4). Portanto a
#     troca "6.2.1.2 -> 6.2.1.1.2" NÃO pode ser feita sozinha: daria respaldo
#     normativo aparente a um FS=1,5 que a norma não contém. Ver regra
#     NBR6122-6.2.1.1.2-tracao-deslizamento-tombamento e kb/pendencias.md.

# --- Versão 3: rodada NBR 6118 §22.6 (rigidez e direcionalidade) ------------
#
# ATENÇÃO: esta versão ALTERA o ruleset. Conforme CLAUDE.md regra 5, as
# aprovações de A6 (relatorios/revisao_codigo.md) e A7 (relatorios/validacao*)
# ficam INVALIDADAS para tudo que dependa das regras NBR6118-22.6.*: é
# obrigatória nova rodada de A6 e A7 antes de qualquer release. As regras
# NBR6122-* e NBR6118-8/9/19.4/19.5 não foram tocadas.
#
# Disparada por consulta do usuário: "o modelo classifica sapata isolada como
# unidirecional/bidirecional e aplica redutor de armadura secundária?"
#
# RESPOSTA NORMATIVA, conferida por leitura VISUAL das páginas 191/192/193 da
# NBR 6118:2023 pelo a2-verificador (não pelo resumo do a1): NÃO EXISTE, na
# NBR 6118:2023, classificação de sapata em unidirecional/bidirecional, nem
# critério geométrico que a produza, nem redutor de armadura em direção
# secundária. Os itens 22.6.2.2-a) (rígida) e 22.6.2.3-a) (flexível) exigem
# trabalho à flexão NAS DUAS DIREÇÕES, incondicionalmente. A única dicotomia
# de comportamento estrutural oferecida pela Norma é rígida x flexível
# (declarado textualmente em 22.6.2.1). Portanto o comportamento atual do
# software — sempre dimensionar as duas direções, sem redutor — está CORRETO
# e não é lacuna; passa a ser regra APROVADA e explicitamente protegida
# contra "otimização" futura (ver NBR6118-22.6.2.2a-flexao-duas-direcoes).
#
# A NBR 6122:2022 corrobora pelo lado terminológico: "sapata corrida" (3.40) é
# definida por CARREGAMENTO (carga distribuída linearmente ou 3+ pilares num
# mesmo alinhamento), não por forma alongada. Uma sapata retangular alongada
# sob UM pilar permanece no campo de 3.38 (sapata) — não migra para 3.40 e
# não herda nenhum tratamento de viga/faixa por analogia terminológica.
#
# Auditoria da extração do a1 nesta rodada: 15 transcrições + 4 buscas
# negativas. Rastreabilidade (norma+item+página+hash) presente em 15/15, e
# todos os 15 hashes foram reconferidos como sha256 reproduzível do próprio
# enunciado. Três imprecisões do a1 corrigidas aqui, nenhuma bloqueante:
#   (a) o a1 afirma que 22.6.4.1.3 é "a ÚNICA referência cruzada da Seção 22
#       para as Seções 19 e 20". FALSO como escrito: 22.6.2.2-b) remete a
#       19.5.3.1 e 22.6.2.3-b) remete a 19.5. O correto e mais estreito:
#       22.6.4.1.3 é a única remissão que importa requisitos de DETALHAMENTO
#       DE LAJE (Seção 20) para sapata — e só para sapata FLEXÍVEL. Sapata
#       rígida TEM, sim, obrigação vinda da Seção 19 (compressão diagonal por
#       19.5.3.1, via 22.6.2.2-b).
#   (b) a busca negativa NBR6122-sapata-isolada-nada registra 'bidirecional'
#       como NADA_ENCONTRADO na NBR 6122:2022; o termo OCORRE duas vezes
#       (PDF p. 50 e 53), como "teste bidirecional" (ensaio tipo Osterberg).
#       A conclusão do a1 não muda, mas o falso positivo não foi documentado.
#   (c) "sapata isolada" tem 0 ocorrência no singular na NBR 6122; a única
#       ocorrência é no plural, "sapatas isoladas", em 7.7.1.

# --- Versão 2: adição do escopo AMPLO ---------------------------------------
#
# calc_core/sapata_isolada/ é um pacote maior, fornecido pelo usuário (não
# gerado pelo pipeline A1->A2 deste projeto), cobrindo carga excêntrica,
# recalques, punção, bielas e tirantes, rigidez/grelha sobre base elástica e
# MEF do solo. Ele foi tratado como fonte a AUDITAR, não como verdade aceita:
# cada fórmula abaixo com status APROVADA foi conferida por leitura VISUAL
# (imagem da página em 300dpi, não do texto extraído) contra a NBR 6118:2023,
# porque as equações da 6118 não têm camada de texto (ver CLAUDE.md).
#
# Da auditoria da Seção 8 (materiais), 9 (ancoragem) e 19.4/19.5 (cisalhamento
# e punção) — a única parte coberta até agora — saíram 6 defeitos confirmados,
# todos corrigidos em calc_core/sapata_isolada/materiais.py e sapata.py:
#   1. fct,m (fck>50MPa): constante errada na fórmula.
#   2. Eci: faltava o parâmetro alpha_E do agregado (assumia granito=1,0 sempre).
#   3. l_b básico: faltava o piso >=25*phi exigido pela norma.
#   4. eta_1: CA-60 herdava o valor de CA-50 (2,25 em vez de 1,00) — ERRO DO
#      LADO INSEGURO (subestima comprimento de ancoragem para CA-60).
#   5. tau_Rd1 (punção, contorno C'): "d" usado em milímetros em vez de
#      centímetros no fator ke — subestimava a resistência (conservador).
#   6. tau_Rd1: faltava o teto rho<=0,02 — ERRO DO LADO INSEGURO em sapata
#      muito armada (superestima a resistência à punção).
#
# As demais partes do pacote (geotecnia com Boussinesq/Newmark, recalques —
# Schmertmann/Perloff/Terzaghi, bielas e tirantes de Blévot além dos limites
# de nó já conferidos, rigidez/grelha sobre base elástica de Winkler, MEF do
# solo axissimétrico, e a geometria/estabilidade sob carga excêntrica em
# sapata.py) foram PORTADAS mas AINDA NÃO auditadas item a item contra a
# fonte — ver a seção "escopo_amplo_em_conferencia" abaixo. A interface e o
# memorial devem deixar isso visível: "em conferência" não é "aprovado".

regras:

  - id: NBR6122-7.6.1-area-carga-centrada
    norma: "NBR 6122:2022"
    item: "7.6.1"
    pagina: 23
    metodo: ambos  # a fórmula (sigma = N/A <= sigma_adm) vale tanto para
                    # valores admissíveis (característico + FSg) quanto para
                    # valores de cálculo (tensão resistente de cálculo) —
                    # a norma usa a mesma estrutura para os dois métodos em
                    # 7.1; o chamador decide qual tensão-limite está passando.
    status: APROVADA
    implementacao: "geotecnico.dimensionar_sapata_carga_centrada"
    checagem_dimensional: "N [kN] / A [m²] = sigma [kPa]; sigma <= sigma_adm [kPa]. Homogêneo."
    checagem_numerica: "N_k=1200 kN, sigma_adm=250 kPa, pilar 0,30x0,50 m -> A_nec=4,8 m², B~2,10 L~2,30 m (ver relatorios/conformidade.md). Dentro da faixa plausível declarada em a2-verificador.md (50-600 kPa)."
    observacao: "Cláusula não define COMO obter B e L a partir da área — apenas exige tensão uniforme <= limite. O método de manter a mesma folga 'c' nas quatro bordas do pilar (B=b_pilar+2c, L=l_pilar+2c) é prática consagrada de escritório (Alonso, Bowles), NÃO é texto da norma. Registrado como decisão de implementação, não como regra normativa — rotulado em código como tal."

  - id: NBR6122-5.6-peso-proprio-minimo
    norma: "NBR 6122:2022"
    item: "5.6"
    pagina: 14
    metodo: ambos
    status: APROVADA
    implementacao: "geotecnico.dimensionar_sapata_carga_centrada (parâmetro percentual_peso_proprio)"
    checagem_dimensional: "adimensional (percentual da carga permanente); aplicado como N_total = N_k * (1 + percentual)."
    checagem_numerica: "5% é o MÍNIMO normativo, não uma estimativa universal — para sapatas muito grandes ou muito profundas o peso próprio real pode superar 5% da carga permanente. Software usa 5% como valor default explícito e sobrescrevível, nunca oculto."
    observacao: "Norma diz 'no mínimo 5%' — não é peso próprio real, é piso normativo para quando o peso próprio real ainda não foi calculado (situação típica no pré-dimensionamento). Memorial deve deixar claro que é uma estimativa, não o peso próprio real da peça final."

  - id: NBR6122-7.7.1-dimensao-minima
    norma: "NBR 6122:2022"
    item: "7.7.1"
    pagina: 24
    metodo: ambos
    status: APROVADA
    implementacao: "geotecnico.verificar_dimensao_minima"
    checagem_dimensional: "comprimento [m] >= 0,60 m. Trivial."
    checagem_numerica: "N/A — comparação direta, sem propagação de erro possível."
    observacao: "Regra clara, sem ambiguidade, sem exceção declarada no texto."

  - id: NBR6122-7.6.2-area-comprimida
    norma: "NBR 6122:2022"
    item: "7.6.2"
    pagina: 23
    metodo: ambos
    status: PENDENTE_HUMANO
    motivo_pendencia: "Fora do escopo mínimo (carga excêntrica). Extraído em kb/clausulas.jsonl para quando o escopo for ampliado; ninguém decidiu ainda a estratégia de busca de B×L sob excentricidade dupla nem como tratar o núcleo central. NÃO implementar em calc_core até esta linha virar APROVADA."
    achado_colateral_v5: >-
      ACHADO SEPARADO, trazido pela rodada da apostila Bastos mas SEM ligação
      com a pendência de deslizamento/tombamento — registrado aqui, que é onde
      pertence, e explicitamente NÃO usado para justificar nada lá.
      A mesma apostila traz um SEGUNDO critério de tombamento, nas notas a) e
      b) da p. impressa 46 (PDF 50), eqs. 1.48 e 1.49, por ÁREA COMPRIMIDA:
      e_Ag/A + e_Bg/B <= 1/6 sob cargas permanentes (base inteiramente
      comprimida, núcleo central) e (e_A/A)² + (e_B/B)² <= 1/9 na condição
      mais desfavorável ("pelo menos metade da área comprimida"). Registro
      BASTOS-1.6.4-notas-a-b-eq148-149-tombamento-area-comprimida.
      Este critério, ao contrário do γ >= 1,5, TEM interlocução direta com
      §7.6.2 — e a própria apostila cita §7.6.2 em nota de rodapé.
      A apostila NÃO articula os dois critérios entre si (não diz se são
      alternativos, cumulativos, ou se cada um cabe a um caso). Essa lacuna é
      da fonte e fica registrada como tal; não se resolve por interpretação.
      VERIFICAÇÃO NUMÉRICA DO A2 sobre a interpretação que o a1 marcou como
      sua: "1/9 corresponde a 50 % de área comprimida" CONFERE no limite
      uniaxial — com e_B = 0, (e_A/A)² = 1/9 dá e_A = A/3, e o comprimento
      comprimido do diagrama triangular é 3(A/2 − A/3) = A/2, exatamente
      metade da base. Interpretação do a1 ACEITA nesse limite.
      CONSEQUÊNCIA, E É UMA COLISÃO DE MÉTODO: 50 % é o patamar que §7.6.2
      associa às SOLICITAÇÕES DE CÁLCULO. Para solicitações CARACTERÍSTICAS a
      norma exige 2/3 da área. Aplicar o 1/9 da apostila a combinações
      características seria misturar as rotas do lado inseguro — no mesmo
      formato quadrático, o limite correto para valores característicos é
      (5/18)² = 0,077, e não 1/9 = 0,111, ou seja, o critério da apostila é
      cerca de 44 % mais permissivo do que a norma admite nessa rota.
      SITUAÇÃO DO CÓDIGO, verificada nesta rodada: `sapata.py:98` define
      `area_comprimida_minima = 2.0/3.0` e a verificação de `sapata.py:414`
      roda sobre `combs_els`, isto é, 2/3 com solicitações características.
      Isso está do lado CERTO e é coerente em método com §7.6.2. Logo este
      achado colateral NÃO gera trabalho de correção e NÃO deve motivar troca
      do 2/3 pelo 1/9: seria migração para o patamar de valores de cálculo sem
      migrar as combinações. Fica como evidência de apoio para quando esta
      regra for a julgamento humano, e como guarda contra uma "otimização"
      futura mal fundamentada.

  - id: NBR6122-7.6.3-deslizamento
    norma: "NBR 6122:2022"
    item: "7.6.3"
    pagina: 24
    metodo: ambos
    status: PENDENTE_HUMANO
    motivo_pendencia: "Fora do escopo mínimo (carga horizontal). Depende de dados de solo (ângulo de atrito, empuxo passivo) não coletados na entrada atual."

  - id: NBR6122-6.2.1.1.2-tracao-deslizamento-tombamento
    norma: "NBR 6122:2022"
    item: "6.2.1.1.2"
    pagina: 17          # página impressa 17 = PDF p. 29 (offset 12)
    hash: "sha256:816ce04330cbfffee574b14aaa2b18591d3f4d83fee5c9a7cb4ce8e761813e93"
    hash_pdf_fonte: "sha256:65fb1d5c60b81066010c08a2e86fdedb3491d0603a7c98a46917d52f29571f53"
    metodo: calculo     # <<< SÓ valores de cálculo. A norma NÃO oferece rota
                        # de valores admissíveis (FS global) para tração,
                        # deslizamento e tombamento de fundação rasa.
    status: PENDENTE_HUMANO
    implementacao: "geotecnico.<a definir> — HOJE existe apenas
      sapata_isolada.sapata::_verificar_estabilidade, que NÃO implementa esta
      regra (usa FS global sobre combinações ELS). Não é [rule:] desta regra."
    texto_literal: >-
      "6.2.1.1.2 Coeficientes de ponderação para verificação de tração,
      deslizamento e tombamento — Devem ser adotados os seguintes coeficientes
      de ponderação: γm = 1,2 (minoração) para a parcela favorável do peso;
      γm = 1,4 (minoração) para a resistência do solo; γf = 1,4 (majoração)
      para o esforço atuante, se disponível apenas o seu valor característico;
      se já fornecido o valor de cálculo, nenhum coeficiente de ponderação
      deve ser aplicado a ele."
    checagem_dimensional: >-
      Coeficientes adimensionais aplicados a grandezas homogêneas
      (peso [kN], resistência [kN], esforço atuante [kN]). As razões FS do
      código também fecham adimensionais (verificado com pint: N·tanδ + c'·A
      [kN] / H [kN] e N·a/2 [kN·m] / M [kN·m]). A dimensão NÃO acusa o defeito
      aqui — o defeito é de MÉTODO e de VALOR, não de transcrição dimensional.
    checagem_numerica: >-
      Convertendo 6.2.1.1.2 para FS global equivalente: deslizamento exige
      R_k/S_k >= 1,2·1,4·1,4 = 2,35 (leitura estrita, peso favorável minorado
      E resistência do solo minorada) ou >= 1,4·1,4 = 1,96 (leitura branda, um
      único γm sobre a resistência de atrito). Tombamento: >= 1,2·1,4 = 1,68.
      O código adota 1,5 e 1,5 (geotecnia.py:215-216). Em TODAS as leituras
      possíveis o código é MENOS conservador que a norma: -36% a -57% em
      deslizamento, -11% em tombamento. LADO INSEGURO.
    motivo_pendencia: >-
      REFORMULADO na versão 5 — de DUAS perguntas bloqueantes para UMA.
      PERGUNTA BLOQUEANTE ÚNICA (era a nº 2): o software mantém a rota de
      valores admissíveis (FS global sobre combinações características) para
      deslizamento e tombamento, com FS = 1,5 rotulado como PRÁTICA CONSAGRADA
      NÃO NORMATIVA, ou migra para o método de valores de cálculo de
      §6.2.1.1.2 (combinações ELU + coeficientes parciais)? O engenheiro que
      responder precisa estar ciente de três fatos, todos verificados:
      (i) §6.2.1.1.2 é o ÚNICO item da NBR 6122:2022 que cobre deslizamento e
      tombamento de fundação rasa, e ele só oferece coeficientes parciais;
      (ii) a licença de escolha de rota de §7.1 e §6.2.1.1.1 é sobre a TENSÃO
      (compressão), não sobre esta verificação — ver cabeçalho da versão 5;
      (iii) o FS equivalente da norma é 1,68 (tombamento) a 2,35 (deslizamento)
      contra os 1,5 do código, ou seja, manter 1,5 é decidir operar de 11 % a
      36 % do lado inseguro em relação ao único item aplicável, em troca de
      alinhamento com a prática de mercado.
      PERGUNTA ANTES BLOQUEANTE, AGORA CONDICIONAL E DORMENTE (era a nº 1):
      se "γm = 1,4 para a resistência do solo" incide sobre tanδ/c' além da
      minoração de 1,2 já aplicada ao peso favorável (FS equivalente 2,35) ou
      se as duas são alternativas (1,96). Só volta a ser bloqueante SE a
      resposta à pergunta única for "migrar para valores de cálculo". Se a
      resposta for "manter admissíveis", esta pergunta deixa de ter efeito
      sobre o código e permanece registrada apenas como referência do cálculo
      de equivalência.
      NÃO IMPLEMENTAR em calc_core até virar APROVADA. A4/A5 continuam
      PROIBIDOS de alterar os valores 1,5/1,5 — a correção de citação e a
      correção de critério são coisas diferentes e a segunda não está decidida.
      A correção de CITAÇÃO, essa sim, está liberada: ver campo
      `acao_liberada_para_a4` abaixo.
    evidencia_secundaria_v5: >-
      FONTE SECUNDÁRIA NÃO NORMATIVA, admitida como evidência de PRÁTICA e
      NUNCA como fonte de obrigatoriedade: BASTOS, P.S., "Sapatas de
      Fundação", UNESP Bauru/SP, Estruturas de Concreto III, Out/2023, 119 p.
      (Sapatas.pdf na raiz). Item 1.8, p. impressas 74-75 / PDF 78-79.
      Cláusulas BASTOS-1.8a-tombamento-eq170-172 e
      BASTOS-1.8b-escorregamento-eq173-175 em kb/clausulas.jsonl; fórmulas
      BASTOS-1.72-tombamento e BASTOS-1.75-escorregamento em kb/formulas.yaml.
      A fonte prescreve γ_tomb = M_estab/M_tomb >= 1,5 e
      γ_esc = F_estab/F_H >= 1,5 — os MESMOS dois valores do código, na MESMA
      forma de fator de segurança global sobre razão resistente/solicitante.
      Conferido pelo a2 por leitura visual própria a 500 dpi das duas equações.
      O QUE ISSO ESTABELECE: FS = 1,5 para tombamento e escorregamento de
      sapata é prática de ensino e de mercado no Brasil, não invenção deste
      software. É base suficiente para o RÓTULO "prática consagrada".
      O QUE ISSO NÃO ESTABELECE: conformidade com a NBR 6122:2022. A busca
      negativa (registro BASTOS-6.2.1-coef-parciais-nada, refeita pelo a2 nas
      119 páginas) mostra que a string "6.2.1" não ocorre uma única vez na
      apostila e que a expressão "coeficiente de segurança" ocorre uma única
      vez em todo o documento — justamente no parágrafo do 1,5, e sem remissão
      normativa. A fonte apresenta 1,5 como valor de projeto direto.
      LEITURA DO A2: uma segunda fonte independente que dá 1,5 SEM citar norma
      é, ao mesmo tempo, evidência a favor do rótulo "prática consagrada" e
      evidência adicional de que não existe âncora normativa para o valor.
      Ela FORTALECE a rotulagem e NÃO substitui a decisão humana sobre manter
      ou não a constante em produção.
    correspondencia_codigo_x_fonte_secundaria: >-
      Verificado pelo a2 com pint e com valores típicos (N=800 kN, P=60 kN,
      F_H=60 kN, M=50 kN·m, h=0,8 m, base 2,0 x 2,0 m, φ=30°, c=10 kPa):
      `sapata.py::_verificar_estabilidade` implementa, na prática, o modelo da
      apostila e NÃO o da norma — M_tomb = M + F_H·h (eq. 1.70),
      M_estab = (N+P)·A/2 (eq. 1.71), razão >= 1,5 (eq. 1.72), e para o
      deslizamento a razão F_estab/F_H >= 1,5 (eq. 1.75) com F_estab de atrito
      mais coesão (eq. 1.74). Todas as razões fecham adimensionais.
      DUAS DIVERGÊNCIAS ENTRE O CÓDIGO E A FONTE, ambas apuradas nesta rodada:
      (a) A FAVOR DO CÓDIGO — a eq. 1.74 escreve a parcela de coesão como A·c
      com A definido pela fonte como comprimento, o que é dimensionalmente
      inconsistente; o código escreve `self.solo.coesao * self.a * self.b`,
      isto é, coesão vezes ÁREA, que é a leitura dimensionalmente correta.
      O defeito da fonte NÃO se propagou para o código.
      (b) CONTRA O CÓDIGO — a eq. 1.74 reduz a coesão a 2/3 (parcela
      "A(2/3 c)"); o código aplica o fator 2/3 apenas ao ângulo de atrito
      (`fator_atrito_base`) e usa a coesão CHEIA. No caso típico acima isso
      torna o código 3,9 % menos conservador que a própria apostila na força
      resistente ao deslizamento. É pequeno e não é bloqueante, mas significa
      que o código não pode ser descrito como "implementa Bastos 1.74": ele
      implementa uma variante mais permissiva. Se a resposta humana for
      "manter a rota admissível", este item entra junto na mesma decisão.
    alertas_da_fonte_avaliados_pelo_a2: >-
      Os dois alertas de qualidade levantados pelo a1 foram avaliados e têm
      PESOS MUITO DIFERENTES na decisão:
      (1) COLISÃO DE SÍMBOLO γ — RELEVANTE, e diretamente relevante a esta
      discussão. A apostila grafa o fator de segurança GLOBAL como γ_tomb e
      γ_esc; a NBR 6122 usa γm/γf para COEFICIENTES PARCIAIS. É a colisão de
      método de segurança do §3 do a2-verificador aparecendo já na notação.
      Um leitor de memorial que veja "γ_tomb = 1,5" pode entender que se trata
      de coeficiente de ponderação normativo — que é precisamente o erro que
      esta pendência existe para impedir. REQUISITO REGISTRADO: o software
      NÃO pode grafar esta constante como γ, em código, em tela ou em
      memorial. Grafar `FSg_tombamento` / `FSg_deslizamento` (fator de
      segurança global), com o rótulo de prática não normativa colado ao
      número. Vale mesmo que a decisão humana seja migrar de método.
      (2) INCONSISTÊNCIA DIMENSIONAL DA EQ. 1.74 — REAL (confirmada por pint,
      ver cabeçalho da versão 5) mas IRRELEVANTE para a decisão sobre o valor
      1,5. São coisas separadas: 1,5 vem da eq. 1.72 e da eq. 1.75, ambas
      dimensionalmente sadias; o defeito está só na eq. 1.74, que é uma das
      duas alternativas de F_estab. E o código já usa a forma dimensionalmente
      correta (coesão x área), como registrado acima. Portanto este alerta NÃO
      enfraquece a apostila como evidência de prática quanto ao 1,5. Ele
      apenas proíbe que a eq. 1.74 seja citada como fórmula auditada.
    discrepancia_de_edicao: >-
      REGISTRO, NÃO TAREFA. Três edições diferentes da NBR 6122 circulam neste
      dossiê: a apostila cita 2021 (três vezes, e "2022" não aparece nenhuma
      vez em suas 119 páginas); o código cita 2019 em vários pontos; o acervo
      deste repositório tem a de 2022. O a1 conferiu três trechos citados
      literalmente pela apostila contra a edição 2022 e bateram palavra por
      palavra, e a numeração dos dezesseis itens que ela cita coincide — o que
      é COMPATÍVEL com a hipótese de erro de grafia do ano, mas NÃO a prova, e
      em particular nada disso prova que o item de deslizamento/tombamento
      tenha a mesma redação em 2021. Não há exemplar de 2021 nem de 2019 no
      acervo, logo não há como investigar. Fica assim. Consequência operacional
      única e suficiente: a fonte normativa deste projeto é a NBR 6122:2022 do
      acervo, e toda citação no código deve dizer 2022 — as citações "2019"
      espalhadas pelo código são incorretas por edição, independentemente de
      estarem ou não corretas por item.
    acao_liberada_para_a4: >-
      LIBERADO, e SOMENTE isto: `geotecnia.py:215` traz o comentário
      "# NBR 6122, 6.2.1.2" ao lado de `fs_deslizamento: float = 1.5`, e
      `ui/completo/resultado.py:22` traz
      ITEM_ESTABILIDADE = "NBR 6122:2019 §6.2.1.2 — deslizamento e tombamento".
      As duas citações são falsas em dois níveis: §6.2.1.2 é "Segurança de
      fundações PROFUNDAS", e a edição do acervo é 2022, não 2019. Devem ser
      REMOVIDAS. Substituir NÃO por outro número de item, mas pela verdade
      apurada: o valor 1,5 não tem item normativo; é prática consagrada de
      mercado, documentada em fonte secundária, sob decisão pendente de
      engenheiro. Redação sugerida para o comentário e para o rótulo de tela:
      "FS global = 1,5 — PRÁTICA CONSAGRADA, SEM RESPALDO NORMATIVO. A NBR
      6122:2022 §6.2.1.1.2 trata deslizamento/tombamento SÓ por coeficientes
      parciais (equivalente 1,68 a 2,35). Valor sob decisão de engenharia
      pendente. [rule: NBR6122-6.2.1.1.2-tracao-deslizamento-tombamento —
      PENDENTE_HUMANO]". Isto NÃO é a troca cega "6.2.1.2 -> 6.2.1.1.2" que a
      versão 4 proibiu, e continua proibida: não se troca um item por outro,
      RETIRA-SE a alegação normativa. Nenhum número muda. Nenhum resultado de
      cálculo muda. Executor: a4-geotecnico (estabilidade geotécnica).
    observacao: >-
      COLISÃO DE MÉTODO DE SEGURANÇA (o erro clássico do setor, ver
      a2-verificador.md §3). _verificar_estabilidade itera sobre
      `self.combs_els` (valores característicos) e compara contra um FS
      global — rota de "valores admissíveis". Mas a NBR 6122:2022 só define
      tração/deslizamento/tombamento de fundação rasa pela rota de "valores
      de cálculo". Não há, em toda a NBR 6122:2022, FS global para
      deslizamento ou tombamento: varredura das 120 páginas por
      "deslizamento|tombamento" retorna 4 ocorrências — 6.2.1.1 c) (lista de
      mecanismos de ELU), o título e o corpo de 6.2.1.1.2, e 7.5.1 (fundação
      sobre rocha inclinada). O único FS global de fundação rasa fora da
      compressão é 1,1, e é para FLUTUAÇÃO (6.2.1.1.3) — não confundir.
      Requisito para o software: proibir em tempo de execução a mistura de
      valores característicos com FS global nesta verificação.

  - id: NBR6122-6.2.1.1.1-fatores-seguranca-tabela1
    norma: "NBR 6122:2022"
    item: "6.2.1.1.1 e Tabela 1"
    pagina: 17           # impressa. A v8 trazia "28", que não é nem a impressa
    pagina_pdf: 29       # (17) nem a do PDF (29). Metadado corrigido na v9.
    metodo: ambos
    status: APROVADA     # ERA PENDENTE_HUMANO até a v8. Ver `desbloqueio_v9`.
    clausula_ref: "NBR6122-6.2.1.1.1-tabela1-confirmada-visual"
    implementacao: "geotecnico.seguranca.fator_de_seguranca_global (a criar)"
    desbloqueio_v9: >-
      A pendência da v8 tinha DUAS causas e AS DUAS caíram. (1) "Necessária
      apenas se o software vier a DEDUZIR sigma_adm a partir de SPT/CPT" —
      passou a ser necessária: é exatamente o que a v9 aprova. (2) "o extrator
      lineariza a Tabela 1 (células mescladas); valores lidos do texto corrido,
      não conferidos contra a tabela renderizada — exigir conferência visual
      antes de aprovar" — a conferência foi feita TRÊS vezes, de forma
      independente: duas pelo a1 (render da página PDF 29 inteira a 300 dpi e
      recorte da região da tabela a 500 dpi; registro
      NBR6122-6.2.1.1.1-tabela1-confirmada-visual, divergencia false) e uma pelo
      a2 nesta rodada (render próprio a 350 e 400 dpi, associação linha-coluna
      lida célula a célula na imagem, mais a camada de texto do PDF do acervo).
      Os três resultados coincidem e nenhum valor numérico mudou em relação ao
      texto corrido. A exigência que a v8 impôs está cumprida nos termos em que
      foi imposta.
    texto_literal: >-
      "A verificação da segurança pode ser feita com valores característicos e
      fator de segurança global ou com valores de cálculo, obtidos pela
      aplicação de coeficientes de ponderação aos valores característicos,
      devendo ser obedecidos os valores da Tabela 1." | Tabela 1 – Fundações
      rasas – Fatores de segurança e coeficientes de ponderação para
      solicitações de compressão. Linha "Semiempíricos (a)": gamma_m = "Valores
      propostos no próprio processo e no mínimo 2,15"; FSg = "Valores propostos
      no próprio processo e no mínimo 3,00". Linha "Analíticos (b)": gamma_m =
      2,15; FSg = 3,00. Linha "Semiempíricos (a) ou analíticos (b) acrescidos de
      duas ou mais provas de carga, necessariamente executadas na fase de
      projeto, conforme 7.3.1": gamma_m = 1,40; FSg = 2,00. Nota a: "Atendendo
      ao domínio de validade para o terreno local." Nota b: "Sem aplicação de
      coeficientes de ponderação aos parâmetros de resistência do terreno."
      Nota c: "Em todas as situações de gamma_m, gamma_f = 1,4 (majoração) para
      o esforço atuante, se disponível apenas o seu valor característico; se já
      fornecido o valor de cálculo, nenhum coeficiente de ponderação deve ser
      aplicado a ele."
    valores:
      semiempiricos_FSg_minimo: 3.00        # PISO, não valor fixo
      semiempiricos_gamma_m_minimo: 2.15    # PISO, não valor fixo
      analiticos_FSg: 3.00                  # FIXO
      analiticos_gamma_m: 2.15              # FIXO
      com_2_ou_mais_provas_de_carga_FSg: 2.00
      com_2_ou_mais_provas_de_carga_gamma_m: 1.40
      gamma_f_esforco_atuante: 1.40
    checagem_dimensional: >-
      Todos adimensionais, aplicados a sigma_rup [kPa] devolvendo [kPa].
      Homogêneo por construção. A checagem dimensional tem poder NULO aqui, e
      isso fica dito para que ninguém a confunda com validação: ela não
      distingue 3,00 de 2,15, nem FSg de gamma_m. Quem carrega esta regra é a
      leitura visual (V5 do cabeçalho da v9) e a guarda de método
      (REQ-SIGMA-01).
    checagem_numerica: >-
      sigma_rup = 900 kPa (argila rija, c = 150 kPa, Nc.Sc = 6) com FSg = 3,00
      dá sigma_adm = 300 kPa — dentro da faixa plausível de 50-600 kPa.
      EQUIVALÊNCIA ENTRE AS DUAS COLUNAS, conferida pelo a2: 3,00/2,15 = 1,3953
      ~= gamma_f = 1,4. Isto é, as duas rotas são calibradas para dar o MESMO
      resultado quando o esforço atuante entra em valor característico e é
      majorado por 1,4 (nota c). É o argumento aritmético de que as colunas são
      ALTERNATIVAS e não cumulativas — e portanto de que aplicar as duas é
      contar segurança duas vezes.
    diferenca_de_redacao_entre_as_linhas: >-
      NÃO PODE SER APAGADA POR ARREDONDAMENTO DE LEITURA, e é o defeito mais
      provável de implementação desta tabela. Para SEMIEMPÍRICOS a Norma escreve
      "Valores propostos no próprio processo E NO MÍNIMO 3,00": 3,00 é PISO, e
      se o método de origem propuser FS maior, PREVALECE O DO MÉTODO. Para
      ANALÍTICOS os valores são cravados (2,15 e 3,00), sem cláusula de "no
      mínimo". Implementar `FSg = 3.00` como constante no caminho semiempírico é
      INSEGURO sempre que o método de origem pedir mais. REQ-SIGMA-02
      transforma isto em asserção executável.
    observacao: >-
      COLISÃO DE MÉTODO DE SEGURANÇA (a2-verificador.md §3) — esta é a regra em
      que ela vive. As duas colunas são MÉTODOS ALTERNATIVOS E MUTUAMENTE
      EXCLUSIVOS: FSg para valores característicos, gamma_m para valores de
      cálculo. Misturar é o erro clássico do setor. O software tem de PROIBIR a
      mistura em tempo de execução, não apenas documentá-la: REQ-SIGMA-01.
      ESCOPO desta tabela: fundações rasas, solicitações de COMPRESSÃO. NÃO
      cobre tração, deslizamento e tombamento (6.2.1.1.2, regra separada e ainda
      PENDENTE_HUMANO) nem flutuação (6.2.1.1.3, FS >= 1,1) — não estender por
      analogia. A linha das provas de carga exige DUAS OU MAIS e
      "necessariamente executadas na fase de projeto": prova de carga de obra
      não vale para reduzir o FS, e o software não pode oferecer FSg = 2,00 sem
      esses dois requisitos declarados pelo usuário.

