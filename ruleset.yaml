  # --- Versão 9: determinação de sigma_adm (§7.3, §7.3.2, §7.3.3, §7.4) e -----
  #     majoração por vento (§6.3.1-§6.3.3). Todas NORMATIVAS: [rule: ].

  - id: NBR6122-7.3.3-metodos-semiempiricos
    norma: "NBR 6122:2022"
    item: "7.3.3"
    pagina: 22
    pagina_pdf: 34
    metodo: admissivel   # e tambem 'calculo': o item cita as duas grandezas.
                         # Ver `nota_de_metodo`.
    status: APROVADA
    clausula_ref: "NBR6122-7.3.3-metodos-semiempiricos"
    implementacao: "geotecnico.sigma_adm.semiempirico_spt (a criar)"
    texto_literal: >-
      "7.3.3 Métodos semiempíricos — São métodos que relacionam resultados de
      ensaios (tais como o SPT, CPT etc.) com tensões admissíveis ou tensões
      resistentes de cálculo. Devem ser observados os domínios de validade de
      suas aplicações, bem como as dispersões dos dados e as limitações
      regionais associadas a cada um dos métodos."
    o_que_esta_regra_aprova: >-
      O item é uma AUTORIZAÇÃO CONDICIONADA, não uma especificação de método.
      Conferido pelo a2 na camada de texto do PDF do acervo: a NBR 6122:2022 NÃO
      nomeia método semiempírico algum, NÃO reproduz nenhuma correlação
      N_SPT -> sigma_adm, NÃO traz tabela de valores e NÃO cita autor (nem
      Teixeira, nem Aoki-Velloso, nem Décourt-Quaresma). Portanto o que esta
      regra normativa aprova são exatamente DUAS coisas, e nada além:
      (1) que é LÍCITO deduzir sigma_adm de SPT/CPT — o que remove o obstáculo
          normativo que mantinha sigma_adm como entrada direta obrigatória; e
      (2) as TRÊS obrigações que o item impõe, que passam a ser requisitos
          executáveis do software: (a) observar o domínio de validade da
          aplicação; (b) observar a dispersão dos dados; (c) observar as
          limitações regionais do método.
      A FÓRMULA em si NÃO vem daqui e não é normativa: vem de
      `praticas_consagradas` (FB-TEIXEIRA-1996-areia,
      FB-REGRA-BRASILEIRA-Nspt-50-argila) e é citada com [pratica: ], nunca
      com [rule: ]. Um memorial que diga "sigma_adm conforme NBR 6122 §7.3.3"
      está certo quanto ao PROCEDIMENTO e errado se sugerir que o NÚMERO tem
      origem normativa.
    obrigacao_a_dominio_de_validade: >-
      Vira guarda de entrada dura (REQ-SIGMA-04): função que RECUSA, com
      exceção explícita, entrada fora do domínio declarado pela fonte da
      correlação. Não aproximar, não extrapolar, não "clampar" silenciosamente.
      Reforçada pela nota (a) da Tabela 1, que repete a exigência com as
      palavras "atendendo ao domínio de validade para o terreno LOCAL".
    obrigacao_b_dispersao_dos_dados: >-
      A Norma manda observar a dispersão; NENHUMA das correlações desta rodada
      publica desvio-padrão, intervalo de confiança ou faixa de dispersão. O
      software não pode inventar uma. O que ele PODE e DEVE fazer, e é o que
      esta regra exige, é exibir a dispersão OBSERVÁVEL: quando mais de uma
      correlação aplicável ao mesmo caso estiver no domínio, mostrar os
      resultados LADO A LADO em vez de um número só. Medido pelo a2 com
      N_SPT = 15, B = 2,0 m: Teixeira areia 320 kPa, regra N/50 300 kPa,
      Mello 287 kPa. A convergência é boa, mas quem decide se ela é boa o
      bastante é o engenheiro, e ele só decide se vir os três. REQ-SIGMA-05.
    obrigacao_c_limitacoes_regionais: >-
      É a obrigação mais difícil de satisfazer em software e a que o a1 apontou
      corretamente. As correlações desta rodada são brasileiras e calibradas em
      solos do Sudeste (a Fig. 4.1 da fonte compara explicitamente com
      "valores de experiência prática em São Paulo, relatados por Vargas,
      1951"). A Norma NÃO define "região". O software NÃO pode inferir
      aplicabilidade regional de um perfil SPT, e NÃO pode ficar calado sobre
      isso. Resolução adotada: declaração explícita do usuário, com registro no
      memorial (REQ-SIGMA-06). Um software que aceite N_SPT sem exigir essa
      declaração NÃO cumpre 7.3.3, mesmo com a aritmética correta.
    nota_de_metodo: >-
      O item cobre as DUAS grandezas ("tensões admissíveis OU tensões
      resistentes de cálculo"). Nesta versão só o ramo ADMISSÍVEL é
      implementado, porque é o único que o repositório usa hoje — ver a decisão
      registrada em REQ-SIGMA-01. Não é limitação da norma; é limitação
      deliberada de escopo, para não criar um segundo padrão de segurança.
    checagem_dimensional: >-
      Item em prosa, sem equação. Nada a checar. A checagem dimensional das
      correlações que ele autoriza está em `tools/checar_dimensoes.py` e o
      resultado é que TODAS são NÃO HOMOGÊNEAS por construção (correlações
      empíricas com coeficientes dimensionais implícitos) — ver REQ-SIGMA-03,
      que trata as duas armadilhas de unidade que a análise dimensional não
      pega.

  - id: NBR6122-7.3.2-metodos-teoricos-condicao-2022
    norma: "NBR 6122:2022"
    item: "7.3.2"
    pagina: 22
    pagina_pdf: 34
