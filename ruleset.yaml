  - id: NBR6122-T1-resistencia-ELU
    status: APROVADA
    tipo: formula
    metodo: ambos
    titulo: Tabela 1 -- tensao admissivel / resistente de calculo a partir da ruptura (ELU), compressao
    norma: ABNT NBR 6122:2022
    item: 6.2.1.1.1 (Tabela 1)
    pagina: [17]
    pagina_pdf: [29]
    clausula_kb: NBR6122-2022-6.2.1.1.1
    hash_trecho: sha256:607af8000aa7fc8b8e005d825f22eddd6baed1ff5bdc046a3042367e3db95dd3
    trecho_literal:
      - A verificação da segurança pode ser feita com valores característicos e fator de segurança global ou com valores de cálculo, obtidos pela aplicação de coeficientes de ponderação aos valores característicos, devendo ser obedecidos os valores da Tabela 1.
      - Semiempíricos a Valores propostos no próprio processo e no mínimo 2,15 Valores propostos no próprio processo e no mínimo 3,00 Analíticos b 2,15 3,00
      - acrescidos de duas ou mais provas de carga, necessariamente executadas na fase de projeto, conforme 7.3.1 1,40 2,00
    origem: LITERAL
    sympy:
      - "Eq(sigma_adm_ELU, sigma_r_k/FS_g)"
      - "Eq(sigma_Rd_ELU, sigma_r_k/gamma_m)"
    variaveis:
      sigma_r_k: {unidade_pint: kPa, implementacao: geotecnico.sigma_r_k, entrada_obrigatoria: true}
      sigma_adm_ELU: {unidade_pint: kPa, implementacao: geotecnico.sigma_adm_ELU, metodo: admissivel}
      sigma_Rd_ELU: {unidade_pint: kPa, implementacao: geotecnico.sigma_Rd_ELU, metodo: calculo}
      FS_g: {unidade_pint: dimensionless, implementacao: seguranca.FS_g, metodo: admissivel}
      gamma_m: {unidade_pint: dimensionless, implementacao: seguranca.gamma_m, metodo: calculo}
    tabela:
      semiempirico:
        FS_g: {minimo: 3.00, valor: "proposto no proprio processo (entrada obrigatoria), >= 3,00"}
        gamma_m: {minimo: 2.15, valor: "proposto no proprio processo (entrada obrigatoria), >= 2,15"}
        condicao: "nota a: atendendo ao dominio de validade para o terreno local (declaracao obrigatoria do engenheiro)"
      analitico:
        FS_g: {valor: 3.00}
        gamma_m: {valor: 2.15}
        condicao: "nota b: sem aplicacao de coeficientes de ponderacao aos parametros de resistencia do terreno (declaracao obrigatoria)"
      com_provas_de_carga:
        FS_g: {valor: 2.00}
        gamma_m: {valor: 1.40}
        condicao: "n_provas_de_carga >= 2 (entrada inteira obrigatoria) E executadas na fase de projeto conforme 7.3.1 (declaracao obrigatoria); senao a linha e inacessivel"
    entradas:
      metodo_resistencia: {tipo: "enum {semiempirico, analitico, com_provas_de_carga}", entrada_obrigatoria: true}
    acao_se_violada: "FS_g ou gamma_m informado abaixo do minimo da linha -> recusa; linha com provas de carga sem n >= 2 / fase de projeto -> recusa"
    conferencia_A2: >-
      Celulas conferidas na pagina rasterizada (PDF p.29). Consistencia interna: FS_g ~ gamma_m *
      gamma_f com gamma_f = 1,4: 2,15*1,4 = 3,01 ~ 3,00 e 1,40*1,4 = 1,96 ~ 2,00 -- confirma que
      as colunas nao foram trocadas. A saida desta regra e SO o limite de ELU; a tensao de projeto
      exige tambem ELS (regra NBR6122-7.1-7.4-ELU-e-ELS).

  - id: NBR6122-T1c-gamma-f
    status: APROVADA
    tipo: constante
    metodo: calculo
    titulo: gamma_f = 1,4 sobre esforco disponivel apenas em valor caracteristico
    norma: ABNT NBR 6122:2022
    item: 6.2.1.1.1 (Tabela 1, nota c)
    pagina: [17]
    pagina_pdf: [29]
    clausula_kb: NBR6122-2022-6.2.1.1.1
    hash_trecho: sha256:607af8000aa7fc8b8e005d825f22eddd6baed1ff5bdc046a3042367e3db95dd3
    trecho_literal:
      - Em todas as situações de γm, γf = 1,4 (majoração) para o esforço atuante, se disponível apenas o seu valor característico; se já fornecido o valor de cálculo, nenhum coeficiente de ponderação deve ser aplicado a ele.
    origem: LITERAL
    sympy: ["Eq(N_d, gamma_f*N_k)"]
    variaveis:
      N_d: {unidade_pint: kN, implementacao: cargas.N_d}
      N_k: {unidade_pint: kN, implementacao: cargas.N_k}
      gamma_f: {unidade_pint: dimensionless, implementacao: seguranca.gamma_f}
    constantes_nomeadas:
      GAMMA_F_6122_T1C: {valor: 1.4, unidade_pint: dimensionless}
    logica:
      - "N_d fornecido -> usar N_d sem nenhum coeficiente"
      - "so N_k fornecido -> N_d = 1,4 * N_k"
      - "P_pp_k e P_solo_k (sempre caracteristicos) -> multiplicar por 1,4"
      - "nao se aplica ao metodo admissivel (RT-01)"

  - id: NBR6122-7.1-7.4-ELU-e-ELS
    status: APROVADA
    tipo: formula
    metodo: ambos
    titulo: Tensao de projeto atende simultaneamente ELU e ELS
    norma: ABNT NBR 6122:2022
    item: 7.1 / 7.4
    pagina: [21, 23]
    pagina_pdf: [33, 35]
